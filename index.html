<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM Planificador</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231F2BD4'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='30' font-weight='bold' fill='white' text-anchor='middle'%3EQM%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#080B12; --surface:#111726; --surface2:#18203314; --panel:#141B2B; --panel2:#1B2336;
  --border:#252E42; --border2:#313c54;
  --text:#E6EAF2; --muted:#8C96AC; --muted2:#5e6982;
  --primary:#2E3BE0; --primary-deep:#1F2BD4; --primary-soft:#2730a0; --primary-glow:#4450f0;
  --green:#1FB87A; --green-bg:#0f3a2c; --amber:#F0A91E; --amber-bg:#3d2f0c; --red:#E5484D; --red-bg:#3d1518;
  --radius:10px; --radius-sm:7px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --font:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3450;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#384670}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#16204a 0%,#080B12 60%)}
#login .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:42px 40px;width:380px;box-shadow:var(--shadow)}
.logo-box{width:64px;height:64px;border-radius:12px;background:var(--primary-deep);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:26px;color:#fff;letter-spacing:1px;box-shadow:0 0 24px rgba(46,59,224,.5)}
#login h1{font-size:22px;margin:18px 0 2px;font-weight:700}
#login p{color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;background:#0d1422;border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:var(--radius-sm);outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-glow)}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius-sm);font-weight:600;
  transition:background .15s,transform .05s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--primary-glow)}
.btn:active{transform:translateY(1px)}
.btn.full{width:100%;justify-content:center;padding:12px}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn.ghost:hover{background:var(--panel2);border-color:var(--primary-glow)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#f25a5f}
.btn.green{background:var(--green)}.btn.green:hover{background:#28d690}

/* ---------- SHELL ---------- */
#app{display:none;height:100vh;grid-template-columns:248px 1fr;grid-template-rows:56px 1fr}
#sidebar{grid-row:1/3;background:linear-gradient(180deg,#0d1322,#0a0f1b);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--border)}
.brand .logo-box{width:38px;height:38px;font-size:16px;border-radius:9px;box-shadow:0 0 14px rgba(46,59,224,.4)}
.brand .t{font-weight:700;font-size:15px;line-height:1.1}
.brand .t small{display:block;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.5px}
.nav{padding:10px 10px;flex:1}
.nav-group{color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);color:var(--muted);
  text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.12s;border:1px solid transparent}
.nav a:hover{background:#141d31;color:var(--text)}
.nav a.active{background:linear-gradient(90deg,rgba(46,59,224,.22),rgba(46,59,224,.05));color:#fff;border-color:#2c3a86}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
.sb-foot{padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted2)}

#topbar{grid-column:2;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border)}
#topbar h2{font-size:16px;font-weight:600}
#topbar .crumb{color:var(--muted);font-size:12px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.userchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);padding:5px 11px;border-radius:20px;font-size:12.5px}
.userchip .av{width:24px;height:24px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

#main{grid-column:2;overflow-y:auto;padding:22px 24px 60px}

/* ---------- COMPONENTS ---------- */
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.card h3{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .sub{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-head h1{font-size:20px;font-weight:700}
.section-head .desc{color:var(--muted);font-size:13px}
.section-head .sp{flex:1}

.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .val{font-size:28px;font-weight:700;margin-top:6px;line-height:1}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:5px}
.kpi .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.kpi.green .accent{background:var(--green)} .kpi.amber .accent{background:var(--amber)} .kpi.red .accent{background:var(--red)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td{padding:9px 11px;border-bottom:1px solid #1b2336;vertical-align:middle}
tr:hover td{background:#141d31}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.verde{background:var(--green-bg);color:#3fe0a0}.pill.amarillo{background:var(--amber-bg);color:#ffc24d}
.pill.rojo{background:var(--red-bg);color:#ff7378}.pill.neutral{background:#1c2740;color:#8da}
.pill.gris{background:#1c2740;color:var(--muted)}
.tag{background:#16203a;border:1px solid #25325a;color:#9fb0d8;font-size:11px;padding:1px 8px;border-radius:6px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.right{text-align:right}.center{text-align:center}
.muted{color:var(--muted)} .small{font-size:12px}
.linklike{color:var(--primary-glow);cursor:pointer;font-weight:500}
.linklike:hover{text-decoration:underline}
.actions{display:flex;gap:6px}
.iconbtn{background:#16203a;border:1px solid var(--border);color:var(--muted);min-width:28px;height:26px;border-radius:6px;padding:0 9px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;transition:.12s;white-space:nowrap}
.iconbtn:hover{color:#fff;border-color:var(--primary-glow);background:#1c2a4a}
.mini-select{background:#16203a;border:1px solid var(--border);color:var(--muted);height:22px;border-radius:6px;font-size:10.5px;padding:0 4px;max-width:120px;vertical-align:middle}
.mini-select:hover{border-color:var(--primary-glow);color:#fff}
.empty{text-align:center;color:var(--muted);padding:38px 20px}
.empty .ic{font-size:34px;opacity:.4;display:block;margin-bottom:10px}

/* progress bar */
.bar{height:7px;background:#0d1422;border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.bar > span{display:block;height:100%;background:var(--primary);border-radius:5px}
.bar.green>span{background:var(--green)}.bar.amber>span{background:var(--amber)}.bar.red>span{background:var(--red)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;font-size:13px;font-weight:500;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:#fff;border-bottom-color:var(--primary-glow)}

/* modal */
#modalbg{position:fixed;inset:0;background:rgba(4,7,14,.72);z-index:900;display:none;align-items:flex-start;justify-content:center;padding:50px 16px;overflow-y:auto}
#modal{background:var(--panel);border:1px solid var(--border2);border-radius:14px;width:560px;max-width:100%;box-shadow:var(--shadow)}
#modal.wide{width:880px}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-head .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
.modal-head .x:hover{color:#fff}
.modal-body{padding:20px;max-height:62vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/3}
.field textarea{resize:vertical;min-height:64px}
.checkrow{display:flex;align-items:center;gap:8px}
.checkrow input{width:auto}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;z-index:1100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--border2);border-left:4px solid var(--primary);padding:12px 16px;border-radius:8px;
  box-shadow:var(--shadow);font-size:13px;min-width:240px;animation:slidein .25s}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1}}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:center;padding:4px;font-weight:700;letter-spacing:.5px}
.cal-cell{background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:96px;padding:6px;font-size:11px;position:relative}
.cal-cell.other{opacity:.4}
.cal-cell.today{border-color:var(--primary-glow);box-shadow:0 0 0 1px var(--primary-glow) inset}
.cal-cell .dn{font-weight:700;font-size:12px;margin-bottom:4px}
.cal-ev{border-radius:5px;padding:2px 6px;margin-bottom:3px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.cal-ev.pad{background:#13294d;color:#7fb0ff;border-left:3px solid #3d7bff}
.cal-ev.mant{background:#3a1f0c;color:#ffc24d;border-left:3px solid var(--amber)}
.cal-ev.mant.rojo{background:#3d1518;color:#ff7378;border-left-color:var(--red)}
.cal-ev.op{background:#0f3a2c;color:#3fe0a0;border-left:3px solid var(--green)}

/* gantt */
.gantt-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);max-height:64vh}
.gantt-inner{position:relative}
.gantt-row{display:flex;align-items:stretch;border-bottom:1px solid #1b2336}
.gantt-row:last-child{border-bottom:none}
.gantt-label{width:160px;min-width:160px;padding:8px 12px;position:sticky;left:0;background:var(--panel);z-index:6;border-right:1px solid var(--border2);font-size:12.5px}
.gantt-label .nm{font-weight:700}
.gantt-label .hh{color:var(--muted);font-size:10.5px}
.gantt-track{position:relative;height:66px;flex:1}
.gantt-head{height:30px;position:sticky;top:0;z-index:2;background:var(--panel)}
.gantt-head .gantt-label{background:var(--panel);z-index:7;border-bottom:1px solid var(--border)}
.gantt-month{position:absolute;top:0;height:100%;border-left:1px solid #222c42;font-size:10.5px;color:var(--muted);padding:7px 5px;white-space:nowrap}
.gantt-grid{position:absolute;top:0;bottom:0;border-left:1px solid #161e2e}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--primary-glow);z-index:1;opacity:.8}
.gantt-bar{position:absolute;top:9px;height:18px;border-radius:4px;background:#244a86;border:1px solid #3d6ed0;color:#cfe0ff;font-size:10px;line-height:16px;padding:0 5px;overflow:hidden;white-space:nowrap;z-index:1}
.gantt-mark{position:absolute;top:30px;width:11px;height:11px;border-radius:2px;transform:rotate(45deg);z-index:2;cursor:default;border:1px solid rgba(0,0,0,.3)}
.gantt-mark.verde{background:var(--green)}.gantt-mark.amarillo{background:var(--amber)}.gantt-mark.rojo{background:var(--red)}.gantt-mark.neutral{background:var(--muted2)}
.gantt-mark.proy{background:transparent;opacity:.85;width:9px;height:9px;top:31px}
.gantt-mark.proy.verde{border-color:var(--green)}.gantt-mark.proy.amarillo{border-color:var(--amber)}.gantt-mark.proy.rojo{border-color:var(--red)}.gantt-mark.proy.neutral{border-color:var(--muted2)}
.gantt-venc{position:absolute;left:2px;top:28px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px;z-index:2}
.gantt-hmark{position:absolute;top:46px;width:9px;height:9px;border-radius:2px;transform:rotate(45deg);background:#22b8cf;border:1px solid #0b7285;z-index:3;cursor:default}
.gantt-hdot{position:absolute;top:48px;width:5px;height:5px;border-radius:50%;background:#22b8cf;opacity:.7;z-index:2;cursor:default}
.gantt-hlabel{position:absolute;top:44px;font-size:9px;color:#5fd0e0;white-space:nowrap;z-index:3;pointer-events:none;font-variant-numeric:tabular-nums}

/* gauge */
.gauge-wrap{display:flex;align-items:center;gap:14px}
.minigraph{display:flex;gap:3px;align-items:flex-end;height:40px}
.minigraph i{width:7px;background:var(--primary);border-radius:2px 2px 0 0;display:block;opacity:.85}

/* equipo card */
.eq-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.15s}
.eq-card:hover{border-color:#2c3a86}
.eq-card .top{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.eq-card .top .nm{font-weight:700;font-size:15px}
.eq-card .top .cd{color:var(--muted);font-size:11px}
.eq-card .body{padding:14px 16px}
.eq-stat{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
.eq-stat .v{font-weight:700}
.statusband{height:4px}
.statusband.verde{background:var(--green)}.statusband.amarillo{background:var(--amber)}.statusband.rojo{background:var(--red)}.statusband.neutral{background:var(--muted2)}

.help{background:#0e1830;border:1px solid #1f2c52;border-radius:8px;padding:11px 14px;font-size:12.5px;color:#a9b8db;margin-bottom:16px;display:flex;gap:10px}
.help .ic{color:var(--primary-glow);font-size:15px}
hr.sep{border:none;border-top:1px solid var(--border);margin:18px 0}

@media print{
  #sidebar,#topbar,.no-print,.top-actions{display:none!important}
  #app{display:block!important}#main{overflow:visible;padding:0}
  body{background:#fff;color:#000;overflow:visible}
  .card,.kpi,.table-wrap{border-color:#ccc;background:#fff;break-inside:avoid}
  th{background:#eee!important;color:#000;position:static}
  td{border-color:#ddd}
  .pill,.tag{border:1px solid #999}
}
</style>
</head>

function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

  DB.pads.forEach(p=>{
    if(!p.asignaciones){
      p.asignaciones=(p.equipos||[]).map(id=>({equipoId:id,desde:p.fechaInicio,hasta:p.fechaFin}));
      delete p.equipos;
    }
    // Reparación: asignaciones con fechas FUERA del rango del pad (bug de carga) → se ajustan al pad
    (p.asignaciones||[]).forEach(a=>{
      if(!a.desde||a.desde<p.fechaInicio) a.desde=p.fechaInicio;
      if(!a.hasta||a.hasta>p.fechaFin) a.hasta=p.fechaFin;
      if(a.desde>a.hasta){ a.desde=p.fechaInicio; a.hasta=p.fechaFin; }   // quedó inválida → rango completo del pad

  });
}

/* ============================================================
   MOTOR DE PROYECCIÓN PREDICTIVA
   Regla clave: los datos reales tienen prioridad absoluta.
   Las horas se acumulan SOLO desde la última lectura real y
   ÚNICAMENTE en los días en que el equipo opera dentro de un pad.
   ============================================================ */
function lastReading(eqId){
  return DB.lecturas.filter(l=>l.equipoId===eqId).sort((a,b)=>a.fecha<b.fecha?1:-1)[0]||null;
}
function padsForEquipo(eqId){ return DB.pads.filter(p=>(p.asignaciones||[]).some(a=>a.equipoId===eqId)); }
// Rangos de trabajo (desde/hasta) de un equipo a lo largo de todos los pads
function asignacionesForEquipo(eqId){
  const out=[]; DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId) out.push({pad:p,desde:a.desde,hasta:a.hasta}); })); return out;
}

function buildTimeline(eq){
  const lr=lastReading(eq.id); if(!lr) return null;
  const motorDia=Number(eq.motorDia)||DB.params.horasMotorDia;
  const bombaDia=Number(eq.bombaDia)||DB.params.horasBombaDia;
  const asigs=asignacionesForEquipo(eq.id);
  const horizon=DB.params.horizonteDias||1095;
  const startD=parseD(lr.fecha), endD=addDays(startD,horizon);
  let cumM=Number(lr.horasMotor)||0, cumB=Number(lr.horasBomba)||0;
  const a0=asigs.find(x=> lr.fecha>=x.desde && lr.fecha<=x.hasta);   // ¿opera el día de la lectura? (para detectar tramo en curso)
  const days=[{date:lr.fecha,cumMotor:cumM,cumBomba:cumB,pad:a0?a0.pad.nombre:null}];
  let cur=addDays(startD,1);
  while(cur<=endD){
    const iso=toISO(cur);
    // Solo suma horas si el equipo trabajó ese día (rango desde/hasta de su asignación)
    const a=asigs.find(x=> iso>=x.desde && iso<=x.hasta);
    if(a){ cumM+=motorDia; cumB+=bombaDia; }
    days.push({date:iso,cumMotor:cumM,cumBomba:cumB,pad:a?a.pad.nombre:null});
    cur=addDays(cur,1);
  }
  return {base:lr,days,motorDia,bombaDia};
}

function lastExecHours(eqId,planKey,fuente){
  const ms=DB.mantenimientos.filter(m=>m.equipoId===eqId&&m.plan===planKey).sort((a,b)=>a.fecha<b.fecha?1:-1);
  if(!ms.length) return null;
  return fuente==='motor'? Number(ms[0].horasMotor) : Number(ms[0].horasBomba);
}
// Primer punto de control a considerar (puede estar VENCIDO). allEvents luego genera los siguientes ciclos.
function nextDueHours(plan,eq,currentH){
  const exec=lastExecHours(eq.id,plan.key,plan.fuente);
  const I=plan.intervalo;
  if(plan.tipo==='unica'){                                   // Alfa Zero: única vez
    if(exec!=null) return null;                              // ya registrado como ejecutado → no vuelve a aparecer
    return I;                                                // si NO está registrado y las horas pasaron → VENCIDO
  }
  if(exec!=null) return exec+I;                              // CON registro propio: primer ciclo tras el último service
  if(plan.dependeDe){                                        // depende de otro plan (Alfa depende de Alfa Zero)
    const ed=lastExecHours(eq.id,plan.dependeDe,plan.fuente);
    return ed!=null ? ed+I : null;                           // 1er ciclo = ejecución de la dependencia + I; si no se hizo, NO aparece (no pueden ir juntos)
  }
  // SIN registro: no se asume que los ciclos anteriores se hicieron
  const minFirst = plan.offset ? I*2 : I;                    // Alfa arranca en 1000 hs (después de Alfa Zero)
  if(currentH < minFirst) return minFirst;                  // todavía no llegó al primer ciclo → próximo, NO vencido
  let nextAbove = Math.floor(currentH/I)*I + I;             // siguiente múltiplo por encima
  if(plan.offset) nextAbove = Math.max(nextAbove, I*2);
  return nextAbove - I;                                      // ciclo más reciente ya superado → VENCIDO (el próximo lo agrega allEvents)
}
function findCrossDate(timeline,fuente,nd){
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  const days=timeline.days;
  if(days[0][key]>=nd) return {date:days[0].date,vencido:true,horas:nd};
  for(let i=1;i<days.length;i++){ if(days[i][key]>=nd) return {date:days[i].date,vencido:false,horas:nd}; }
  return {date:null,beyond:true,horas:nd};
}
function statusOf(r){
  if(r.naAplica) return 'gris';
  if(r.beyond) return 'neutral';
  if(r.vencido) return 'rojo';
  const dr=daysBetween(todayISO(),r.date);
  if(dr<0) return 'rojo';
  if(dr<=DB.params.umbralRojo) return 'rojo';
  if(dr<=DB.params.umbralAmarillo) return 'amarillo';
  return 'verde';
}

/* Proyección completa de un equipo: resultado por cada plan */
function projectEquipo(eq){
  const tl=buildTimeline(eq);
  if(!tl) return {equipo:eq,sinLectura:true,planes:[]};
  const hoy=todayISO();
  const hoyM=cumAt(tl,hoy,'motor'), hoyB=cumAt(tl,hoy,'bomba');     // horas PROYECTADAS a hoy (real + planificado)
  const run=operatingRuns(tl).find(r=> hoy>=r.start && hoy<=r.end); // ¿está operando hoy?
  const finPad = run? {fecha:run.end,pad:run.pad,motor:cumAt(tl,run.end,'motor'),bomba:cumAt(tl,run.end,'bomba')} : null;
  const planes=PLANES.map(plan=>{
    const currentH = plan.fuente==='motor'? Number(tl.base.horasMotor) : Number(tl.base.horasBomba);
    const hoyH = plan.fuente==='motor'? hoyM : hoyB;
    const nd=nextDueHours(plan,eq,currentH);
    if(nd==null) return {plan,naAplica:true,currentH};
    const cross=findCrossDate(tl,plan.fuente,nd);
    const r={plan,currentH,horasMant:nd,horasRestantes:Math.round(nd-hoyH),...cross};   // restan DESDE HOY
    r.diasRestantes = cross.date? daysBetween(hoy,cross.date): null;
    r.vencido = !!cross.vencido || (cross.date && r.diasRestantes<0);   // vencido = horas superadas O fecha ya pasada
    r.alFinPad = finPad ? (plan.fuente==='motor'?finPad.motor:finPad.bomba)>=nd : false;  // ¿se alcanza antes de terminar el pad actual?
    r.estado=statusOf(r);
    r.rec=planRecomendacion(tl,{vencido:r.vencido,beyond:r.beyond,date:r.date,plan,horas:nd});
    upgradeRec(r,todayISO());
    return r;
  });
  return {equipo:eq,base:tl.base,timeline:tl,planes,motorDia:tl.motorDia,bombaDia:tl.bombaDia,horasHoyMotor:hoyM,horasHoyBomba:hoyB,finPad};
}
function projectAll(){ return DB.equipos.filter(e=>e.estado!=='Baja').map(projectEquipo); }

/* Lista plana de todos los mantenimientos proyectados (para calendario/agrupación/stock) */
function allProjectedMaints(){
  const out=[];
  projectAll().forEach(p=>{
    if(p.sinLectura) return;
    p.planes.forEach(r=>{ if(r.naAplica||r.beyond||!r.date) return;
      out.push({equipo:p.equipo,plan:r.plan,date:r.date,horas:r.horasMant,estado:r.estado,diasRestantes:r.diasRestantes,vencido:r.vencido}); });
  });
  return out.sort((a,b)=> a.date<b.date?-1:1);
}

/* TODAS las ocurrencias de cada plan (no solo la próxima) hasta una fecha límite.
   Incluye siempre los vencidos. Usado por el listado filtrable del Dashboard. */
function allEvents(untilISO){
  const today=todayISO();
  const horizonEnd=toISO(addDays(parseD(today),DB.params.horizonteDias||1095));
  const limite = untilISO && untilISO>today ? untilISO : horizonEnd;
  const out=[];
  DB.equipos.filter(e=>e.estado!=='Baja').forEach(eq=>{
    const tl=buildTimeline(eq); if(!tl) return;
    PLANES.forEach(plan=>{
      const currentH = plan.fuente==='motor'? Number(tl.base.horasMotor) : Number(tl.base.horasBomba);
      let nd=nextDueHours(plan,eq,currentH);
      if(nd==null) return;
      let guard=0;
      while(nd!=null && guard<400){
        const cross=findCrossDate(tl,plan.fuente,nd);
        if(cross.beyond||!cross.date) break;
        const dr=daysBetween(today,cross.date);
        const vencido = !!cross.vencido || dr<0;
        // se incluye si está vencido (siempre) o si su fecha es <= límite
        if(vencido || cross.date<=limite){
          const r={plan,date:cross.date,vencido,diasRestantes:dr};
          out.push({equipo:eq,plan,date:cross.date,horas:nd,horasRestantes:Math.round(nd-currentH),vencido,diasRestantes:dr,estado:statusOf(r)});
        }
        if(plan.tipo==='unica') break;            // Alfa Zero: una sola vez
        if(cross.date>limite) break;              // siguientes ocurrencias ya fuera del límite
        nd+=plan.intervalo; guard++;
      }
    });
  });
  return out.sort((a,b)=> a.date===b.date? (a.equipo.nombre<b.equipo.nombre?-1:1) : (a.date<b.date?-1:1));
}

/* ---------- Lead time aprendido (órdenes de producción) ---------- */
function leadStatsPlan(planKey){
  const recs=DB.ordenes.filter(o=>o.plan===planKey && o.fechaLanzamiento && o.fechaRecepcion);
  if(!recs.length) return {n:0,avg:DB.params.leadTimeDefaultDias,std:0,cumpl:null};
  const lt=recs.map(o=>daysBetween(o.fechaLanzamiento,o.fechaRecepcion));
  const avg=lt.reduce((a,b)=>a+b,0)/lt.length;
  const std=Math.sqrt(lt.reduce((a,b)=>a+(b-avg)**2,0)/lt.length);
  const comp=recs.filter(o=>o.fechaComprometida).map(o=>daysBetween(o.fechaComprometida,o.fechaRecepcion)<=0);
  const cumpl=comp.length? Math.round(comp.filter(Boolean).length/comp.length*100):null;
  return {n:recs.length,avg:Math.round(avg),std:Math.round(std),cumpl};
}
function leadStatsGlobal(){
  const recs=DB.ordenes.filter(o=>o.fechaLanzamiento&&o.fechaRecepcion);
  if(!recs.length) return {n:0,avg:DB.params.leadTimeDefaultDias,std:0,cumpl:null};
  const lt=recs.map(o=>daysBetween(o.fechaLanzamiento,o.fechaRecepcion));
  const avg=lt.reduce((a,b)=>a+b,0)/lt.length;
  const std=Math.sqrt(lt.reduce((a,b)=>a+(b-avg)**2,0)/lt.length);
  const comp=recs.filter(o=>o.fechaComprometida).map(o=>daysBetween(o.fechaComprometida,o.fechaRecepcion)<=0);
  const cumpl=comp.length? Math.round(comp.filter(Boolean).length/comp.length*100):null;
  return {n:recs.length,avg:Math.round(avg),std:Math.round(std),cumpl};
}
function recommendedLead(planKey){
  const s=leadStatsPlan(planKey);
  const z=DB.params.zServicio||1.65;
  return {dias:Math.round(s.avg + z*s.std), stats:s};   // lead + colchón por variabilidad
}

// Asigna fecha de acción y, si el cruce era "sin fecha" pero hay acción dentro de tolerancia, sube su urgencia
function upgradeRec(it,today){
  it.accionFecha = (it.rec&&it.rec.fecha)? it.rec.fecha : it.date;
  if(it.beyond && it.rec && it.rec.fecha){
    it.diasRestantes = daysBetween(today, it.rec.fecha);
    it.estado = statusOf({date:it.rec.fecha,vencido:false});
    it.accionable = true;
  }
}
// Genera los ciclos FUTUROS de un plan repetitivo como REFERENCIA (proyección). Cada ciclo se ancla en las horas
// reales a las que se ejecutará el ciclo anterior (su fecha de acción), no en el múltiplo teórico.
function proyectarCiclos(out,eq,plan,tl,firstIt,hoyH,today){
  const fuente=plan.fuente;
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  const maxCum=tl.days[tl.days.length-1][key];
  const wins=equipoGaps(eq.id);                              // paradas propias (donde el equipo NO opera)
  if(!wins.length) return;
  const idxAt=d=> wins.reduce((acc,g,i)=> g.desde<=d?i:acc, -1);  // última parada que empieza <= d
  let prevIdx=idxAt(firstIt.accionFecha);                    // parada del ciclo firme
  let prevReal=firstIt.horasReal!=null?firstIt.horasReal:Math.round(cumAt(tl,firstIt.accionFecha,fuente)); // horas REALES a las que se hace el ciclo previo
  let teorico=firstIt.horas;                                 // teórico firme (ej. 1500)
  let guard=0;
  while(guard++<60){                                         // proyecta TODOS los ciclos alcanzables (1500,2000,...,hasta donde lleguen los pads)
    teorico+=plan.intervalo;                                 // teórico fijo: 2000,2500,... (anclado en sí mismo, sin drift)
    if(teorico>maxCum) break;                                // el teórico ya no se alcanza con los pads cargados → fin
    const cross=findCrossDate(tl,fuente,teorico);            // dónde cruza ESTE teórico
    if(cross.beyond||!cross.date) break;
    let natIdx=idxAt(cross.date); if(natIdx<0) natIdx=0;     // parada natural (antes del pad donde cruza)
    let idx=Math.max(natIdx, prevIdx+1);                     // UNA intervención por parada: si dos ciclos chocan, el 2º va a la siguiente (vencido)
    if(idx>=wins.length) break;                              // no quedan paradas
    const w=wins[idx];
    const bumped=idx>natIdx;                                 // se corrió de su parada natural por chocar con otro ciclo
    const accion=asapEnVentana(w);
    const realH=Math.round(cumAt(tl,accion,fuente));         // horas reales a las que quedaría hacerse
    const cicloRef=prevReal+plan.intervalo;                  // CUÁNDO corresponde por el ciclo (ejecución real previa + intervalo)
    const venc=realH-cicloRef;                               // >0 = se hará VENCIDO respecto del ciclo de 'intervalo' h
    const it={equipo:eq,plan,horas:teorico,hoy:Math.round(hoyH),horasRestantes:Math.round(teorico-hoyH),
      date:accion,beyond:false,vencido:false,diasRestantes:daysBetween(today,accion),
      estado:venc>0?'rojo':statusOf({date:accion,vencido:false}),base:Math.round(prevReal),
      proyeccion:true,horasReal:realH,excedente:venc,cicloRef,accionFecha:accion};
    it.rec={tipo:venc>0?'postpad':'prepad',fecha:accion,desde:w.desde,hasta:w.hasta,cls:venc>0?'rojo':'verde',
      txt: bumped?`Se corre a la parada del ${fmtDM(accion)} (no puede coincidir con otro ciclo)`:`En la parada del ${fmtDM(accion)}`};
    out.push(it);
    prevIdx=idx; prevReal=realH;
  }
}
// TODOS los planes de TODOS los equipos: cada plan muestra su PRÓXIMO; se repite solo si está vencido (ciclos vencidos + el próximo).
// Los ciclos siguientes se muestran como PROYECCIÓN (referencia) y se recalculan al cargar datos reales.
// Si el próximo cae fuera de los pads cargados, igual aparece (sin fecha estimada).
function planEvents(){
  const today=todayISO(); const out=[];
  DB.equipos.filter(e=>e.estado!=='Baja').forEach(eq=>{
    const tl=buildTimeline(eq); if(!tl) return;
    const hoyM=cumAt(tl,today,'motor'), hoyB=cumAt(tl,today,'bomba');   // horas proyectadas a hoy
    PLANES.forEach(plan=>{
      const currentH=plan.fuente==='motor'?Number(tl.base.horasMotor):Number(tl.base.horasBomba);
      const hoyH=plan.fuente==='motor'?hoyM:hoyB;
      const nd=nextDueHours(plan,eq,currentH);
      if(nd==null) return;                       // única vez ya ejecutada → no aparece
      // SOLO el próximo ciclo pendiente. Los siguientes dependen de CUÁNDO se ejecute éste (la cadena se corre).
      const base=lastExecHours(eq.id,plan.key,plan.fuente);   // anclaje del ciclo (último mantenimiento registrado)
      const cross=findCrossDate(tl,plan.fuente,nd);
      let it;
      if(cross.beyond){
        it={equipo:eq,plan,horas:nd,hoy:Math.round(hoyH),horasRestantes:Math.round(nd-hoyH),date:null,beyond:true,vencido:false,diasRestantes:null,estado:'neutral',base};
      } else {
        const dr=daysBetween(today,cross.date), vencido=!!cross.vencido||dr<0;
        it={equipo:eq,plan,horas:nd,hoy:Math.round(hoyH),horasRestantes:Math.round(nd-hoyH),date:cross.date,beyond:false,vencido,diasRestantes:dr,estado:statusOf({date:cross.date,vencido}),base};
      }
      it.rec=planRecomendacion(tl,it); upgradeRec(it,today); aplicarPlanificado(it);
      // si la fecha de acción (manual o sugerida) es POSTERIOR al cruce, calcular cuántas horas estará vencido
      if(it.accionFecha){
        const hAcc=cumAt(tl,it.accionFecha,plan.fuente);
        it.horasReal=Math.round(hAcc);                    // horas reales a las que se hará (en la parada)
        it.excedente=Math.round(hAcc-nd);                 // >0 = operará vencido esas horas al ejecutarse
        if(it.excedente>0 && it.manual){ it.rec.cls='rojo'; it.estado='rojo'; }
      }
      out.push(it);
      // Ciclos FUTUROS proyectados (solo repetitivos): se anclan en CUÁNDO se hace realmente el ciclo previo.
      // Ej.: si el Alfa 1500 se adelanta y se hace a 1300, el siguiente cae a 1800 (1300+500). Se recalcula con los datos reales.
      if(plan.tipo==='repetitivo' && it.accionFecha && !it.beyond) proyectarCiclos(out,eq,plan,tl,it,hoyH,today);
    });
  });
  // orden por CUÁNDO SE VENCE: lo ya vencido hace más tiempo / lo más próximo primero → lo último al final
  const key=x=> x.date || x.accionFecha || '9999-99-99';
  return out.sort((a,b)=>{ const ka=key(a),kb=key(b); if(ka!==kb) return ka<kb?-1:1; return a.equipo.nombre<b.equipo.nombre?-1:1; });
}

  else if(DFILTER.estado==='rojo') evs=evs.filter(e=>e.estado==='rojo');

    <div class="kpi"><div class="accent"></div><div class="lbl">Fracturadores operativos</div><div class="val">${operativos}<small> / ${DB.equipos.length}</small></div><div class="sub">Flota activa</div></div>
    <div class="kpi red"><div class="accent"></div><div class="lbl">Mantenimientos vencidos</div><div class="val">${venc}</div><div class="sub">Requieren acción inmediata</div></div>
    <div class="kpi amber"><div class="accent"></div><div class="lbl">Próximos 30 días</div><div class="val">${prox30}</div><div class="sub">A planificar</div></div>
    ${WEB_LITE?'':`<div class="kpi green"><div class="accent"></div><div class="lbl">Lead time aprendido</div><div class="val">${lead.avg}<small> días</small></div><div class="sub">${lead.n} órdenes · ±${lead.std}d</div></div>
    <div class="kpi ${cob.cls}"><div class="accent"></div><div class="lbl">Cobertura de stock</div><div class="val">${cob.pct}<small>%</small></div><div class="sub">${cob.faltantes} ítems bajo ROP</div></div>`}
  </div>`;

  // ===== Próximos mantenimientos: filtro + listado COMPLETO =====
  let evs=filteredEvents();
  const vencEvs=evs.filter(e=>e.vencido).length;
  const comps=[...new Set(PLANES.map(p=>p.componente))];
  const opt=(v,t,sel)=>`<option value="${v}" ${sel===v?'selected':''}>${t}</option>`;
  html+=`<div class="card" style="margin-top:16px"><h3>Mantenimientos proyectados <span class="sub">${evs.length} resultado(s) · ${vencEvs} vencido(s)</span></h3>
    <div class="row" style="gap:10px;margin-bottom:14px;align-items:flex-end">
      <div class="field" style="margin:0;min-width:150px"><label>Estado</label><select id="df-estado" onchange="applyDFilter()">
        ${opt('todos','Todos',DFILTER.estado)}${opt('vencidos',' Solo vencidos',DFILTER.estado)}${opt('rojo','Críticos',DFILTER.estado)}${opt('amarillo','Atención',DFILTER.estado)}${opt('verde','En plan',DFILTER.estado)}</select></div>
      <div class="field" style="margin:0;min-width:160px"><label>Hasta fecha (vacío = todas)</label><input type="date" id="df-hasta" value="${DFILTER.hasta}" onchange="applyDFilter()"></div>
      <div class="field" style="margin:0;min-width:150px"><label>Equipo</label><select id="df-equipo" onchange="applyDFilter()">
        ${opt('todos','Todos',DFILTER.equipo)}${DB.equipos.map(e=>opt(e.id,esc(e.nombre),DFILTER.equipo)).join('')}</select></div>
      <div class="field" style="margin:0;min-width:150px"><label>Componente</label><select id="df-comp" onchange="applyDFilter()">
        ${opt('todos','Todos',DFILTER.comp)}${comps.map(c=>opt(c,c,DFILTER.comp)).join('')}</select></div>
      <button class="btn ghost sm" onclick="clearDFilter()">Limpiar</button>
      <button class="btn ghost sm" onclick="exportCSV('eventos')">Excel</button>
      <label class="row" style="gap:6px;font-size:12px;cursor:pointer;margin-left:auto"><input type="checkbox" ${VERPROY?'checked':''} onchange="VERPROY=this.checked;renderDashboard()"> Ver proyección</label>
    </div>
    <div class="muted small" style="margin:-6px 0 12px">Aparecen <b>todos los planes de todos los equipos</b> (su próximo). Los <span style="color:var(--red)">vencidos</span> se repiten (ciclo vencido + próximo). Si el próximo cae fuera de los pads cargados, se muestra <i>sin fecha</i>. Usá los filtros para acotar.</div>`;
  if(!evs.length) html+=`<div class="empty"><span class="ic"></span>No hay mantenimientos para este filtro.</div>`;
  else{
    html+=`<div class="table-wrap" style="max-height:62vh;overflow:auto"><table><thead><tr><th>Equipo</th><th>Plan</th><th>Componente</th><th class="right">Hoy (h)</th><th class="right">Objetivo</th><th class="right">Restan (h)</th><th>Fecha / acción</th><th>Días</th><th>Estado</th></tr></thead><tbody>`;
    const recColor={rojo:'#ff9a4d',amarillo:'#ffc24d',verde:'#3fe0a0',neutral:'var(--muted)',gris:'var(--muted)'};
    const recShow={postpad:1,prepad:1,lejano:1,manual:1};
    evs.slice(0,500).forEach(m=>{
      const fecha = m.vencido?'<span style="color:var(--red)">se cumple ya</span>' : (m.beyond?(m.accionable?'<span class="muted">cruce s/fecha exacta</span>':'<span class="muted">sin fecha</span>') : 'se cumple '+fmtDShort(m.date));
      const recLine = (m.rec&&m.rec.txt&&recShow[m.rec.tipo]&&!m.proyeccion) ? `<br><span style="font-size:10px;color:${recColor[m.rec.cls]||'var(--muted)'}">${m.manual?'[Fijado] ':''}${esc(m.rec.txt)}</span>` : '';
      const fijar = m.proyeccion?'' : `<br><span class="linklike" style="font-size:10px" onclick="planificarMant('${m.equipo.id}','${m.plan.key}',${m.horas})">${m.manual?'cambiar fecha':'fijar fecha'}</span>`;
      const dias  = m.vencido?'<span style="color:var(--red)">'+m.diasRestantes+'d</span>' : ((m.beyond&&!m.accionable)?'—':m.diasRestantes+'d');
      const proyTag = m.proyeccion?` <span class="tag" style="font-size:9px;background:#222c42;color:#7f8db0">proyección</span>`:'';
      const realLine = (!m.proyeccion && m.horasReal!=null) ? `<br><span style="font-size:10px;color:#5fd0e0">se hará a ~${num(m.horasReal)}h${m.excedente>0?' · <b style="color:var(--red)">VENCIDO ~'+num(m.excedente)+'h por el ciclo de '+num(m.plan.intervalo)+'h</b>':''}</span>` : '';
      html+=`<tr ${m.proyeccion?'style="opacity:.55"':''}><td><b>${esc(m.equipo.nombre)}</b></td><td><span class="tag">${m.plan.nombre}</span>${proyTag}</td><td class="muted">${m.plan.componente} <span style="font-size:9px">${m.plan.fuente==='motor'?'Mot.':'Bba.'}</span></td>
        <td class="right mono">${num(m.hoy)}</td><td class="right mono">${num(m.horas)}</td><td class="right mono">${m.vencido?'<span style="color:var(--red)">—</span>':num(m.horasRestantes)}</td>
        <td class="mono small">${m.proyeccion?'<span class="muted">proyectado · se hará a ~'+num(m.horasReal)+'h</span>'+(m.excedente>0?' <b style="color:var(--red)">· VENCIDO ~'+num(m.excedente)+'h por el ciclo de '+num(m.plan.intervalo)+'h</b>':'')+' ':''}${fecha}${realLine}${recLine}${fijar}</td><td class="mono">${dias}</td>
        <td><span class="pill ${m.estado}"><span class="dot" style="background:currentColor"></span>${estadoLabel(m.estado)}</span></td></tr>`;
    });
    if(evs.length>500) html+=`<tr><td colspan="9" class="muted center">… ${evs.length-500} más (afiná el filtro o exportá a Excel)</td></tr>`;
    html+=`</tbody></table></div>`;
  }
  html+=`</div>`;

  // tarjetas por equipo
  html+=`<h3 style="margin:22px 0 12px;font-size:14px">Estado por fracturador</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">`;
  proj.forEach(p=>{
    if(p.sinLectura){ html+=`<div class="eq-card"><div class="statusband neutral"></div><div class="top"><div class="logo-box" style="width:32px;height:32px;font-size:13px;background:#1c2740">${esc(p.equipo.codigo||'??')}</div><div><div class="nm">${esc(p.equipo.nombre)}</div><div class="cd">Sin lectura registrada</div></div></div><div class="body"><div class="muted small">Registre una lectura de horas para proyectar.</div></div></div>`; return; }
    const next=p.planes.filter(r=>!r.naAplica&&(r.date||r.accionable)).sort((a,b)=>{const fa=a.accionFecha||a.date,fb=b.accionFecha||b.date;return fa<fb?-1:1;})[0];
    const st=next?next.estado:'verde';
    html+=`<div class="eq-card" onclick="showEquipoDetail('${p.equipo.id}')" style="cursor:pointer">
      <div class="statusband ${st}"></div>
      <div class="top"><div class="logo-box" style="width:34px;height:34px;font-size:12px">${esc(p.equipo.codigo||'')}</div>
        <div><div class="nm">${esc(p.equipo.nombre)}</div><div class="cd">${esc(p.equipo.estado)}</div></div>
        ${next?`<span class="pill ${st}" style="margin-left:auto"><span class="dot" style="background:currentColor"></span>${estadoLabel(st)}</span>`:''}</div>
      <div class="body">
        <div class="eq-stat"><span class="muted">Motor (hoy)</span><span class="v mono">${num(p.horasHoyMotor)} h</span></div>
        <div class="eq-stat"><span class="muted">Bomba (hoy)</span><span class="v mono">${num(p.horasHoyBomba)} h</span></div>
        ${p.finPad?`<div class="eq-stat" style="color:#7fb0ff"><span> Fin pad ${fmtDM(p.finPad.fecha)}</span><span class="v mono">M${num(p.finPad.motor)} B${num(p.finPad.bomba)}</span></div>`:''}
        <hr class="sep" style="margin:10px 0">
        ${next?`<div class="eq-stat"><span class="muted">Próximo</span><span class="v"><span class="tag">${next.plan.nombre}</span></span></div>
          <div class="eq-stat"><span class="muted">${next.rec&&(next.rec.tipo==='prepad'||next.rec.tipo==='postpad')?'Acción':'Fecha'}</span><span class="v mono">${next.vencido?'<span style="color:var(--red)">hacer ya</span>':fmtDShort(next.accionFecha||next.date)}</span></div>
          <div class="eq-stat"><span class="muted">Restan (hoy)</span><span class="v mono">${next.vencido?'VENCIDO':num(next.horasRestantes)+' h · '+next.diasRestantes+' d'}</span></div>`
          :`<div class="muted small">Sin mantenimientos en el horizonte.</div>`}
        <div class="muted" style="font-size:10.5px;margin-top:8px">Lectura real: M${num(p.base.horasMotor)} B${num(p.base.horasBomba)} · ${fmtD(p.base.fecha)}</div>
      </div></div>`;
  });
  html+=`</div>`;
  M.innerHTML=html;
}
function currentHoras(eq,fuente){ const lr=lastReading(eq.id); if(!lr)return 0; return fuente==='motor'?Number(lr.horasMotor):Number(lr.horasBomba); }
function estadoLabel(s){ return {verde:'En plan',amarillo:'Atención',rojo:'Crítico',neutral:'No se alcanza aún',gris:'N/A'}[s]||s; }

function showEquipoDetail(eqId){
  const eq=DB.equipos.find(e=>e.id===eqId); const p=projectEquipo(eq);
  if(p.sinLectura){ openModal(eq.nombre,`<div class="empty">Sin lecturas. Registre horas reales primero.</div>`); return; }
  let evs=planEvents().filter(e=>e.equipo.id===eqId);              // TODOS los planes: próximo + repite si vencido
  const pidx=k=>PLANES.findIndex(x=>x.key===k);
  const dk=x=> x.accionFecha||x.date||'9999-99-99';
  evs.sort((a,b)=> (dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0) || pidx(a.plan.key)-pidx(b.plan.key) || a.horas-b.horas);   // por FECHA de vencimiento
  const venc=evs.filter(e=>e.vencido).length;
  const naAplica=p.planes.filter(r=>r.naAplica).map(r=>r.plan.nombre);
  let html=`<div class="row" style="margin-bottom:12px">
    <div class="kpi" style="flex:1"><div class="accent"></div><div class="lbl">Motor — hoy (proy.)</div><div class="val mono">${num(p.horasHoyMotor)}</div><div class="sub">real ${num(p.base.horasMotor)}h @ ${fmtD(p.base.fecha)} · ${p.motorDia} h/día</div></div>
    <div class="kpi" style="flex:1"><div class="accent"></div><div class="lbl">Bomba — hoy (proy.)</div><div class="val mono">${num(p.horasHoyBomba)}</div><div class="sub">real ${num(p.base.horasBomba)}h · ${p.bombaDia} h/día</div></div></div>`;
  if(p.finPad) html+=`<div style="background:#101a30;border:1px solid #25325a;border-radius:8px;padding:10px 14px;margin-bottom:12px;color:#9fb0d8;font-size:13px"> <b>Operando en ${esc(p.finPad.pad)}</b> hasta el ${fmtD(p.finPad.fecha)} → al terminar el pad tendrá <b>M ${num(p.finPad.motor)}h motor</b> · <b>B ${num(p.finPad.bomba)}h bomba</b></div>`;
  html+=`<div class="muted small" style="margin-bottom:10px">Cada plan muestra su <b>próximo</b>; los <span style="color:var(--red)">vencidos</span> se repiten. El próximo se cuenta <b>desde el último mantenimiento registrado</b> (col. <b>Base</b>: desde horas); si no hay registro, desde el último ciclo cumplido por horas. <i>Ej: Alfa hecho a 1.600h → próximo a 2.100h.</i> · <span style="color:var(--red)">${venc} vencido(s)</span>.</div>`;
  html+=`<div class="table-wrap" style="max-height:50vh;overflow:auto"><table><thead><tr><th>Plan</th><th>Comp.</th><th class="right">Cada</th><th>Base ciclo</th><th class="right">A las (h)</th><th class="right">Restan h</th><th>Se cumple</th><th>Acción recomendada</th><th>Estado</th></tr></thead><tbody>`;
  const recColor={rojo:'#ff9a4d',amarillo:'#ffc24d',verde:'#3fe0a0',neutral:'var(--muted)',gris:'var(--muted)',ya:'#ff7378'};
  evs.forEach(e=>{
    const realTxt = e.horasReal!=null?` <span style="color:#5fd0e0">· se hará a ~${num(e.horasReal)}h</span>`:'';
    const fecha = (e.vencido?'<span style="color:var(--red)">VENCIDO</span>' : (e.beyond?'<span class="muted">sin fecha</span>' : fmtDShort(e.date)+' · '+e.diasRestantes+'d'))+realTxt;
    const exec  = lastExecHours(eqId,e.plan.key,e.plan.fuente);
    const base  = exec!=null?`<span style="color:#5fd0e0">desde ${num(exec)}h</span>` : '<span class="muted">por horas</span>';
    const rec=e.rec; const accion = rec&&rec.txt? `<span style="color:${recColor[rec.cls]||'var(--muted)'}">${rec.tipo==='postpad'?' ':rec.tipo==='prepad'?' ':''}${esc(rec.txt)}</span>` : '<span class="muted">en la fecha</span>';
    html+=`<tr><td><span class="tag">${e.plan.nombre}</span></td><td class="muted">${e.plan.componente}</td>
      <td class="right mono">${num(e.plan.intervalo)}</td><td class="mono small">${base}</td><td class="right mono">${num(e.horas)}</td>
      <td class="right mono">${e.vencido?'—':num(e.horasRestantes)}</td>
      <td class="mono small">${fecha}</td><td class="small">${accion}</td>
      <td><span class="pill ${e.estado}">${estadoLabel(e.estado)}</span></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  if(naAplica.length) html+=`<div class="muted small" style="margin-top:10px"> Única vez ya ejecutado (no se repite): ${naAplica.join(', ')}</div>`;
  openModal(`${eq.nombre} · Todos los planes`,html,null,true);
}

function renderEquipos(){
  let html=`<div class="section-head"><h1>Fracturadores</h1><div class="desc">Alta, edición y baja de equipos</div><div class="sp"></div>
    <button class="btn" onclick="eqForm()">+ Nuevo fracturador</button></div>`;
  html+=`<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Código</th><th>Estado</th><th>H. Motor</th><th>H. Bomba</th><th>Última lectura</th><th>Observaciones</th><th></th></tr></thead><tbody>`;
  if(!DB.equipos.length) html+=`<tr><td colspan="8"><div class="empty"><span class="ic"></span>Sin equipos.</div></td></tr>`;
  DB.equipos.forEach(e=>{
    const lr=lastReading(e.id);
    const sc={Operativo:'verde','En mantenimiento':'amarillo',Baja:'rojo',Inactivo:'neutral'}[e.estado]||'neutral';
    html+=`<tr><td><b>${esc(e.nombre)}</b></td><td class="mono">${esc(e.codigo||'')}</td>
      <td><span class="pill ${sc}">${esc(e.estado)}</span></td>
      <td class="mono">${lr?num(lr.horasMotor):'—'}</td><td class="mono">${lr?num(lr.horasBomba):'—'}</td>
      <td class="mono">${lr?fmtD(lr.fecha):'—'}</td><td class="muted small">${esc(e.obs||'')}</td>
      <td class="actions"><button class="iconbtn" title="Editar" onclick="eqForm('${e.id}')">Editar</button>
      <button class="iconbtn" title="Eliminar" onclick="eqDelete('${e.id}')">Eliminar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  M.innerHTML=html;
}
function eqForm(id){
  const e=id?DB.equipos.find(x=>x.id===id):{nombre:'',codigo:'',estado:'Operativo',obs:'',motorDia:'',bombaDia:''};
  const body=`<div class="form-grid">
    <div class="field"><label>Nombre *</label><input id="f-nombre" value="${esc(e.nombre)}"></div>
    <div class="field"><label>Código interno</label><input id="f-codigo" value="${esc(e.codigo||'')}"></div>
    <div class="field"><label>Estado</label><select id="f-estado">${['Operativo','En mantenimiento','Inactivo','Baja'].map(s=>`<option ${e.estado===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label>—</label><div class="small muted" style="padding-top:9px">Ritmo específico (opcional, sobrescribe global)</div></div>
    <div class="field"><label>Horas motor/día</label><input id="f-motorDia" type="number" value="${e.motorDia||''}" placeholder="global: ${DB.params.horasMotorDia}"></div>
    <div class="field"><label>Horas bomba/día</label><input id="f-bombaDia" type="number" value="${e.bombaDia||''}" placeholder="global: ${DB.params.horasBombaDia}"></div>
    <div class="field full"><label>Observaciones</label><textarea id="f-obs">${esc(e.obs||'')}</textarea></div></div>`;
  openModal(id?'Editar fracturador':'Nuevo fracturador',body,()=>{
    const nombre=val('f-nombre').trim(); if(!nombre)return toast('El nombre es obligatorio','err');
    const o={nombre,codigo:val('f-codigo').trim(),estado:val('f-estado'),obs:val('f-obs').trim(),
      motorDia:val('f-motorDia')?Number(val('f-motorDia')):'',bombaDia:val('f-bombaDia')?Number(val('f-bombaDia')):''};
    if(id){ Object.assign(DB.equipos.find(x=>x.id===id),o); audit('Editar equipo',nombre); }
    else { o.id=uid(); DB.equipos.push(o); audit('Crear equipo',nombre); }
    saveDB(); closeModal(); renderEquipos(); toast('Equipo guardado');
  });
}
function eqDelete(id){
  const e=DB.equipos.find(x=>x.id===id);
  if(!confirm(`¿Eliminar "${e.nombre}"? Se borrarán sus lecturas y se quitará de los pads.`))return;
  DB.equipos=DB.equipos.filter(x=>x.id!==id);
  DB.lecturas=DB.lecturas.filter(l=>l.equipoId!==id);
  DB.pads.forEach(p=>p.asignaciones=(p.asignaciones||[]).filter(a=>a.equipoId!==id));
  DB.mantenimientos=DB.mantenimientos.filter(m=>m.equipoId!==id);
  audit('Eliminar equipo',e.nombre); saveDB(); renderEquipos(); toast('Equipo eliminado','warn');
}

   HORAS REALES (con auditoría)

function renderHoras(){
  let html=`<div class="section-head"><h1>Horas reales</h1><div class="desc">Lecturas de horómetros · prioridad absoluta sobre proyecciones</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('lecturas')">Excel</button>
    <button class="btn" onclick="lectForm()">+ Registrar lectura</button></div>`;
  html+=`<div class="help"><span class="ic">ℹ</span><div>El sistema proyecta horas <b>solo desde la última lectura real</b> de cada equipo y únicamente en los días con pad asignado. Nunca duplica horas ya registradas.</div></div>`;
  html+=`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th class="right">H. Motor</th><th class="right">H. Bomba</th><th>Observaciones</th><th></th></tr></thead><tbody>`;
  const ls=[...DB.lecturas].sort((a,b)=>a.fecha<b.fecha?1:-1);

  ls.forEach(l=>{
    html+=`<tr><td class="mono">${fmtD(l.fecha)}</td><td><b>${esc(eqName(l.equipoId))}</b></td>
      <td class="right mono">${num(l.horasMotor)}</td><td class="right mono">${num(l.horasBomba)}</td>
      <td class="muted small">${esc(l.obs||'')}</td>
      <td class="actions"><button class="iconbtn" onclick="lectForm('${l.id}')">Editar</button><button class="iconbtn" onclick="lectDelete('${l.id}')">Eliminar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  // auditoría
  html+=`<div class="card" style="margin-top:16px"><h3>Auditoría de cambios <span class="sub">últimos 12</span></h3><div class="table-wrap" style="border:none"><table><thead><tr><th>Fecha/hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>`;
  if(!DB.audit.length) html+=`<tr><td colspan="4" class="muted">Sin registros.</td></tr>`;
  DB.audit.slice(0,12).forEach(a=>{ html+=`<tr><td class="mono small">${new Date(a.ts).toLocaleString('es-AR')}</td><td>${esc(a.user)}</td><td><span class="tag">${esc(a.accion)}</span></td><td class="muted">${esc(a.detalle||'')}</td></tr>`; });
  html+=`</tbody></table></div></div>`;
  M.innerHTML=html;
}
function lectForm(id){
  const l=id?DB.lecturas.find(x=>x.id===id):{equipoId:DB.equipos[0]?.id,fecha:todayISO(),horasMotor:'',horasBomba:'',obs:''};
  const body=`<div class="form-grid">
    <div class="field"><label>Equipo *</label><select id="f-eq">${DB.equipos.map(e=>`<option value="${e.id}" ${l.equipoId===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label>Fecha *</label><input id="f-fecha" type="date" value="${l.fecha}"></div>
    <div class="field"><label>Horas motor *</label><input id="f-hm" type="number" value="${l.horasMotor}"></div>
    <div class="field"><label>Horas bomba *</label><input id="f-hb" type="number" value="${l.horasBomba}"></div>

function lectDelete(id){ const l=DB.lecturas.find(x=>x.id===id); if(!confirm('¿Eliminar esta lectura?'))return; DB.lecturas=DB.lecturas.filter(x=>x.id!==id); audit('Eliminar lectura',`${eqName(l.equipoId)} ${l.fecha}`); saveDB(); renderHoras(); toast('Lectura eliminada','warn'); }

/* ============================================================
   PADS
   ============================================================ */
function renderPads(){
  let html=`<div class="section-head"><h1>Pads</h1><div class="desc">Cronograma futuro de operación</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('pads')">Excel</button>
    <button class="btn" onclick="padForm()">+ Nuevo pad</button></div>`;
  html+=`<div class="help"><span class="ic">ℹ</span><div>Cada fracturador tiene su propio rango <b>desde/hasta</b> dentro del pad. Si un equipo entró a mitad del pad, las horas se suman <b>solo desde su fecha de ingreso</b>, no desde el inicio del pad. Los rangos parciales se muestran en <span style="color:#ffc24d">ámbar</span>.</div></div>`;
  html+=`<div class="table-wrap"><table><thead><tr><th>Pad</th><th>Cliente</th><th>Pad: inicio</th><th>Pad: fin</th><th>Días</th><th>Fracturadores (rango de trabajo)</th><th></th></tr></thead><tbody>`;
  const ps=[...DB.pads].sort((a,b)=>a.fechaInicio<b.fechaInicio?-1:1);
  if(!ps.length) html+=`<tr><td colspan="7"><div class="empty"><span class="ic"></span>Sin pads.</div></td></tr>`;
  ps.forEach(p=>{
    const dur=daysBetween(p.fechaInicio,p.fechaFin)+1;
    const tags=(p.asignaciones||[]).map(a=>{
      const parcial=a.desde>p.fechaInicio||a.hasta<p.fechaFin;
      return `<span class="tag" ${parcial?'style="border-color:var(--amber);color:#ffc24d"':''} title="${parcial?'Ingreso/egreso parcial':'Cubre todo el pad'}">${esc(eqName(a.equipoId))} · ${fmtDM(a.desde)}→${fmtDM(a.hasta)}</span>`;
    }).join(' ')||'<span class="muted">—</span>';
    html+=`<tr><td><b>${esc(p.nombre)}</b></td><td>${esc(p.cliente||'')}</td><td class="mono">${fmtD(p.fechaInicio)}</td><td class="mono">${fmtD(p.fechaFin)}</td>
      <td class="mono">${dur}</td><td>${tags}</td>
      <td class="actions"><button class="iconbtn" onclick="padForm('${p.id}')">Editar</button><button class="iconbtn" onclick="padDelete('${p.id}')">Eliminar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  M.innerHTML=html;
}
function padForm(id){
  const p=id?DB.pads.find(x=>x.id===id):{nombre:'',cliente:'',fechaInicio:todayISO(),fechaFin:todayISO(),asignaciones:[]};
  const asigOf=eid=>(p.asignaciones||[]).find(a=>a.equipoId===eid);
  const rows=DB.equipos.map(e=>{const a=asigOf(e.id);return `
    <div style="display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:7px">
      <label class="checkrow"><input type="checkbox" class="f-eq" value="${e.id}" ${a?'checked':''}> ${esc(e.nombre)}</label>
      <input type="date" class="f-desde" data-eq="${e.id}" value="${a?a.desde:p.fechaInicio}" title="Desde">
      <input type="date" class="f-hasta" data-eq="${e.id}" value="${a?a.hasta:p.fechaFin}" title="Hasta">
    </div>`;}).join('');
  const body=`<div class="form-grid">
    <div class="field"><label>Nombre del pad *</label><input id="f-nombre" value="${esc(p.nombre)}"></div>
    <div class="field"><label>Cliente</label><input id="f-cli" value="${esc(p.cliente||'')}"></div>
    <div class="field"><label>Pad — fecha inicio *</label><input id="f-ini" type="date" value="${p.fechaInicio}" oninput="padSyncDates()"></div>
    <div class="field"><label>Pad — fecha fin *</label><input id="f-fin" type="date" value="${p.fechaFin}" oninput="padSyncDates()"></div>
    <div class="field full"><label>Fracturadores y fechas de trabajo
      <span class="linklike" style="float:right;font-size:11px" onclick="padFillDates()">Igualar todos al pad</span></label>
      <div style="background:#0d1422;border:1px solid var(--border);padding:11px;border-radius:7px">
        <div style="display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px"><span>Equipo</span><span>Trabajó desde</span><span>Trabajó hasta</span></div>
        ${rows}
      </div><div class="muted small" style="margin-top:6px">Tildá el equipo y ajustá sus fechas reales de trabajo. Solo se suman horas dentro de ese rango.</div></div></div>`;
  PAD_DATES={ini:p.fechaInicio,fin:p.fechaFin};   // para auto-sincronizar al cambiar fechas del pad
  openModal(id?'Editar pad':'Nuevo pad',body,()=>{
    const nombre=val('f-nombre').trim(); if(!nombre)return toast('Nombre obligatorio','err');
    const ini=val('f-ini'),fin=val('f-fin'); if(fin<ini)return toast('La fecha fin del pad no puede ser anterior al inicio','err');
    const asignaciones=[];
    for(const c of document.querySelectorAll('.f-eq:checked')){
      const eid=c.value;
      const desde=document.querySelector(`.f-desde[data-eq="${eid}"]`).value||ini;
      const hasta=document.querySelector(`.f-hasta[data-eq="${eid}"]`).value||fin;
      if(hasta<desde) return toast(`${eqName(eid)}: la fecha "hasta" no puede ser anterior a "desde"`,'err');
      asignaciones.push({equipoId:eid,desde,hasta});
    }
    const o={nombre,cliente:val('f-cli').trim(),fechaInicio:ini,fechaFin:fin,asignaciones};
    if(id){ Object.assign(DB.pads.find(x=>x.id===id),o); audit('Editar pad',nombre); }
    else{ o.id=uid(); DB.pads.push(o); audit('Crear pad',nombre); }
    const reagrupo = reagruparAuto();   // al cambiar pads, reescribimos las fechas manuales y reagrupamos inteligentemente
    saveDB(); closeModal(); renderPads();
    toast(reagrupo ? 'Pad guardado · agrupación recalculada' : 'Pad guardado');
  });
}
// Iguala todas las fechas de asignación al rango del pad
function padFillDates(){
  const ini=val('f-ini'),fin=val('f-fin');
  document.querySelectorAll('.f-desde').forEach(i=>i.value=ini);
  document.querySelectorAll('.f-hasta').forEach(i=>i.value=fin);
  PAD_DATES={ini,fin};
}
// Al cambiar las fechas del PAD, sincroniza las fechas de los equipos que aún tenían el rango por defecto
let PAD_DATES={ini:'',fin:''};
function padSyncDates(){
  const ni=val('f-ini'),nf=val('f-fin');
  document.querySelectorAll('.f-desde').forEach(i=>{ if(!i.value||i.value===PAD_DATES.ini) i.value=ni; });
  document.querySelectorAll('.f-hasta').forEach(i=>{ if(!i.value||i.value===PAD_DATES.fin) i.value=nf; });
  PAD_DATES={ini:ni,fin:nf};
}
function padDelete(id){ const p=DB.pads.find(x=>x.id===id); if(!confirm(`¿Eliminar "${p.nombre}"?`))return; DB.pads=DB.pads.filter(x=>x.id!==id); audit('Eliminar pad',p.nombre); reagruparAuto(); saveDB(); renderPads(); toast('Pad eliminado · agrupación recalculada','warn'); }
// Al cambiar pads, descartamos las fechas fijadas/movidas manualmente para que la agrupación inteligente se recalcule de cero. Devuelve true si había algo que limpiar.
function reagruparAuto(){ const n=Object.keys(DB.planificado||{}).length; DB.planificado={}; return n>0; }
// Botón manual: borra TODOS los cambios manuales (fechas fijadas/movidas) y recalcula la agrupación automática.
function reagruparManual(){
  const n=Object.keys(DB.planificado||{}).length;
  if(!n){ toast('No hay cambios manuales para borrar','warn'); return; }
  if(!confirm(`¿Reagrupar todo?\n\nSe borrarán tus ${n} cambio(s) manual(es) (fechas fijadas y mantenimientos movidos « / ») y todo se recalculará con la agrupación inteligente automática.\n\nDespués podés volver a mover lo que quieras.`)) return;
  DB.planificado={}; audit('Reagrupar todo (manual)',`borró ${n} planificados`); saveDB(); route(CURRENT);
  toast('Reagrupado · cambios manuales borrados');
}

/* ============================================================
   PLANES Y MATERIALES (BOM)
   Modelo normalizado: Productos (catálogo) + BOM (plan↔producto).
   Decisión técnica: gestionar POR PRODUCTO con vista POR PLAN.
   ============================================================ */
function renderPlanes(){
  let html=`<div class="section-head"><h1>Planes y materiales</h1><div class="desc">Lista de materiales (BOM) por plan · catálogo de productos compartido</div><div class="sp"></div>
    <button class="btn ghost" onclick="reloadMateriales()">Recargar materiales de fábrica</button>
    <button class="btn ghost" onclick="prodCatalog()"> Catálogo de productos</button></div>`;
  html+=`<div class="help"><span class="ic">ℹ</span><div><b>Decisión de diseño:</b> los materiales se modelan como <b>productos</b> en un catálogo único, vinculados a cada plan por una lista de materiales (BOM). Así un mismo repuesto puede pertenecer a varios planes sin duplicarse, el stock se controla por producto y las órdenes —que se lanzan por plan— se "explotan" automáticamente en demanda de productos.</div></div>`;
  html+=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">`;
  PLANES.forEach(pl=>{
    const items=DB.bom.filter(b=>b.plan===pl.key);
    html+=`<div class="card"><h3><span class="tag">${pl.nombre}</span> ${pl.componente} <span class="sub">${num(pl.intervalo)}h · ${pl.fuente}</span></h3>`;
    if(!items.length) html+=`<div class="muted small" style="margin-bottom:8px">Sin materiales cargados.</div>`;
    else{
      html+=`<table style="font-size:12px"><tbody>`;
      items.forEach(b=>{ const p=prodById(b.productoId); html+=`<tr><td style="padding:5px 4px"><b class="mono small" style="color:#9fb0d8">${esc(p?.refInterna||'?')}</b><br><span class="small">${esc(p?.descripcion||'(eliminado)')}</span>${p?.partNumber?`<br><span class="muted" style="font-size:10px">PN: ${esc(p.partNumber)}</span>`:''}</td><td class="right mono">${num(b.cantidad)} ${esc(p?.unidad||'')}</td><td class="right"><button class="iconbtn" style="width:24px;height:24px;font-size:11px" onclick="bomDelete('${b.id}')">×</button></td></tr>`; });
      html+=`</tbody></table>`;
    }
    html+=`<button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="bomAdd('${pl.key}')">+ Agregar material</button></div>`;
  });
  html+=`</div>`;
  M.innerHTML=html;
}
function bomAdd(planKey){
  if(!DB.productos.length) return toast('Primero cree productos en el catálogo','warn');
  const body=`<div class="form-grid">
    <div class="field full"><label>Producto</label><select id="f-prod">${DB.productos.map(p=>`<option value="${p.id}">${esc(p.refInterna)} — ${esc(p.descripcion)}${p.partNumber?' (PN '+esc(p.partNumber)+')':''}</option>`).join('')}</select></div>
    <div class="field"><label>Cantidad por intervención</label><input id="f-cant" type="number" value="1"></div></div>`;
  openModal(`Agregar material a ${PLAN(planKey).nombre}`,body,()=>{
    DB.bom.push({id:uid(),plan:planKey,productoId:val('f-prod'),cantidad:Number(val('f-cant'))||1});
    saveDB(); closeModal(); renderPlanes(); toast('Material agregado');
  });
}
function bomDelete(id){ DB.bom=DB.bom.filter(b=>b.id!==id); saveDB(); renderPlanes(); }
function prodCatalog(){
  let body=`<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm" onclick="prodForm()">+ Producto</button></div>
    <div class="table-wrap"><table><thead><tr><th>Referencia interna</th><th>Descripción</th><th>Part Number</th><th>Unidad</th><th></th></tr></thead><tbody>`;
  [...DB.productos].sort((a,b)=>(a.refInterna||'')<(b.refInterna||'')?-1:1).forEach(p=>{ body+=`<tr><td class="mono" style="color:#9fb0d8;font-weight:600">${esc(p.refInterna)}</td><td>${esc(p.descripcion)}</td><td class="mono muted">${esc(p.partNumber||'—')}</td><td>${esc(p.unidad)}</td>
    <td class="actions"><button class="iconbtn" onclick="prodForm('${p.id}')">Editar</button><button class="iconbtn" onclick="prodDelete('${p.id}')">Eliminar</button></td></tr>`; });
  body+=`</tbody></table></div>`;
  openModal('Catálogo de productos',body,null,true);
}
function prodForm(id){
  const p=id?DB.productos.find(x=>x.id===id):{refInterna:'',partNumber:'',descripcion:'',unidad:'Unidad'};
  const body=`<div class="form-grid">
    <div class="field full"><label>Referencia interna * <span class="muted small">(código entre corchetes)</span></label><input id="f-ref" value="${esc(p.refInterna||'')}" placeholder="ej: 8.14.01.01.00.0007"></div>
    <div class="field"><label>Part Number</label><input id="f-pn" value="${esc(p.partNumber||'')}" placeholder="ej: P562223"></div>

  openModal(id?'Editar producto':'Nuevo producto',body,()=>{
    const ref=val('f-ref').trim(),desc=val('f-desc').trim(); if(!ref||!desc)return toast('Referencia interna y descripción obligatorias','err');
    const o={refInterna:ref,partNumber:val('f-pn').trim(),descripcion:desc,unidad:val('f-uni').trim()||'Unidad'};

    else{ const np={id:uid(),...o}; DB.productos.push(np); DB.stock.push({id:uid(),productoId:np.id,stockActual:0,leadTimeDias:DB.params.leadTimeDefaultDias,costoUnitario:0,costoPedido:5000}); }

function prodDelete(id){ if(!confirm('¿Eliminar producto? Se quitará de los planes (BOM).'))return; DB.productos=DB.productos.filter(p=>p.id!==id); DB.bom=DB.bom.filter(b=>b.productoId!==id); DB.stock=DB.stock.filter(s=>s.productoId!==id); saveDB(); prodCatalog(); }
// Reemplaza SOLO el catálogo de materiales (productos+BOM+stock) por el de fábrica actualizado, conservando el resto de los datos
function reloadMateriales(){
  if(!confirm('¿Reemplazar el catálogo de materiales (productos, BOM y stock) por el de fábrica con las referencias internas corregidas?\n\nSe CONSERVAN equipos, lecturas, pads, mantenimientos y órdenes. Los valores de stock cargados a mano se intentan conservar por código.'))return;
  // preservar valores de stock por referencia interna o part number
  const prev={};
  DB.stock.forEach(s=>{ const p=DB.productos.find(x=>x.id===s.productoId); if(!p)return; const v={stockActual:s.stockActual,leadTimeDias:s.leadTimeDias,costoUnitario:s.costoUnitario,costoPedido:s.costoPedido}; if(p.refInterna)prev[p.refInterna]=v; if(p.partNumber)prev[p.partNumber]=v; });
  const fresh=seed();
  DB.productos=fresh.productos; DB.bom=fresh.bom;
  DB.stock=fresh.stock.map(s=>{ const p=fresh.productos.find(x=>x.id===s.productoId); const pv=p&&(prev[p.refInterna]||prev[p.partNumber]); return pv?{...s,...pv}:s; });
  audit('Recargar materiales','catálogo de fábrica (referencias B.xx)'); saveDB(); renderPlanes(); toast('Materiales actualizados a las referencias de fábrica');
}

/* ============================================================
   ÓRDENES DE PRODUCCIÓN (aprendizaje de lead time)
   ============================================================ */
function renderOrdenes(){
  const g=leadStatsGlobal();
  let html=`<div class="section-head"><h1>Órdenes de producción</h1><div class="desc">Lanzamiento, compromiso y recepción · plazos recalculados con historial real</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('ordenes')">Excel</button>
    <button class="btn" onclick="ordForm()">+ Nueva orden</button></div>`;

/* ============================================================
   STOCK / INVENTARIO  (EOQ · ROP · Stock de seguridad)
   ============================================================ */
// Demanda anual proyectada por producto, explotando BOM de mantenimientos proyectados (próx 365 d)
function demandaAnualProductos(){
  const dem={}; const maints=allProjectedMaints().filter(m=>m.diasRestantes<=365);
  maints.forEach(m=>{ DB.bom.filter(b=>b.plan===m.plan.key).forEach(b=>{ dem[b.productoId]=(dem[b.productoId]||0)+Number(b.cantidad); }); });
  return dem;
}
function stockAnalysis(){
  const dem=demandaAnualProductos();
  const z=DB.params.zServicio||1.65;
  return DB.stock.map(s=>{
    const p=prodById(s.productoId); if(!p) return null;
    const D=dem[s.productoId]||0;                       // demanda anual proyectada
    const dDia=D/365;
    const LT=Number(s.leadTimeDias)||DB.params.leadTimeDefaultDias;
    const demLT=dDia*LT;                                // demanda durante lead time
    const sigmaLT=Math.sqrt(LT)*dDia*0.5;              // var. estimada (50% de la media diaria)
    const SS=Math.round(z*sigmaLT);                     // stock de seguridad
    const ROP=Math.round(demLT+SS);                     // punto de pedido
    const S=Number(s.costoPedido)||5000, H=Math.max(1,(Number(s.costoUnitario)||1)*0.25); // costo mantener 25%/año
    const EOQ=D>0?Math.round(Math.sqrt(2*D*S/H)):0;     // lote óptimo
    const aPedir=Math.max(0, ROP+EOQ-(Number(s.stockActual)||0));
    const bajoROP=(Number(s.stockActual)||0)<ROP;
    return {s,p,D,LT,SS,ROP,EOQ,aPedir,bajoROP,stockActual:Number(s.stockActual)||0};
  }).filter(Boolean);
}
function coberturaStock(){
  const a=stockAnalysis().filter(x=>x.D>0);
  if(!a.length) return {pct:100,cls:'green',faltantes:0};
  const ok=a.filter(x=>!x.bajoROP).length;
  const pct=Math.round(ok/a.length*100);
  return {pct,faltantes:a.length-ok,cls:pct>=85?'green':pct>=60?'amber':'red'};
}
function renderStock(){
  const a=stockAnalysis();
  let html=`<div class="section-head"><h1>Stock / Inventario</h1><div class="desc">Cálculo automático de punto de pedido (ROP), stock de seguridad y lote óptimo (EOQ)</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('stock')">Excel</button></div>`;
  html+=`<div class="help"><span class="ic">ℹ</span><div>La <b>demanda</b> se calcula explotando la BOM de todos los mantenimientos proyectados a 12 meses. Fórmulas: <b>ROP</b> = demanda(lead time) + stock seguridad · <b>SS</b> = z·σ<sub>LT</sub> (z=${DB.params.zServicio}) · <b>EOQ</b> = √(2·D·S/H).</div></div>`;
  html+=`<div class="table-wrap"><table><thead><tr><th>Producto</th><th class="right">Stock</th><th class="right">Demanda/año</th><th class="right">Lead (d)</th><th class="right">Stock seg.</th><th class="right">ROP</th><th class="right">EOQ</th><th class="right">A fabricar</th><th>Estado</th><th></th></tr></thead><tbody>`;
  const sorted=[...a].sort((x,y)=>(y.bajoROP?1:0)-(x.bajoROP?1:0)|| y.D-x.D);
  sorted.forEach(x=>{
    html+=`<tr><td><b class="mono small" style="color:#9fb0d8">${esc(x.p.refInterna)}</b><br><span class="small">${esc(x.p.descripcion)}</span>${x.p.partNumber?`<br><span class="muted" style="font-size:10px">PN: ${esc(x.p.partNumber)}</span>`:''}</td>
      <td class="right mono">${num(x.stockActual)}</td><td class="right mono">${num(x.D)}</td><td class="right mono">${x.LT}</td>
      <td class="right mono">${num(x.SS)}</td><td class="right mono">${num(x.ROP)}</td><td class="right mono">${num(x.EOQ)}</td>
      <td class="right mono"><b ${x.aPedir>0&&x.bajoROP?'style="color:var(--amber)"':''}>${num(x.aPedir)}</b></td>
      <td><span class="pill ${x.bajoROP&&x.D>0?'rojo':(x.D>0?'verde':'gris')}">${x.D>0?(x.bajoROP?'Reponer':'OK'):'Sin demanda'}</span></td>
      <td class="actions"><button class="iconbtn" onclick="stockForm('${x.s.id}')">Editar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  // recomendaciones de fabricación
  const rep=sorted.filter(x=>x.bajoROP&&x.D>0);
  if(rep.length){
    html+=`<div class="card" style="margin-top:16px"><h3>Plan de fabricación recomendado</h3><div class="muted small" style="margin-bottom:10px">Ítems por debajo del punto de pedido — lanzar producción ahora:</div>`;
    rep.forEach(x=>{ html+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1b2336"><span><b class="mono small" style="color:#9fb0d8">${esc(x.p.refInterna)}</b> ${esc(x.p.descripcion)}${x.p.partNumber?` <span class="muted small">(PN ${esc(x.p.partNumber)})</span>`:''}</span><span><b style="color:var(--amber)">Fabricar ${num(x.aPedir)}</b> ${esc(x.p.unidad)} · lead ${x.LT}d</span></div>`; });
    html+=`</div>`;
  }
  M.innerHTML=html;
}

  const y=calMonth.getFullYear(),mo=calMonth.getMonth();

  DB.pads.forEach(p=>{ push(p.fechaInicio,{type:'pad',label:' '+p.nombre}); });
  // mantenimiento marcado en la FECHA DE ACCIÓN recomendada (antes/después del pad), no solo en el cruce
  maints.forEach(m=>{
    const rec=m.rec; const fechaAccion=(rec&&rec.fecha)||m.date; if(!fechaAccion) return;
    const pre=rec&&rec.tipo==='prepad', post=rec&&rec.tipo==='postpad';
    const label=` ${m.equipo.codigo||m.equipo.nombre} ${m.plan.nombre}${pre?' (antes pad)':post?' (post pad)':''}`;

  // function: is iso within any pad
  const inPad=iso=>DB.pads.find(p=>iso>=p.fechaInicio&&iso<=p.fechaFin);

  CAL_EV=evByDay;   // guardar para el detalle del día
  html+=`<div class="cal-grid">`;
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d=>html+=`<div class="cal-head">${d}</div>`);
  const first=new Date(y,mo,1); let startDow=(first.getDay()+6)%7; // lunes=0
  const start=addDays(first,-startDow);
  for(let i=0;i<42;i++){
    const d=addDays(start,i),iso=toISO(d),other=d.getMonth()!==mo,isToday=iso===todayISO();
    const pad=inPad(iso);

    if(evs.length>4) html+=`<div class="linklike" style="font-size:10px">+${evs.length-4} más — ver</div>`;
    html+=`</div>`;
  }
  html+=`</div>`;

  M.innerHTML=html;

/* ============================================================
   PLANIFICACIÓN (GANTT)  — operación + mantenimientos en el tiempo
   ============================================================ */
let GANTT={px:9, equipo:'todos'};
function renderPlanificacion(){
  const px = GANTT.px||9;                                            // px por día FIJO (no se achica). El selector cambia el ZOOM (densidad), no el rango.
  const hoyISO=todayISO();
  const equipos=DB.equipos.filter(e=>e.estado!=='Baja' && (GANTT.equipo==='todos'||e.id===GANTT.equipo));
  const enFoco = a => (GANTT.equipo==='todos'||a.equipoId===GANTT.equipo);
  // El timeline abarca PASADO + FUTURO. Inicio = pad más antiguo de los equipos mostrados (tope 365 d atrás), mínimo 14 d atrás.
  let startISO=toISO(addDays(parseD(hoyISO),-14));
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(enFoco(a) && a.desde<startISO) startISO=a.desde; }));
  const cap=toISO(addDays(parseD(hoyISO),-365)); if(startISO<cap) startISO=cap;
  // Fin = se extiende para cubrir TODOS los datos: último pad y último mantenimiento con fecha (no se corta en un horizonte fijo).
  let endISO=toISO(addDays(parseD(hoyISO),30));
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(enFoco(a) && a.hasta>endISO) endISO=a.hasta; }));
  planEvents().forEach(e=>{ const f=(e.rec&&e.rec.fecha)||e.date; if(f && (GANTT.equipo==='todos'||e.equipo.id===GANTT.equipo) && f>endISO) endISO=f; });
  const start = parseD(startISO);
  const end = addDays(parseD(endISO),3);
  const days = Math.round((end-start)/86400000);
  const trackW = days*px;
  const dx = iso => (parseD(iso)-start)/86400000*px;               // posición horizontal de una fecha
  const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  let html=`<div class="section-head"><h1>Planificación (Gantt)</h1><div class="desc">Operación programada (pads) y mantenimientos proyectados en una línea de tiempo</div><div class="sp"></div>
    <div class="field" style="margin:0;min-width:150px"><label>Equipo</label><select onchange="GANTT.equipo=this.value;renderPlanificacion()">
      <option value="todos">Todos</option>${DB.equipos.map(e=>`<option value="${e.id}" ${GANTT.equipo===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;min-width:140px"><label>Zoom</label><select onchange="GANTT.px=Number(this.value);renderPlanificacion()">
      ${[[18,'Detalle (día)'],[9,'Normal'],[5,'Amplio'],[3,'Panorámico']].map(o=>`<option value="${o[0]}" ${(GANTT.px||9)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
    <button class="btn ghost sm" onclick="ganttHoy()">Hoy</button>
    <button class="btn ghost sm" onclick="renderPlanificacion()">Actualizar</button>
    <label class="row" style="gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" ${VERPROY?'checked':''} onchange="VERPROY=this.checked;renderPlanificacion()"> Ver proyección</label></div>
    <div class="muted small" style="margin:-6px 0 10px">La línea de tiempo llega hasta el último pad/mantenimiento cargado. Deslizá la barra de abajo para ver pasado y futuro; el <b>Zoom</b> agranda o achica los días. El botón <b>Hoy</b> vuelve al día de la fecha.</div>`;
  html+=`<div class="row" style="margin-bottom:12px;font-size:12px">
