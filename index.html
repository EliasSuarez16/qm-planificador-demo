/* ============================================================
   PLANIFICACIÓN (GANTT)  — operación + mantenimientos en el tiempo
   ============================================================ */
// ---- Recomendación en formato CORTO + badge de situación (reusado por Gantt y Agrupación) ----
function recCorto(m){
  const r=m.rec; if(!r) return '';
  const pad=r.pad?r.pad:'el pad';
  switch(r.tipo){
    case 'ya':      return 'Hacer lo antes posible';
    case 'postpad': return 'Esperar y hacer al terminar '+pad;
    case 'prepad':  return 'Adelantar a la parada previa a '+pad;
    case 'manual':  return 'Fecha fijada por vos';
    case 'lejano':  return 'Cargá más pads para precisar la fecha';
    default:        return '';
  }
}
function sitBadge(m){   // {t,cls} — el estado en una palabra/chip
  const tipo=m.rec&&m.rec.tipo;
  if(tipo==='ya') return {t:'hacer ya', cls:'rojo'};                 // vencido y el equipo está parado
  if(m.vencido) return {t:'vencido', cls:'rojo'};                    // vencido pero la acción cae en una parada (al fin del pad)
  if(m.excedente>0) return {t:'se hará vencido ~'+num(m.excedente)+'h', cls:'rojo'};
  if(m.beyond && !m.accionable) return {t:'sin fecha', cls:'neutral'};
  if(tipo==='manual') return {t:'fijado', cls:'azul'};
  if(tipo==='prepad') return {t:'a tiempo', cls:'verde'};
  if(tipo==='postpad') return {t:'al fin del pad', cls:'amarillo'};
  return {t:estadoLabel(m.estado), cls:m.estado};
}
// Celda de acción visual (agrupación): fecha + situación + motivo corto + link fijar
function accionCell(m){
  const f=m.accionFecha||(m.rec&&m.rec.fecha);
  const when=f?`<span class="when">${fmtDShort(f)}</span>`:'';
  const sb=sitBadge(m);
  const sit=`<span class="sit ${sb.cls}"${m.excedente>0?` title="vencido respecto del ciclo de ${num(m.plan.intervalo)}h"`:''}>${sb.t}</span>`;
  const motivo=recCorto(m);
  const fijar=`<span class="linklike rw" style="font-size:11px" onclick="planificarMant('${m.equipo.id}','${m.plan.key}',${m.horas})">${m.manual?'cambiar fecha':'fijar fecha'}</span>`;
  return `<div class="acc"><div class="acc-line">${when}${sit}</div>${motivo?`<div class="acc-motivo">${esc(motivo)}</div>`:''}${fijar}</div>`;
}
// ---- Tooltip flotante del Gantt (tarjeta limpia, no la línea apretada) ----
let GTIPS={};
function gttShow(ev,id){ const t=document.getElementById('gtt'); if(!t)return; t.innerHTML=GTIPS[id]||''; t.style.display='block'; gttMove(ev); }
function gttMove(ev){ const t=document.getElementById('gtt'); if(!t||t.style.display!=='block')return;
  const r=t.getBoundingClientRect(); let x=ev.clientX+16, y=ev.clientY+16;
  if(x+r.width>window.innerWidth-10) x=ev.clientX-r.width-16;
  if(y+r.height>window.innerHeight-10) y=window.innerHeight-r.height-10; if(y<10)y=10;
  t.style.left=x+'px'; t.style.top=y+'px'; }
function gttHide(){ const t=document.getElementById('gtt'); if(t)t.style.display='none'; }
function gttMarkHTML(e){   // contenido del tooltip de un mantenimiento
  return `<div class="gtt-h"><span class="gtt-dot ${e.estado}"></span>${esc(e.equipo.nombre)} — ${esc(e.plan.nombre)}${e.proyeccion?' · proyección':''}</div>`
    +`<div class="gtt-row"><span>Teórico (plan)</span><b>${num(e.teorico)} h</b></div>`
    +`<div class="gtt-row"><span>Ciclo</span><b>${num(e.horas)} h</b></div>`
    +(e.horasReal!=null?`<div class="gtt-row"><span>Se hará a</span><b>~${num(e.horasReal)} h${(e.accionFecha||e.date)?' · '+fmtDM(e.accionFecha||e.date):''}</b></div>`:'')
    +(e.excedente>0?`<div class="gtt-bad">Se hará VENCIDO ~${num(e.excedente)} h (ciclo ${num(e.plan.intervalo)} h)</div>`:'')
    +(recCorto(e)?`<div class="gtt-muted">${esc(recCorto(e))}</div>`:'');
}
// Letra griega de cada plan (para el Gantt). Alfa Zero = α con un 0; el resto, su letra.
const GRIEGAS={ALFA_ZERO:'α',ALFA:'α',BETA:'β',GAMMA:'γ',DELTA:'δ',EPSILON:'ε',ZETA:'ζ',ETA:'η',THETA:'θ',IOTA:'ι',KAPPA:'κ'};
function glifoPlan(key){ return key==='ALFA_ZERO' ? 'α<span class="g0">0</span>' : (GRIEGAS[key]||'?'); }
// Tramos de operación de un equipo según sus PADS reales (fechas completas, no recortado a la lectura) — para dibujar las barras del Gantt
function padRunsEquipo(eqId){
  let ivs=[];
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId && a.desde && a.hasta) ivs.push({d:a.desde,h:a.hasta,nombre:p.nombre}); }));
  ivs.sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.end),1))){ if(o.h>last.end)last.end=o.h; last.nombres.add(o.nombre); } else merged.push({start:o.d,end:o.h,nombres:new Set([o.nombre])}); });
  return merged.map(m=>({start:m.start,end:m.end,pads:[...m.nombres]}));
}
let GANTT={px:9, equipo:'todos'};
function renderPlanificacion(){
  const px = GANTT.px||9;                                            // px por día FIJO (no se achica). El selector cambia el ZOOM (densidad), no el rango.
  GTIPS={}; let gtseq=0;                                             // tooltips flotantes (se regeneran en cada render)
  const hoyISO=todayISO();
  const equipos=DB.equipos.filter(e=>e.estado!=='Baja' && (GANTT.equipo==='todos'||e.id===GANTT.equipo));
  const enFoco = a => (GANTT.equipo==='todos'||a.equipoId===GANTT.equipo);
  // El timeline abarca PASADO + FUTURO. Inicio = pad más antiguo de los equipos mostrados (tope 365 d atrás), mínimo 14 d atrás.
  let startISO=toISO(addDays(parseD(hoyISO),-14));
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(enFoco(a) && a.desde<startISO) startISO=a.desde; }));
  const cap=toISO(addDays(parseD(hoyISO),-365)); if(startISO<cap) startISO=cap;
  // Fin = se extiende para cubrir TODOS los datos: último pad y último mantenimiento con fecha (no se corta en un horizonte fijo).
  let endISO=toISO(addDays(parseD(hoyISO),30));
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(enFoco(a) && a.hasta>endISO) endISO=a.hasta; }));
  planEvents().forEach(e=>{ const f=(e.rec&&e.rec.fecha)||e.date; if(f && (GANTT.equipo==='todos'||e.equipo.id===GANTT.equipo) && f>endISO) endISO=f; });
  const start = parseD(startISO);
  const end = addDays(parseD(endISO),3);
  const days = Math.round((end-start)/86400000);
  const trackW = days*px;
  const dx = iso => (parseD(iso)-start)/86400000*px;               // posición horizontal de una fecha
  const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  let html=`<div class="section-head"><h1>Planificación (Gantt)</h1><div class="desc">Operación programada (pads) y mantenimientos proyectados en una línea de tiempo</div><div class="sp"></div>
    <div class="field" style="margin:0;min-width:150px"><label>Equipo</label><select onchange="GANTT.equipo=this.value;renderPlanificacion()">
      <option value="todos">Todos</option>${DB.equipos.map(e=>`<option value="${e.id}" ${GANTT.equipo===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;min-width:140px"><label>Zoom</label><select onchange="GANTT.px=Number(this.value);renderPlanificacion()">
      ${[[18,'Detalle (día)'],[9,'Normal'],[5,'Amplio'],[3,'Panorámico']].map(o=>`<option value="${o[0]}" ${(GANTT.px||9)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
    <button class="btn ghost sm" onclick="ganttHoy()">Hoy</button>
    <button class="btn ghost sm" onclick="renderPlanificacion()">Actualizar</button>
    <label class="row" style="gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" ${VERPROY?'checked':''} onchange="VERPROY=this.checked;renderPlanificacion()"> Ver proyección</label></div>
    <div class="muted small" style="margin:-6px 0 10px">La línea de tiempo llega hasta el último pad/mantenimiento cargado. Deslizá la barra de abajo para ver pasado y futuro; el <b>Zoom</b> agranda o achica los días. El botón <b>Hoy</b> vuelve al día de la fecha.</div>`;
  html+=`<div class="row" style="margin-bottom:8px;font-size:13px;align-items:center;gap:20px;flex-wrap:wrap">
    <span class="row" style="gap:8px;align-items:center"><span class="gantt-bar" style="position:static;display:inline-block;height:20px;line-height:18px;padding:0 10px;font-size:11px">Pad</span> operación (suma horas)</span>
    <span class="row" style="gap:8px;align-items:center"><b style="color:var(--muted2);font-weight:600">Estado:</b> <span class="leg-sw rojo"></span>vencido <span class="leg-sw amarillo"></span>atención <span class="leg-sw verde"></span>en plan <span class="leg-sw hueco"></span>proyección</span>
    <span class="row" style="gap:7px;align-items:center"><span class="gantt-hchip" style="position:static;display:inline-block">M· B·</span> horas al fin del pad</span>
    <span style="color:var(--primary-glow);font-weight:700">| línea = HOY</span></div>`;
  // Referencia de letras griegas → plan (generada de PLANES; el color en el Gantt indica el estado, no el plan)
  html+=`<div class="row" style="margin-bottom:12px;font-size:12px;color:var(--muted);align-items:center;gap:4px;flex-wrap:wrap">
    <b style="color:var(--text);font-weight:700">Mantenimientos:</b> ${PLANES.map(p=>`<span style="white-space:nowrap"><b class="leg-gr">${glifoPlan(p.key)}</b> ${esc(p.nombre)}</span>`).join('<span style="opacity:.3;margin:0 3px">·</span>')}</div>`;

  // marcas de meses
  let monthMarks='';
  let mcur=new Date(start.getFullYear(),start.getMonth(),1);
  while(mcur<=end){
    const off=dx(toISO(mcur));
    if(off<=trackW) monthMarks+=`<div class="gantt-month" style="left:${Math.max(0,off)}px">${meses[mcur.getMonth()]} ${String(mcur.getFullYear()).slice(2)}</div>`;
    mcur=new Date(mcur.getFullYear(),mcur.getMonth()+1,1);
  }
  const todayOff=dx(todayISO()); GANTT._todayOff=todayOff;

  html+=`<div class="gantt-wrap"><div class="gantt-inner" style="min-width:${206+trackW}px">`;
  // encabezado
  html+=`<div class="gantt-row gantt-head"><div class="gantt-label">Equipo</div><div class="gantt-track" style="width:${trackW}px;height:36px">${monthMarks}<div class="gantt-today" style="left:${todayOff}px"></div><div class="gantt-hoy-tag" style="left:${todayOff}px">HOY</div></div></div>`;

  const ev=planEvents();
  equipos.forEach(eq=>{
    const tl=buildTimeline(eq);
    const sIso=toISO(start), eIso=toISO(end);
    const evEq=ev.filter(e=>e.equipo.id===eq.id);
    const vencN=evEq.filter(e=>e.vencido).length;
    const hoyM=tl?cumAt(tl,todayISO(),'motor'):0, hoyB=tl?cumAt(tl,todayISO(),'bomba'):0;
    const baseH=tl?`hoy M${num(hoyM)} · B${num(hoyB)}`:'sin lectura';
    let bars='';
    const readF = tl ? tl.base.fecha : null;   // fecha de la lectura: las horas solo se proyectan desde acá
    // BARRAS = pads REALES del equipo (fechas completas, no recortadas a la lectura) → corrige el bug del PAD 69
    padRunsEquipo(eq.id).forEach(r=>{
      if(r.end<sIso||r.start>eIso) return;
      const x0=Math.max(0,dx(r.start<sIso?sIso:r.start));
      const x1=Math.min(trackW,dx(r.end>eIso?eIso:r.end)+px);
      const w=Math.max(3,x1-x0);
      const names=r.pads;
      const tieneHoras = tl && readF && r.end>=readF;   // chip de horas solo donde hay proyección válida (pad en/ tras la lectura)
      const cm=tieneHoras?cumAt(tl,r.end,'motor'):null, cb=tieneHoras?cumAt(tl,r.end,'bomba'):null;
      const tip=`${esc(names.join(', '))} · ${fmtD(r.start)}→${fmtD(r.end)}`+(tieneHoras?` · al final M${num(cm)}h · B${num(cb)}h`:'');
      bars+=`<div class="gantt-bar" style="left:${x0}px;width:${w}px" title="${tip}">${esc(names.join(' + '))}</div>`;
      if(tieneHoras && r.end<=eIso){ const cx=Math.max(0,Math.min(x1+3,trackW-72)); bars+=`<div class="gantt-hchip" style="left:${cx}px" title="${tip}">M${num(cm)} · B${num(cb)}</div>`; }
    });
    // MARCAS = letra griega de cada plan, coloreada por estado; al costado y SIN superponerse
    let marks='';
    const glifos=evEq.filter(e=>{ if(e.proyeccion&&!VERPROY) return false; const f=(e.rec&&e.rec.fecha)||e.date; return !!f && dx(f)<=trackW; })
      .map(e=>{ const f=(e.rec&&e.rec.fecha)||e.date; return {e,off:Math.max(0,dx(f))}; })
      .sort((a,b)=>a.off-b.off);
    let lastX=-999;
    glifos.forEach(m=>{
      const x=Math.max(m.off, lastX+15);   // mínimo 15px entre letras → no se superponen
      lastX=x;
      const e=m.e, proyCls=e.proyeccion?' proy':'';
      const tid='g'+(++gtseq); GTIPS[tid]=gttMarkHTML(e);

function ganttHoy(){ const w=document.querySelector('#main .gantt-wrap'); if(w&&GANTT._todayOff!=null) w.scrollLeft=GANTT._todayOff; }

/* ============================================================
   AGRUPACIÓN INTELIGENTE
   ============================================================ */
// ---- Ventanas SIN operación (huecos entre pads) de un equipo, desde hoy hasta el horizonte ----
function idleWindows(eqId){
  const today=todayISO();
  const horizonEnd=toISO(addDays(parseD(today),DB.params.horizonteDias||1095));
  // intervalos operativos (asignaciones) recortados a [hoy, horizonte], ordenados
  let ops=asignacionesForEquipo(eqId).map(a=>({desde:a.desde,hasta:a.hasta}))
    .filter(o=>o.hasta>=today)
    .map(o=>({desde:o.desde<today?today:o.desde,hasta:o.hasta>horizonEnd?horizonEnd:o.hasta}))
    .sort((a,b)=>a.desde<b.desde?-1:1);
  // fusionar solapados/contiguos
  const merged=[];
  ops.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.desde<=toISO(addDays(parseD(last.hasta),1))){ if(o.hasta>last.hasta) last.hasta=o.hasta; } else merged.push({...o}); });
  if(!merged.length) return [{desde:today,hasta:horizonEnd,abierta:true}];   // sin pads → todo libre
  // huecos entre operaciones
  const gaps=[]; let cursor=today;
  merged.forEach(o=>{ if(o.desde>cursor){ gaps.push({desde:cursor,hasta:toISO(addDays(parseD(o.desde),-1))}); } if(o.hasta>=cursor) cursor=toISO(addDays(parseD(o.hasta),1)); });
  if(cursor<horizonEnd) gaps.push({desde:cursor,hasta:horizonEnd,abierta:true});  // cola libre tras el último pad
  return gaps.filter(g=>g.hasta>=g.desde);
}
// Ventana libre recomendada para ejecutar un mantenimiento cuya fecha proyectada es D
function recommendWindow(eqId,D){
  const gaps=idleWindows(eqId); if(!gaps.length) return null;
  let g=gaps.find(g=> D>=g.desde && D<=g.hasta);                 // ¿el mant cae dentro de una ventana libre?
  if(g) return {win:g,rel:'durante',dist:0};
  let best=null,bestDist=Infinity,rel='';
  gaps.forEach(g=>{
    if(g.hasta<D){ const d=daysBetween(g.hasta,D); if(d<bestDist){bestDist=d;best=g;rel='antes';} }      // hueco previo → preventivo
    else if(g.desde>D){ const d=daysBetween(D,g.desde); if(d<bestDist){bestDist=d;best=g;rel='despues';} } // hueco posterior → leve excedente
  });
  return best?{win:best,rel,dist:bestDist}:null;
}
function computeGroups(){
  const win=DB.params.ventanaAgrupacionDias||10;
  const maints=allProjectedMaints();
  // agrupar por componente (mismo recurso/cuadrilla) en ventana temporal
  const byComp={};
  maints.forEach(m=>{ (byComp[m.plan.componente]=byComp[m.plan.componente]||[]).push(m); });
  const groups=[];
  Object.entries(byComp).forEach(([comp,arr])=>{
    arr.sort((a,b)=>a.date<b.date?-1:1);
    let i=0;
    while(i<arr.length){
      const cluster=[arr[i]]; let j=i+1;
      while(j<arr.length && daysBetween(arr[i].date,arr[j].date)<=win){ cluster.push(arr[j]); j++; }
      if(cluster.length>=2){
        groups.push({componente:comp,items:cluster,from:cluster[0].date,to:cluster[cluster.length-1].date,
          evitadas:cluster.length-1});
      }
      i=j>i+1?j:i+1;
    }
  });
  return groups.sort((a,b)=>b.evitadas-a.evitadas);
}
// Tramos contiguos de operación (runs) a partir del timeline
function operatingRuns(tl){
  const runs=[]; let cur=null;
  tl.days.forEach(d=>{ if(d.pad){ if(!cur) cur={start:d.date,end:d.date,pad:d.pad}; else cur.end=d.date; } else if(cur){ runs.push(cur); cur=null; } });
  if(cur) runs.push(cur);
  return runs;
}
// Horas acumuladas de una fuente a una fecha dada
function cumAt(tl,iso,fuente){
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  let last=tl.days[0][key];
  for(const d of tl.days){ if(d.date>iso) break; last=d[key]; }
  return last;
}
// Fecha de ACCIÓN recomendada (distinta del cruce). Usa TOLERANCIA: el primer pad en cuyo final
// el equipo queda a <= tolerancia del umbral (lo cruce o no) es donde hay que actuar.
function ventanaTxt(desde,hasta){
  if(desde&&hasta) return desde===hasta?`el ${fmtDM(desde)}`:`entre ${fmtDM(desde)} y ${fmtDM(hasta)}`;
  if(desde) return `desde el ${fmtDM(desde)}`;
  return '';
}
function planRecomendacion(tl,m){
  const hoy=todayISO();
  const runs=operatingRuns(tl);
  if(!runs.length) return m.vencido?{tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible'}:{tipo:'futuro',fecha:null,cls:'neutral',txt:'Sin pads cargados para este equipo'};
  const asap0=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };
  if(m.vencido){
    // si el equipo está operando hoy, no se puede frenar: se hace al terminar el pad en curso (se agrupa con los demás)
    const rHoy=runs.find(r=> hoy>=r.start && hoy<=r.end);
    if(rHoy){
      const nx=runs[runs.indexOf(rHoy)+1];
      const w={desde:toISO(addDays(parseD(rHoy.end),1)), hasta: nx?toISO(addDays(parseD(nx.start),-1)):null};
      const f=asap0(w);
      return {tipo:'postpad',...w,fecha:f,pad:rHoy.pad,cls:'rojo',txt:`Vencido · hacer al terminar ${rHoy.pad} (~${fmtDM(f)})`};
    }
    return {tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible (equipo parado)'};
  }
  const nd=m.horas, fuente=m.plan.fuente;
  // PAD donde REALMENTE se cruza el umbral (no donde está "cerca"): primer run cuyo fin alcanza nd
  let idx=-1;
  for(let k=0;k<runs.length;k++){ if(cumAt(tl,runs[k].end,fuente) >= nd){ idx=k; break; } }
  if(idx<0){                                                                 // ningún pad cargado llega a cruzarlo
    const last=runs[runs.length-1], lleg=cumAt(tl,last.end,fuente), faltan=Math.round(nd-lleg);
    return {tipo:'lejano',fecha:null,cls:'neutral',faltan,txt:`Con los pads cargados llega a ${num(lleg)}h (faltan ~${num(faltan)}h al ${fmtDM(last.end)}). Cargá el próximo pad para precisar.`};
  }
  const R=runs[idx], prev=runs[idx-1], next=runs[idx+1];
  const ongoing=R.start<=hoy;
  const gapBefore={desde: prev?toISO(addDays(parseD(prev.end),1)):hoy, hasta: toISO(addDays(parseD(R.start),-1))};
  const gapAfter ={desde: toISO(addDays(parseD(R.end),1)), hasta: next?toISO(addDays(parseD(next.start),-1)):null};
  const asap=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };  // lo antes posible = 2 días tras el pad previo
  if(ongoing){   // cruza operando dentro del pad en curso → no se puede frenar, se hace al terminarlo
    const w=gapAfter; return {tipo:'postpad',...w,fecha:asap(w),pad:R.pad,cls:'rojo',txt:`Cruza operando en ${R.pad} (en curso) · hacer al terminar (~${fmtDM(asap(w))})`};
  }
  // cruza en un pad FUTURO. No se puede frenar a mitad de pad, así que hay DOS paradas posibles:
  //   prepad  = parada ANTES del pad  → se haría ADELANTADO (se desperdicia vida útil)
  //   postpad = parada DESPUÉS del pad → se haría VENCIDO (operó de más dentro del pad)
  // Solo conviene ADELANTAR si el adelanto entra en la TOLERANCIA (Parámetros, def. 150h). Si falta más que
  // eso (típico de un mantenimiento RECIÉN hecho, o un primer service todavía lejano), NO se adelanta: como el
  // pad no se puede frenar, se ESPERA a que se venza y se hace al terminar el pad — nunca rehacerlo prematuro.
  const tol=Number(DB.params.toleranciaHoras)||0;
  const hBefore=cumAt(tl,asap(gapBefore),fuente);
  const hAfter =cumAt(tl,R.end,fuente);
  const adelanto=Math.round(nd-hBefore), atraso=Math.round(hAfter-nd);
  if(adelanto<=tol){
    const w=gapBefore;
    return {tipo:'prepad',...w,fecha:asap(w),pad:R.pad,cls:'amarillo',txt:`Cruza en ${R.pad} · adelantar a la parada previa (~${fmtDM(asap(w))}, ~${num(adelanto)}h antes)`};
  }
  const w=gapAfter;
  return {tipo:'postpad',...w,fecha:asap(w),pad:R.pad,cls:'rojo',txt:`Faltan ~${num(adelanto)}h (más que la tolerancia) · esperar y hacer al terminar ${R.pad} (~${fmtDM(asap(w))}, se vence ~${num(atraso)}h)`};
}
// Ventanas SIN operación (entre pads) a nivel flota — TODAS, aunque estén vacías
function fleetGaps(){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=DB.pads.map(p=>({d:p.fechaInicio,h:p.fechaFin})).filter(x=>x.d&&x.h&&x.h>=hoy).sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});  // hueco antes del 1er pad
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,14);
}
// ¿El equipo está OPERANDO (dentro de un pad propio) esa fecha?
function equipoOperando(eqId,iso){
  return DB.pads.some(p=>(p.asignaciones||[]).some(a=>a.equipoId===eqId && a.desde && a.hasta && iso>=a.desde && iso<=a.hasta));
}
// Ventanas en las que ESTE equipo NO opera (paradas propias) = complemento de sus pads. Puede haber paradas
// para un equipo mientras otros operan. Son las únicas ventanas válidas para mover/fijar su mantenimiento.
function equipoGaps(eqId){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=[];
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId && a.desde && a.hasta && a.hasta>=hoy) ivs.push({d:a.desde,h:a.hasta}); }));
  ivs.sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,30);
}
// "Lo antes posible" dentro de una ventana = 2 días después de que arranca (o desde hoy)
function asapEnVentana(g){ let f=toISO(addDays(parseD(g.desde),1)); if(f<todayISO())f=todayISO(); if(g.hasta&&f>g.hasta)f=g.hasta; return f; }
// Paradas para MOSTRAR = ventanas de flota (todas, incl. vacías) + ventanas individuales donde caiga un mant. (equipo libre mientras otros operan)
function computeParadas(){
  const items=planEvents().filter(e=>e.accionFecha && (VERPROY||!e.proyeccion));
  const wins=fleetGaps().map(g=>({desde:g.desde,hasta:g.hasta,abierta:g.abierta,individual:false,items:[]}));
  items.forEach(it=>{
    let w=wins.find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta && !g.individual);
    if(!w){   // cae fuera de las ventanas de flota → ventana individual del equipo (libre mientras otros operan)
      const eg=equipoGaps(it.equipo.id).find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta);
      const desde=eg?eg.desde:it.accionFecha, hasta=eg?eg.hasta:it.accionFecha, ab=eg?eg.abierta:false;
      w=wins.find(g=>g.individual && g.desde===desde && g.hasta===hasta);
      if(!w){ w={desde,hasta,abierta:ab,individual:true,items:[]}; wins.push(w); }
    }
    w.items.push(it);
  });
  wins.sort((a,b)=> a.desde<b.desde?-1:(a.desde>b.desde?1:0));
  return wins;
}
// Mover un mantenimiento a la parada PROPIA del equipo anterior (-1) o siguiente (+1). Salta solo las ventanas
// donde el equipo opera (no son válidas), así no hay que pasar por ellas.
function moverParada(eqId,planKey,horas,dir){ if(isRO())return roBlock();
  const wins=equipoGaps(eqId);
  if(!wins.length){ toast('Este equipo no tiene paradas (cargá pads).','warn'); return; }
  const item=planEvents().find(e=>e.equipo.id===eqId&&e.plan.key===planKey&&e.horas===horas);
  const cur=item&&item.accionFecha;
  let gi=wins.findIndex(g=> cur&&cur>=g.desde&&cur<=g.hasta);
  if(gi<0){ // la fecha actual no cae en una parada propia (p.ej. está operando): arranco del borde según la dirección
    if(cur){ gi = dir>0 ? wins.reduce((acc,g,i)=> g.desde<=cur?i:acc, -1) : wins.findIndex(g=>g.desde>=cur); if(dir<0&&gi<0) gi=wins.length; }
    else gi = dir>0?-1:wins.length;
  }
  const t=wins[gi+dir];
  if(!t){ toast('No hay parada '+(dir<0?'anterior':'siguiente')+' para este equipo','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
// Saltar directo a una parada concreta del equipo (por índice de equipoGaps) — permite saltar varias ventanas de una
function moverParadaA(eqId,planKey,horas,idx){ if(isRO())return roBlock();
  const wins=equipoGaps(eqId); const t=wins[idx];
  if(!t){ toast('Parada no válida','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
function fijarEnVentana(eqId,planKey,horas,g){
  const f=asapEnVentana(g);
  DB.planificado[planKeyOf(eqId,planKey,horas)]=f;
  audit('Mover a parada',`${eqName(eqId)} ${PLAN(planKey)?.nombre} → ${f}`);
  saveDB(); route(CURRENT);
}
// Selector "Mover a…": lista las paradas PROPIAS del equipo (donde NO opera) para saltar directo a cualquiera
function selectorMover(m){
  const wins=equipoGaps(m.equipo.id);
  const cur=m.accionFecha;
  const opts=wins.map((g,i)=>{ const sel=cur&&cur>=g.desde&&cur<=g.hasta?'selected':''; const lbl=`${fmtDShort(g.desde)} ${g.abierta?'→ adelante':'→ '+fmtDShort(g.hasta)}`; return `<option value="${i}" ${sel}>${lbl}</option>`; }).join('');
  return `<select class="mini-select" title="Saltar a otra parada del equipo (solo donde está parado)" onchange="moverParadaA('${m.equipo.id}','${m.plan.key}',${m.horas},Number(this.value))"><option value="" disabled ${cur?'':'selected'}>Mover a…</option>${opts}</select>`;
}

function renderAnalitica(){
  const maints=allProjectedMaints();
  const venc=maints.filter(m=>m.vencido).length;
  const prox=maints.filter(m=>!m.vencido&&m.diasRestantes<=60).length;
  const g=WEB_LITE?{}:leadStatsGlobal(); const cob=WEB_LITE?{}:coberturaStock();
  // carga de trabajo por mes
  const carga={};
  maints.forEach(m=>{ const k=m.date.slice(0,7); carga[k]=(carga[k]||0)+1; });
  const months=Object.keys(carga).sort().slice(0,12);
  const maxc=Math.max(1,...months.map(k=>carga[k]));
  // consumo proyectado por componente (h-intervención)
  let html=`<div class="section-head"><h1>Analítica de gestión</h1><div class="sp"></div><button class="btn ghost" onclick="window.print()">Exportar PDF</button></div>`;
  html+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:18px">
    <div class="kpi red"><div class="accent"></div><div class="lbl">Mant. vencidos</div><div class="val">${venc}</div></div>
    <div class="kpi amber"><div class="accent"></div><div class="lbl">Próximos 60 d</div><div class="val">${prox}</div></div>
    ${WEB_LITE?'':`<div class="kpi"><div class="accent"></div><div class="lbl">Lead time prom.</div><div class="val mono">${g.avg}<small>d</small></div></div>
    <div class="kpi ${g.cumpl>=85?'green':'amber'}"><div class="accent"></div><div class="lbl">Cumpl. órdenes</div><div class="val mono">${g.cumpl??'—'}<small>%</small></div></div>
    <div class="kpi ${cob.cls}"><div class="accent"></div><div class="lbl">Cobertura stock</div><div class="val mono">${cob.pct}<small>%</small></div></div>`}</div>`;
  // gráfico carga futura
  html+=`<div class="card" style="margin-bottom:16px"><h3>Carga de trabajo futura <span class="sub">mantenimientos por mes</span></h3>`;
  if(!months.length) html+=`<div class="muted small">Sin datos.</div>`;
  else{ html+=`<div class="minigraph" style="height:160px;align-items:flex-end;gap:10px">`;
    months.forEach(k=>{ const h=carga[k]/maxc*140+8; const [yy,mm]=k.split('-'); html+=`<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:1"><b class="mono small">${carga[k]}</b><i style="width:100%;height:${h}px;background:linear-gradient(180deg,var(--primary-glow),var(--primary-deep))"></i><span class="muted" style="font-size:10px">${mm}/${yy.slice(2)}</span></div>`; });
    html+=`</div>`; }
  html+=`</div>`;
  // tabla consumo proyectado por componente
  const comp={};
  maints.filter(m=>m.diasRestantes<=365).forEach(m=>{ comp[m.plan.componente]=(comp[m.plan.componente]||0)+1; });
  html+=`<div class="row"><div class="card" style="flex:1;min-width:300px"><h3>Intervenciones por componente <span class="sub">12 meses</span></h3>
    <div class="table-wrap" style="border:none"><table><thead><tr><th>Componente</th><th class="right">Intervenciones</th></tr></thead><tbody>`;
  Object.entries(comp).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>html+=`<tr><td>${c}</td><td class="right mono">${n}</td></tr>`);
  if(!Object.keys(comp).length)html+=`<tr><td colspan="2" class="muted">Sin datos.</td></tr>`;
  html+=`</tbody></table></div></div>`;
  // consumo proyectado top productos (oculto en versión web acotada)
  if(!WEB_LITE){
    const dem=demandaAnualProductos();
    const top=Object.entries(dem).sort((a,b)=>b[1]-a[1]).slice(0,10);
    html+=`<div class="card" style="flex:1;min-width:300px"><h3>Consumo proyectado de materiales <span class="sub">top 10 · 12 meses</span></h3>
      <div class="table-wrap" style="border:none"><table><thead><tr><th>Producto</th><th class="right">Demanda</th></tr></thead><tbody>`;
    top.forEach(([pid,q])=>{ const p=prodById(pid); html+=`<tr><td><span class="mono small" style="color:#9fb0d8">${esc(p?.refInterna||'?')}</span> ${esc(p?.descripcion||'')}</td><td class="right mono">${num(q)}</td></tr>`; });
    if(!top.length)html+=`<tr><td colspan="2" class="muted">Sin demanda proyectada.</td></tr>`;
    html+=`</tbody></table></div></div>`;
  }
  html+=`</div>`;
  M.innerHTML=html;
}

/* ---------- PUBLICAR LA DEMO WEB (desde el botón, sin terminal) ----------
   Arma el index.html del sitio (mismo resultado que build-web.js, pero en el navegador) a partir de
   PRISTINE_HTML + los datos ACTUALES, y lo sube al repo de GitHub Pages con la API de GitHub. */
function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str); let bin=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function buildLiteHTML(){
  const clean=JSON.parse(JSON.stringify(DB));
  clean.audit=[];                                            // no exponer el log interno
  if(clean.params){ clean.params.user='demo'; clean.params.pass='demo';
    delete clean.params.ghToken; delete clean.params.ghOwner; delete clean.params.ghRepo; }  // NUNCA publicar el token
  const ver=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  const json=JSON.stringify(clean).replace(/<\//g,'<\\/');
  const inject=`<script>window.QM_FORCE_LITE=true;window.QM_LITE_SEED=${json};window.QM_LITE_SEED_VER=${JSON.stringify(ver)};<\/script>`;
  let html=PRISTINE_HTML;
  html=html.replace(/<body[^>]*>/i, m=> m+'\n'+inject);                          // el seed debe correr ANTES del script principal
  html=html.replace('</head>', '<meta name="robots" content="noindex,nofollow">\n</head>');
  return {html, ver};
}
async function publicarWeb(){
  if(isRO()) return roBlock();
  if(WEB_LITE){ toast('Publicá desde la app LOCAL (no desde la web).','err'); return; }
  // guardar config tomada de los inputs (si está la pantalla abierta)
  const tok=(val('p-ghtoken')||DB.params.ghToken||'').trim();
  const owner=(val('p-ghowner')||DB.params.ghOwner||'EliasSuarez16').trim();
  const repo=(val('p-ghrepo')||DB.params.ghRepo||'qm-planificador-demo').trim();
  DB.params.ghToken=tok; DB.params.ghOwner=owner; DB.params.ghRepo=repo; saveDB();
  if(!tok){ toast('Pegá tu token de GitHub abajo y guardá antes de publicar.','err'); return; }
  const {html,ver}=buildLiteHTML();
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
  const headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const btn=document.getElementById('btn-publicar'); if(btn){ btn.disabled=true; btn.textContent='Publicando…'; }
  toast('Publicando demo web…');
  try{
    let sha;
    const g=await fetch(api,{headers});                       // sha actual (necesario para sobrescribir)
    if(g.ok){ sha=(await g.json()).sha; }
    else if(g.status===401){ throw new Error('token inválido o sin permiso (401)'); }
    else if(g.status!==404){ throw new Error('no se pudo leer el repo ('+g.status+')'); }
    const body={message:'Actualizar demo '+ver, content:utf8ToBase64(html)}; if(sha) body.sha=sha;
    const p=await fetch(api,{method:'PUT',headers,body:JSON.stringify(body)});
    if(!p.ok){ const t=await p.text(); throw new Error('GitHub '+p.status+' · '+t.slice(0,140)); }
    audit('Publicar web', `${owner}/${repo} v${ver}`); saveDB();
    toast('✓ Publicado. La web se actualiza en ~1 minuto: '+`https://${owner}.github.io/${repo}/`);
  }catch(e){
    toast('No se pudo publicar online ('+e.message+'). Descargo el index.html como respaldo.','err');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='index.html'; a.click();
  }finally{ if(btn){ btn.disabled=false; btn.textContent='Publicar demo web ahora'; } }
}
function saveGhConfig(){
  if(isRO())return roBlock();
  const t=(val('p-ghtoken')||'').trim();
  if(t) DB.params.ghToken=t;                                 // vacío = conservar el token ya guardado
  DB.params.ghOwner=(val('p-ghowner')||'EliasSuarez16').trim();
  DB.params.ghRepo=(val('p-ghrepo')||'qm-planificador-demo').trim();
  audit('Config publicación web', DB.params.ghOwner+'/'+DB.params.ghRepo);
  saveDB(); toast('Configuración guardada'); renderParametros();
}

  html+=`<div class="help"><span class="ic"></span><div>Sus datos se guardan localmente en este equipo/navegador. Realice respaldos periódicos al archivo <b>.qmdb</b> y guárdelos en OneDrive.</div></div>`;
  html+=`<div class="row"><div class="card" style="flex:1;min-width:280px"><h3>Exportar copia</h3>
    <p class="muted small" style="margin-bottom:14px">Descarga un archivo con equipos, lecturas, pads, mantenimientos, materiales, órdenes y configuración.</p>
    <button class="btn green" onclick="backupExport()">Descargar respaldo (.qmdb)</button></div>
    <div class="card" style="flex:1;min-width:280px"><h3>Restaurar copia</h3>
    <p class="muted small" style="margin-bottom:14px">Reemplaza TODOS los datos actuales por los del archivo seleccionado.</p>
    <input type="file" id="impfile" accept=".qmdb,.json" style="display:none" onchange="backupImport(this)">
    <button class="btn ghost" onclick="document.getElementById('impfile').click()">Seleccionar archivo…</button></div></div>`;
  html+=`<div class="card" style="margin-top:14px"><h3>Reiniciar</h3>
    <p class="muted small" style="margin-bottom:14px">Borra todos los datos y restaura los de ejemplo.</p>
    <button class="btn danger" onclick="resetDB()">Restaurar datos de fábrica</button></div>`;
  const counts=`Equipos: ${DB.equipos.length} · Lecturas: ${DB.lecturas.length} · Pads: ${DB.pads.length} · Mant.: ${DB.mantenimientos.length} · Productos: ${DB.productos.length} · Órdenes: ${DB.ordenes.length}`;
  html+=`<div class="muted small" style="margin-top:18px">${counts}</div>`;
  M.innerHTML=html;
}
function backupExport(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`QM-Planificador_${todayISO()}.qmdb`; a.click(); toast('Respaldo descargado');
}
function backupImport(input){ if(isRO())return roBlock();
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.equipos)throw 0; DB=d; migrate(); saveDB(); toast('Datos restaurados'); route('dashboard'); }catch(e){ toast('Archivo inválido','err'); } };
  r.readAsText(f);
}
function resetDB(){ if(isRO())return roBlock(); if(!confirm('¿Borrar todo y restaurar datos de ejemplo?'))return; DB=seed(); saveDB(); toast('Datos restaurados','warn'); route('dashboard'); }

/* ============================================================
   EXPORTACIÓN CSV (Excel)
   ============================================================ */
function dl(name,rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); toast('Excel (CSV) exportado');
}
function exportCSV(what){
  if(what==='lecturas') dl('lecturas.csv',[['Fecha','Equipo','Horas Motor','Horas Bomba','Observaciones'],...DB.lecturas.map(l=>[l.fecha,eqName(l.equipoId),l.horasMotor,l.horasBomba,l.obs])]);
  if(what==='pads') dl('pads.csv',[['Pad','Cliente','Inicio','Fin','Equipo','Trabajó desde','Trabajó hasta'],...DB.pads.flatMap(p=>(p.asignaciones||[]).length?(p.asignaciones).map(a=>[p.nombre,p.cliente,p.fechaInicio,p.fechaFin,eqName(a.equipoId),a.desde,a.hasta]):[[p.nombre,p.cliente,p.fechaInicio,p.fechaFin,'—','','']])]);
  if(what==='mantenimientos') dl('mantenimientos.csv',[['Fecha','Equipo','Plan','Horas Motor','Horas Bomba','Responsable','Obs'],...DB.mantenimientos.map(m=>[m.fecha,eqName(m.equipoId),PLAN(m.plan)?.nombre,m.horasMotor,m.horasBomba,m.responsable,m.obs])]);
  if(what==='ordenes') dl('ordenes.csv',[['Lanzamiento','Plan','Para (h)','Equipo','Cantidad','Comprometida','Recepcion'],...DB.ordenes.map(o=>[o.fechaLanzamiento,PLAN(o.plan)?.nombre,o.horas||'',o.equipoId?eqName(o.equipoId):'',o.cantidad,o.fechaComprometida,o.fechaRecepcion])]);
  if(what==='eventos'){ const evs=filteredEvents(); dl('mantenimientos_proyectados.csv',[['Equipo','Plan','Componente','Fuente','Hoy h','Teorico h','Objetivo ciclo h','Restan h','Se hara a h','Vencido por ciclo h','Cruce','Accion recomendada','Fecha accion','Dias','Estado','Vencido'],...evs.map(e=>[e.equipo.nombre,e.plan.nombre,e.plan.componente,e.plan.fuente,e.hoy,e.teorico,e.horas,e.vencido?'':e.horasRestantes,e.horasReal!=null?e.horasReal:'',e.excedente>0?e.excedente:'',e.vencido?'VENCIDO':(e.date||''),e.rec?e.rec.txt:'',e.rec?(e.rec.fecha||''):'',e.diasRestantes,estadoLabel(e.estado),e.vencido?'SI':'NO'])]); }
  if(what==='stock'){ const a=stockAnalysis(); dl('stock.csv',[['Referencia interna','Descripcion','Part Number','Stock','Demanda/año','LeadTime','StockSeg','ROP','EOQ','AFabricar'],...a.map(x=>[x.p.refInterna,x.p.descripcion,x.p.partNumber||'',x.stockActual,x.D,x.LT,x.SS,x.ROP,x.EOQ,x.aPedir])]); }
}
