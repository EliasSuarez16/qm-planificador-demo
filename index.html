<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QM Planificador</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231F2BD4'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='30' font-weight='bold' fill='white' text-anchor='middle'%3EQM%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#080B12; --surface:#111726; --surface2:#18203314; --panel:#141B2B; --panel2:#1B2336;
  --border:#252E42; --border2:#313c54;
  --text:#E6EAF2; --muted:#8C96AC; --muted2:#5e6982;
  --primary:#2E3BE0; --primary-deep:#1F2BD4; --primary-soft:#2730a0; --primary-glow:#4450f0;
  --green:#1FB87A; --green-bg:#0f3a2c; --amber:#F0A91E; --amber-bg:#3d2f0c; --red:#E5484D; --red-bg:#3d1518;
  --radius:10px; --radius-sm:7px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --font:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3450;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#384670}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#16204a 0%,#080B12 60%)}
#login .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:42px 40px;width:380px;box-shadow:var(--shadow)}
.logo-box{width:64px;height:64px;border-radius:12px;background:var(--primary-deep);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:26px;color:#fff;letter-spacing:1px;box-shadow:0 0 24px rgba(46,59,224,.5)}
#login h1{font-size:22px;margin:18px 0 2px;font-weight:700}
#login p{color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;background:#0d1422;border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:var(--radius-sm);outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-glow)}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius-sm);font-weight:600;
  transition:background .15s,transform .05s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--primary-glow)}
.btn:active{transform:translateY(1px)}
.btn.full{width:100%;justify-content:center;padding:12px}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn.ghost:hover{background:var(--panel2);border-color:var(--primary-glow)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#f25a5f}
.btn.green{background:var(--green)}.btn.green:hover{background:#28d690}

/* ---------- SHELL ---------- */
#app{display:none;height:100vh;grid-template-columns:248px 1fr;grid-template-rows:56px 1fr}
#sidebar{grid-row:1/3;background:linear-gradient(180deg,#0d1322,#0a0f1b);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--border)}
.brand .logo-box{width:38px;height:38px;font-size:16px;border-radius:9px;box-shadow:0 0 14px rgba(46,59,224,.4)}
.brand .t{font-weight:700;font-size:15px;line-height:1.1}
.brand .t small{display:block;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.5px}
.nav{padding:10px 10px;flex:1}
.nav-group{color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);color:var(--muted);
  text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:.12s;border:1px solid transparent}
.nav a:hover{background:#141d31;color:var(--text)}
.nav a.active{background:linear-gradient(90deg,rgba(46,59,224,.22),rgba(46,59,224,.05));color:#fff;border-color:#2c3a86}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
.nav a.sub{margin-left:16px;padding-left:14px;font-size:12.5px;position:relative;border-left:1px solid var(--border);border-top-left-radius:0;border-bottom-left-radius:0}
.nav a.sub::before{content:"";position:absolute;left:0;top:50%;width:9px;height:1px;background:var(--border)}
.nav a.sub .sub-t{color:var(--muted2);font-size:9px;text-transform:uppercase;letter-spacing:.5px;margin-left:auto;font-weight:700}
.sb-foot{padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted2)}

#topbar{grid-column:2;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border)}
#topbar h2{font-size:16px;font-weight:600}
#topbar .crumb{color:var(--muted);font-size:12px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.userchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);padding:5px 11px;border-radius:20px;font-size:12.5px}
.userchip .av{width:24px;height:24px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

#main{grid-column:2;overflow-y:auto;padding:26px 30px 64px}

/* ---------- COMPONENTS ---------- */
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.planes-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:860px){.planes-grid{grid-template-columns:1fr}}
.matsearch{background:#0d1422;border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:var(--radius-sm);outline:none;transition:border .15s;font-size:13px}
.matsearch:focus{border-color:var(--primary-glow)}
.matsearch::placeholder{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .sub{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:auto}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.section-head h1{font-size:25px;font-weight:800;letter-spacing:-.3px}
.section-head .desc{color:var(--muted);font-size:13.5px}
.section-head .sp{flex:1}

.kpi{background:linear-gradient(180deg,var(--panel),#11182a);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .val{font-size:38px;font-weight:800;margin-top:8px;line-height:1;letter-spacing:-1px}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:7px}
.kpi .accent{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--primary)}
.kpi.green .accent{background:var(--green)} .kpi.amber .accent{background:var(--amber)} .kpi.red .accent{background:var(--red)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
  padding:11px 13px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td{padding:11px 13px;border-bottom:1px solid #1b2336;vertical-align:middle}
tr:hover td{background:#141d31}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.verde{background:var(--green-bg);color:#3fe0a0}.pill.amarillo{background:var(--amber-bg);color:#ffc24d}
.pill.rojo{background:var(--red-bg);color:#ff7378}.pill.neutral{background:#1c2740;color:#8da}
.pill.gris{background:#1c2740;color:var(--muted)}
.tag{display:inline-block;white-space:nowrap;vertical-align:middle;line-height:1.5;background:#16203a;border:1px solid #25325a;color:#9fb0d8;font-size:12px;padding:2px 9px;border-radius:6px;font-weight:600}
.prodres{position:absolute;left:0;right:0;top:100%;margin-top:2px;z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:8px;max-height:230px;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.prodrow{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--surface2);white-space:normal}
.prodrow:last-child{border-bottom:none}
.prodrow:hover{background:var(--panel2)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.right{text-align:right}.center{text-align:center}
.muted{color:var(--muted)} .small{font-size:12px}
.linklike{color:var(--primary-glow);cursor:pointer;font-weight:500}
.linklike:hover{text-decoration:underline}
.actions{display:flex;gap:6px}
.iconbtn{background:#16203a;border:1px solid var(--border);color:var(--muted);min-width:28px;height:26px;border-radius:6px;padding:0 9px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;transition:.12s;white-space:nowrap}
.iconbtn:hover{color:#fff;border-color:var(--primary-glow);background:#1c2a4a}
.mini-select{background:#16203a;border:1px solid var(--border);color:var(--muted);height:22px;border-radius:6px;font-size:10.5px;padding:0 4px;max-width:120px;vertical-align:middle}
/* Selector oscuro para encabezados (ej. elegir equipo en la Historia) — evita el fondo blanco nativo */
.selh{background:#0d1422;color:var(--text);border:1px solid var(--border);border-radius:9px;height:36px;padding:0 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.selh:hover{border-color:var(--border2)} .selh:focus{border-color:var(--primary-glow);outline:none} .selh option{background:#0d1422;color:var(--text)}
.mini-select:hover{border-color:var(--primary-glow);color:#fff}
/* Modo solo lectura (usuario web): oculta toda acción de edición */
#app.ro .rw,#app.ro .actions,#app.ro th.actions,#app.ro .mover,#app.ro th.mover{display:none!important}
.empty{text-align:center;color:var(--muted);padding:38px 20px}
.empty .ic{font-size:34px;opacity:.4;display:block;margin-bottom:10px}

/* progress bar */
.bar{height:7px;background:#0d1422;border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.bar > span{display:block;height:100%;background:var(--primary);border-radius:5px}
.bar.green>span{background:var(--green)}.bar.amber>span{background:var(--amber)}.bar.red>span{background:var(--red)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;font-size:13px;font-weight:500;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:#fff;border-bottom-color:var(--primary-glow)}

/* modal */
#modalbg{position:fixed;inset:0;background:rgba(4,7,14,.72);z-index:900;display:none;align-items:flex-start;justify-content:center;padding:50px 16px;overflow-y:auto}
#modal{background:var(--panel);border:1px solid var(--border2);border-radius:14px;width:560px;max-width:100%;box-shadow:var(--shadow)}
#modal.wide{width:880px}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-head .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
.modal-head .x:hover{color:#fff}
.modal-body{padding:20px;max-height:62vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/3}
.field textarea{resize:vertical;min-height:64px}
.checkrow{display:flex;align-items:center;gap:8px}
.checkrow input{width:auto}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;z-index:1100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--border2);border-left:4px solid var(--primary);padding:12px 16px;border-radius:8px;
  box-shadow:var(--shadow);font-size:13px;min-width:240px;animation:slidein .25s}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1}}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:center;padding:4px;font-weight:700;letter-spacing:.5px}
.cal-cell{background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:96px;padding:6px;font-size:11px;position:relative}
.cal-cell.other{opacity:.4}
.cal-cell.today{border-color:var(--primary-glow);box-shadow:0 0 0 1px var(--primary-glow) inset}
.cal-cell .dn{font-weight:700;font-size:12px;margin-bottom:4px}
.cal-ev{border-radius:5px;padding:2px 6px;margin-bottom:3px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.cal-ev.pad{background:#13294d;color:#7fb0ff;border-left:3px solid #3d7bff}
.cal-ev.mant{background:#3a1f0c;color:#ffc24d;border-left:3px solid var(--amber)}
.cal-ev.mant.rojo{background:#3d1518;color:#ff7378;border-left-color:var(--red)}
.cal-ev.op{background:#0f3a2c;color:#3fe0a0;border-left:3px solid var(--green)}

/* gantt */
.gantt-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);max-height:70vh}
.gantt-inner{position:relative}
.gantt-row{display:flex;align-items:stretch;border-bottom:1px solid #2b3852}
.gantt-row:last-child{border-bottom:none}
.gantt-row:hover .gantt-track{background:#0e1626}
.gantt-label{width:206px;min-width:206px;padding:11px 15px;position:sticky;left:0;background:var(--panel);z-index:6;border-right:1px solid var(--border2);font-size:13.5px;display:flex;flex-direction:column;justify-content:center}
.gantt-label .nm{font-weight:800;font-size:14.5px}
.gantt-label .hh{color:var(--muted);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.gantt-track{position:relative;height:132px;flex:1}
.gantt-head{height:36px;position:sticky;top:0;z-index:2;background:var(--panel)}
.gantt-head .gantt-track{height:36px}
.gantt-head .gantt-label{background:var(--panel);z-index:7;border-bottom:1px solid var(--border);justify-content:center}
.gantt-month{position:absolute;top:0;height:100%;border-left:1px solid #2a3550;font-size:12px;color:var(--muted);padding:10px 7px;white-space:nowrap;font-weight:600}
.gantt-grid{position:absolute;top:0;bottom:0;border-left:1px solid #161e2e}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--primary-glow);z-index:1;box-shadow:0 0 8px rgba(68,80,240,.6)}
.gantt-hoy-tag{position:absolute;top:2px;transform:translateX(-50%);background:var(--primary-glow);color:#fff;font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 6px;z-index:4;white-space:nowrap}
.gantt-bar{position:absolute;top:6px;height:30px;border-radius:7px;background:linear-gradient(180deg,#2f5aa0,#22427a);border:1px solid #3d6ed0;color:#dbe7ff;font-size:12px;font-weight:600;line-height:30px;padding:0 10px;overflow:hidden;white-space:nowrap;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.gantt-padbar{position:absolute;border-radius:6px;border:1px solid;color:#eaf0ff;font-size:11px;font-weight:600;padding:0 8px;overflow:hidden;white-space:nowrap;z-index:1;box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:default}
.gantt-padbar:hover{filter:brightness(1.12);outline:1px solid rgba(255,255,255,.35)}
.gantt-pausa{position:absolute;top:6px;height:30px;z-index:2;border-radius:2px;box-sizing:border-box;border-left:1px dashed rgba(255,255,255,.55);border-right:1px dashed rgba(255,255,255,.55);background:repeating-linear-gradient(45deg,rgba(8,12,22,.82) 0 4px,rgba(150,160,190,.28) 4px 8px)}
.gantt-hchip{position:absolute;top:40px;background:#0c2f38;border:1px solid #0b7285;color:#5fe0ef;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;z-index:3;white-space:nowrap;font-variant-numeric:tabular-nums}
.gantt-hchip.real{top:61px;background:#0e2b1c;border-color:#1c5a3a;color:#5fe88f}
.gantt-hchip.real b{color:#8affc0;font-weight:800;margin-right:3px}
.gantt-mark{position:absolute;top:106px;width:16px;height:16px;border-radius:3px;transform:rotate(45deg);z-index:2;cursor:default;border:1.5px solid rgba(0,0,0,.35);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.gantt-mark.verde{background:var(--green)}.gantt-mark.amarillo{background:var(--amber)}.gantt-mark.rojo{background:var(--red)}.gantt-mark.neutral{background:var(--muted2)}
.gantt-mark.proy{background:transparent;opacity:.9;width:13px;height:13px;top:107px;border-width:2px}
.gantt-mark.proy.verde{border-color:var(--green)}.gantt-mark.proy.amarillo{border-color:var(--amber)}.gantt-mark.proy.rojo{border-color:var(--red)}.gantt-mark.proy.neutral{border-color:var(--muted2)}
.gantt-venc{position:absolute;left:4px;top:106px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:8px;padding:2px 8px;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gantt-mark:hover{outline:2px solid #fff;outline-offset:1px}
/* Letras griegas de los mantenimientos en el Gantt (reemplazan a los rombos) */
.gantt-glifo{position:absolute;top:106px;font-size:19px;font-weight:800;line-height:1;cursor:default;z-index:3;
  font-family:"Cambria","Georgia","Segoe UI",serif;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
.gantt-glifo .g0{font-size:.6em;font-weight:700;vertical-align:-.05em;margin-left:1px}
.gantt-glifo.verde{color:var(--green)}.gantt-glifo.amarillo{color:var(--amber)}.gantt-glifo.rojo{color:var(--red)}.gantt-glifo.neutral{color:var(--muted2)}
.gantt-glifo.proy{opacity:.7;font-weight:600;font-style:italic}
.gantt-glifo.done{color:#aab3c7;text-shadow:0 1px 2px rgba(0,0,0,.85)}
.gantt-glifo.done.corr{color:#E8743C}
.gantt-glifo.done.insp{color:#6fc0ff}
.hist-tl{position:relative;margin:2px 0 2px 9px;padding-left:24px;border-left:2px solid var(--border)}
.hist-ev{position:relative;margin:0 0 14px}
.hist-ev .dot{position:absolute;left:-33px;top:3px;width:15px;height:15px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--border)}
.hist-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 14px}
.hist-date{font-size:11px;color:var(--muted);font-family:Consolas,monospace;white-space:nowrap}
.gantt-glifo .gd-chk{position:absolute;top:-7px;right:-8px;font-size:10px;color:#1FB87A;font-weight:900;text-shadow:0 0 2px #000}
.gantt-glifo:hover{filter:brightness(1.35)}
/* leyenda: cuadraditos de estado + letras de referencia */
.leg-sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:middle}
.leg-sw.rojo{background:var(--red)}.leg-sw.amarillo{background:var(--amber)}.leg-sw.verde{background:var(--green)}
.leg-sw.hueco{background:transparent;border:2px solid var(--muted2)}
.leg-gr{font-family:"Cambria","Georgia",serif;font-weight:800;color:#cfe0ff;font-size:14px}
.leg-gr .g0{font-size:.6em;font-weight:700;vertical-align:-.05em;margin-left:1px}
/* barras de costos con relieve */
.cbar-track{background:#0b1120;border:1px solid var(--border);border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.cbar-fill{height:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);transition:width .45s ease}
/* tooltip flotante (gantt) */
#gtt{position:fixed;z-index:1200;display:none;max-width:300px;background:#0c1220;border:1px solid var(--border2);border-radius:11px;box-shadow:var(--shadow);padding:12px 14px;font-size:12.5px;pointer-events:none}
#gtt .gtt-h{font-weight:800;font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#gtt .gtt-dot{width:11px;height:11px;border-radius:3px;transform:rotate(45deg);flex:none}
#gtt .gtt-dot.verde{background:var(--green)}#gtt .gtt-dot.amarillo{background:var(--amber)}#gtt .gtt-dot.rojo{background:var(--red)}#gtt .gtt-dot.neutral{background:var(--muted2)}
#gtt .gtt-row{display:flex;justify-content:space-between;gap:20px;margin:3px 0;color:var(--muted)}
#gtt .gtt-row b{color:var(--text);font-variant-numeric:tabular-nums}
#gtt .gtt-bad{color:#ff8a8e;font-weight:700;margin-top:7px}
#gtt .gtt-muted{color:var(--muted);margin-top:7px}
/* chips de acción (agrupación) */
.acc{display:flex;flex-direction:column;gap:6px}
.acc-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.when{background:#13294d;border:1px solid #2d63b8;color:#aecbff;border-radius:7px;padding:3px 10px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sit{border-radius:7px;padding:3px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.sit.rojo{background:var(--red-bg);color:#ff8a8e}.sit.verde{background:var(--green-bg);color:#5fe0a8}.sit.amarillo{background:var(--amber-bg);color:#ffc24d}.sit.azul{background:#13294d;color:#aecbff}.sit.neutral{background:#1c2740;color:var(--muted)}
.acc-motivo{color:var(--muted);font-size:12px}

/* gauge */
.gauge-wrap{display:flex;align-items:center;gap:14px}
.minigraph{display:flex;gap:3px;align-items:flex-end;height:40px}
.minigraph i{width:7px;background:var(--primary);border-radius:2px 2px 0 0;display:block;opacity:.85}

/* equipo card */
.eq-card{background:linear-gradient(180deg,var(--panel),#10172780);border:1px solid var(--border);border-radius:13px;overflow:hidden;transition:.15s}
.eq-card:hover{border-color:#2c3a86;transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.eq-card .top{padding:15px 17px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.eq-card .top .nm{font-weight:800;font-size:17px}
.eq-card .top .cd{color:var(--muted);font-size:12px}
.eq-card .body{padding:15px 17px}
.eq-stat{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}
.eq-stat .v{font-weight:700}
.statusband{height:6px}
.statusband.verde{background:var(--green)}.statusband.amarillo{background:var(--amber)}.statusband.rojo{background:var(--red)}.statusband.neutral{background:var(--muted2)}
/* dashboard visual helpers */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.statbox{background:#0e1626;border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.statbox .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.statbox .v{font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1}
.statbox .v small{font-size:11px;color:var(--muted);font-weight:600}
.prog{height:10px;background:#0d1422;border-radius:6px;overflow:hidden;border:1px solid var(--border);margin:7px 0 5px}
.prog>span{display:block;height:100%;border-radius:6px;transition:width .3s}
.prog.verde>span{background:linear-gradient(90deg,#1FB87A,#28d690)}.prog.amarillo>span{background:linear-gradient(90deg,#d99216,#F0A91E)}.prog.rojo>span{background:linear-gradient(90deg,#c93a3f,#E5484D)}.prog.neutral>span{background:#3a4a6a}
.next-box{background:#0e1626;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:4px}
.next-box .pl{font-weight:800;font-size:15px}
.urg-row{display:flex;align-items:center;gap:11px;padding:11px 6px;border-bottom:1px solid #1b2336}
.urg-row:last-child{border-bottom:none}
.urg-row .nm{font-weight:700;font-size:13.5px}
.urg-row .meta{color:var(--muted);font-size:12px}
.chartbars{display:flex;gap:12px;align-items:flex-end;height:150px;padding-top:10px}
.chartbars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chartbars .bar3{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--primary-glow),var(--primary-deep))}
.chartbars .bar3.hot{background:linear-gradient(180deg,#ff7a4d,#E5484D)}
/* agrupación */
.parada-date{background:var(--primary-deep);color:#fff;border-radius:11px;padding:9px 13px;text-align:center;font-weight:800;line-height:1.05;min-width:62px;box-shadow:0 0 14px rgba(46,59,224,.3)}
.parada-date.conj{background:linear-gradient(180deg,#22c98a,#0f9e63);box-shadow:0 0 14px rgba(31,184,122,.35)}
.parada-date .d{font-size:19px;display:block}
.parada-date .m{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.9}
.parada-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.parada-head .ttl{font-size:16px;font-weight:800}
.countpill{background:#16203a;border:1px solid var(--border2);border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:700;color:#cdd6ea}
.certgrp>summary{list-style:none;cursor:pointer}
.certgrp>summary::-webkit-details-marker{display:none}
.certgrp .arrow::before{content:'▸';color:#6fb7ff;display:inline-block;width:12px;transition:transform .12s}
.certgrp[open] .arrow::before{content:'▾'}
.conj-banner{background:linear-gradient(90deg,#0e2a1f,#11352566);border:1px solid #1f6b4a;border-radius:10px;padding:12px 16px;margin-bottom:14px;color:#8ce8bf;font-size:13.5px;display:flex;align-items:center;gap:10px}
.conj-banner b{color:#aef5d3}

.help{background:#0e1830;border:1px solid #1f2c52;border-radius:8px;padding:11px 14px;font-size:12.5px;color:#a9b8db;margin-bottom:16px;display:flex;gap:10px}
.help .ic{color:var(--primary-glow);font-size:15px}
hr.sep{border:none;border-top:1px solid var(--border);margin:18px 0}

@media print{
  #sidebar,#topbar,.no-print,.top-actions{display:none!important}
  #app{display:block!important}#main{overflow:visible;padding:0}
  body{background:#fff;color:#000;overflow:visible}
  .card,.kpi,.table-wrap{border-color:#ccc;background:#fff;break-inside:avoid}
  th{background:#eee!important;color:#000;position:static}
  td{border-color:#ddd}
  .pill,.tag{border:1px solid #999}
}

/* ============================================================

   App local de archivo único. Persistencia: localStorage.

/* ---------- PLANES DE MANTENIMIENTO (definición de fábrica; editables/agregables en DB.planes) ---------- */
const PLANES_DEF = [
  {key:'ALFA_ZERO', nombre:'Alfa Zero', componente:'Motor',       intervalo:500,   fuente:'motor', tipo:'unica'},
  {key:'ALFA',      nombre:'Alfa',      componente:'Motor',       intervalo:500,   fuente:'motor', tipo:'repetitivo', offset:true, dependeDe:'ALFA_ZERO'},
  {key:'BETA',      nombre:'Beta',      componente:'Transmisión', intervalo:1500,  fuente:'motor', tipo:'repetitivo'},
  {key:'GAMMA',     nombre:'Gamma',     componente:'Power End',   intervalo:2500,  fuente:'bomba', tipo:'repetitivo'},
  {key:'DELTA',     nombre:'Delta',     componente:'Frac Pump',   intervalo:3000,  fuente:'bomba', tipo:'repetitivo'},
  {key:'EPSILON',   nombre:'Epsilon',   componente:'Transmisión', intervalo:6000,  fuente:'motor', tipo:'repetitivo'},
  {key:'ZETA',      nombre:'Zeta',      componente:'Frac Pump',   intervalo:6000,  fuente:'bomba', tipo:'repetitivo'},

  {key:'KAPPA',     nombre:'Kappa',     componente:'Motor',       intervalo:48000, fuente:'motor', tipo:'repetitivo'},
];
let PLANES = PLANES_DEF.map(p=>({...p}));   // copia de trabajo (SOLO planes ACTIVOS); aplicarPlanes() la reemplaza por DB.planes no-archivados al cargar
// PLAN() resuelve contra TODOS los planes (incluidos los archivados) para que la historia clínica siga mostrando el nombre de un plan archivado.
const PLAN = k => ((typeof DB!=='undefined' && Array.isArray(DB.planes) && DB.planes.length) ? DB.planes : PLANES).find(p=>p.key===k);
// Periodicidad (intervalo) EDITABLE desde Parámetros. Se guardan los valores de fábrica para poder restaurar,
// y los del usuario viven en DB.params.intervalos. aplicarIntervalos() los vuelca sobre PLANES, así TODO el
// motor (nextDueHours, hitoTeorico, proyecciones, stock, costos) usa el intervalo vigente sin tocar nada más.
const INTERVALOS_DEF = Object.fromEntries(PLANES_DEF.map(p=>[p.key,p.intervalo]));

// así TODO el motor (nextDueHours, hitoTeorico, proyecciones, agrupación, gantt, stock, costos) usa los planes vigentes.
function aplicarPlanes(){
  if(typeof DB!=='undefined' && Array.isArray(DB.planes) && DB.planes.length) PLANES = DB.planes.filter(p=>!p.archivado);   // ACTIVOS: los archivados no se proyectan ni aparecen en listas/selectores
  else PLANES = PLANES_DEF.map(p=>({...p}));
}
// Texto del "cada cuánto" según cómo se controla el plan (horas / meses / años / pads)
function intervaloTxt(p){
  if(p.fuente==='pads') return num(p.intervalo)+' pad'+(Number(p.intervalo)===1?'':'s');
  if(p.fuente==='calendario'){
    if(p.calMode==='fija'){ const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return (p.diaFijo||1)+' '+M[(Number(p.mesFijo)||1)-1]+(Number(p.intervalo)>1?(' c/'+num(p.intervalo)+' años'):' (anual)'); }
    return num(p.intervalo)+' mes'+(Number(p.intervalo)===1?'':'es');
  }
  return num(p.intervalo)+' h';
}
function fuenteTxt(p){ return p.fuente==='motor'?'Motor':p.fuente==='bomba'?'Bomba':p.fuente==='calendario'?'Calendario':p.fuente==='pads'?'Pads':(p.fuente||''); }
function esPorHoras(p){ return p.fuente==='motor'||p.fuente==='bomba'; }
// Etiqueta clara de un plan (aclara que Alfa arranca a 1000, Alfa Zero es única vez, etc.)
function planLabel(p){
  if(!esPorHoras(p)){ return `${p.nombre} — ${fuenteTxt(p)}, cada ${intervaloTxt(p)}${p.tipo==='unica'?' (única vez)':''}`; }
  const src = p.fuente==='motor'?'Motor':'Bombeo';
  if(p.tipo==='unica') return `${p.nombre} — ${src}, ${num(p.intervalo)}h (única vez)`;
  if(p.offset) return `${p.nombre} — ${src}, cada ${num(p.intervalo)}h (1ª vez a las ${num(primerHito(p))}h)`;
  return `${p.nombre} — ${src}, cada ${num(p.intervalo)}h`;
}

/* ---------- UTILIDADES ---------- */
function money(v){ if(v==null||v===''||Number(v)===0) return '—'; return (DB.params&&DB.params.moneda||'USD')+' '+num(v); }
function empColorOf(nombre){ const e=(DB.empresasServicio||[]).find(x=>x.nombre===nombre); return e?e.color:'#3d6ed0'; }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => toISO(new Date());
function toISO(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); const day=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(day,last)); return x; }
function fmtD(s){ if(!s) return '—'; const d=parseD(s); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function fmtDM(s){ if(!s) return '—'; const d=parseD(s); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }
function fmtDShort(s){ if(!s) return '—'; const d=parseD(s); const M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return `${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()}`; }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function num(v,dec=0){ if(v==null||v==='')return '—'; return Number(v).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- BASE DE DATOS (localStorage) ---------- */
const DBKEY='qm_planificador_db_v1';
let DB=null;
function saveDB(){ localStorage.setItem(DBKEY, JSON.stringify(DB)); if(typeof fsProgramarVolcado==='function') fsProgramarVolcado(); }
// ---- Sincronización automática a SharePoint vía webhook de Power Automate (ver instrucciones en Parámetros) ----
let _syncT=null;
function syncProgramar(){
  if(typeof WEB_LITE!=='undefined' && WEB_LITE) return;            // la demo web no sincroniza
  if(!DB||!DB.params||!DB.params.syncURL||!DB.params.syncAuto) return;
  clearTimeout(_syncT); _syncT=setTimeout(()=>syncAhora(true),2500);  // debounce: agrupa cambios seguidos
}
function syncAhora(silencioso){
  const url=DB.params&&DB.params.syncURL;
  if(!url){ if(!silencioso) toast('Primero pegá la URL de Power Automate en Parámetros','warn'); return; }
  try{
    fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:csvProximosMant()});
    DB.params.syncUltima=new Date().toISOString(); localStorage.setItem(DBKEY,JSON.stringify(DB));   // sin re-disparar sync
    if(!silencioso) toast('Datos enviados a SharePoint');
    const el=document.getElementById('sync-estado'); if(el) el.textContent='Última sincronización: '+fmtDHora(DB.params.syncUltima);
  }catch(e){ if(!silencioso) toast('No se pudo enviar: '+e.message,'err'); }
}
function fmtDHora(iso){ try{ const d=new Date(iso); return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
// CSV COMPLETO de TODOS los próximos mantenimientos (firmes + proyectados + vencidos) para export/SharePoint
function csvProximosMant(){
  const head=['Equipo','Codigo','Plan','Tipo mantenimiento','Componente','Fuente horas','Horas teoricas','Se hara a (h)','Vencido por (h)','Fecha','Estado'];
  const rows=planEvents().map(e=>[
    e.equipo.nombre, e.equipo.codigo||'', e.plan.nombre,
    e.proyeccion?'Proyeccion':(e.vencido?'Vencido':'Proximo'),
    e.plan.componente, e.plan.fuente==='motor'?'Motor':'Bomba',
    e.teorico!=null?e.teorico:e.horas, e.horasReal!=null?e.horasReal:'',
    e.excedente>0?e.excedente:'', e.accionFecha||e.date||'sin fecha',
    estadoLabel(e.estado)
  ]);
  return '﻿'+[head,...rows].map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
}
function exportTodo(){ const blob=new Blob([csvProximosMant()],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='proximos_mantenimientos_'+todayISO()+'.csv'; a.click(); toast('Exportado: todos los próximos mantenimientos'); }
function loadDB(){
  const raw=localStorage.getItem(DBKEY);
  if(raw){ try{ DB=JSON.parse(raw); migrate(); aplicarPlanes(); return; }catch(e){} }
  DB=seed(); migrate(); aplicarPlanes(); saveDB();
}
function migrate(){
  DB.equipos??=[]; DB.lecturas??=[]; DB.pads??=[]; DB.mantenimientos??=[];
  DB.ordenes??=[]; DB.productos??=[]; DB.bom??=[]; DB.stock??=[]; DB.audit??=[];
  DB.pendientes??=[];   // "partes 2": materiales que faltaron en un mantenimiento parcial → hacer en la próxima parada
  DB.bom.forEach(b=>{ if(!Array.isArray(b.alternativas)) b.alternativas=[]; });   // alternativas de producto (este u otro): productoId=principal, alternativas=equivalentes
  DB.adelantos??=[];   // "adelantos": partes de un plan hechas ANTES del mant completo (no reinician el ciclo)
  DB.inspecciones??=[];   // catálogo estandarizado de inspecciones/chequeos: [{id,nombre,descripcion}] — referenciado por planes (BOM tipo inspeccion) y por mant tipo inspección
  // Auto-catálogo: convertir inspecciones de texto libre ya cargadas (v9.1) en entradas del catálogo y enlazarlas por inspId
  { const porNombre={}; DB.inspecciones.forEach(i=>{ if(i.nombre) porNombre[i.nombre.trim().toLowerCase()]=i.id; });
    const asegurar=(nombre)=>{ const k=(nombre||'').trim().toLowerCase(); if(!k) return null; if(porNombre[k]) return porNombre[k]; const id=uid(); DB.inspecciones.push({id,nombre:nombre.trim(),descripcion:''}); porNombre[k]=id; return id; };
    DB.bom.forEach(b=>{ if(b.tipo==='inspeccion' && !b.inspId && b.titulo) b.inspId=asegurar(b.titulo); });
    DB.mantenimientos.forEach(m=>{ (m.productos||[]).forEach(x=>{ if(x.tipo==='inspeccion' && !x.inspId && x.titulo) x.inspId=asegurar(x.titulo); }); });
  }
  DB.planificado??={};   // fechas fijadas manualmente por el usuario: clave equipoId|plan|horas -> fecha
  // Certificaciones de equipos (RTO, cañería de alta, etc.)
  DB.certCategorias??=[];
  if(!DB.certCategorias.length){ DB.certCategorias=[{id:uid(),nombre:'RTO',avisoDias:null,porComponente:false},{id:uid(),nombre:'Cañería de alta',avisoDias:null,porComponente:true}]; }
  DB.certCategorias.forEach(c=>{ if(c.porComponente===undefined) c.porComponente=/ca[ñn]er[ií]a\s*de\s*alta/i.test(c.nombre||''); });   // porComponente: certifica el componente/SN (rota entre equipos). Cañería de alta arranca por-componente.
  DB.certificaciones??=[];
  DB.certificaciones.forEach(c=>{ c.seriales??=[]; c.partNumbers??=[]; c.nrosCert??=[]; c.pdfs??=[]; if(c.archivada===undefined)c.archivada=false; if(c.equipoId===undefined)c.equipoId=''; });
  // Componentes: entidad propia para las categorías por-componente (SN que rota entre equipos). El componente tiene el equipo; las certificaciones cuelgan de él.
  DB.componentes??=[];
  DB.pnNombres??={};   // nombre corto/reconocible por Part Number (compartido): { pnLower: nombre }
  // Ficha técnica: secciones. tipo 'piezas' (certificable, cantidad esperada) o 'campos' (tabla: columnas + filas). scope 'general' (un dato para todos) o 'equipo' (cada uno el suyo, filas/columnas comunes).
  DB.fichaGeneral??={secciones:[]};
  if(!DB.fichaGeneral.secciones || !DB.fichaGeneral.secciones.length){
    const cMarca=uid(),cCant=uid(),cDato=uid();
    DB.fichaGeneral={secciones:[
      {id:uid(),nombre:'Componentes certificables',tipo:'piezas',scope:'equipo',items:[]},
      {id:uid(),nombre:'Aceites y fluidos',tipo:'campos',scope:'equipo',columnas:[{id:cMarca,nombre:'Marca',scope:'general'},{id:cCant,nombre:'Cantidad',scope:'equipo'}],filas:[{id:uid(),nombre:'Aceite motor',celdas:{}},{id:uid(),nombre:'Aceite bomba / power end',celdas:{}},{id:uid(),nombre:'Refrigerante',celdas:{}}]},
      {id:uid(),nombre:'Motor',tipo:'campos',scope:'general',columnas:[{id:cDato,nombre:'Dato',scope:'general'}],filas:[{id:uid(),nombre:'Marca',celdas:{}},{id:uid(),nombre:'Modelo',celdas:{}},{id:uid(),nombre:'Potencia',celdas:{}}]},
    ]};
  }
  // Migración: dar scope y estructura de tabla a secciones viejas (campos etiqueta+valor → columnas+filas)
  (DB.fichaGeneral.secciones||[]).forEach(s=>{ if(!s.scope) s.scope='equipo';
    if(s.tipo==='campos' && !s.columnas){ const cv=uid(); s.columnas=[{id:cv,nombre:'Valor'}]; s.filas=(s.items||[]).map(it=>({id:it.id||uid(),nombre:it.etiqueta||'',celdas:{[cv]:it.valor||''}})); s._valCol=cv; delete s.items; }
    if(s.tipo==='campos'){ s.columnas=s.columnas||[]; s.filas=s.filas||[]; s.filas.forEach(f=>{ f.celdas=f.celdas||{}; }); s.columnas.forEach(c=>{ if(!c.scope) c.scope=s.scope||'equipo'; }); }   // scope ahora es POR COLUMNA (heredа del scope de sección que tenía antes)
    if(s.tipo==='piezas'){ s.items=s.items||[]; }
  });
  DB.fichaEquipo??={};   // { equipoId: { esp:{itemId:N}, cel:{'filaId|colId':'valor'} } }
  { const item2col={}; (DB.fichaGeneral.secciones||[]).forEach(s=>{ if(s.tipo==='campos'&&s._valCol) (s.filas||[]).forEach(f=>item2col[f.id]=s._valCol); });
    Object.keys(DB.fichaEquipo).forEach(eqId=>{ const d=DB.fichaEquipo[eqId]; if(d&&d.val){ d.cel=d.cel||{}; Object.keys(d.val).forEach(iid=>{ const col=item2col[iid]; if(col) d.cel[iid+'|'+col]=d.val[iid]; }); delete d.val; } if(d&&!d.cel)d.cel={}; if(d&&!d.esp)d.esp={}; }); }
  // Back-link: certificaciones por-componente sin componenteId → crear/asociar un componente por (categoría, SN)
  DB.certificaciones.forEach(c=>{ const cat=(DB.certCategorias||[]).find(k=>k.id===c.categoriaId); if(!cat||!cat.porComponente||c.componenteId) return;
    const sn=(c.seriales&&c.seriales[0])||''; let comp=DB.componentes.find(x=>x.categoriaId===c.categoriaId && (x.sn||'').toLowerCase()===sn.toLowerCase() && (sn||x.id===c._tmp));
    if(!comp){ comp={id:uid(),categoriaId:c.categoriaId,sn,descripcion:c.descripcion||'',partNumber:(c.partNumbers&&c.partNumbers[0])||'',equipoId:c.equipoId||'',creadoEn:c.creadoEn||new Date().toISOString()}; DB.componentes.push(comp); }
    c.componenteId=comp.id; });
  DB.params??={};
  const dp={horasMotorDia:20,horasBombaDia:14,horizonteDias:1095,umbralRojo:15,umbralAmarillo:45,factorBordePad:0.5,
    costoMovilizacion:8000,ventanaAgrupacionDias:10,leadTimeDefaultDias:120,zServicio:1.65,toleranciaHoras:80,user:'admin',pass:'admin',
    adminWebPass:'admin', userRoutes:['dashboard','calendario','planificacion','agrupacion','equipos','horas','pads','mantenimientos','historia','ficha','componentes','certificaciones','analitica','costos'],
    syncURL:'', syncAuto:false, moneda:'USD', costoPlan:{}, certAvisoDias:30};
  for(const k in dp) if(DB.params[k]===undefined) DB.params[k]=dp[k];
  // Periodicidades editables: se completan con las de fábrica (y así aparecen planes nuevos si se agregan)
  DB.params.intervalos = Object.assign({}, INTERVALOS_DEF, DB.params.intervalos||{});
  // Planes EDITABLES/AGREGABLES: inicializar DB.planes desde los de fábrica aplicando los intervalos ya configurados (v7.0)
  if(!Array.isArray(DB.planes) || !DB.planes.length){
    DB.planes = PLANES_DEF.map(p=>{ const iv=Number(DB.params.intervalos[p.key]); return {...p, intervalo:(iv>0?iv:p.intervalo)}; });
  }
  // Mantenimientos: costo asociado + tipo (preventivo alimenta proyecciones / correctivo solo cuenta para costos)
  DB.mantenimientos.forEach(m=>{ if(m.costo==null) m.costo=0; if(!m.tipo) m.tipo='preventivo'; if(!m.creadoEn) m.creadoEn=m.fecha; if(!Array.isArray(m.adjuntos)) m.adjuntos=[]; });
  // Reparar partes 2 completadas ANTES del fix v9.1 (quedaba estado 'hecho' pero el mant seguía con material 'pendiente')
  (DB.pendientes||[]).filter(p=>p.estado==='hecho').forEach(p=>{ const m=DB.mantenimientos.find(x=>x.id===p.mantId); if(m&&Array.isArray(m.productos)){ const ids=new Set(p.productos.map(x=>x.bomId||x.productoId)); m.productos.forEach(x=>{ if(x.estado==='pendiente'&&ids.has(x.bomId||x.productoId)) x.estado='usado'; }); m.parcial=m.productos.some(x=>x.estado==='pendiente'); } });
  // Cliente → operadora + empresa de servicio (con listas y color por empresa)
  DB.operadoras??=[]; DB.empresasServicio??=[];
  const EMPCOL=['#4450f0','#22b8cf','#1FB87A','#F0A91E','#E5484D','#9b8cff','#e06fae','#f0883a','#86c95f','#3fb6e6'];
  DB.pads.forEach(p=>{
    if(p.operadora===undefined){
      const c=(p.cliente||'').trim(); let op=c, emp=''; const i=c.indexOf('-');
      if(i>=0){ op=c.slice(0,i).trim(); emp=c.slice(i+1).trim(); }
      p.operadora=op; p.empresaServicio=emp;
    }
    if(p.operadora && !DB.operadoras.includes(p.operadora)) DB.operadoras.push(p.operadora);
    if(p.empresaServicio && !DB.empresasServicio.some(e=>e.nombre===p.empresaServicio)) DB.empresasServicio.push({nombre:p.empresaServicio,color:EMPCOL[DB.empresasServicio.length%EMPCOL.length]});
  });
  // Unificación: "Zeta Motor" se fusionó en un único plan "Zeta" (6000 h bomba). Reasigna datos viejos.
  DB.mantenimientos.forEach(m=>{ if(m.plan==='ZETA_MOTOR') m.plan='ZETA'; });
  DB.ordenes.forEach(o=>{ if(o.plan==='ZETA_MOTOR') o.plan='ZETA'; });
  const zetaProd=new Set(DB.bom.filter(b=>b.plan==='ZETA'&&b.productoId).map(b=>b.productoId));
  DB.bom.forEach(b=>{ if(b.plan==='ZETA_MOTOR'&&b.productoId){ if(zetaProd.has(b.productoId)) b._drop=true; else { b.plan='ZETA'; zetaProd.add(b.productoId); } } });
  DB.bom=DB.bom.filter(b=>!b._drop);
  Object.keys(DB.planificado||{}).forEach(k=>{ if(k.includes('|ZETA_MOTOR|')) delete DB.planificado[k]; });   // planificado viejo de Zeta Motor (8000h motor) ya no aplica
  // Migración: pad.equipos[] → pad.asignaciones[{equipoId,desde,hasta}] (fechas de trabajo por equipo)
  DB.pads.forEach(p=>{
    if(!p.asignaciones){
      p.asignaciones=(p.equipos||[]).map(id=>({equipoId:id,desde:p.fechaInicio,hasta:p.fechaFin}));
      delete p.equipos;
    }
    // Reparación: asignaciones con fechas FUERA del rango del pad (bug de carga) → se ajustan al pad
    (p.asignaciones||[]).forEach(a=>{
      if(!a.desde||a.desde<p.fechaInicio) a.desde=p.fechaInicio;
      if(!a.hasta||a.hasta>p.fechaFin) a.hasta=p.fechaFin;
      if(a.desde>a.hasta){ a.desde=p.fechaInicio; a.hasta=p.fechaFin; }   // quedó inválida → rango completo del pad
    });
  });

/* ============================================================
   MOTOR DE PROYECCIÓN PREDICTIVA
   Regla clave: los datos reales tienen prioridad absoluta.
   Las horas se acumulan SOLO desde la última lectura real y
   ÚNICAMENTE en los días en que el equipo opera dentro de un pad.
   ============================================================ */
function lastReading(eqId){
  return DB.lecturas.filter(l=>l.equipoId===eqId).sort((a,b)=>a.fecha<b.fecha?1:-1)[0]||null;
}
function firstReading(eqId){
  return DB.lecturas.filter(l=>l.equipoId===eqId).sort((a,b)=>a.fecha<b.fecha?-1:1)[0]||null;
}
// Rangos de trabajo (desde/hasta) de un equipo a lo largo de todos los pads
function asignacionesForEquipo(eqId){
  const out=[]; DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId) out.push({pad:p,desde:a.desde,hasta:a.hasta,pausas:a.pausas||[]}); })); return out;
}
// ¿La fecha cae en una PAUSA (en locación pero sin operar → no suma horas, pero NO es parada disponible)?
function enPausa(pausas,iso){ return (pausas||[]).some(p=>p.desde&&p.hasta&&iso>=p.desde&&iso<=p.hasta); }

function buildTimeline(eq,baseReading){
  let lr=baseReading||lastReading(eq.id);
  if(!lr){
    // Equipo sin lecturas (p.ej. en fabricación) pero con pads asignados → proyectar desde 0 h.
    const asg=asignacionesForEquipo(eq.id);
    if(!asg.length) return null;   // sin lectura y sin pads → nada que proyectar
    // Ancla sintética = un día ANTES del primer pad (con 0 h) → así el 1er día de operación ya suma,
    // igual que un equipo con lectura. Antes se anclaba en HOY y el día de hoy no se contaba (quedaba en 0).
    const firstStart=asg.map(a=>a.desde).filter(Boolean).sort()[0];
    const anchor = firstStart ? toISO(addDays(parseD(firstStart),-1)) : todayISO();
    lr={fecha:anchor, horasMotor:0, horasBomba:0, sintetica:true};
  }
  const motorDia=Number(eq.motorDia)||DB.params.horasMotorDia;
  const bombaDia=Number(eq.bombaDia)||DB.params.horasBombaDia;
  const fBorde=(DB.params.factorBordePad!=null?DB.params.factorBordePad:0.5);   // 1er y último día del pad = jornada parcial (entrada/salida)
  const asigs=asignacionesForEquipo(eq.id);
  const horizon=DB.params.horizonteDias||1095;
  const startD=parseD(lr.fecha), endD=addDays(startD,horizon);
  let cumM=Number(lr.horasMotor)||0, cumB=Number(lr.horasBomba)||0;
  const a0=asigs.find(x=> lr.fecha>=x.desde && lr.fecha<=x.hasta);   // ¿opera el día de la lectura? (para detectar tramo en curso)
  const days=[{date:lr.fecha,cumMotor:cumM,cumBomba:cumB,pad:a0?a0.pad.nombre:null}];
  let cur=addDays(startD,1);
  while(cur<=endD){
    const iso=toISO(cur);
    // Solo suma horas si el equipo trabajó ese día (rango desde/hasta de su asignación) Y NO está en pausa (día sin operar en locación)
    const a=asigs.find(x=> iso>=x.desde && iso<=x.hasta);
    if(a && !enPausa(a.pausas,iso)){ const f=(iso===a.desde||iso===a.hasta)?fBorde:1; cumM+=motorDia*f; cumB+=bombaDia*f; }
    days.push({date:iso,cumMotor:cumM,cumBomba:cumB,pad:a?a.pad.nombre:null});
    cur=addDays(cur,1);
  }
  return {base:lr,days,motorDia,bombaDia,sintetica:!!lr.sintetica};
}

function lastExecHours(eqId,planKey,fuente){
  // SOLO preventivos alimentan la proyección; los correctivos no reinician ciclos ni mueven nada
  const ms=DB.mantenimientos.filter(m=>m.equipoId===eqId&&m.plan===planKey&&m.tipo!=='correctivo').sort((a,b)=>a.fecha<b.fecha?1:-1);
  let best = ms.length ? (fuente==='motor'? Number(ms[0].horasMotor) : Number(ms[0].horasBomba)) : null;
  // MATCHEO POR PRODUCTO (opt-in): si el plan tiene ítems marcados "traer historial" (un producto que se movió desde otro plan),
  // se ancla el ciclo también en la última vez que ESE producto se reemplazó —en cualquier plan—, aunque este plan nunca se haya hecho.
  // Se toma la MÁS RECIENTE (no adelanta de menos). Es opt-in: sin la marca, la proyección no cambia en nada.
  const pidsTraer = DB.bom.filter(b=>b.plan===planKey && b.traerHistorial && b.productoId).map(b=>b.productoId);
  if(pidsTraer.length){
    const setP=new Set(pidsTraer);
    DB.mantenimientos.filter(m=>m.equipoId===eqId && m.tipo!=='correctivo' && Array.isArray(m.productos) && m.productos.some(x=>x&&setP.has(x.productoId)))
      .forEach(m=>{ const h=fuente==='motor'?Number(m.horasMotor):Number(m.horasBomba); if(h>0 && (best==null||h>best)) best=h; });
  }
  return best;
}
// Primer hito nominal del plan (la 1ª vez que corresponde hacerlo, sin ejecuciones previas).
// Si depende de otro plan (Alfa ← Alfa Zero) arranca en: intervalo del padre + el propio (500+500=1000 por defecto).
// Se calcula así (y no como intervalo*2) para que siga siendo correcto si cambiás las periodicidades en Parámetros.
function primerHito(plan){
  const I=plan.intervalo;
  if(plan.tipo==='unica') return I;
  if(plan.offset){ const dep=plan.dependeDe?PLAN(plan.dependeDe):null; return ((dep&&dep.intervalo)?dep.intervalo:I)+I; }
  return I;
}
// Primer punto de control a considerar (puede estar VENCIDO). allEvents luego genera los siguientes ciclos.
function nextDueHours(plan,eq,currentH){
  const exec=lastExecHours(eq.id,plan.key,plan.fuente);
  const I=plan.intervalo;
  // Offset de calibración del equipo: los hitos ABSOLUTOS (sin ejecución previa) se corren junto al odómetro corregido → no se vencen al calibrar.
  const off = plan.fuente==='motor' ? (Number(eq.horasOffsetMotor)||0) : (Number(eq.horasOffsetBomba)||0);
  if(plan.tipo==='unica'){                                   // Alfa Zero: única vez
    if(exec!=null) return null;                              // ya registrado como ejecutado → no vuelve a aparecer
    return I+off;                                            // si NO está registrado y las horas pasaron → VENCIDO
  }
  if(exec!=null) return exec+I;                              // CON registro propio: primer ciclo tras el último service (relativo → invariante a la calibración)
  if(plan.dependeDe){                                        // depende de otro plan (Alfa depende de Alfa Zero)
    const ed=lastExecHours(eq.id,plan.dependeDe,plan.fuente);
    if(ed!=null) return ed+I;                                // si la dependencia SE ejecutó: 1er ciclo = su ejecución + I
    // si la dependencia NO se ejecutó aún: NO ocultamos, seguimos con la lógica teórica (offset) → se proyecta igual y se re-ancla al cargar el dato real
  }
  // SIN registro: no se asume que los ciclos anteriores se hicieron. Se compara en el marco SIN offset (currentH-off) y se devuelve el hito en el marco calibrado (+off).
  const minFirst = primerHito(plan);                         // Alfa arranca después de Alfa Zero (500+500=1000 por defecto)
  const cur = currentH - off;
  if(cur < minFirst) return minFirst+off;                   // todavía no llegó al primer ciclo → próximo, NO vencido
  let nextAbove = Math.floor(cur/I)*I + I;                  // siguiente múltiplo por encima
  if(nextAbove < minFirst) nextAbove = minFirst;
  return (nextAbove - I) + off;                              // ciclo más reciente ya superado → VENCIDO (el próximo lo agrega allEvents)
}
// Hito TEÓRICO del plan = el número redondo del plan (500, 1000, 1500, 2000…), distinto de:
//   · las horas del CICLO (último service + intervalo, p.ej. 1.427+500=1.927) → columna "Objetivo"
//   · las horas REALES a las que se ejecutará por los pads → "se hará a ~Xh"
// Sirve de referencia: "el plan marca 2.000h, aunque el ciclo caiga en 1.927 y se haga a 2.171".
function hitoTeorico(plan,horas){
  const I=plan.intervalo; if(!I||horas==null) return horas;
  let m=Math.round(horas/I)*I;
  const min = primerHito(plan);
  if(m<min) m=min;
  return m;
}
function findCrossDate(timeline,fuente,nd){
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  const days=timeline.days;
  if(days[0][key]>=nd) return {date:days[0].date,vencido:true,horas:nd};
  for(let i=1;i<days.length;i++){ if(days[i][key]>=nd) return {date:days[i].date,vencido:false,horas:nd}; }
  return {date:null,beyond:true,horas:nd};
}
function statusOf(r){
  if(r.naAplica) return 'gris';
  if(r.beyond) return 'neutral';
  if(r.vencido) return 'rojo';
  const dr=daysBetween(todayISO(),r.date);
  if(dr<0) return 'rojo';
  if(dr<=DB.params.umbralRojo) return 'rojo';
  if(dr<=DB.params.umbralAmarillo) return 'amarillo';
  return 'verde';
}
// "Se hará vencido" en el sentido problemático = se pasará del ciclo MÁS que la tolerancia de horas.
// Dentro de la tolerancia = aceptable (se hace "al fin del pad"), no se marca como vencido.
function venceFuera(e){ return Number(e&&e.excedente)>Number(DB.params.toleranciaHoras||0); }

/* Proyección completa de un equipo: resultado por cada plan */
function projectEquipo(eq){
  const tl=buildTimeline(eq);
  if(!tl) return {equipo:eq,sinLectura:true,planes:[]};
  const hoy=todayISO();
  const hoyM=cumAt(tl,hoy,'motor'), hoyB=cumAt(tl,hoy,'bomba');     // horas PROYECTADAS a hoy (real + planificado)
  const run=operatingRuns(tl).find(r=> hoy>=r.start && hoy<=r.end); // ¿está operando hoy?
  const finPad = run? {fecha:run.end,pad:run.pad,motor:cumAt(tl,run.end,'motor'),bomba:cumAt(tl,run.end,'bomba')} : null;
  const planes=PLANES.map(plan=>{
    const currentH = plan.fuente==='motor'? Number(tl.base.horasMotor) : Number(tl.base.horasBomba);
    const hoyH = plan.fuente==='motor'? hoyM : hoyB;
    const nd=nextDueHours(plan,eq,currentH);
    if(nd==null) return {plan,naAplica:true,currentH};
    const cross=findCrossDate(tl,plan.fuente,nd);
    const r={plan,currentH,horasMant:nd,horasRestantes:Math.round(nd-hoyH),...cross};   // restan DESDE HOY
    r.diasRestantes = cross.date? daysBetween(hoy,cross.date): null;
    r.vencido = !!cross.vencido || (cross.date && r.diasRestantes<0);   // vencido = horas superadas O fecha ya pasada
    r.alFinPad = finPad ? (plan.fuente==='motor'?finPad.motor:finPad.bomba)>=nd : false;  // ¿se alcanza antes de terminar el pad actual?
    r.estado=statusOf(r);
    r.rec=planRecomendacion(tl,{vencido:r.vencido,beyond:r.beyond,date:r.date,plan,horas:nd});
    upgradeRec(r,todayISO());
    r.teorico=hitoTeorico(plan,nd);   // TEÓRICO = hito nominal del plan (1500, 2000…). El ciclo real "debería" = r.horasMant=nd.
    return r;
  });
  return {equipo:eq,base:tl.base,timeline:tl,planes,motorDia:tl.motorDia,bombaDia:tl.bombaDia,horasHoyMotor:hoyM,horasHoyBomba:hoyB,finPad,sintetica:tl.sintetica};
}
function projectAll(){ return DB.equipos.filter(e=>e.estado!=='Baja').map(projectEquipo); }

/* Lista plana de todos los mantenimientos proyectados (para calendario/agrupación/stock) */
function allProjectedMaints(proj){
  const out=[];
  (proj||projectAll()).forEach(p=>{   // proj opcional: reusa el projectAll ya calculado por quien llama (evita recomputarlo)
    if(p.sinLectura) return;
    p.planes.forEach(r=>{ if(r.naAplica||r.beyond||!r.date) return;
      out.push({equipo:p.equipo,plan:r.plan,date:r.date,horas:r.horasMant,estado:r.estado,diasRestantes:r.diasRestantes,vencido:r.vencido}); });
  });
  return out.sort((a,b)=> a.date<b.date?-1:1);
}

/* TODAS las ocurrencias de cada plan (no solo la próxima) hasta una fecha límite.
   Incluye siempre los vencidos. Usado por el listado filtrable del Dashboard. */
function allEvents(untilISO){
  const today=todayISO();
  const horizonEnd=toISO(addDays(parseD(today),DB.params.horizonteDias||1095));
  const limite = untilISO && untilISO>today ? untilISO : horizonEnd;
  const out=[];
  DB.equipos.filter(e=>e.estado!=='Baja').forEach(eq=>{
    const tl=buildTimeline(eq); if(!tl) return;
    PLANES.forEach(plan=>{
      const currentH = plan.fuente==='motor'? Number(tl.base.horasMotor) : Number(tl.base.horasBomba);
      let nd=nextDueHours(plan,eq,currentH);
      if(nd==null) return;
      let guard=0;
      while(nd!=null && guard<400){
        const cross=findCrossDate(tl,plan.fuente,nd);
        if(cross.beyond||!cross.date) break;
        const dr=daysBetween(today,cross.date);
        const vencido = !!cross.vencido || dr<0;
        // se incluye si está vencido (siempre) o si su fecha es <= límite
        if(vencido || cross.date<=limite){
          const r={plan,date:cross.date,vencido,diasRestantes:dr};
          out.push({equipo:eq,plan,date:cross.date,horas:nd,horasRestantes:Math.round(nd-currentH),vencido,diasRestantes:dr,estado:statusOf(r)});
        }
        if(plan.tipo==='unica') break;            // Alfa Zero: una sola vez
        if(cross.date>limite) break;              // siguientes ocurrencias ya fuera del límite
        nd+=plan.intervalo; guard++;
      }
    });
  });
  return out.sort((a,b)=> a.date===b.date? (a.equipo.nombre<b.equipo.nombre?-1:1) : (a.date<b.date?-1:1));
}

/* ---------- Lead time aprendido (órdenes de producción) ---------- */
function leadStatsPlan(planKey){
  const recs=DB.ordenes.filter(o=>o.plan===planKey && o.fechaLanzamiento && o.fechaRecepcion);
  if(!recs.length) return {n:0,avg:DB.params.leadTimeDefaultDias,std:0,cumpl:null};
  const lt=recs.map(o=>daysBetween(o.fechaLanzamiento,o.fechaRecepcion));
  const avg=lt.reduce((a,b)=>a+b,0)/lt.length;
  const std=Math.sqrt(lt.reduce((a,b)=>a+(b-avg)**2,0)/lt.length);
  const comp=recs.filter(o=>o.fechaComprometida).map(o=>daysBetween(o.fechaComprometida,o.fechaRecepcion)<=0);
  const cumpl=comp.length? Math.round(comp.filter(Boolean).length/comp.length*100):null;
  return {n:recs.length,avg:Math.round(avg),std:Math.round(std),cumpl};
}
function leadStatsGlobal(){
  const recs=DB.ordenes.filter(o=>o.fechaLanzamiento&&o.fechaRecepcion);
  if(!recs.length) return {n:0,avg:DB.params.leadTimeDefaultDias,std:0,cumpl:null};
  const lt=recs.map(o=>daysBetween(o.fechaLanzamiento,o.fechaRecepcion));
  const avg=lt.reduce((a,b)=>a+b,0)/lt.length;
  const std=Math.sqrt(lt.reduce((a,b)=>a+(b-avg)**2,0)/lt.length);
  const comp=recs.filter(o=>o.fechaComprometida).map(o=>daysBetween(o.fechaComprometida,o.fechaRecepcion)<=0);
  const cumpl=comp.length? Math.round(comp.filter(Boolean).length/comp.length*100):null;
  return {n:recs.length,avg:Math.round(avg),std:Math.round(std),cumpl};
}
function recommendedLead(planKey){
  const s=leadStatsPlan(planKey);
  const z=DB.params.zServicio||1.65;
  return {dias:Math.round(s.avg + z*s.std), stats:s};   // lead + colchón por variabilidad
}

      || location.search.includes('lite')

let WEB_ROLE = location.search.includes('admin') ? 'admin' : (location.search.includes('user') ? 'user' : (location.search.includes('vista') ? 'vista' : (WEB_LITE ? 'vista' : 'admin')));   // en la web, por defecto Usuario Vista (sin costos)

// ¿Es visible una ruta según modo web + rol + lo que el admin habilitó para usuarios?
function routeVisible(id){
  const asUser = (WEB_ROLE==='user'||WEB_ROLE==='vista');                 // rol usuario (web) o previsualización local del mismo
  if((WEB_LITE||asUser) && LITE_ROUTES.includes(id)) return false;       // Abastecimiento nunca en web ni en vista de usuario
  if(sinCostos() && id==='costos') return false;                         // Usuario Vista: nada de costos
  if(asUser){
    const uv = (DB.params && DB.params.userRoutes) || WEB_ROUTES;
    if(!uv.includes(id)) return false;                                   // el admin no lo habilitó para el usuario
  }
  return true;
}

// Set de bomIds ya adelantados (abiertos) para un equipo+plan → al hacer el mant, esos materiales ya están hechos
function bomIdsAdelantados(eqId,planKey){ const s={}; adelantosAbiertos().filter(a=>a.equipoId===eqId&&a.planKey===planKey).forEach(a=>a.productos.forEach(x=>{ s[x.bomId]=a.fecha; })); return s; }
// Una inspección del catálogo ya hecha SUELTA (o adelantada en otro plan) hace poco → según tolerancia de horas se puede saltear en este plan.
// Devuelve {fecha,horas} de la más reciente dentro de la tolerancia, o null.
function inspHechaReciente(eqId, inspId, fuente, refHoras){
  if(!inspId || !(refHoras>0)) return null;
  const tol=Number(DB.params.toleranciaHoras)||0; let best=null;
  const considerar=(fecha,h)=>{ if(!(h>0)) return; const d=refHoras-h; if(d>=0 && d<=tol && (!best||fecha>best.fecha)) best={fecha,horas:h}; };
  // inspecciones sueltas (tipo inspección) del mismo tipo
  DB.mantenimientos.filter(m=>m.equipoId===eqId && m.tipo==='inspeccion' && (m.inspId===inspId || (m.productos||[]).some(x=>x.inspId===inspId)))
    .forEach(m=>considerar(m.fecha, fuente==='motor'?Number(m.horasMotor):Number(m.horasBomba)));
  // adelantos ABIERTOS de esa inspección en CUALQUIER plan (los del propio plan ya los toma bomIdsAdelantados)
  adelantosAbiertos().filter(a=>a.equipoId===eqId && (a.productos||[]).some(x=>x.tipo==='inspeccion'&&x.inspId===inspId))
    .forEach(a=>considerar(a.fecha, Number(a.horasMotor)));
  return best;
}
// Parte 2 como "items" ubicables en una parada (para Agrupación) y con fecha (para el Gantt). accionFecha = próxima parada.

}

// Asigna fecha de acción y, si el cruce era "sin fecha" pero hay acción dentro de tolerancia, sube su urgencia
function upgradeRec(it,today){
  it.accionFecha = (it.rec&&it.rec.fecha)? it.rec.fecha : it.date;
  if(it.beyond && it.rec && it.rec.fecha){
    it.diasRestantes = daysBetween(today, it.rec.fecha);

    it.accionable = true;
  }

// Genera los ciclos FUTUROS de un plan repetitivo como REFERENCIA (proyección). Cada ciclo se ancla en las horas
// reales a las que se ejecutará el ciclo anterior (su fecha de acción), no en el múltiplo teórico.
function proyectarCiclos(out,eq,plan,tl,firstIt,hoyH,today){
  const fuente=plan.fuente;
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  const maxCum=tl.days[tl.days.length-1][key];
  const wins=equipoGaps(eq.id);                              // paradas propias (donde el equipo NO opera)
  if(!wins.length) return;
  const tol=Number(DB.params.toleranciaHoras)||0;
  const idxAt=d=> wins.reduce((acc,g,i)=> g.desde<=d?i:acc, -1);  // última parada que empieza <= d
  let prevIdx=idxAt(firstIt.accionFecha);                    // parada del ciclo firme
  let prevReal=firstIt.horasReal!=null?firstIt.horasReal:Math.round(cumAt(tl,firstIt.accionFecha,fuente)); // horas REALES a las que se hace el ciclo previo
  let teoricoNom=firstIt.teorico;                            // TEÓRICO nominal: sigue la secuencia del firme (+intervalo por ciclo): 2000,2500,3000…
  let guard=0;
  while(guard++<60){                                         // proyecta TODOS los ciclos alcanzables hasta donde lleguen los pads
    teoricoNom+=plan.intervalo;                              // hito nominal de ESTE ciclo (no se mueve con el drift)
    // CICLO RODANTE (objetivo real): cada ciclo se ancla en CUÁNDO se hace realmente (proyectado) el ciclo anterior + intervalo.
    // Ej.: Teórico 2500 pero "debería" a 2650 porque el Alfa 2000 se proyecta a 2150.
    const nd=Math.round(prevReal+plan.intervalo);
    if(nd>maxCum) break;                                     // ya no se alcanza con los pads cargados → fin
    const cross=findCrossDate(tl,fuente,nd);                 // dónde cruza ESTE ciclo rodante
    if(cross.beyond||!cross.date) break;
    if(plan.hacerEnPad){                                     // plan "durante el pad": el ciclo se hace al cruzar las horas, no en una parada
      const accion=cross.date, realH=nd; if(realH<=prevReal) break;
      const it={equipo:eq,plan,horas:nd,hoy:Math.round(hoyH),horasRestantes:Math.round(nd-hoyH),
        date:accion,beyond:false,vencido:false,diasRestantes:daysBetween(today,accion),
        estado:statusOf({date:accion,vencido:false}),base:Math.round(prevReal),
        proyeccion:true,horasReal:realH,excedente:0,cicloRef:nd,accionFecha:accion,teorico:teoricoNom,durantePad:true};
      it.rec={tipo:'durantepad',fecha:accion,desde:accion,hasta:accion,cls:it.estado,txt:'Durante el pad · '+fmtDM(accion)};
      out.push(it); prevReal=realH; prevIdx=idxAt(accion); continue;
    }
    let natIdx=idxAt(cross.date); if(natIdx<0) natIdx=0;     // parada natural (ANTES del pad donde cruza = prepad)
    // ¿conviene adelantar a esa parada o esperar a la de DESPUÉS del pad (vencido)? Mismo criterio que el ciclo firme.
    if(natIdx+1<wins.length){
      const hB=Math.round(cumAt(tl,asapEnVentana(wins[natIdx]),fuente));
      if((nd-hB) > tol) natIdx++;  // adelantar más que la tolerancia desperdicia vida → esperar (vencido)
    }
    let idx=Math.max(natIdx, prevIdx+1);                     // UNA intervención por parada: si dos ciclos chocan, el 2º va a la siguiente (vencido)
    if(idx>=wins.length) break;                              // no quedan paradas
    const w=wins[idx];
    const bumped=idx>natIdx;                                 // se corrió de su parada natural por chocar con otro ciclo
    const accion=asapEnVentana(w);
    const realH=Math.round(cumAt(tl,accion,fuente));         // horas reales a las que quedaría hacerse
    if(realH<=prevReal) break;
    const venc=realH-nd;                                     // >0 = se hará VENCIDO respecto del ciclo (nd), no del teórico nominal
    const it={equipo:eq,plan,horas:nd,hoy:Math.round(hoyH),horasRestantes:Math.round(nd-hoyH),
      date:accion,beyond:false,vencido:false,diasRestantes:daysBetween(today,accion),
      estado:statusOf({date:accion,vencido:false}),base:Math.round(prevReal),
      proyeccion:true,horasReal:realH,excedente:venc,cicloRef:nd,accionFecha:accion,teorico:teoricoNom};
    it.rec={tipo:venc>0?'postpad':'prepad',fecha:accion,desde:w.desde,hasta:w.hasta,cls:venc>tol?'rojo':(venc>0?'amarillo':'verde'),
      txt: bumped?`Se corre a la parada del ${fmtDM(accion)} (no puede coincidir con otro ciclo)`:`En la parada del ${fmtDM(accion)}`};
    out.push(it);
    prevIdx=idx; prevReal=realH;
  }
}
// Familia Alfa con Alfa Zero PENDIENTE (firme/planificado, NO ejecutado): el Alfa se ancla en CUÁNDO se hará el
// Alfa Zero (azReal), no en el teórico. Si Alfa Zero se hace a 600 → Alfa 1000 se hará a 1100. Todos los ciclos van
// como PROYECCIÓN en paradas POSTERIORES a la del Alfa Zero (nunca en la misma ventana). Al mover el AZ, lo siguen.
function familiaAlfaPendiente(out,eq,plan,tl,azItem,hoyH,today){
  const fuente=plan.fuente, k=fuente==='motor'?'cumMotor':'cumBomba';
  const maxCum=tl.days[tl.days.length-1][k];
  const wins=equipoGaps(eq.id); if(!wins.length) return;
  const idxAt=d=> wins.reduce((a,g,i)=> g.desde<=d?i:a,-1);
  const tol=Number(DB.params.toleranciaHoras)||0;
  let prevReal=azItem.horasReal!=null?azItem.horasReal:Math.round(cumAt(tl,azItem.accionFecha,fuente));
  let prevIdx=idxAt(azItem.accionFecha);
  let teoricoNom=primerHito(plan);                            // TEÓRICO nominal del 1er Alfa = 1000, luego 1500, 2000… (+intervalo por ciclo)
  let guard=0;
  while(guard++<60){
    // TEÓRICO nominal = teoricoNom (1000,1500,2000…, fijo del plan). CICLO RODANTE (objetivo real) = prevReal + intervalo:
    // si el Alfa Zero se hará vencido a 894h, el Alfa 1000 "debería" a 1394h (no a 1000); el siguiente, proyección+500, etc.
    const nd=Math.round(prevReal+plan.intervalo);            // se hará a: AZ_real+500, luego proyección+500…
    if(nd>maxCum) break;
    const cross=findCrossDate(tl,fuente,nd); if(cross.beyond||!cross.date) break;
    let natIdx=idxAt(cross.date); if(natIdx<0) natIdx=0;     // parada ANTES del pad donde cruza (prepad)
    if(natIdx+1<wins.length){                                // ¿adelantar o esperar a que se venza? (mismo criterio que el ciclo firme)
      const hB=Math.round(cumAt(tl,asapEnVentana(wins[natIdx]),fuente));
      if((nd-hB) > tol) natIdx++;                            // adelantar más que la tolerancia → esperar (vencido)
    }
    let idx=Math.max(natIdx, prevIdx+1);                     // SIEMPRE en una parada posterior a la del Alfa Zero / ciclo previo
    if(idx>=wins.length) break;
    const w=wins[idx], accion=asapEnVentana(w), realH=Math.round(cumAt(tl,accion,fuente));
    if(realH<=prevReal) break;
    const venc=realH-nd;                                     // se hará vencido respecto del ciclo (nd), no del teórico nominal
    const it={equipo:eq,plan,horas:nd,hoy:Math.round(hoyH),horasRestantes:Math.round(nd-hoyH),
      date:accion,beyond:false,vencido:false,diasRestantes:daysBetween(today,accion),
      estado:statusOf({date:accion,vencido:false}),base:Math.round(prevReal),
      proyeccion:true,horasReal:realH,excedente:venc,cicloRef:nd,accionFecha:accion,teorico:teoricoNom,
      rec:{tipo:venc>0?'postpad':'prepad',fecha:accion,desde:w.desde,hasta:w.hasta,cls:venc>0?'rojo':'verde',
        txt:`Después del Alfa Zero · en la parada del ${fmtDM(accion)}`}};
    out.push(it);
    prevReal=realH; prevIdx=idx; teoricoNom+=plan.intervalo;
  }
}
// ===== Planes por CALENDARIO (meses/años o fecha fija anual) y por PADS (cantidad, con fracciones) =====
function lastExecFecha(eqId,planKey){ const ms=DB.mantenimientos.filter(m=>m.equipoId===eqId&&m.plan===planKey&&m.tipo!=='correctivo').sort((a,b)=>a.fecha<b.fecha?1:-1); return ms.length?ms[0].fecha:null; }
// Pads (fracción) operados por el equipo entre anchor y at (cada asignación = 1 pad; fracción por días)
function padCountAt(eqId,anchorISO,atISO){
  let acc=0; asignacionesForEquipo(eqId).filter(a=>a.desde&&a.hasta).sort((a,b)=>a.desde<b.desde?-1:1).forEach(a=>{
    if(a.hasta<=anchorISO || a.desde>atISO) return;
    const s=a.desde<anchorISO?anchorISO:a.desde, e=a.hasta>atISO?atISO:a.hasta;
    const total=Math.max(1,daysBetween(a.desde,a.hasta)+1), part=Math.max(0,daysBetween(s,e)+1);
    acc+=Math.min(1,part/total);
  });
  return acc;
}
// Fecha en la que se cumplen N pads (fracción) desde anchor (o null si no se alcanza con los pads cargados)
function padDueDate(eqId,anchorISO,N){
  let acc=0; const asg=asignacionesForEquipo(eqId).filter(a=>a.desde&&a.hasta).sort((a,b)=>a.desde<b.desde?-1:1);
  for(const a of asg){
    if(a.hasta<=anchorISO) continue;
    const s=a.desde<anchorISO?anchorISO:a.desde;
    const total=Math.max(1,daysBetween(a.desde,a.hasta)+1), avail=Math.max(0,daysBetween(s,a.hasta)+1), frac=Math.min(1,avail/total);
    if(acc+frac>=N-1e-9){ const need=Math.max(0,N-acc), dias=Math.max(1,Math.ceil(need*total)), due=toISO(addDays(parseD(s),dias-1)); return due>a.hasta?a.hasta:due; }
    acc+=frac;
  }
  return null;
}
// Genera los eventos (firme + próximos ciclos proyectados) de un plan por CALENDARIO o por PADS
function eventoFechaOPads(out,eq,plan,today){
  const anchor = lastExecFecha(eq.id,plan.key) || (firstReading(eq.id)&&firstReading(eq.id).fecha) || (asignacionesForEquipo(eq.id).map(a=>a.desde).filter(Boolean).sort()[0]) || today;
  const NCICLOS=4; let dues=[];
  if(plan.fuente==='calendario'){
    if(plan.calMode==='fija'){
      const mes=Math.max(1,Math.min(12,Number(plan.mesFijo)||1)), dia=Math.max(1,Math.min(28,Number(plan.diaFijo)||1)), stepY=Math.max(1,Math.round(Number(plan.intervalo)||1));
      let y=parseD(anchor).getFullYear(), d=toISO(new Date(y,mes-1,dia));
      while(d<=anchor){ y+=stepY; d=toISO(new Date(y,mes-1,dia)); }
      for(let i=0;i<NCICLOS;i++){ dues.push(d); d=toISO(new Date(parseD(d).getFullYear()+stepY,mes-1,dia)); }
    } else {
      const meses=Math.max(1,Math.round(Number(plan.intervalo)||1)); let d=toISO(addMonths(parseD(anchor),meses));
      for(let i=0;i<NCICLOS;i++){ dues.push(d); d=toISO(addMonths(parseD(d),meses)); }
    }
  } else { // pads
    const Np=Math.max(0.1,Number(plan.intervalo)||1); let a=anchor;
    for(let i=0;i<NCICLOS;i++){ const d=padDueDate(eq.id,a,Np); if(!d) break; dues.push(d); a=d; }
  }
  if(plan.tipo==='unica'){ if(lastExecFecha(eq.id,plan.key)) return; dues=dues.slice(0,1); }   // única vez: si ya se hizo, no aparece; si no, solo la 1ª
  dues.forEach((d,i)=>{
    const vencido=d<today, dr=daysBetween(today,d);
    const it={equipo:eq,plan,horas:null,hoy:null,teorico:null,base:null,horasRestantes:null,
      date:d,beyond:false,vencido,diasRestantes:dr,estado:statusOf({date:d,vencido}),
      proyeccion:i>0,accionFecha:d,unidad:(plan.fuente==='pads'?'pads':'cal')};
    it.rec={tipo:'fecha',fecha:d,desde:d,hasta:d,cls:it.estado,txt:(plan.fuente==='pads'?('Cada '+num(plan.intervalo)+' pad(s) · ~'+fmtDM(d)):('Calendario · '+fmtDM(d)))};
    aplicarPlanificado(it);
    if(plan.hacerEnPad && !it.manual) it.durantePad=true;
    out.push(it);
  });
}
// TODOS los planes de TODOS los equipos: cada plan muestra su PRÓXIMO; se repite solo si está vencido (ciclos vencidos + el próximo).
// Los ciclos siguientes se muestran como PROYECCIÓN (referencia) y se recalculan al cargar datos reales.
// Si el próximo cae fuera de los pads cargados, igual aparece (sin fecha estimada).
function planEvents(){
  const today=todayISO(); const out=[];
  DB.equipos.filter(e=>e.estado!=='Baja').forEach(eq=>{
    const tl=buildTimeline(eq); if(!tl) return;
    const hoyM=cumAt(tl,today,'motor'), hoyB=cumAt(tl,today,'bomba');   // horas proyectadas a hoy
    const depAnchors={};   // planes-dependencia PENDIENTES (firme/planificado) ya colocados, p.ej. ALFA_ZERO → para anclar sus dependientes
    PLANES.forEach(plan=>{
      if(plan.fuente==='calendario' || plan.fuente==='pads'){ eventoFechaOPads(out,eq,plan,today); return; }   // planes por tiempo/pads: proyección por fecha, no por horas
      const hoyH=plan.fuente==='motor'?hoyM:hoyB;
      // Dependiente (Alfa) cuyo plan-padre (Alfa Zero) está PENDIENTE → cadena anclada en cuándo se hará el padre (proyección)
      if(plan.dependeDe && depAnchors[plan.dependeDe]){ familiaAlfaPendiente(out,eq,plan,tl,depAnchors[plan.dependeDe],hoyH,today); return; }
      const currentH=plan.fuente==='motor'?Number(tl.base.horasMotor):Number(tl.base.horasBomba);
      const nd=nextDueHours(plan,eq,currentH);
      if(nd==null) return;                       // única vez ya ejecutada → no aparece
      // SOLO el próximo ciclo pendiente. Los siguientes dependen de CUÁNDO se ejecute éste (la cadena se corre).
      const base=lastExecHours(eq.id,plan.key,plan.fuente);   // anclaje del ciclo (último mantenimiento registrado)
      const cross=findCrossDate(tl,plan.fuente,nd);
      let it;
      if(cross.beyond){
        it={equipo:eq,plan,horas:nd,hoy:Math.round(hoyH),horasRestantes:Math.round(nd-hoyH),date:null,beyond:true,vencido:false,diasRestantes:null,estado:'neutral',base};
      } else {
        const dr=daysBetween(today,cross.date), vencido=!!cross.vencido||dr<0;
        it={equipo:eq,plan,horas:nd,hoy:Math.round(hoyH),horasRestantes:Math.round(nd-hoyH),date:cross.date,beyond:false,vencido,diasRestantes:dr,estado:statusOf({date:cross.date,vencido}),base};
      }
      it.teorico=hitoTeorico(plan,nd);   // TEÓRICO = hito nominal del plan; el ciclo real "debería" = it.horas=nd
      it.rec=planRecomendacion(tl,it); upgradeRec(it,today); aplicarPlanificado(it);
      if(plan.hacerEnPad && !it.manual) it.durantePad=true;
      // si la fecha de acción (manual o sugerida) es POSTERIOR al cruce, calcular cuántas horas estará vencido
      if(it.accionFecha){
        const hAcc=cumAt(tl,it.accionFecha,plan.fuente);
        it.horasReal=Math.round(hAcc);                    // horas reales a las que se hará (en la parada)
        it.excedente=Math.round(hAcc-nd);                 // >0 = operará pasado del ciclo esas horas al ejecutarse
        if(venceFuera(it)){ it.rec.cls='rojo'; }          // se pasará MÁS que la tolerancia → "se hará vencido" (rojo). Dentro de tolerancia = aceptable (el semáforo por días sigue mandando)
      }
      out.push(it);
      // Plan-única PENDIENTE (ej. Alfa Zero firme/planificado) → queda como anclaje para sus dependientes (Alfa)
      if(plan.tipo==='unica' && it.accionFecha && !it.beyond) depAnchors[plan.key]=it;
      // Ciclos FUTUROS proyectados (solo repetitivos): se anclan en CUÁNDO se hace realmente el ciclo previo.
      // Ej.: si el Alfa 1500 se adelanta y se hace a 1300, el siguiente cae a 1800 (1300+500). Se recalcula con los datos reales.
      if(plan.tipo==='repetitivo' && it.accionFecha && !it.beyond) proyectarCiclos(out,eq,plan,tl,it,hoyH,today);
    });
  });
  // orden por CUÁNDO SE VENCE: lo ya vencido hace más tiempo / lo más próximo primero → lo último al final
  const key=x=> x.date || x.accionFecha || '9999-99-99';
  return out.sort((a,b)=>{ const ka=key(a),kb=key(b); if(ka!==kb) return ka<kb?-1:1; return a.equipo.nombre<b.equipo.nombre?-1:1; });
}
function filteredEvents(){
  let evs=planEvents();
  if(!VERPROY) evs=evs.filter(e=>!e.proyeccion);
  if(DFILTER.estado==='vencidos') evs=evs.filter(e=>e.vencido);
  else if(DFILTER.estado==='rojo') evs=evs.filter(e=>e.estado==='rojo');
  else if(DFILTER.estado==='amarillo') evs=evs.filter(e=>e.estado==='amarillo');
  else if(DFILTER.estado==='verde') evs=evs.filter(e=>e.estado==='verde');
  if(DFILTER.equipo!=='todos') evs=evs.filter(e=>e.equipo.id===DFILTER.equipo);
  if(DFILTER.comp!=='todos') evs=evs.filter(e=>e.plan.componente===DFILTER.comp);
  if(DFILTER.hasta) evs=evs.filter(e=> e.vencido || (e.date && e.date<=DFILTER.hasta));  // fecha vacía = todas
  return evs;
}
