function ganttHoy(){ const w=document.querySelector('#main .gantt-wrap'); if(w&&GANTT._todayOff!=null) w.scrollLeft=GANTT._todayOff; }

/* ============================================================
   AGRUPACIÓN INTELIGENTE
   ============================================================ */
// ---- Ventanas SIN operación (huecos entre pads) de un equipo, desde hoy hasta el horizonte ----
function idleWindows(eqId){
  const today=todayISO();
  const horizonEnd=toISO(addDays(parseD(today),DB.params.horizonteDias||1095));
  // intervalos operativos (asignaciones) recortados a [hoy, horizonte], ordenados
  let ops=asignacionesForEquipo(eqId).map(a=>({desde:a.desde,hasta:a.hasta}))
    .filter(o=>o.hasta>=today)
    .map(o=>({desde:o.desde<today?today:o.desde,hasta:o.hasta>horizonEnd?horizonEnd:o.hasta}))
    .sort((a,b)=>a.desde<b.desde?-1:1);
  // fusionar solapados/contiguos
  const merged=[];
  ops.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.desde<=toISO(addDays(parseD(last.hasta),1))){ if(o.hasta>last.hasta) last.hasta=o.hasta; } else merged.push({...o}); });
  if(!merged.length) return [{desde:today,hasta:horizonEnd,abierta:true}];   // sin pads → todo libre
  // huecos entre operaciones
  const gaps=[]; let cursor=today;
  merged.forEach(o=>{ if(o.desde>cursor){ gaps.push({desde:cursor,hasta:toISO(addDays(parseD(o.desde),-1))}); } if(o.hasta>=cursor) cursor=toISO(addDays(parseD(o.hasta),1)); });
  if(cursor<horizonEnd) gaps.push({desde:cursor,hasta:horizonEnd,abierta:true});  // cola libre tras el último pad
  return gaps.filter(g=>g.hasta>=g.desde);
}
// Ventana libre recomendada para ejecutar un mantenimiento cuya fecha proyectada es D
function recommendWindow(eqId,D){
  const gaps=idleWindows(eqId); if(!gaps.length) return null;
  let g=gaps.find(g=> D>=g.desde && D<=g.hasta);                 // ¿el mant cae dentro de una ventana libre?
  if(g) return {win:g,rel:'durante',dist:0};
  let best=null,bestDist=Infinity,rel='';
  gaps.forEach(g=>{
    if(g.hasta<D){ const d=daysBetween(g.hasta,D); if(d<bestDist){bestDist=d;best=g;rel='antes';} }      // hueco previo → preventivo
    else if(g.desde>D){ const d=daysBetween(D,g.desde); if(d<bestDist){bestDist=d;best=g;rel='despues';} } // hueco posterior → leve excedente
  });
  return best?{win:best,rel,dist:bestDist}:null;
}
function computeGroups(){
  const win=DB.params.ventanaAgrupacionDias||10;
  const maints=allProjectedMaints();
  // agrupar por componente (mismo recurso/cuadrilla) en ventana temporal
  const byComp={};
  maints.forEach(m=>{ (byComp[m.plan.componente]=byComp[m.plan.componente]||[]).push(m); });
  const groups=[];
  Object.entries(byComp).forEach(([comp,arr])=>{
    arr.sort((a,b)=>a.date<b.date?-1:1);
    let i=0;
    while(i<arr.length){
      const cluster=[arr[i]]; let j=i+1;
      while(j<arr.length && daysBetween(arr[i].date,arr[j].date)<=win){ cluster.push(arr[j]); j++; }
      if(cluster.length>=2){
        groups.push({componente:comp,items:cluster,from:cluster[0].date,to:cluster[cluster.length-1].date,
          evitadas:cluster.length-1});
      }
      i=j>i+1?j:i+1;
    }
  });
  return groups.sort((a,b)=>b.evitadas-a.evitadas);
}
// Tramos contiguos de operación (runs) a partir del timeline
function operatingRuns(tl){
  const runs=[]; let cur=null;
  tl.days.forEach(d=>{ if(d.pad){ if(!cur) cur={start:d.date,end:d.date,pad:d.pad}; else cur.end=d.date; } else if(cur){ runs.push(cur); cur=null; } });
  if(cur) runs.push(cur);
  return runs;
}
// Horas acumuladas de una fuente a una fecha dada
function cumAt(tl,iso,fuente){
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  let last=tl.days[0][key];
  for(const d of tl.days){ if(d.date>iso) break; last=d[key]; }
  return last;
}
// Fecha de ACCIÓN recomendada (distinta del cruce). Usa TOLERANCIA: el primer pad en cuyo final
// el equipo queda a <= tolerancia del umbral (lo cruce o no) es donde hay que actuar.
function ventanaTxt(desde,hasta){
  if(desde&&hasta) return desde===hasta?`el ${fmtDM(desde)}`:`entre ${fmtDM(desde)} y ${fmtDM(hasta)}`;
  if(desde) return `desde el ${fmtDM(desde)}`;
  return '';
}
function planRecomendacion(tl,m){
  const hoy=todayISO();
  const runs=operatingRuns(tl);
  if(!runs.length) return m.vencido?{tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible'}:{tipo:'futuro',fecha:null,cls:'neutral',txt:'Sin pads cargados para este equipo'};
  const asap0=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };
  if(m.vencido){
    // si el equipo está operando hoy, no se puede frenar: se hace al terminar el pad en curso (se agrupa con los demás)
    const rHoy=runs.find(r=> hoy>=r.start && hoy<=r.end);
    if(rHoy){
      const nx=runs[runs.indexOf(rHoy)+1];
      const w={desde:toISO(addDays(parseD(rHoy.end),1)), hasta: nx?toISO(addDays(parseD(nx.start),-1)):null};
      const f=asap0(w);
      return {tipo:'postpad',...w,fecha:f,pad:rHoy.pad,cls:'rojo',txt:`Vencido · hacer al terminar ${rHoy.pad} (~${fmtDM(f)})`};
    }
    return {tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible (equipo parado)'};
  }
  const nd=m.horas, fuente=m.plan.fuente;
  // PAD donde REALMENTE se cruza el umbral (no donde está "cerca"): primer run cuyo fin alcanza nd
  let idx=-1;
  for(let k=0;k<runs.length;k++){ if(cumAt(tl,runs[k].end,fuente) >= nd){ idx=k; break; } }
  if(idx<0){                                                                 // ningún pad cargado llega a cruzarlo
    const last=runs[runs.length-1], lleg=cumAt(tl,last.end,fuente), faltan=Math.round(nd-lleg);
    return {tipo:'lejano',fecha:null,cls:'neutral',faltan,txt:`Con los pads cargados llega a ${num(lleg)}h (faltan ~${num(faltan)}h al ${fmtDM(last.end)}). Cargá el próximo pad para precisar.`};
  }
  const R=runs[idx], prev=runs[idx-1], next=runs[idx+1];
  const ongoing=R.start<=hoy;
  const gapBefore={desde: prev?toISO(addDays(parseD(prev.end),1)):hoy, hasta: toISO(addDays(parseD(R.start),-1))};
  const gapAfter ={desde: toISO(addDays(parseD(R.end),1)), hasta: next?toISO(addDays(parseD(next.start),-1)):null};
  const asap=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };  // lo antes posible = 2 días tras el pad previo
  if(ongoing){   // cruza operando dentro del pad en curso → no se puede frenar, se hace al terminarlo
    const w=gapAfter; return {tipo:'postpad',...w,fecha:asap(w),pad:R.pad,cls:'rojo',txt:`Cruza operando en ${R.pad} (en curso) · hacer al terminar (~${fmtDM(asap(w))})`};
  }
  // cruza en un pad FUTURO → hacerlo en la parada PREVIA a ese pad (lo antes posible en ese hueco)
  const w=gapBefore;
  return {tipo:'prepad',...w,fecha:asap(w),pad:R.pad,cls:'amarillo',txt:`Cruza en ${R.pad} · hacer en la parada previa (~${fmtDM(asap(w))})`};
}
// Ventanas SIN operación (entre pads) a nivel flota — TODAS, aunque estén vacías
function fleetGaps(){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=DB.pads.map(p=>({d:p.fechaInicio,h:p.fechaFin})).filter(x=>x.d&&x.h&&x.h>=hoy).sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});  // hueco antes del 1er pad
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,14);
}
// ¿El equipo está OPERANDO (dentro de un pad propio) esa fecha?
function equipoOperando(eqId,iso){
  return DB.pads.some(p=>(p.asignaciones||[]).some(a=>a.equipoId===eqId && a.desde && a.hasta && iso>=a.desde && iso<=a.hasta));
}
// Ventanas en las que ESTE equipo NO opera (paradas propias) = complemento de sus pads. Puede haber paradas
// para un equipo mientras otros operan. Son las únicas ventanas válidas para mover/fijar su mantenimiento.
function equipoGaps(eqId){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=[];
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId && a.desde && a.hasta && a.hasta>=hoy) ivs.push({d:a.desde,h:a.hasta}); }));
  ivs.sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,30);
}
// "Lo antes posible" dentro de una ventana = 2 días después de que arranca (o desde hoy)
function asapEnVentana(g){ let f=toISO(addDays(parseD(g.desde),1)); if(f<todayISO())f=todayISO(); if(g.hasta&&f>g.hasta)f=g.hasta; return f; }
// Paradas para MOSTRAR = ventanas de flota (todas, incl. vacías) + ventanas individuales donde caiga un mant. (equipo libre mientras otros operan)
function computeParadas(){
  const items=planEvents().filter(e=>e.accionFecha && (VERPROY||!e.proyeccion));
  const wins=fleetGaps().map(g=>({desde:g.desde,hasta:g.hasta,abierta:g.abierta,individual:false,items:[]}));
  items.forEach(it=>{
    let w=wins.find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta && !g.individual);
    if(!w){   // cae fuera de las ventanas de flota → ventana individual del equipo (libre mientras otros operan)
      const eg=equipoGaps(it.equipo.id).find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta);
      const desde=eg?eg.desde:it.accionFecha, hasta=eg?eg.hasta:it.accionFecha, ab=eg?eg.abierta:false;
      w=wins.find(g=>g.individual && g.desde===desde && g.hasta===hasta);
      if(!w){ w={desde,hasta,abierta:ab,individual:true,items:[]}; wins.push(w); }
    }
    w.items.push(it);
  });
  wins.sort((a,b)=> a.desde<b.desde?-1:(a.desde>b.desde?1:0));
  return wins;
}
// Mover un mantenimiento a la parada PROPIA del equipo anterior (-1) o siguiente (+1). Salta solo las ventanas
// donde el equipo opera (no son válidas), así no hay que pasar por ellas.
function moverParada(eqId,planKey,horas,dir){
  const wins=equipoGaps(eqId);
  if(!wins.length){ toast('Este equipo no tiene paradas (cargá pads).','warn'); return; }
  const item=planEvents().find(e=>e.equipo.id===eqId&&e.plan.key===planKey&&e.horas===horas);
  const cur=item&&item.accionFecha;
  let gi=wins.findIndex(g=> cur&&cur>=g.desde&&cur<=g.hasta);
  if(gi<0){ // la fecha actual no cae en una parada propia (p.ej. está operando): arranco del borde según la dirección
    if(cur){ gi = dir>0 ? wins.reduce((acc,g,i)=> g.desde<=cur?i:acc, -1) : wins.findIndex(g=>g.desde>=cur); if(dir<0&&gi<0) gi=wins.length; }
    else gi = dir>0?-1:wins.length;
  }
  const t=wins[gi+dir];
  if(!t){ toast('No hay parada '+(dir<0?'anterior':'siguiente')+' para este equipo','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
// Saltar directo a una parada concreta del equipo (por índice de equipoGaps) — permite saltar varias ventanas de una
function moverParadaA(eqId,planKey,horas,idx){
  const wins=equipoGaps(eqId); const t=wins[idx];
  if(!t){ toast('Parada no válida','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
function fijarEnVentana(eqId,planKey,horas,g){
  const f=asapEnVentana(g);
  DB.planificado[planKeyOf(eqId,planKey,horas)]=f;
  audit('Mover a parada',`${eqName(eqId)} ${PLAN(planKey)?.nombre} → ${f}`);
  saveDB(); route(CURRENT);
}
// Selector "Mover a…": lista las paradas PROPIAS del equipo (donde NO opera) para saltar directo a cualquiera
function selectorMover(m){
  const wins=equipoGaps(m.equipo.id);
  const cur=m.accionFecha;
  const opts=wins.map((g,i)=>{ const sel=cur&&cur>=g.desde&&cur<=g.hasta?'selected':''; const lbl=`${fmtDShort(g.desde)} ${g.abierta?'→ adelante':'→ '+fmtDShort(g.hasta)}`; return `<option value="${i}" ${sel}>${lbl}</option>`; }).join('');
  return `<select class="mini-select" title="Saltar a otra parada del equipo (solo donde está parado)" onchange="moverParadaA('${m.equipo.id}','${m.plan.key}',${m.horas},Number(this.value))"><option value="" disabled ${cur?'':'selected'}>Mover a…</option>${opts}</select>`;
}
function renderAgrupacion(){
  const gaps=computeParadas();
  const sched=gaps.flatMap(g=>g.items).filter(x=>!x.proyeccion);
  const proyN=gaps.flatMap(g=>g.items).filter(x=>x.proyeccion).length;

  let html=`<div class="section-head"><h1>Agrupación inteligente</h1><div class="desc">Cada ventana sin operación es una "parada". Los mantenimientos se ubican en su parada; movélos con « / » o el selector para reorganizar</div>
    <div class="sp"></div><button class="btn ghost sm" onclick="reagruparManual()" title="Borra todas tus fechas fijadas/movidas y recalcula la agrupación automática">Reagrupar todo</button><label class="row" style="gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" ${VERPROY?'checked':''} onchange="VERPROY=this.checked;renderAgrupacion()"> Ver ciclos futuros (proyección)</label></div>`;
  html+=`<div class="help"><span class="ic">ℹ</span><div><b>Criterio:</b> se muestran <b>todas las paradas</b>, aunque estén vacías. Una parada vale para un equipo solo si <b>ese día NO está operando</b>. Con <b>« / »</b> lo movés a la parada anterior/siguiente del equipo (salta sola las ventanas donde opera); con <b>Mover a…</b> saltás directo a cualquiera; con <b>fijar fecha</b> ponés una fecha exacta (da error si cae mientras opera). Los <b>ciclos futuros</b> aparecen como referencia y se recalculan al cargar datos reales.</div></div>`;
  html+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px">
    <div class="kpi red"><div class="accent"></div><div class="lbl">Vencidos (hacer ya)</div><div class="val mono">${vencidos.length}</div></div>
    <div class="kpi amber"><div class="accent"></div><div class="lbl">A programar en parada</div><div class="val mono">${sched.length}</div></div>
    <div class="kpi"><div class="accent"></div><div class="lbl">Paradas</div><div class="val mono">${gaps.length}</div></div>
    <div class="kpi green"><div class="accent"></div><div class="lbl">Paradas conjuntas</div><div class="val mono">${conjuntas}</div><div class="sub">≥2 equipos juntos</div></div>
    ${VERPROY?`<div class="kpi"><div class="accent"></div><div class="lbl">Ciclos proyectados</div><div class="val mono">${proyN}</div><div class="sub">referencia</div></div>`:''}</div>`;

  if(vencidos.length){
    html+=`<div class="card" style="margin-bottom:16px;border-color:#5a1f22"><h3 style="color:#ff7378">Vencidos — requieren acción <span class="sub">${vencidos.length} · ya cruzaron las horas</span></h3>
      <div class="table-wrap" style="border:none"><table><thead><tr><th>Equipo</th><th>Plan</th><th>Comp.</th><th class="right">A las (h)</th><th>Cuándo hacerlo</th></tr></thead><tbody>`;
    vencidos.forEach(m=>{ html+=`<tr><td><b>${esc(m.equipo.nombre)}</b></td><td><span class="tag">${m.plan.nombre}</span></td><td class="muted">${m.plan.componente}</td><td class="right mono">${num(m.horas)}</td>
      <td class="small">${m.manual?'[Fijado] ':''}${esc(m.rec.txt)} <span class="linklike" style="font-size:10px" onclick="planificarMant('${m.equipo.id}','${m.plan.key}',${m.horas})">${m.manual?'(cambiar)':'(fijar)'}</span></td></tr>`; });
    html+=`</tbody></table></div></div>`;
  }

  html+=`<h3 style="font-size:14px;margin:6px 0 12px">Paradas <span class="muted small">— las vacías sirven para mover mantenimientos ahí</span></h3>`;
  if(!gaps.length) html+=`<div class="empty"><span class="ic"></span>No hay ventanas entre pads. Cargá pads para generar paradas.</div>`;
  gaps.forEach(g=>{
    const c=g.items;
    const firmes=c.filter(x=>!x.proyeccion);
    const eqs=new Set(firmes.map(x=>x.equipo.id)).size;
    const conjunta=eqs>=2;
    const titulo=`Parada ${fmtDShort(g.desde)} ${g.abierta?'en adelante':'→ '+fmtDShort(g.hasta)}`;
    const indiv=g.individual?` <span class="tag" style="background:#3a2b14;color:#e6b860;border-color:#5a4a1f">individual — otros equipos operando</span>`:'';
    html+=`<div class="card" style="margin-bottom:14px${c.length?'':';opacity:.7;border-style:dashed'}"><h3>${titulo}${indiv} <span class="sub">${c.length?c.length+' mant. · '+eqs+' equipo(s)':'vacía — disponible'}</span></h3>`;
    if(!c.length){ html+=`<div class="muted small">Sin mantenimientos. Podés mover acá con « / » o "Mover a…" desde otras paradas.</div></div>`; return; }
    if(conjunta) html+=`<div style="background:#0e2a1f;border:1px solid #15543b;border-radius:8px;padding:10px 14px;margin-bottom:12px;color:#7fe0b5;font-size:13px"> <b>Conviene hacerlos en una sola parada.</b> ${eqs} equipos coinciden en esta ventana → ${eqs-1} movilización(es) menos.</div>`;
    html+=`<div class="table-wrap" style="border:none"><table><thead><tr><th>Equipo</th><th>Plan</th><th>Comp.</th><th class="right">A las (h)</th><th>Cuándo se cumple</th><th>Acción / fecha</th><th class="center">Mover</th></tr></thead><tbody>`;
    c.forEach(m=>{
      const cumple = m.vencido?'<span style="color:var(--red)">vencido</span>' : (m.date?fmtDShort(m.date):'<span class="muted">s/fecha exacta</span>');
      const venceTxt = m.excedente>0?` <b style="color:var(--red)">· se ejecutará VENCIDO por ~${num(m.excedente)} h (ciclo ${num(m.plan.intervalo)}h)</b>`:'';
      if(m.proyeccion){   // ciclo futuro: referencia, sin controles (se recalcula solo)
        html+=`<tr style="opacity:.6"><td><b>${esc(m.equipo.nombre)}</b></td><td><span class="tag" style="background:#1a2336;color:#9fb0d8">${m.plan.nombre}</span> <span class="tag" style="font-size:9px;background:#222c42;color:#7f8db0">proyección</span></td><td class="muted small">${m.plan.componente} ${m.plan.fuente==='motor'?'Mot.':'Bba.'}</td>
          <td class="right mono">${num(m.horas)}</td><td class="mono small">${cumple}</td>
          <td class="small muted">Ciclo futuro (referencia) · se hará a ~${num(m.horasReal)} h${venceTxt}</td><td class="center muted small">—</td></tr>`;
        return;
      }
      const mv=`<span class="iconbtn" style="height:22px;min-width:22px;padding:0 7px" title="Parada anterior del equipo" onclick="moverParada('${m.equipo.id}','${m.plan.key}',${m.horas},-1)">«</span> <span class="iconbtn" style="height:22px;min-width:22px;padding:0 7px" title="Parada siguiente del equipo" onclick="moverParada('${m.equipo.id}','${m.plan.key}',${m.horas},1)">»</span> ${selectorMover(m)}`;
      html+=`<tr><td><b>${esc(m.equipo.nombre)}</b></td><td><span class="tag">${m.plan.nombre}</span></td><td class="muted small">${m.plan.componente} ${m.plan.fuente==='motor'?'Mot.':'Bba.'}</td>
        <td class="right mono">${num(m.horas)}</td><td class="mono small">${cumple}</td>
        <td class="small">${m.manual?'[Fijado] ':''}${esc(m.rec.txt)}${venceTxt} <span class="linklike" style="font-size:10px" onclick="planificarMant('${m.equipo.id}','${m.plan.key}',${m.horas})">${m.manual?'(cambiar fecha)':'(fijar fecha)'}</span></td>
        <td class="center" style="white-space:nowrap">${mv}</td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  M.innerHTML=html;
}

/* ============================================================
   ANALÍTICA
   ============================================================ */
function renderAnalitica(){
  const maints=allProjectedMaints();
  const venc=maints.filter(m=>m.vencido).length;
  const prox=maints.filter(m=>!m.vencido&&m.diasRestantes<=60).length;
  const g=WEB_LITE?{}:leadStatsGlobal(); const cob=WEB_LITE?{}:coberturaStock();
  // carga de trabajo por mes
  const carga={};
  maints.forEach(m=>{ const k=m.date.slice(0,7); carga[k]=(carga[k]||0)+1; });
  const months=Object.keys(carga).sort().slice(0,12);
  const maxc=Math.max(1,...months.map(k=>carga[k]));
  // consumo proyectado por componente (h-intervención)
  let html=`<div class="section-head"><h1>Analítica de gestión</h1><div class="sp"></div><button class="btn ghost" onclick="window.print()">Exportar PDF</button></div>`;
  html+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:18px">
    <div class="kpi red"><div class="accent"></div><div class="lbl">Mant. vencidos</div><div class="val">${venc}</div></div>
    <div class="kpi amber"><div class="accent"></div><div class="lbl">Próximos 60 d</div><div class="val">${prox}</div></div>
    ${WEB_LITE?'':`<div class="kpi"><div class="accent"></div><div class="lbl">Lead time prom.</div><div class="val mono">${g.avg}<small>d</small></div></div>
    <div class="kpi ${g.cumpl>=85?'green':'amber'}"><div class="accent"></div><div class="lbl">Cumpl. órdenes</div><div class="val mono">${g.cumpl??'—'}<small>%</small></div></div>
    <div class="kpi ${cob.cls}"><div class="accent"></div><div class="lbl">Cobertura stock</div><div class="val mono">${cob.pct}<small>%</small></div></div>`}</div>`;
  // gráfico carga futura
  html+=`<div class="card" style="margin-bottom:16px"><h3>Carga de trabajo futura <span class="sub">mantenimientos por mes</span></h3>`;
  if(!months.length) html+=`<div class="muted small">Sin datos.</div>`;
  else{ html+=`<div class="minigraph" style="height:160px;align-items:flex-end;gap:10px">`;
    months.forEach(k=>{ const h=carga[k]/maxc*140+8; const [yy,mm]=k.split('-'); html+=`<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:1"><b class="mono small">${carga[k]}</b><i style="width:100%;height:${h}px;background:linear-gradient(180deg,var(--primary-glow),var(--primary-deep))"></i><span class="muted" style="font-size:10px">${mm}/${yy.slice(2)}</span></div>`; });
    html+=`</div>`; }
  html+=`</div>`;
  // tabla consumo proyectado por componente
  const comp={};
  maints.filter(m=>m.diasRestantes<=365).forEach(m=>{ comp[m.plan.componente]=(comp[m.plan.componente]||0)+1; });
  html+=`<div class="row"><div class="card" style="flex:1;min-width:300px"><h3>Intervenciones por componente <span class="sub">12 meses</span></h3>
    <div class="table-wrap" style="border:none"><table><thead><tr><th>Componente</th><th class="right">Intervenciones</th></tr></thead><tbody>`;
  Object.entries(comp).sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>html+=`<tr><td>${c}</td><td class="right mono">${n}</td></tr>`);
  if(!Object.keys(comp).length)html+=`<tr><td colspan="2" class="muted">Sin datos.</td></tr>`;
  html+=`</tbody></table></div></div>`;
  // consumo proyectado top productos (oculto en versión web acotada)
  if(!WEB_LITE){
    const dem=demandaAnualProductos();
    const top=Object.entries(dem).sort((a,b)=>b[1]-a[1]).slice(0,10);
    html+=`<div class="card" style="flex:1;min-width:300px"><h3>Consumo proyectado de materiales <span class="sub">top 10 · 12 meses</span></h3>
      <div class="table-wrap" style="border:none"><table><thead><tr><th>Producto</th><th class="right">Demanda</th></tr></thead><tbody>`;
    top.forEach(([pid,q])=>{ const p=prodById(pid); html+=`<tr><td><span class="mono small" style="color:#9fb0d8">${esc(p?.refInterna||'?')}</span> ${esc(p?.descripcion||'')}</td><td class="right mono">${num(q)}</td></tr>`; });
    if(!top.length)html+=`<tr><td colspan="2" class="muted">Sin demanda proyectada.</td></tr>`;
    html+=`</tbody></table></div></div>`;
  }
  html+=`</div>`;
  M.innerHTML=html;
}

function renderRespaldo(){
  let html=`<div class="section-head"><h1>Respaldo y restauración</h1><div class="desc">Copia de seguridad de toda la base de datos</div></div>`;
  html+=`<div class="help"><span class="ic"></span><div>Sus datos se guardan localmente en este equipo/navegador. Realice respaldos periódicos al archivo <b>.qmdb</b> y guárdelos en OneDrive.</div></div>`;
  html+=`<div class="row"><div class="card" style="flex:1;min-width:280px"><h3>Exportar copia</h3>
    <p class="muted small" style="margin-bottom:14px">Descarga un archivo con equipos, lecturas, pads, mantenimientos, materiales, órdenes y configuración.</p>
    <button class="btn green" onclick="backupExport()">Descargar respaldo (.qmdb)</button></div>
    <div class="card" style="flex:1;min-width:280px"><h3>Restaurar copia</h3>
    <p class="muted small" style="margin-bottom:14px">Reemplaza TODOS los datos actuales por los del archivo seleccionado.</p>
    <input type="file" id="impfile" accept=".qmdb,.json" style="display:none" onchange="backupImport(this)">
    <button class="btn ghost" onclick="document.getElementById('impfile').click()">Seleccionar archivo…</button></div></div>`;
  html+=`<div class="card" style="margin-top:14px"><h3>Reiniciar</h3>
    <p class="muted small" style="margin-bottom:14px">Borra todos los datos y restaura los de ejemplo.</p>
    <button class="btn danger" onclick="resetDB()">Restaurar datos de fábrica</button></div>`;
  const counts=`Equipos: ${DB.equipos.length} · Lecturas: ${DB.lecturas.length} · Pads: ${DB.pads.length} · Mant.: ${DB.mantenimientos.length} · Productos: ${DB.productos.length} · Órdenes: ${DB.ordenes.length}`;
  html+=`<div class="muted small" style="margin-top:18px">${counts}</div>`;
  M.innerHTML=html;
}
function backupExport(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`QM-Planificador_${todayISO()}.qmdb`; a.click(); toast('Respaldo descargado');
}
function backupImport(input){
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.equipos)throw 0; DB=d; migrate(); saveDB(); toast('Datos restaurados'); route('dashboard'); }catch(e){ toast('Archivo inválido','err'); } };
  r.readAsText(f);
}
function resetDB(){ if(!confirm('¿Borrar todo y restaurar datos de ejemplo?'))return; DB=seed(); saveDB(); toast('Datos restaurados','warn'); route('dashboard'); }

/* ============================================================
   EXPORTACIÓN CSV (Excel)
   ============================================================ */
function dl(name,rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); toast('Excel (CSV) exportado');
}
function exportCSV(what){
  if(what==='lecturas') dl('lecturas.csv',[['Fecha','Equipo','Horas Motor','Horas Bomba','Observaciones'],...DB.lecturas.map(l=>[l.fecha,eqName(l.equipoId),l.horasMotor,l.horasBomba,l.obs])]);
  if(what==='pads') dl('pads.csv',[['Pad','Cliente','Inicio','Fin','Equipo','Trabajó desde','Trabajó hasta'],...DB.pads.flatMap(p=>(p.asignaciones||[]).length?(p.asignaciones).map(a=>[p.nombre,p.cliente,p.fechaInicio,p.fechaFin,eqName(a.equipoId),a.desde,a.hasta]):[[p.nombre,p.cliente,p.fechaInicio,p.fechaFin,'—','','']])]);
  if(what==='mantenimientos') dl('mantenimientos.csv',[['Fecha','Equipo','Plan','Horas Motor','Horas Bomba','Responsable','Obs'],...DB.mantenimientos.map(m=>[m.fecha,eqName(m.equipoId),PLAN(m.plan)?.nombre,m.horasMotor,m.horasBomba,m.responsable,m.obs])]);
  if(what==='ordenes') dl('ordenes.csv',[['Lanzamiento','Plan','Para (h)','Equipo','Cantidad','Comprometida','Recepcion'],...DB.ordenes.map(o=>[o.fechaLanzamiento,PLAN(o.plan)?.nombre,o.horas||'',o.equipoId?eqName(o.equipoId):'',o.cantidad,o.fechaComprometida,o.fechaRecepcion])]);
  if(what==='eventos'){ const evs=filteredEvents(); dl('mantenimientos_proyectados.csv',[['Equipo','Plan','Componente','Fuente','Hoy h','Objetivo h','Restan h','Cruce','Accion recomendada','Fecha accion','Dias','Estado','Vencido'],...evs.map(e=>[e.equipo.nombre,e.plan.nombre,e.plan.componente,e.plan.fuente,e.hoy,e.horas,e.vencido?'':e.horasRestantes,e.vencido?'VENCIDO':(e.date||''),e.rec?e.rec.txt:'',e.rec?(e.rec.fecha||''):'',e.diasRestantes,estadoLabel(e.estado),e.vencido?'SI':'NO'])]); }
  if(what==='stock'){ const a=stockAnalysis(); dl('stock.csv',[['Referencia interna','Descripcion','Part Number','Stock','Demanda/año','LeadTime','StockSeg','ROP','EOQ','AFabricar'],...a.map(x=>[x.p.refInterna,x.p.descripcion,x.p.partNumber||'',x.stockActual,x.D,x.LT,x.SS,x.ROP,x.EOQ,x.aPedir])]); }
}

  const lo=document.querySelector('button[onclick="logout()"]'); if(lo) lo.style.display='none';
  buildNav(); route('dashboard');
} else {
  // si ya hubo sesión en esta pestaña, no re-mostrar login innecesariamente (simple)
  document.getElementById('lg-user').focus();
}
</script>
</body>
</html>
