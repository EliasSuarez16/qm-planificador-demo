async function compImportFile(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  try{
    if(/\.xlsx$/i.test(f.name)){ const rows=await _impXlsx(f); document.getElementById('cimp-txt').value=rows.map(r=>r.map(c=>String(c==null?'':c)).join('\t')).join('\n'); }
    else { document.getElementById('cimp-txt').value=await f.text(); }
    compImportAnalizar();
  }catch(e){ toast('No pude leer el archivo ('+e.message+'). Copiá las celdas en Excel y pegalas.','err'); }
}
function _compImpMap(rows){
  if(!rows.length) return {items:[],hadHeader:false};
  const width=Math.max(...rows.map(r=>r.length));
  let lead=0; for(let c=0;c<width;c++){ if(rows.every(r=>!((r[c]||'').trim()))) lead++; else break; }   // saltar columnas iniciales vacías (ej: datos que empiezan en la columna B del Excel)
  const h0=rows[0].map(x=>(x||'').trim().toLowerCase());
  // Encabezado ESTRICTO: la celda debe SER una etiqueta de columna (no un dato). Evita que "Prometheus 1" o un SN se tomen como título.
  const reSN=/^(sn|serial(\s*number|es)?|n[º°]?\s*de?\s*serie)$/, rePN=/^(pn|part\s*(number|n[º°]?)|nro?\s*de?\s*parte)$/, reD=/^descrip\w*$/, reEqHead=/^(equipo|fracturador)$/;
  const nLabels=h0.filter(c=>reSN.test(c)||rePN.test(c)||reD.test(c)||reEqHead.test(c)).length;
  const looksHeader = nLabels>=2;
  let idx={sn:lead,pn:lead+1,desc:lead+2,eq:lead+3}, start=0;
  if(looksHeader){ start=1; const find=re=>h0.findIndex(c=>re.test(c));
    const iSN=find(reSN), iPN=find(rePN), iD=find(reD), iE=find(reEqHead);
    idx={sn:iSN>=0?iSN:lead, pn:iPN>=0?iPN:lead+1, desc:iD>=0?iD:lead+2, eq:iE>=0?iE:lead+3};
  }
  const items=rows.slice(start).map(r=>({sn:(r[idx.sn]||'').trim(), pn:(r[idx.pn]||'').trim(), desc:(r[idx.desc]||'').trim(), equipoTxt:(r[idx.eq]||'').trim()})).filter(it=>it.sn||it.pn||it.desc||it.equipoTxt);
  return {items,hadHeader:looksHeader};
}
function compImportAnalizar(){
  const rows=_impParseText(val('cimp-txt'));
  const {items}=_compImpMap(rows);
  COMPIMP_PARSED=items;
  const prev=document.getElementById('cimp-prev'); if(!prev) return;
  if(!items.length){ prev.innerHTML=`<div class="muted small" style="color:#ff8a8e">No se detectaron filas. Revisá que sean columnas SN · PN · Descripción · Equipo.</div>`; return; }
  const catId=COMPIMP_CAT;
  const rowsHtml=items.map(it=>{
    const existe=DB.componentes.find(k=>k.categoriaId===catId && (k.sn||'').toLowerCase()===(it.sn||'').toLowerCase());
    const res=compResolveEquipo(it.equipoTxt);
    const acc = !it.sn ? `<span class="tag" style="font-size:9px;background:#241213;color:#ff8a8e;border-color:#5a2a2c">sin SN — se ignora</span>`
      : existe ? `<span class="tag" style="font-size:9px">actualiza${(existe.equipoId||'')!==(res.id==null?existe.equipoId||'':res.id)?' · reasigna':''}</span>`
      : `<span class="tag" style="font-size:9px;background:#241a2e;color:#caa8e0;border-color:#4a3a5f">nuevo</span>`;
    const eqLbl = res.found ? esc(res.label) : `<span style="color:#e6b860">${esc(res.label)}</span>`;
    return `<tr><td class="mono small">${esc(it.sn||'—')}</td><td class="mono small">${esc(it.pn||'—')}</td><td class="small">${esc(it.desc||'—')}</td><td class="small">${eqLbl}</td><td>${acc}</td></tr>`;
  }).join('');
  prev.innerHTML=`<div class="muted small" style="margin:8px 0 4px"><b>${items.length}</b> fila(s) · categoría <b>${esc(certCatNombre(catId))}</b>:</div>
    <div class="table-wrap" style="border:none;max-height:230px;overflow:auto"><table style="font-size:12px"><thead><tr><th>SN</th><th>PN</th><th>Descripción</th><th>Equipo</th><th>Acción</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    <button class="btn" style="margin-top:10px" onclick="compImportApply()">Importar ${items.filter(i=>i.sn).length} componente(s)</button>`;
}
async function compImportApply(){ if(isRO())return roBlock();
  const items=COMPIMP_PARSED, catId=COMPIMP_CAT; if(!items||!items.length) return;
  let creados=0, actualizados=0, reasign=0, sinEq=0, ignorados=0;
  for(const it of items){
    if(!it.sn){ ignorados++; continue; }
    const res=compResolveEquipo(it.equipoTxt);
    let k=DB.componentes.find(x=>x.categoriaId===catId && (x.sn||'').toLowerCase()===it.sn.toLowerCase());
    if(!k){ k={id:uid(),categoriaId:catId,sn:it.sn,descripcion:it.desc||'',partNumber:it.pn||'',equipoId:(res.id!=null?res.id:''),creadoEn:new Date().toISOString()}; DB.componentes.push(k); creados++; if(!res.found && it.equipoTxt) sinEq++; }
    else {
      if(it.pn) k.partNumber=it.pn; if(it.desc) k.descripcion=it.desc; actualizados++;
      compCerts(k.id,true).forEach(c=>{ c.seriales=[k.sn]; c.partNumbers=k.partNumber?[k.partNumber]:[]; });   // sincronizar identidad
      if(res.id!=null){ if((k.equipoId||'')!==res.id){ await compAplicarEquipo(k,res.id); reasign++; } }

let CERTIMP_CAT=null, CERTIMP_PARSED=null;
function compParseFecha(v){
  const s=String(v==null?'':v).trim(); if(!s) return '';
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){ const p=s.split('-'); return p[0]+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0'); }
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);   // DD/MM/AAAA (formato local)
  if(m){ let d=+m[1],mo=+m[2],y=+m[3]; if(y<100)y+=2000; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  if(/^\d+(\.\d+)?$/.test(s)){ const n=parseFloat(s); if(n>20000&&n<90000){ const dt=new Date(Math.round((n-25569)*86400000)); if(!isNaN(dt)) return dt.toISOString().slice(0,10); } }   // serial de Excel
  const dt=new Date(s); if(!isNaN(dt)&&/\d{4}/.test(s)) return dt.toISOString().slice(0,10);
  return '';
}
function _certImpMap(rows){
  if(!rows.length) return {items:[],hadHeader:false};
  const width=Math.max(...rows.map(r=>r.length));
  let lead=0; for(let c=0;c<width;c++){ if(rows.every(r=>!((r[c]||'').trim()))) lead++; else break; }
  const h0=rows[0].map(x=>(x||'').trim().toLowerCase());
  const reSN=/^(sn|serial(\s*number|es)?|n[º°]?\s*de?\s*serie)$/, reEmi=/(emis|certificaci[oó]n|fecha\s*cert)/, reVto=/(vto|venc)/, reNC=/(n[º°]?\s*(de)?\s*certif|nro?\s*cert|^certificado$)/;
  const nLabels=h0.filter(c=>reSN.test(c)||reEmi.test(c)||reVto.test(c)||reNC.test(c)).length;
  const looksHeader=nLabels>=2;
  let idx={sn:lead,emi:lead+1,vto:lead+2,nc:lead+3}, start=0;
  if(looksHeader){ start=1; const find=re=>h0.findIndex(c=>re.test(c)); idx={sn:find(reSN)>=0?find(reSN):lead, emi:find(reEmi)>=0?find(reEmi):lead+1, vto:find(reVto)>=0?find(reVto):lead+2, nc:find(reNC)>=0?find(reNC):lead+3}; }
  const items=rows.slice(start).map(r=>({sn:(r[idx.sn]||'').trim(), emi:compParseFecha(r[idx.emi]), vto:compParseFecha(r[idx.vto]), nc:(r[idx.nc]||'').trim()})).filter(it=>it.sn||it.vto||it.emi||it.nc);
  return {items,hadHeader:looksHeader};
}

// Si un SN viene repetido en el Excel, se queda con la certificación de VENCIMIENTO más reciente (tiebreak: emisión más nueva)
function _certImpDedup(rawItems){
  const map=new Map(), noSN=[];
  rawItems.forEach(it=>{ if(!it.sn){ noSN.push(it); return; } const key=it.sn.toLowerCase(); const prev=map.get(key);
    if(!prev || (it.vto||'')>(prev.vto||'') || ((it.vto||'')===(prev.vto||'') && (it.emi||'')>(prev.emi||''))) map.set(key,it); });
  return [...map.values(), ...noSN];
}

    <div class="table-wrap" style="border:none;max-height:230px;overflow:auto"><table style="font-size:12px"><thead><tr><th>SN</th><th>Certificación</th><th>Vto</th><th>N°</th><th>Acción</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>

let CERT_F={equipo:'todos',cat:'todos',estado:'todos',q:'',verObsoletas:false};
function certRowsFiltradas(){
  let rows=[];
  DB.certificaciones.forEach(c=>{ if(!CERT_F.verObsoletas && c.archivada) return; rows.push({type:'cert',c,equipoId:c.equipoId,categoriaId:c.categoriaId}); });
  // filas "Falta": equipo×categoría sin ninguna vigente — SOLO para categorías por-equipo (las por-componente no llevan Falta)
  DB.equipos.filter(e=>e.estado!=='Baja').forEach(e=>{ DB.certCategorias.filter(cat=>!cat.porComponente).forEach(cat=>{ const has=DB.certificaciones.some(c=>c.equipoId===e.id&&c.categoriaId===cat.id&&!c.archivada); if(!has) rows.push({type:'falta',equipoId:e.id,categoriaId:cat.id}); }); });
  rows=rows.filter(r=>{
    if(CERT_F.equipo==='__none__'){ if((r.equipoId||'')!=='') return false; }
    else if(CERT_F.equipo!=='todos'&&r.equipoId!==CERT_F.equipo) return false;
    if(CERT_F.cat!=='todos'&&r.categoriaId!==CERT_F.cat) return false;
    const est=r.type==='cert'?certEstado(r.c):'falta';
    if(CERT_F.estado!=='todos'&&est!==CERT_F.estado) return false;
    if(CERT_F.q){ const q=CERT_F.q.toLowerCase(); const eq=DB.equipos.find(e=>e.id===r.equipoId); const cat=certCat(r.categoriaId);
      const hay=((eq?eq.nombre:'')+' '+(cat?cat.nombre:'')+' '+(r.type==='cert'?((r.c.descripcion||'')+' '+(r.c.seriales||[]).join(' ')+' '+(r.c.partNumbers||[]).join(' ')+' '+(r.c.nrosCert||[]).join(' ')):'')).toLowerCase();
      if(!hay.includes(q)) return false; }
    return true;
  });
  const key=r=>(r.type==='cert'&&r.c.fechaVencimiento)?parseD(r.c.fechaVencimiento).getTime():Infinity;
  rows.sort((a,b)=>key(a)-key(b));
  return rows;
}

      <td><button class="iconbtn" onclick="certPdfPanel('${c.id}')">${nPdf?('📎 '+nPdf):'Asociar'}</button></td>

// Crea la estructura de carpetas Equipos/<equipo>/<categoría>/vigente|obsoleta para todos los equipos activos
async function certPrepararCarpetas(){
  if(!certFsListo()){ toast('Primero conectá la carpeta','warn'); return; }
  const root=await certDirEquipos(true); if(!root){ toast('No se pudo acceder a la carpeta (falta permiso)','err'); return; }
  const eqs=DB.equipos.filter(x=>x.estado!=='Baja'); let nEq=0, fallo=false;
  for(const e of eqs){ let algo=false;
    for(const cat of DB.certCategorias){ const v=await certDirFor(e,cat,'vigente',true); const o=await certDirFor(e,cat,'obsoleta',true); if(v&&o) algo=true; else fallo=true; }

}

// Renombra los PDF asociados al nombre estándar (p.ej. tras cambiar el vencimiento)
async function certRenombrarPdfs(cert){
  if(!certFsListo() || !(cert.pdfs||[]).length) return;
  const eq=DB.equipos.find(e=>e.id===cert.equipoId)||null, cat=certCat(cert.categoriaId); if(!cat) return;
  const sub = cert.archivada ? 'obsoleta' : 'vigente';
  const d=await certDirFor(eq,cat,sub,true); if(!d) return;
  for(const p of cert.pdfs){ const nuevo=certPdfBaseName(cert,p.serial); if(sub==='vigente'){ const nn=await certRenombrarVigente(eq,cat,p.name,nuevo); p.name=nn; } }
  saveDB();
}

async function certPdfAsociar(id,fileName,serial){ const c=DB.certificaciones.find(x=>x.id===id); if(!c) return; const eq=DB.equipos.find(e=>e.id===c.equipoId), cat=certCat(c.categoriaId);

function certPdfQuitar(id,name){ const c=DB.certificaciones.find(x=>x.id===id); if(!c) return; c.pdfs=(c.pdfs||[]).filter(p=>p.name!==name); saveDB(); certPdfPanel(id); renderCertificaciones(); }

/* ============================================================
   PLANIFICACIÓN (GANTT)  — operación + mantenimientos en el tiempo
   ============================================================ */
// ---- Recomendación en formato CORTO + badge de situación (reusado por Gantt y Agrupación) ----
function recCorto(m){
  const r=m.rec; if(!r) return '';
  const pad=r.pad?r.pad:'el pad';
  switch(r.tipo){
    case 'ya':      return 'Hacer lo antes posible';
    case 'postpad': return 'Esperar y hacer al terminar '+pad;
    case 'prepad':  return 'Adelantar a la parada previa a '+pad;
    case 'manual':  return 'Fecha fijada por vos';
    case 'lejano':  return 'Cargá más pads para precisar la fecha';
    default:        return '';
  }
}
function sitBadge(m){   // {t,cls} — el estado en una palabra/chip
  const tipo=m.rec&&m.rec.tipo;
  const exc = m.excedente>0 ? ' ~'+num(m.excedente)+'h' : '';        // horas que se pasará del ciclo AL EJECUTARSE (también si ya está vencido o si vos moviste la fecha)
  if(tipo==='ya') return {t:'hacer ya'+exc, cls:'rojo'};             // vencido y el equipo está parado
  if(m.vencido) return {t:'vencido'+exc, cls:'rojo'};                // vencido; si además se hará N h pasado, lo muestra
  if(venceFuera(m)) return {t:'se hará vencido ~'+num(m.excedente)+'h', cls:'rojo'};
  if(m.beyond && !m.accionable) return {t:'sin fecha', cls:'neutral'};
  if(tipo==='manual') return {t:'fijado', cls:'azul'};
  if(tipo==='prepad') return {t:'a tiempo', cls:'verde'};
  if(tipo==='postpad') return {t:'al fin del pad', cls:'amarillo'};
  return {t:estadoLabel(m.estado), cls:m.estado};
}
// Celda de acción visual (agrupación): fecha + situación + motivo corto + link fijar
function accionCell(m){
  const f=m.accionFecha||(m.rec&&m.rec.fecha);
  const when=f?`<span class="when">${fmtDShort(f)}</span>`:'';
  const sb=sitBadge(m);
  const sit=`<span class="sit ${sb.cls}"${m.excedente>0?` title="Al ejecutarse estará ~${num(m.excedente)}h pasado el objetivo (${num(m.horas)}h) · ciclo de ${num(m.plan.intervalo)}h"`:''}>${sb.t}</span>`;
  const motivo=recCorto(m);
  const dpBadge=m.durantePad?` <span class="tag" style="background:#241a2e;color:#caa8e0;border-color:#4a3a5f;font-size:9px;padding:0 5px" title="Se hace durante el pad, sin frenar la operación (parada breve)">durante el pad</span>`:'';
  const fijar=`<span class="linklike rw" style="font-size:11px" onclick="planificarMant('${m.equipo.id}','${m.plan.key}',${m.horas})">${m.manual?'cambiar fecha':'fijar fecha'}</span>`;
  return `<div class="acc"><div class="acc-line">${when}${sit}${dpBadge}</div>${motivo?`<div class="acc-motivo">${esc(motivo)}</div>`:''}${fijar}</div>`;
}
// ---- Tooltip flotante del Gantt (tarjeta limpia, no la línea apretada) ----
let GTIPS={};
function gttShow(ev,id){ const t=document.getElementById('gtt'); if(!t)return; t.innerHTML=GTIPS[id]||''; t.style.display='block'; gttMove(ev); }
function gttMove(ev){ const t=document.getElementById('gtt'); if(!t||t.style.display!=='block')return;
  const r=t.getBoundingClientRect(); let x=ev.clientX+16, y=ev.clientY+16;
  if(x+r.width>window.innerWidth-10) x=ev.clientX-r.width-16;
  if(y+r.height>window.innerHeight-10) y=window.innerHeight-r.height-10; if(y<10)y=10;
  t.style.left=x+'px'; t.style.top=y+'px'; }
function gttHide(){ const t=document.getElementById('gtt'); if(t)t.style.display='none'; }
function gttMarkHTML(e){   // contenido del tooltip de un mantenimiento (proyectado / próximo)
  return `<div class="gtt-h"><span class="gtt-dot ${e.estado}"></span>${esc(e.equipo.nombre)} — ${esc(e.plan.nombre)}${e.proyeccion?' · proyección':''}</div>`
    +`<div class="gtt-row"><span>Teórico (plan)</span><b>${num(e.teorico)} h</b></div>`
    +(e.horas!=null?`<div class="gtt-row"><span>Objetivo (ciclo)</span><b>${num(e.horas)} h</b></div>`:'')

  // Fila "Sin asignar": vencimientos de componentes que no están asignados a ningún equipo (solo si mostramos todos)

    let p2=`<h3 style="margin:24px 0 6px;font-size:16px;font-weight:800">Pads por empresa <span class="muted small" style="font-weight:400">— ventanas de operación de cada empresa de servicio, aunque no haya equipos en el pad</span></h3>`;

    grupos.forEach(emp=>{

      let bars='';
      lanes.forEach((ln,li)=>{ ln.forEach(p=>{ if(p.fechaFin<startISO||p.fechaInicio>endISO) return;

        const w=Math.max(3,x1-x0), y=rowPad+li*(laneH+laneGap);
        const nEq=(p.asignaciones||[]).length;
        const tip=`${esc(nombre)} · ${esc(p.nombre)} · ${fmtD(p.fechaInicio)} → ${fmtD(p.fechaFin)} · ${nEq?nEq+' equipo(s)':'sin equipos'}`;

      }); });
      p2+=`<div class="gantt-row"><div class="gantt-label" style="flex-direction:row;align-items:center"><span style="width:11px;height:11px;border-radius:3px;background:${col};flex:none;margin-right:8px"></span><div class="nm" style="font-size:13px">${esc(nombre)} <span class="muted small" style="font-weight:400">(${pads.length})</span></div></div>
        <div class="gantt-track" style="width:${trackW}px;height:${rowH}px"><div class="gantt-today" style="left:${todayOff}px"></div>${bars}</div></div>`;
    });
    p2+=`</div></div>`;
    html+=p2;
  }

  html+=`<div id="gtt"></div>`;
  M.innerHTML=html;
  // Los dos gantts comparten la escala de tiempo → sincronizar su scroll horizontal para que se muevan juntos
  const gwraps=[...M.querySelectorAll('.gantt-wrap')];
  if(gwraps.length>1){ let lock=false; gwraps.forEach(w=>w.addEventListener('scroll',()=>{ if(lock)return; lock=true; gwraps.forEach(o=>{ if(o!==w && o.scrollLeft!==w.scrollLeft) o.scrollLeft=w.scrollLeft; }); lock=false; })); }
  ganttHoy();   // posicionar AMBOS gantts en HOY; el pasado queda a la izquierda para deslizar
}

/* ============================================================
   AGRUPACIÓN INTELIGENTE
   ============================================================ */
// ---- Ventanas SIN operación (huecos entre pads) de un equipo, desde hoy hasta el horizonte ----
function idleWindows(eqId){
  const today=todayISO();
  const horizonEnd=toISO(addDays(parseD(today),DB.params.horizonteDias||1095));
  // intervalos operativos (asignaciones) recortados a [hoy, horizonte], ordenados
  let ops=asignacionesForEquipo(eqId).map(a=>({desde:a.desde,hasta:a.hasta}))
    .filter(o=>o.hasta>=today)
    .map(o=>({desde:o.desde<today?today:o.desde,hasta:o.hasta>horizonEnd?horizonEnd:o.hasta}))
    .sort((a,b)=>a.desde<b.desde?-1:1);
  // fusionar solapados/contiguos
  const merged=[];
  ops.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.desde<=toISO(addDays(parseD(last.hasta),1))){ if(o.hasta>last.hasta) last.hasta=o.hasta; } else merged.push({...o}); });
  if(!merged.length) return [{desde:today,hasta:horizonEnd,abierta:true}];   // sin pads → todo libre
  // huecos entre operaciones
  const gaps=[]; let cursor=today;
  merged.forEach(o=>{ if(o.desde>cursor){ gaps.push({desde:cursor,hasta:toISO(addDays(parseD(o.desde),-1))}); } if(o.hasta>=cursor) cursor=toISO(addDays(parseD(o.hasta),1)); });
  if(cursor<horizonEnd) gaps.push({desde:cursor,hasta:horizonEnd,abierta:true});  // cola libre tras el último pad
  return gaps.filter(g=>g.hasta>=g.desde);
}
// Tramos contiguos de operación (runs) a partir del timeline
function operatingRuns(tl){
  const runs=[]; let cur=null;
  tl.days.forEach(d=>{ if(d.pad){ if(!cur) cur={start:d.date,end:d.date,pad:d.pad}; else cur.end=d.date; } else if(cur){ runs.push(cur); cur=null; } });
  if(cur) runs.push(cur);
  return runs;
}
// Horas acumuladas de una fuente a una fecha dada
function cumAt(tl,iso,fuente){
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  let last=tl.days[0][key];
  for(const d of tl.days){ if(d.date>iso) break; last=d[key]; }
  return last;
}
// Horas REALES (medidas) a una fecha, según las LECTURAS reales del equipo (interpola por fecha entre lecturas).
// Se usa en el Gantt para los pads ya terminados: así cada pad muestra las horas reales de SU fecha, no las de la última lectura.
function realHorasAt(eqId, iso, fuente){
  const key = fuente==='motor'?'horasMotor':'horasBomba';
  const ls = DB.lecturas.filter(l=>l.equipoId===eqId).sort((a,b)=>a.fecha<b.fecha?-1:1);
  if(!ls.length) return null;
  if(iso<=ls[0].fecha) return Math.round(Number(ls[0][key])||0);
  const lastL=ls[ls.length-1];
  if(iso>=lastL.fecha) return Math.round(Number(lastL[key])||0);
  for(let i=0;i<ls.length-1;i++){
    const a=ls[i], b=ls[i+1];
    if(iso>=a.fecha && iso<=b.fecha){
      const h0=Number(a[key])||0, h1=Number(b[key])||0;
      const t0=parseD(a.fecha).getTime(), t1=parseD(b.fecha).getTime(), ti=parseD(iso).getTime();
      if(t1<=t0) return Math.round(h1);
      return Math.round(h0+(h1-h0)*(ti-t0)/(t1-t0));
    }
  }
  return Math.round(Number(lastL[key])||0);
}
// Fecha de ACCIÓN recomendada (distinta del cruce). Usa TOLERANCIA: el primer pad en cuyo final
// el equipo queda a <= tolerancia del umbral (lo cruce o no) es donde hay que actuar.
function planRecomendacion(tl,m){
  const hoy=todayISO();
  // Plan marcado "se hace durante el pad": NO espera a una parada, se hace al cruzar las horas (aunque el equipo opere).
  if(m.plan.hacerEnPad){
    const f=(m.date && m.date>=hoy)?m.date:hoy;
    return {tipo:'durantepad',fecha:f,desde:f,hasta:f,cls:(m.vencido?'rojo':statusOf({date:f,vencido:false})),txt:'Durante el pad · al cruzar las horas (~'+fmtDM(f)+')'};
  }
  const runs=operatingRuns(tl);
  if(!runs.length) return m.vencido?{tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible'}:{tipo:'futuro',fecha:null,cls:'neutral',txt:'Sin pads cargados para este equipo'};
  const asap0=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };
  if(m.vencido){
    // si el equipo está operando hoy, no se puede frenar: se hace al terminar el pad en curso (se agrupa con los demás)
    const rHoy=runs.find(r=> hoy>=r.start && hoy<=r.end);
    if(rHoy){
      const nx=runs[runs.indexOf(rHoy)+1];
      const w={desde:toISO(addDays(parseD(rHoy.end),1)), hasta: nx?toISO(addDays(parseD(nx.start),-1)):null};
      const f=asap0(w);
      return {tipo:'postpad',...w,fecha:f,pad:rHoy.pad,cls:'rojo',txt:`Vencido · hacer al terminar ${rHoy.pad} (~${fmtDM(f)})`};
    }
    return {tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible (equipo parado)'};
  }
  const nd=m.horas, fuente=m.plan.fuente;
  // PAD donde REALMENTE se cruza el umbral (no donde está "cerca"): primer run cuyo fin alcanza nd
  let idx=-1;
  for(let k=0;k<runs.length;k++){ if(cumAt(tl,runs[k].end,fuente) >= nd){ idx=k; break; } }
  if(idx<0){                                                                 // ningún pad cargado llega a cruzarlo
    const last=runs[runs.length-1], lleg=cumAt(tl,last.end,fuente), faltan=Math.round(nd-lleg);
    return {tipo:'lejano',fecha:null,cls:'neutral',faltan,txt:`Con los pads cargados llega a ${num(lleg)}h (faltan ~${num(faltan)}h al ${fmtDM(last.end)}). Cargá el próximo pad para precisar.`};
  }
  const R=runs[idx], prev=runs[idx-1], next=runs[idx+1];
  const ongoing=R.start<=hoy;
  const gapBefore={desde: prev?toISO(addDays(parseD(prev.end),1)):hoy, hasta: toISO(addDays(parseD(R.start),-1))};
  const gapAfter ={desde: toISO(addDays(parseD(R.end),1)), hasta: next?toISO(addDays(parseD(next.start),-1)):null};
  const asap=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };  // lo antes posible = 2 días tras el pad previo
  if(ongoing){   // cruza operando dentro del pad en curso → no se puede frenar, se hace al terminarlo
    const w=gapAfter; return {tipo:'postpad',...w,fecha:asap(w),pad:R.pad,cls:'rojo',txt:`Cruza operando en ${R.pad} (en curso) · hacer al terminar (~${fmtDM(asap(w))})`};
  }
  // cruza en un pad FUTURO. No se puede frenar a mitad de pad, así que hay DOS paradas posibles:
  //   prepad  = parada ANTES del pad  → se haría ADELANTADO (se desperdicia vida útil)
  //   postpad = parada DESPUÉS del pad → se haría VENCIDO (operó de más dentro del pad)
  // Solo conviene ADELANTAR si el adelanto entra en la TOLERANCIA (Parámetros, def. 150h). Si falta más que
  // eso (típico de un mantenimiento RECIÉN hecho, o un primer service todavía lejano), NO se adelanta: como el
  // pad no se puede frenar, se ESPERA a que se venza y se hace al terminar el pad — nunca rehacerlo prematuro.
  const tol=Number(DB.params.toleranciaHoras)||0;
  const hBefore=cumAt(tl,asap(gapBefore),fuente);
  const hAfter =cumAt(tl,R.end,fuente);
  const adelanto=Math.round(nd-hBefore), atraso=Math.round(hAfter-nd);
  if(adelanto<=tol){
    const w=gapBefore;
    return {tipo:'prepad',...w,fecha:asap(w),pad:R.pad,cls:'amarillo',txt:`Cruza en ${R.pad} · adelantar a la parada previa (~${fmtDM(asap(w))}, ~${num(adelanto)}h antes)`};
  }
  const w=gapAfter;
  return {tipo:'postpad',...w,fecha:asap(w),pad:R.pad,cls:'rojo',txt:`Faltan ~${num(adelanto)}h (más que la tolerancia) · esperar y hacer al terminar ${R.pad} (~${fmtDM(asap(w))}, se vence ~${num(atraso)}h)`};
}
// Ventanas SIN operación (entre pads) a nivel flota — TODAS, aunque estén vacías
function fleetGaps(){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=DB.pads.filter(p=>(p.asignaciones||[]).length>0).map(p=>({d:p.fechaInicio,h:p.fechaFin})).filter(x=>x.d&&x.h&&x.h>=hoy).sort((a,b)=>a.d<b.d?-1:1);   // solo pads CON equipos: un pad vacío no ocupa la flota
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});  // hueco antes del 1er pad
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,14);
}
// ¿El equipo está OPERANDO (dentro de un pad propio) esa fecha?
function equipoOperando(eqId,iso){
  return DB.pads.some(p=>(p.asignaciones||[]).some(a=>a.equipoId===eqId && a.desde && a.hasta && iso>=a.desde && iso<=a.hasta));
}
// ¿El equipo está EN LOCACIÓN pero en PAUSA (sin operar) esa fecha? (dentro de un pad, día marcado sin operar)
function equipoEnPausa(eqId,iso){
  return DB.pads.some(p=>(p.asignaciones||[]).some(a=>a.equipoId===eqId && a.desde && a.hasta && iso>=a.desde && iso<=a.hasta && enPausa(a.pausas,iso)));
}
// Ventanas en las que ESTE equipo NO opera (paradas propias) = complemento de sus pads. Puede haber paradas
// para un equipo mientras otros operan. Son las únicas ventanas válidas para mover/fijar su mantenimiento.
function equipoGaps(eqId){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=[];
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId && a.desde && a.hasta && a.hasta>=hoy) ivs.push({d:a.desde,h:a.hasta}); }));
  ivs.sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,30);
}
// "Lo antes posible" dentro de una ventana = 2 días después de que arranca (o desde hoy)
function asapEnVentana(g){ let f=toISO(addDays(parseD(g.desde),1)); if(f<todayISO())f=todayISO(); if(g.hasta&&f>g.hasta)f=g.hasta; return f; }
// Paradas para MOSTRAR = ventanas de flota (todas, incl. vacías) + ventanas individuales donde caiga un mant. (equipo libre mientras otros operan)
function computeParadas(evs){
  const items=(evs||planEvents()).filter(e=>e.accionFecha && (VERPROY||!e.proyeccion)).concat(pendientesItems());   // evs opcional: reusa el planEvents ya calculado
  const wins=fleetGaps().map(g=>({desde:g.desde,hasta:g.hasta,abierta:g.abierta,individual:false,items:[]}));
  items.forEach(it=>{
    let w=wins.find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta && !g.individual);
    if(!w){   // cae fuera de las ventanas de flota → ventana individual del equipo (libre mientras otros operan)
      const eg=equipoGaps(it.equipo.id).find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta);
      const desde=eg?eg.desde:it.accionFecha, hasta=eg?eg.hasta:it.accionFecha, ab=eg?eg.abierta:false;
      w=wins.find(g=>g.individual && g.desde===desde && g.hasta===hasta);
      if(!w){ w={desde,hasta,abierta:ab,individual:true,items:[]}; wins.push(w); }
    }
    w.items.push(it);
  });
  wins.sort((a,b)=> a.desde<b.desde?-1:(a.desde>b.desde?1:0));
  return wins;
}
// Mover un mantenimiento a la parada PROPIA del equipo anterior (-1) o siguiente (+1). Salta solo las ventanas
// donde el equipo opera (no son válidas), así no hay que pasar por ellas.
function moverParada(eqId,planKey,horas,dir){ if(isRO())return roBlock();
  const wins=equipoGaps(eqId);
  if(!wins.length){ toast('Este equipo no tiene paradas (cargá pads).','warn'); return; }
  const item=planEvents().find(e=>e.equipo.id===eqId&&e.plan.key===planKey&&e.horas===horas);
  const cur=item&&item.accionFecha;
  let gi=wins.findIndex(g=> cur&&cur>=g.desde&&cur<=g.hasta);
  if(gi<0){ // la fecha actual no cae en una parada propia (p.ej. está operando): arranco del borde según la dirección
    if(cur){ gi = dir>0 ? wins.reduce((acc,g,i)=> g.desde<=cur?i:acc, -1) : wins.findIndex(g=>g.desde>=cur); if(dir<0&&gi<0) gi=wins.length; }
    else gi = dir>0?-1:wins.length;
  }
  const t=wins[gi+dir];
  if(!t){ toast('No hay parada '+(dir<0?'anterior':'siguiente')+' para este equipo','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
// Saltar directo a una parada concreta del equipo (por índice de equipoGaps) — permite saltar varias ventanas de una
function moverParadaA(eqId,planKey,horas,idx){ if(isRO())return roBlock();
  const wins=equipoGaps(eqId); const t=wins[idx];
  if(!t){ toast('Parada no válida','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
function fijarEnVentana(eqId,planKey,horas,g){
  const f=asapEnVentana(g);
  DB.planificado[planKeyOf(eqId,planKey,horas)]=f;
  audit('Mover a parada',`${eqName(eqId)} ${PLAN(planKey)?.nombre} → ${f}`);
  saveDB(); route(CURRENT);
}
// Selector "Mover a…": lista las paradas PROPIAS del equipo (donde NO opera) para saltar directo a cualquiera
function selectorMover(m){
  const wins=equipoGaps(m.equipo.id);
  const cur=m.accionFecha;
  const opts=wins.map((g,i)=>{ const sel=cur&&cur>=g.desde&&cur<=g.hasta?'selected':''; const lbl=`${fmtDShort(g.desde)} ${g.abierta?'→ adelante':'→ '+fmtDShort(g.hasta)}`; return `<option value="${i}" ${sel}>${lbl}</option>`; }).join('');
  return `<select class="mini-select" title="Saltar a otra parada del equipo (solo donde está parado)" onchange="moverParadaA('${m.equipo.id}','${m.plan.key}',${m.horas},Number(this.value))"><option value="" disabled ${cur?'':'selected'}>Mover a…</option>${opts}</select>`;
}
// Certificaciones a renovar para la Agrupación: si el vto cae DENTRO de un pad, recomienda hacerlo ANTES de arrancar el pad (para que no venza operando)
function certAgrupacionItems(diasHorizonte){
  const hoy=todayISO(); const horizon=toISO(addDays(parseD(hoy), diasHorizonte||180)); const out=[];
  (DB.certificaciones||[]).forEach(c=>{
    if(c.archivada||!c.fechaVencimiento) return;
    if(c.fechaVencimiento>horizon && certEstado(c)!=='vencida') return;   // solo vencidas o próximas al horizonte
    const eq=DB.equipos.find(e=>e.id===c.equipoId);
    let dentroPad=null;
    if(eq){ (padRunsEquipo(c.equipoId)||[]).forEach(r=>{ if(r.start && r.end && c.fechaVencimiento>=r.start && c.fechaVencimiento<=r.end) dentroPad=r; }); }
    let recomendada, motivo;
    if(certEstado(c)==='vencida'){ recomendada=hoy; motivo='vencida — renovar ya'; }
    else if(dentroPad){ recomendada=dentroPad.start; motivo=`vence durante el pad (${fmtDShort(dentroPad.start)} → ${fmtDShort(dentroPad.end)}) · renovar ANTES de arrancar`; }
    else { recomendada=c.fechaVencimiento; motivo='renovar cerca del vencimiento (el equipo no opera ese día)'; }
    out.push({c,eq,recomendada,motivo,dentroPad});
  });
  out.sort((a,b)=> a.recomendada<b.recomendada?-1:(a.recomendada>b.recomendada?1:0));
  return out;
}

function renderAnalitica(){
  const maints=allProjectedMaints();

/* ============================================================
   COSTOS y TCO por equipo
   ============================================================ */
function costosPorEquipo(){
  return DB.equipos.filter(e=>e.estado!=='Baja').map(e=>{
    const ms=DB.mantenimientos.filter(m=>m.equipoId===e.id);
    const prev=ms.filter(m=>m.tipo!=='correctivo'), corr=ms.filter(m=>m.tipo==='correctivo');  // inspección cuenta como preventivo
    const ade=(DB.adelantos||[]).filter(a=>a.equipoId===e.id && a.estado!=='cancelado');          // adelantos cuentan como preventivo
    const p2h=(DB.pendientes||[]).filter(p=>p.equipoId===e.id && p.estado==='hecho');             // partes 2 completadas cuentan como preventivo
    const cAde=ade.reduce((s,a)=>s+(Number(a.costo)||0),0)+p2h.reduce((s,p)=>s+(Number(p.costo)||0),0);
    const cPrev=prev.reduce((s,m)=>s+(Number(m.costo)||0),0)+cAde, cCorr=corr.reduce((s,m)=>s+(Number(m.costo)||0),0);
    const lr=lastReading(e.id); const hM=lr?Number(lr.horasMotor)||0:0, hB=lr?Number(lr.horasBomba)||0:0;
    const total=cPrev+cCorr;
    return {equipo:e,total,cPrev,cCorr,cAde,nPrev:prev.length,nCorr:corr.length,nAde:ade.length,hM,hB,
      tcoM: hM>0?total/hM:null, tcoB: hB>0?total/hB:null};
  });
}
// Aclara (p>0) u oscurece (p<0) un color hex — para los gradientes de relieve
function shade(hex,p){
  hex=(''+hex).replace('#',''); if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  const f=x=>Math.max(0,Math.min(255,Math.round(p>0?x+(255-x)*p:x*(1+p))));
  return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
// Costo estándar (planificado) de un plan preventivo — lo define el usuario
function costoDePlan(key){ return Number((DB.params.costoPlan||{})[key])||0; }
// Costo PLANIFICADO estimado por equipo (suma del costo estándar de cada mantenimiento que viene, dentro de N meses)
function costoPlanificado(meses){
  meses=meses||12;
  const hoy=todayISO(), hasta=toISO(addDays(parseD(hoy),meses*31));
  const porEquipo={}, porPlan={}, porMes={}, porEquipoPlan={}, porMesEquipo={}; let total=0, n=0;
  planEvents().forEach(e=>{
    if(e.beyond) return; const f=e.accionFecha||e.date; if(!f||f<hoy||f>hasta) return;
    const c=costoDePlan(e.plan.key); if(!c) return;
    const eq=e.equipo.id, pk=e.plan.key, mes=f.slice(0,7);
    (porEquipo[eq]=porEquipo[eq]||{c:0,n:0}); porEquipo[eq].c+=c; porEquipo[eq].n++;
    (porPlan[pk]=porPlan[pk]||{c:0,n:0}); porPlan[pk].c+=c; porPlan[pk].n++;
    (porEquipoPlan[eq]=porEquipoPlan[eq]||{}); porEquipoPlan[eq][pk]=(porEquipoPlan[eq][pk]||0)+c;
    (porMesEquipo[mes]=porMesEquipo[mes]||{}); porMesEquipo[mes][eq]=(porMesEquipo[mes][eq]||0)+c;
    porMes[mes]=(porMes[mes]||0)+c;
    total+=c; n++;
  });
  return {porEquipo,porPlan,porMes,porEquipoPlan,porMesEquipo,total,n};
}
// Costo YA REALIZADO desglosado por plan (preventivos por su plan; correctivos/inspecciones agrupados aparte; adelantos → su plan, como preventivo)
function costosRealizadosPorPlan(){
  const porPlan={}; let total=0;
  const add=(k,c)=>{ (porPlan[k]=porPlan[k]||{c:0,n:0}); porPlan[k].c+=c; porPlan[k].n++; total+=c; };
  DB.mantenimientos.forEach(m=>{ const c=Number(m.costo)||0; if(!c) return;
    add(m.tipo==='correctivo'?'CORRECTIVO':(m.tipo==='inspeccion'?'INSPECCION':m.plan), c); });
  (DB.adelantos||[]).forEach(a=>{ if(a.estado==='cancelado') return; const c=Number(a.costo)||0; if(!c) return; add(a.planKey, c); });
  return {porPlan,total};
}

// Gráfico de dona (torta) en SVG con relieve: gradiente por porción, sombra y pista de fondo
function donutSVG(segs,opts){
  opts=opts||{}; const size=opts.size||190, sw=opts.stroke||28, r=(size-sw)/2-3, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const list=segs.filter(s=>s.value>0); const total=list.reduce((s,x)=>s+x.value,0)||1;
  const gap=list.length>1?Math.min(C*0.014,6):0;   // espacio fino entre porciones
  const u='d'+Math.random().toString(36).slice(2,7);
  let defs=`<filter id="${u}s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/></filter>`;
  list.forEach((s,i)=>{ defs+=`<linearGradient id="${u}g${i}" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="${shade(s.color,0.34)}"/><stop offset="1" stop-color="${shade(s.color,-0.16)}"/></linearGradient>`; });
  let off=0, arcs='';
  list.forEach((s,i)=>{ const len=s.value/total*C, draw=Math.max(0.6,len-gap);
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#${u}g${i})" stroke-width="${sw}" stroke-dasharray="${draw.toFixed(2)} ${(C-draw).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.label)}: ${money(s.value)} (${Math.round(s.value/total*100)}%)</title></circle>`;
    off+=len; });
  const track=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0b1120" stroke-width="${sw}"/><circle cx="${cx}" cy="${cy}" r="${r-sw/2}" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none"><defs>${defs}</defs>${track}<g filter="url(#${u}s)">${arcs}</g>`
    +`<text x="${cx}" y="${cy-1}" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="800">${esc(opts.centerTop||'')}</text>`
    +`<text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--muted)" font-size="10.5">${esc(opts.centerSub||'')}</text></svg>`;
}

  const segEq=data.map((d,i)=>({label:d.equipo.nombre,value:d.total,color:COSTCOL[i%COSTCOL.length]}));
  // por plan (lo ya realizado): SOLO preventivos por su plan (el correctivo ya está en la torta Prev/Corr)
  const realPlan=costosRealizadosPorPlan();
  const segPlan=PLANES.filter(p=>realPlan.porPlan[p.key]).map(p=>({label:p.nombre,value:realPlan.porPlan[p.key].c,color:planColor(p.key)}));
  const totalPlanPrev=segPlan.reduce((s,x)=>s+x.value,0);
  html+=`<div class="row" style="align-items:stretch;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div class="card" style="flex:1;min-width:280px"><h3>Preventivo vs Correctivo <span class="sub">realizado</span></h3>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px">${donutSVG(segPC,{size:168,centerTop:num(totalFlota),centerSub:'total '+mon})}${donutLegend(segPC,totalFlota)}</div></div>
    <div class="card" style="flex:1;min-width:280px"><h3>Costo por equipo <span class="sub">realizado</span></h3>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px">${donutSVG(segEq,{size:168,centerTop:String(data.length),centerSub:'equipos'})}${donutLegend(segEq,totalFlota)}</div></div>
    <div class="card" style="flex:1;min-width:280px"><h3>Costo por plan <span class="sub">solo preventivo</span></h3>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px">${donutSVG(segPlan,{size:168,centerTop:String(segPlan.length),centerSub:'planes'})}${donutLegend(segPlan,totalPlanPrev)}</div></div></div>`;
  // ===== Costo total por equipo (barras apiladas preventivo + correctivo) =====
  const maxTotal=Math.max(1,...data.map(d=>d.total));
  html+=`<div class="card" style="margin-bottom:16px"><h3>Costo total por equipo <span class="sub">preventivo + correctivo</span></h3><div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">`;
  data.forEach(d=>{
    const wp=d.total?d.cPrev/maxTotal*100:0, wc=d.total?d.cCorr/maxTotal*100:0;
    const pPrev=d.total?Math.round(d.cPrev/d.total*100):0, pCorr=d.total?100-pPrev:0;
    const lbl=(w,pct)=> w>9?`<span style="color:#08110b;font-size:10.5px;font-weight:800;line-height:24px;padding-left:7px">${pct}%</span>`:'';
    html+=`<div style="display:grid;grid-template-columns:130px 1fr 120px;align-items:center;gap:10px">
      <span style="font-weight:600;font-size:13px">${esc(d.equipo.nombre)}</span>
      <div class="cbar-track" style="height:24px;display:flex">
        <div class="cbar-fill" title="Preventivo ${money(d.cPrev)} (${pPrev}%)" style="width:${wp}%;background:linear-gradient(180deg,#34c98e,#178a5e);overflow:hidden;white-space:nowrap">${lbl(wp,pPrev)}</div>
        <div class="cbar-fill" title="Correctivo ${money(d.cCorr)} (${pCorr}%)" style="width:${wc}%;background:linear-gradient(180deg,#f0954a,#c9591f);overflow:hidden;white-space:nowrap">${lbl(wc,pCorr)}</div>
      </div>
      <span style="text-align:right;line-height:1.3"><span class="mono" style="font-size:12.5px">${money(d.total)}</span><br><span style="font-size:10.5px"><b style="color:#34c98e">${pPrev}%</b> prev · <b style="color:#f0954a">${pCorr}%</b> corr</span></span></div>`;
  });
  html+=`</div><div class="row" style="gap:16px;margin-top:12px;font-size:12px"><span class="row" style="gap:6px"><span class="leg-sw" style="background:#2bbd86"></span>Preventivo</span><span class="row" style="gap:6px"><span class="leg-sw" style="background:#ef8a3d"></span>Correctivo</span></div></div>`;
  // ===== TCO: costo por hora (motor y bomba) por equipo =====
  const tcoData=data.filter(d=>d.tcoM!=null||d.tcoB!=null);
  const maxM=Math.max(0.0001,...tcoData.map(d=>d.tcoM||0)), maxB=Math.max(0.0001,...tcoData.map(d=>d.tcoB||0));
  const tcoCol=(arr,key,max,grad,sub)=>{
    let h=`<div class="card" style="flex:1;min-width:300px"><h3>TCO ${sub}</h3><div class="muted small" style="margin:-4px 0 12px">Costo total ÷ horas de ${sub} acumuladas</div><div style="display:flex;flex-direction:column;gap:12px">`;
    arr.forEach(d=>{ const v=d[key]; const w=v!=null?Math.max(2,v/max*100):0;
      h+=`<div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="font-weight:600">${esc(d.equipo.nombre)}</span><span class="mono" style="color:#ffd27f">${v!=null?money(v)+'/h':'<span style=\"color:var(--muted)\">sin horas</span>'}</span></div>
        <div class="cbar-track" style="height:18px"><div class="cbar-fill" style="width:${w}%;background:${grad}"></div></div></div>`;
    });
    return h+`</div></div>`;
  };
  html+=`<div class="row" style="align-items:flex-start;gap:16px">`;
  html+=tcoCol(tcoData,'tcoM',maxM,'linear-gradient(180deg,#5a66ff,#2a35c0)','motor');
  html+=tcoCol(tcoData,'tcoB',maxB,'linear-gradient(180deg,#3fd0e8,#147f99)','bombeo');
  html+=`</div>`;
  html+=planifHTML+editorHTML;
  M.innerHTML=html;
}

];
function saveExportTabs(){ if(isRO())return roBlock(); DB.params.exportTabs=[...document.querySelectorAll('.exp-chk:checked')].map(c=>c.value); saveDB(); toast('Selección de exportación guardada'); }
// Guarda las periodicidades. Lo YA EJECUTADO no se toca: el próximo ciclo sale de "último mantenimiento + nueva periodicidad"
// (nextDueHours: exec+I). Las fechas fijadas a mano se reinician porque su clave incluye las horas del ciclo, que cambian.
function savePeriodicidades(){
  if(isRO())return roBlock();
  const nuevos={}; let cambios=[];
  for(const inp of document.querySelectorAll('.pint')){
    const k=inp.dataset.k, v=Math.round(Number(inp.value));
    if(!(v>0)) return toast(`${PLAN(k)?.nombre||k}: la periodicidad tiene que ser un número mayor a 0`,'err');
    nuevos[k]=v;
    const antes=PLAN(k)?.intervalo;
    if(antes!==v) cambios.push(`${PLAN(k)?.nombre||k}: ${num(antes)}h → ${num(v)}h`);
  }
  if(!cambios.length) return toast('No cambiaste ninguna periodicidad');
  const nFijadas=Object.keys(DB.planificado||{}).length;
  if(!confirm(`Vas a cambiar:\n\n${cambios.join('\n')}\n\nLo ya ejecutado NO se modifica; el próximo ciclo de cada equipo se recalcula desde su último mantenimiento.${nFijadas?`\n\nSe van a reiniciar ${nFijadas} fecha(s) fijada(s) a mano.`:''}\n\n¿Confirmás?`)) return;
  DB.planes.forEach(p=>{ if(nuevos[p.key]>0){ p.intervalo=nuevos[p.key]; DB.params.intervalos[p.key]=nuevos[p.key]; } });
  aplicarPlanes(); reagruparAuto();      // las fechas manuales apuntan a ciclos que ya no existen → se reinician
  audit('Cambiar periodicidad',cambios.join(' · '));
  saveDB(); renderParametros(); refreshBadges();
  toast('Periodicidades guardadas · proyecciones recalculadas');
}
function resetPeriodicidades(){
  if(isRO())return roBlock();
  if(!confirm('¿Restaurar TODOS los planes a los valores de fábrica?\n\nSe pierden los planes que hayas agregado y las ediciones (nombre, horas, tipo, etc.).')) return;
  DB.planes=PLANES_DEF.map(p=>({...p})); DB.params.intervalos=Object.assign({},INTERVALOS_DEF); aplicarPlanes();
  reagruparAuto(); audit('Planes','Restaurados a fábrica');
  saveDB(); renderParametros(); refreshBadges(); toast('Planes restaurados a fábrica');
}

/* ---------- PUBLICAR LA DEMO WEB (desde el botón, sin terminal) ----------
   Arma el index.html del sitio (mismo resultado que build-web.js, pero en el navegador) a partir de
   PRISTINE_HTML + los datos ACTUALES, y lo sube al repo de GitHub Pages con la API de GitHub. */
function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str); let bin=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function buildLiteHTML(){
  const clean=JSON.parse(JSON.stringify(DB));
  clean.audit=[];                                            // no exponer el log interno
  if(clean.params){ clean.params.user='demo'; clean.params.pass='demo';
    delete clean.params.ghToken; delete clean.params.ghOwner; delete clean.params.ghRepo; }  // NUNCA publicar el token
  const ver=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  const json=JSON.stringify(clean).replace(/<\//g,'<\\/');
  const inject=`<script>window.QM_FORCE_LITE=true;window.QM_LITE_SEED=${json};window.QM_LITE_SEED_VER=${JSON.stringify(ver)};<\/script>`;
  let html=PRISTINE_HTML;
  html=html.replace(/<body[^>]*>/i, m=> m+'\n'+inject);                          // el seed debe correr ANTES del script principal
  html=html.replace('</head>', '<meta name="robots" content="noindex,nofollow">\n</head>');
  return {html, ver};
}
async function publicarWeb(){
  if(isRO()) return roBlock();
  if(WEB_LITE){ toast('Publicá desde la app LOCAL (no desde la web).','err'); return; }
  // guardar config tomada de los inputs (si está la pantalla abierta)
  const tok=(val('p-ghtoken')||DB.params.ghToken||'').trim();
  const owner=(val('p-ghowner')||DB.params.ghOwner||'EliasSuarez16').trim();
  const repo=(val('p-ghrepo')||DB.params.ghRepo||'qm-planificador-demo').trim();
  DB.params.ghToken=tok; DB.params.ghOwner=owner; DB.params.ghRepo=repo; saveDB();
  if(!tok){ toast('Pegá tu token de GitHub abajo y guardá antes de publicar.','err'); return; }
  const {html,ver}=buildLiteHTML();
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
  const headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const btn=document.getElementById('btn-publicar'); if(btn){ btn.disabled=true; btn.textContent='Publicando…'; }
  toast('Publicando demo web…');
  try{
    let sha;
    const g=await fetch(api,{headers});                       // sha actual (necesario para sobrescribir)
    if(g.ok){ sha=(await g.json()).sha; }
    else if(g.status===401){ throw new Error('token inválido o sin permiso (401)'); }
    else if(g.status!==404){ throw new Error('no se pudo leer el repo ('+g.status+')'); }
    const body={message:'Actualizar demo '+ver, content:utf8ToBase64(html)}; if(sha) body.sha=sha;
    const p=await fetch(api,{method:'PUT',headers,body:JSON.stringify(body)});
    if(!p.ok){ const t=await p.text(); throw new Error('GitHub '+p.status+' · '+t.slice(0,140)); }
    audit('Publicar web', `${owner}/${repo} v${ver}`); saveDB();
    toast('✓ Publicado. La web se actualiza en ~1 minuto: '+`https://${owner}.github.io/${repo}/`);
  }catch(e){
    toast('No se pudo publicar online ('+e.message+'). Descargo el index.html como respaldo.','err');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='index.html'; a.click();
  }finally{ if(btn){ btn.disabled=false; btn.textContent='Publicar demo web ahora'; } }
}

  if(isRO())return roBlock();
  const t=(val('p-ghtoken')||'').trim();
  if(t) DB.params.ghToken=t;                                 // vacío = conservar el token ya guardado
  DB.params.ghOwner=(val('p-ghowner')||'EliasSuarez16').trim();
  DB.params.ghRepo=(val('p-ghrepo')||'qm-planificador-demo').trim();
  audit('Config publicación web', DB.params.ghOwner+'/'+DB.params.ghRepo);
  saveDB(); toast('Configuración guardada'); renderParametros();
}

      :`<button class="btn"${fsDisponible()?'':' disabled'} onclick="fsConectar()">Elegir carpeta y sincronizar</button>`}

function backupExport(){

function backupImport(input){ if(isRO())return roBlock();

function dl(name,rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); toast('Excel (CSV) exportado');
}

const _xmlEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])).replace(/\n/g,'&#10;');   // \n → salto de línea dentro de la celda (con WrapText)

const _xlColorId={'#e3f5ea':'cg','#e6f2fb':'cb','#fdeee6':'co','#fff5db':'cm'};
function _wsName(s,used){ let n=String(s||'Hoja').replace(/[\[\]\:\*\?\/\\]/g,' ').slice(0,28).trim()||'Hoja'; let b=n,i=2; while(used[n.toLowerCase()]){ n=(b.slice(0,25)+' '+i).trim(); i++; } used[n.toLowerCase()]=1; return n; }
function sheetsToXls(sheets){

   ARCHIVOS sincronizados a una carpeta (historia Excel / gantt HTML / agrupación HTML) — auto-actualizan en cada cambio

/* ---- Export GRÁFICO: HTML autocontenido que se ve IGUAL que la app (gantt y agrupación ya graficados, sin instalar nada) ----
   Estrategia: renderizamos la MISMA vista de la app en un contenedor oculto, capturamos su HTML y lo empaquetamos con el CSS de la app. */
function _appStyles(){ return [...document.querySelectorAll('style')].map(s=>s.textContent).join('\n'); }
function _captureVista(renderFn){
  const prevM=M, prevTips=GTIPS, prevOff=GANTT._todayOff;   // aislar: no tocar la vista en pantalla ni sus tooltips
  const off=document.createElement('div');
  off.style.cssText='position:absolute;left:-99999px;top:0;width:1600px';
  document.body.appendChild(off);
  M=off;
  try{ renderFn(); }catch(e){}
  off.querySelectorAll('.section-head').forEach(n=>n.remove());   // fuera la cabecera con controles interactivos
  const gtt=off.querySelector('#gtt'); if(gtt) gtt.remove();      // contenedor de tooltips flotantes (no aplica en estático)
  off.querySelectorAll('*').forEach(el=>{ [...el.attributes].forEach(a=>{ if(/^on/i.test(a.name)) el.removeAttribute(a.name); }); });   // sin handlers on*
  const inner=off.innerHTML;
  document.body.removeChild(off);
  M=prevM; GTIPS=prevTips; GANTT._todayOff=prevOff;
  return inner;
}
function _exportDoc(titulo, subtitulo, inner, scrollHoy){
  const fecha=fmtD(todayISO());
  const scrollScript = scrollHoy ? '<scr'+'ipt>window.addEventListener("load",function(){document.querySelectorAll(".gantt-wrap").forEach(function(w){var t=w.querySelector(".gantt-today");if(t){var x=parseFloat(t.style.left)||0;w.scrollLeft=Math.max(0,x-200);}});});<\/scr'+'ipt>' : '';
  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QM · '+esc(titulo)+' · '+fecha+'</title>\n'
    + '<style>'+_appStyles()+'</style>\n'
    + '<style>'
    + 'html,body{overflow:auto!important;height:auto}'
    + 'body{padding:0;background:var(--bg)}'
    + '#app{display:block!important;height:auto}'   /* la app oculta #app y lo hace grid; acá lo mostramos como bloque simple */
    + '.qm-x{max-width:1500px;margin:0 auto;padding:22px 28px 64px}'
    + '.qm-x-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:22px}'
    + '.qm-x-head .logo-box{width:46px;height:46px;font-size:18px;flex:none}'
    + '.qm-x-head h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.3px}'
    + '.qm-x-head .sub{color:var(--muted);font-size:13px;margin-top:3px}'
    + '.qm-x-head .stamp{margin-left:auto;text-align:right;color:var(--muted);font-size:12px;line-height:1.4}'
    + '.qm-x-head .stamp b{color:var(--text);display:block;font-size:14px}'
    + '.gantt-wrap{max-height:none!important}'
    + '</style></head>\n'
    + '<body><div id="app" class="ro"><div class="qm-x">'
    + '<div class="qm-x-head"><div class="logo-box">QM</div>'
    + '<div><h1>'+esc(titulo)+'</h1><div class="sub">'+esc(subtitulo)+'</div></div>'
    + '<div class="stamp">Actualizado<b>'+fecha+'</b>QM Planificador</div></div>'
    + '<main id="main">'+inner+'</main>'
    + '</div></div>'+scrollScript+'</body></html>';
}
function buildGanttHTML(){
  const prevEq=GANTT.equipo; GANTT.equipo='todos';   // el export siempre muestra toda la flota
  const inner=_captureVista(renderPlanificacion);
  GANTT.equipo=prevEq;
  return _exportDoc('Planificación (Gantt)','Operación programada (pads) y mantenimientos proyectados en una línea de tiempo', inner, true);
}
function buildAgrupacionHTML(){
  const inner=_captureVista(renderAgrupacion);
  return _exportDoc('Agrupación inteligente','Cada ventana sin operación es una parada; los mantenimientos se ubican donde corresponde', inner, false);
}

// ---- Sincronización a carpeta local (File System Access API) — auto en cada cambio + respaldo por descarga ----
let FS_DIR=null, FS_T=null, FS_PEND=null;   // FS_PEND: carpeta guardada esperando re-otorgar permiso (el navegador lo pide de nuevo en cada sesión)
function fsDisponible(){ return typeof window!=='undefined' && !!window.showDirectoryPicker; }
// BOM solo para .xls (Excel); el .html va limpio. Reintenta: OneDrive/antivirus toca la carpeta y el handle queda viejo ("state changed since read from disk") → re-leemos y reintentamos.
async function fsWrite(name,text){
  const body=(/\.html?$/i.test(name)?'':'﻿')+text;
  let ultimo;
  for(let intento=1;intento<=3;intento++){
    try{ const fh=await FS_DIR.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(body); await w.close(); return; }
    catch(e){ ultimo=e; await new Promise(r=>setTimeout(r,300)); }
  }
  throw ultimo;
}
async function fsVolcar(showToast){
  if(!FS_DIR) return;
  try{ if((await FS_DIR.queryPermission({mode:'readwrite'}))!=='granted'){ if(!showToast){ return; } if((await FS_DIR.requestPermission({mode:'readwrite'}))!=='granted'){ FS_DIR=null; return; } } }
  catch(e){ if(showToast) toast('No se pudo acceder a la carpeta: '+e.message,'err'); return; }
  // Cada archivo se escribe por separado: si uno falla (OneDrive sincronizando), los otros igual se actualizan.
  const tareas=[
    ['QM_historia_clinica.xls', ()=>sheetsToXls(exportSheets(['historia']))],   // historia clínica: Excel (para el cliente, sin costos)
    ['QM_gantt.html',           ()=>buildGanttHTML()],                          // gantt: HTML ya graficado (igual que la app)
    ['QM_agrupacion.html',      ()=>buildAgrupacionHTML()],                     // agrupación: HTML visual (igual que la app)
    ['QM_ficha_tecnica.xls',    ()=>sheetsToXls(exportSheets(['ficha']))],      // ficha técnica: Excel (piezas certificables + datos por equipo)
  ];
  let fallo=null;
  for(const [name,gen] of tareas){ try{ await fsWrite(name, gen()); }catch(e){ fallo=e; } }
  try{ await FS_DIR.removeEntry('QM_gantt.xls'); }catch(e){}                     // limpiar los .xls viejos (ahora son .html)
  try{ await FS_DIR.removeEntry('QM_agrupacion.xls'); }catch(e){}
  if(fallo){ if(showToast) toast('Algún archivo no se pudo actualizar ('+fallo.message+'). Probá "Actualizar ahora" de nuevo.','err'); }
  else if(showToast) toast('Se actualizaron los 4 archivos en la carpeta');
}
function fsProgramarVolcado(){ if(!FS_DIR) return; clearTimeout(FS_T); FS_T=setTimeout(()=>fsVolcar(false),1500); }   // debounce: agrupa cambios seguidos
async function fsConectar(){
  if(!fsDisponible()){ toast('Tu navegador no permite escribir en carpetas. Usá "Descargar los 3 Excel" (o abrí con Chrome/Edge).','err'); return; }
  try{ FS_DIR=await window.showDirectoryPicker({mode:'readwrite',id:'qm-export'}); await fsGuardarHandle(FS_DIR); await fsVolcar(true); DB.params.fsSyncOn=true; saveDB(); renderRespaldo(); certSweepVencidas(); }
  catch(e){ if(e && e.name!=='AbortError') toast('No se conectó la carpeta: '+e.message,'err'); }
}
function fsDesconectar(){ FS_DIR=null; FS_PEND=null; DB.params.fsSyncOn=false; fsGuardarHandle(null); saveDB(); renderRespaldo(); toast('Carpeta desconectada'); }
function fsGuardarHandle(dir){ return new Promise(res=>{ try{ const rq=indexedDB.open('qm-fs',1); rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('h');}catch(e){}}; rq.onsuccess=()=>{ try{ const tx=rq.result.transaction('h','readwrite'); tx.objectStore('h').put(dir,'dir'); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }catch(e){res();} }; rq.onerror=()=>res(); }catch(e){ res(); } }); }
function fsCargarHandle(){ return new Promise(res=>{ try{ const rq=indexedDB.open('qm-fs',1); rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('h');}catch(e){}}; rq.onsuccess=()=>{ try{ const tx=rq.result.transaction('h','readonly'); const g=tx.objectStore('h').get('dir'); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); }catch(e){res(null);} }; rq.onerror=()=>res(null); }catch(e){ res(null); } }); }
async function fsResumir(){
  if(!fsDisponible()) return;
  try{
    const h=await fsCargarHandle(); if(!h) return;
    const perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted'){ FS_DIR=h; if(CURRENT==='respaldo') renderRespaldo(); fsVolcar(false); certSweepVencidas(); return; }   // el permiso persistió → reanuda solo
    if(perm!=='denied'){ FS_PEND=h; fsArmarReconexion(); if(CURRENT==='respaldo') renderRespaldo(); }        // hay carpeta guardada; reconecta en el 1er gesto
  }catch(e){}
}
// El navegador exige un gesto del usuario para re-otorgar el permiso de la carpeta. Lo reintenta en la PRIMERA interacción (clic/tecla) y, si el navegador recuerda el permiso, es silencioso.
function fsArmarReconexion(){
  if(fsArmarReconexion._armado) return; fsArmarReconexion._armado=true;
  const intentar=async()=>{
    document.removeEventListener('pointerdown',intentar,true); document.removeEventListener('keydown',intentar,true);   // un solo intento automático por sesión
    fsArmarReconexion._armado=false;
    const h=FS_PEND; if(!h) return;
    try{ const perm=await h.requestPermission({mode:'readwrite'});
      if(perm==='granted'){ FS_PEND=null; FS_DIR=h; if(CURRENT==='respaldo') renderRespaldo(); await fsVolcar(false); certSweepVencidas(); }
    }catch(e){}
  };
  document.addEventListener('pointerdown',intentar,true);
  document.addEventListener('keydown',intentar,true);
}
// Reconexión manual (botón en Respaldo): corre dentro del gesto del clic, así el navegador permite pedir el permiso.
async function fsReconectar(){
  const h=FS_PEND||await fsCargarHandle();
  if(!h){ fsConectar(); return; }
  try{ const perm=await h.requestPermission({mode:'readwrite'});
    if(perm==='granted'){ FS_PEND=null; FS_DIR=h; renderRespaldo(); await fsVolcar(true); certSweepVencidas(); }
    else toast('No se otorgó el permiso de la carpeta','err');
  }catch(e){ toast('No se pudo reconectar: '+e.message,'err'); }
}
function _dlXls(name,xls){ const b=new Blob(['﻿'+xls],{type:'application/vnd.ms-excel;charset=UTF-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function _dlHtml(name,html){ const b=new Blob([html],{type:'text/html;charset=UTF-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function descargarPaquete(){
  _dlXls('QM_historia_clinica.xls', sheetsToXls(exportSheets(['historia'])));
  setTimeout(()=>_dlHtml('QM_gantt.html', buildGanttHTML()),350);
  setTimeout(()=>_dlHtml('QM_agrupacion.html', buildAgrupacionHTML()),700);
  setTimeout(()=>_dlXls('QM_ficha_tecnica.xls', sheetsToXls(exportSheets(['ficha']))),1050);
  toast('Descargando historia + ficha técnica (Excel) + gantt y agrupación (HTML)');
}
