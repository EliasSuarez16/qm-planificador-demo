  if(p.finPad) html+=`<div style="background:#101a30;border:1px solid #25325a;border-radius:8px;padding:10px 14px;margin-bottom:12px;color:#9fb0d8;font-size:13px"> <b>Operando en ${esc(p.finPad.pad)}</b> hasta el ${fmtD(p.finPad.fecha)} → al terminar el pad tendrá <b>M ${num(p.finPad.motor)}h motor</b> · <b>B ${num(p.finPad.bomba)}h bomba</b></div>`;
  html+=`<div class="muted small" style="margin-bottom:12px">Los ciclos se agrupan <b>por plan</b> (el que tiene varios viene plegado). <b>Teórico</b> = hito nominal del plan (1.500, 2.000…); <b>Objetivo</b> = a las horas que debería hacerse según el ciclo (ejecución previa + intervalo); <b>se hará a</b> = horas reales por los pads. <span style="color:var(--red)">${venc} vencido(s)</span>.</div>`;
  const recColor={rojo:'#ff9a4d',amarillo:'#ffc24d',verde:'#3fe0a0',neutral:'var(--muted)',gris:'var(--muted)',ya:'#ff7378'};
  const thead=`<thead><tr><th>Comp.</th><th class="right">Cada</th><th>Base ciclo</th><th class="right" title="Hito nominal del plan (1500, 2000…)">Teórico</th><th class="right" title="A las horas que debería hacerse según el ciclo: ejecución previa + intervalo">Objetivo</th><th class="right">Restan h</th><th>Se cumple</th><th>Acción recomendada</th><th>Estado</th></tr></thead>`;
  const rowFor=e=>{
    const realTxt = e.horasReal!=null?` <span style="color:#5fd0e0">· se hará a ~${num(e.horasReal)}h</span>`:'';
    const fecha = (e.vencido?'<span style="color:var(--red)">VENCIDO</span>' : (e.beyond?'<span class="muted">sin fecha</span>' : fmtDShort(e.date)+' · '+e.diasRestantes+'d'))+realTxt;
    const exec  = lastExecHours(eqId,e.plan.key,e.plan.fuente);
    const base  = exec!=null?`<span style="color:#5fd0e0">desde ${num(exec)}h</span>` : (e.proyeccion?`<span class="muted">desde ~${num(e.base)}h</span>`:'<span class="muted">por horas</span>');
    const rec=e.rec; const accion = rec&&rec.txt? `<span style="color:${recColor[rec.cls]||'var(--muted)'}">${esc(rec.txt)}</span>` : '<span class="muted">en la fecha</span>';
    const objCol = e.horas!=null?(venceFuera(e)?`<span style="color:#ff9a4d">${num(e.horas)}</span>`:num(e.horas)):'—';
    return `<tr${e.proyeccion?' style="opacity:.72"':''}><td class="muted">${e.plan.componente}</td><td class="right mono">${num(e.plan.intervalo)}</td><td class="mono small">${base}</td><td class="right mono" style="color:#9fb0d8">${num(e.teorico)}</td><td class="right mono">${objCol}</td><td class="right mono">${e.vencido?'—':num(e.horasRestantes)}</td><td class="mono small">${fecha}</td><td class="small">${accion}</td><td><span class="pill ${e.estado}">${estadoLabel(e.estado)}</span></td></tr>`;
  };
  html+=`<div style="max-height:56vh;overflow:auto">`;
  PLANES.forEach(pl=>{
    const grp=evs.filter(e=>e.plan.key===pl.key);
    if(!grp.length) return;
    grp.sort((a,b)=> (dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0) || a.horas-b.horas);
    const next=grp[0], hasV=grp.some(e=>e.vencido), open=(grp.length===1||hasV)?' open':'';
    const proxTxt = next.vencido?'<span style="color:var(--red);font-weight:700">vencido</span>':(next.beyond?'sin fecha':'próx. '+fmtDShort(next.accionFecha||next.date));
    const summ=`<summary style="padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;list-style:none"><span class="tag">${pl.nombre}</span><span class="muted small">${pl.componente} · ${pl.fuente==='motor'?'motor':'bomba'}</span>${grp.length>1?`<span class="countpill" style="padding:1px 9px;font-size:11px">${grp.length} ciclos</span>`:''}<span class="muted small" style="margin-left:auto">${proxTxt}</span><span class="pill ${next.estado}">${estadoLabel(next.estado)}</span></summary>`;
    html+=`<details${open} class="card" style="padding:0;margin-bottom:9px;overflow:hidden">${summ}<div class="table-wrap" style="border:none;border-top:1px solid var(--border);border-radius:0"><table>${thead}<tbody>${grp.map(rowFor).join('')}</tbody></table></div></details>`;
  });
  html+=`</div>`;
  if(naAplica.length) html+=`<div class="muted small" style="margin-top:10px"> Única vez ya ejecutado (no se repite): ${naAplica.join(', ')}</div>`;
  openModal(`${eq.nombre} · Todos los planes`,html,null,true);
}

// CALIBRAR HORAS: corrige un desfasaje CONSTANTE del odómetro (venía mal desde el arranque) sumando/restando la diferencia
// a TODAS las lecturas y mantenimientos del equipo por igual → el odómetro queda real, pero como el punto de partida y los
// mantenimientos se mueven juntos, "faltan X h para el próximo" NO cambia y no se vence ningún mantenimiento.
function ajustarHorasForm(){ if(isRO())return roBlock();
  const eqs=DB.equipos;
  if(!eqs.length) return toast('No hay equipos','warn');
  const body=`<div class="form-grid">
    <div class="field full"><div class="help" style="margin:0"><span class="ic">⚙</span><div>Si las horas venían <b>mal desde el arranque</b> (ej. faltaban 200 h), acá corregís el <b>odómetro</b> sumando (o restando, con signo −) esa diferencia. Se aplica a <b>todas las lecturas y mantenimientos</b> del equipo por igual → el número real queda bien, pero <b>las fechas de los próximos mantenimientos NO cambian ni se vence ninguno</b> (se mueve todo junto).</div></div></div>
    <div class="field"><label>Equipo *</label><select id="aj-eq" onchange="ajustarHorasPrev()">${eqs.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label>Ajuste horas MOTOR <span class="muted small">(+ suma / − resta)</span></label><input id="aj-m" type="number" step="0.1" value="0" oninput="ajustarHorasPrev()"></div>
    <div class="field"><label>Ajuste horas BOMBA <span class="muted small">(+ suma / − resta)</span></label><input id="aj-b" type="number" step="0.1" value="0" oninput="ajustarHorasPrev()"></div>
    <div class="field full"><div id="aj-prev" class="muted small" style="background:#0d1422;border:1px solid var(--border);border-radius:7px;padding:9px 12px"></div></div>
  </div>`;
  openModal('Corregir / calibrar horas del equipo',body,()=>{
    const eqId=val('aj-eq'), dm=Number(val('aj-m'))||0, db=Number(val('aj-b'))||0;
    if(!dm && !db) return toast('Poné el ajuste de horas (a sumar o restar)','err');
    let nL=0,nM=0;
    DB.lecturas.forEach(l=>{ if(l.equipoId===eqId){ l.horasMotor=Math.round(((Number(l.horasMotor)||0)+dm)*10)/10; l.horasBomba=Math.round(((Number(l.horasBomba)||0)+db)*10)/10; nL++; } });
    DB.mantenimientos.forEach(m=>{ if(m.equipoId===eqId){ if(m.horasMotor!=null) m.horasMotor=Math.round(((Number(m.horasMotor)||0)+dm)*10)/10; if(m.horasBomba!=null) m.horasBomba=Math.round(((Number(m.horasBomba)||0)+db)*10)/10; nM++; } });
    (DB.adelantos||[]).forEach(a=>{ if(a.equipoId===eqId && a.horasMotor!=null) a.horasMotor=Math.round(((Number(a.horasMotor)||0)+dm)*10)/10; });
    // Offset acumulado del equipo: para que los hitos ABSOLUTOS (planes que todavía no se ejecutaron, ej. "1ª Beta a 1500h") también se muevan junto al odómetro → no se vencen.
    const eqO=DB.equipos.find(e=>e.id===eqId); if(eqO){ eqO.horasOffsetMotor=(Number(eqO.horasOffsetMotor)||0)+dm; eqO.horasOffsetBomba=(Number(eqO.horasOffsetBomba)||0)+db; }
    audit('Calibrar horas',`${eqName(eqId)} motor ${dm>=0?'+':''}${dm} · bomba ${db>=0?'+':''}${db} (${nL} lecturas, ${nM} mant)`);
    saveDB(); closeModal(); renderHoras(); refreshBadges(); toast(`Horas corregidas · ${nL} lectura(s) y ${nM} mant. ajustados · la planificación no cambió`);
  });
  setTimeout(ajustarHorasPrev,0);
}
function ajustarHorasPrev(){
  const box=document.getElementById('aj-prev'); if(!box) return;
  const eqId=val('aj-eq'), dm=Number(val('aj-m'))||0, db=Number(val('aj-b'))||0;
  const lr=lastReading(eqId);
  const nL=DB.lecturas.filter(l=>l.equipoId===eqId).length, nM=DB.mantenimientos.filter(m=>m.equipoId===eqId).length;
  if(!lr){ box.innerHTML='Este equipo todavía no tiene lecturas.'; return; }
  const nm=(Number(lr.horasMotor)||0)+dm, nb=(Number(lr.horasBomba)||0)+db;
  box.innerHTML=`Última lectura (${fmtD(lr.fecha)}): motor <b>${num(lr.horasMotor)}</b> → <b style="color:#5fe0a0">${num(nm)}</b> · bomba <b>${num(lr.horasBomba)}</b> → <b style="color:#5fe0a0">${num(nb)}</b>
    <div style="margin-top:5px">Se ajustarán <b>${nL}</b> lectura(s) y <b>${nM}</b> mantenimiento(s) de este equipo. Las fechas de los próximos mantenimientos <b style="color:#5fe0a0">no cambian</b>.</div>`;
}

/* ============================================================
   PADS
   ============================================================ */
function renderPads(){
  let html=`<div class="section-head"><h1>Pads</h1><div class="desc">Cronograma de operación · agrupados por empresa de servicio</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('pads')">Excel</button>
    <button class="btn ghost rw" onclick="gestionEmpresas()">Operadoras y empresas</button>
    <button class="btn rw" onclick="padForm()">+ Nuevo pad</button></div>`;
  if(!DB.pads.length){ html+=`<div class="empty"><span class="ic"></span>Sin pads. Tocá "+ Nuevo pad".</div>`; M.innerHTML=html; return; }
  const hoy=todayISO();
  const groups={}; DB.pads.forEach(p=>{ const k=p.empresaServicio||'—'; (groups[k]=groups[k]||[]).push(p); });
  const orderK=[...(DB.empresasServicio||[]).map(e=>e.nombre).filter(n=>groups[n]), ...Object.keys(groups).filter(k=>!(DB.empresasServicio||[]).some(e=>e.nombre===k))];
  // Fila de un pad. Los chips de equipo no se parten a mitad (white-space:nowrap) → la fecha no se corta.
  const padRow=p=>{
    const dur=daysBetween(p.fechaInicio,p.fechaFin)+1;
    const tags=(p.asignaciones||[]).map(a=>{ const parcial=a.desde>p.fechaInicio||a.hasta<p.fechaFin; const nP=(a.pausas||[]).length; const pzTit=nP?` · ${nP} día(s) sin operar: ${a.pausas.map(z=>fmtDM(z.desde)+(z.desde!==z.hasta?'→'+fmtDM(z.hasta):'')).join(', ')}`:''; return `<span class="tag" style="white-space:nowrap;display:inline-block;margin:2px 3px 2px 0${parcial?';border-color:var(--amber);color:#ffc24d':''}" title="${(parcial?'Ingreso/egreso parcial':'Cubre todo el pad')+esc(pzTit)}">${esc(eqName(a.equipoId))} · ${fmtDM(a.desde)}→${fmtDM(a.hasta)}${nP?` <span style="color:#caa8e0" title="días sin operar">✂${nP}</span>`:''}</span>`; }).join('')||'<span class="muted">—</span>';
    return `<tr><td><b>${esc(p.nombre)}</b></td><td>${esc(p.operadora||'')}</td><td class="mono" style="white-space:nowrap">${fmtD(p.fechaInicio)}</td><td class="mono" style="white-space:nowrap">${fmtD(p.fechaFin)}</td><td class="mono">${dur}</td><td style="min-width:230px">${tags}</td>
      <td class="actions"><button class="iconbtn" onclick="padForm('${p.id}')">Editar</button><button class="iconbtn" onclick="padDelete('${p.id}')">Eliminar</button></td></tr>`;
  };
  const tableHTML=arr=>`<div class="table-wrap" style="border:none;border-top:1px solid var(--border);border-radius:0"><table><thead><tr><th>Pad</th><th>Operadora</th><th>Inicio</th><th>Fin</th><th>Días</th><th>Fracturadores (rango de trabajo)</th><th class="actions"></th></tr></thead><tbody>${arr.map(padRow).join('')}</tbody></table></div>`;
  orderK.forEach(k=>{
    const list=groups[k].slice().sort((a,b)=>a.fechaInicio<b.fechaInicio?-1:1);
    const vigentes=list.filter(p=>p.fechaFin>=hoy);          // próximos / en curso → desplegados
    const finalizados=list.filter(p=>p.fechaFin<hoy);        // terminados → plegados por defecto
    const color=k==='—'?'#5e6982':empColorOf(k);
    html+=`<details open class="card" style="padding:0;margin-bottom:12px;overflow:hidden;border-left:4px solid ${color}">
      <summary style="padding:13px 18px;cursor:pointer;font-weight:700;font-size:14px"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${color};vertical-align:middle;margin-right:9px"></span>${esc(k==='—'?'Sin empresa de servicio':k)}<span class="muted" style="font-weight:500;font-size:12px;margin-left:8px">${vigentes.length} vigente(s)${finalizados.length?` · ${finalizados.length} finalizado(s)`:''}</span></summary>`;
    if(vigentes.length) html+=tableHTML(vigentes);
    else html+=`<div class="muted small" style="padding:13px 18px;border-top:1px solid var(--border)">Sin pads vigentes en esta empresa.</div>`;
    if(finalizados.length){
      html+=`<details style="border-top:1px solid var(--border)"><summary style="padding:11px 18px;cursor:pointer;font-size:12.5px;color:var(--muted)"> Finalizados (${finalizados.length}) — mostrar</summary>${tableHTML(finalizados.slice().sort((a,b)=>a.fechaInicio<b.fechaInicio?1:-1))}</details>`;
    }
    html+=`</details>`;
  });
  M.innerHTML=html;
}

function padAddPausa(eid){
  const d=val('pz-d-'+eid); let h=val('pz-h-'+eid)||d;
  if(!d) return toast('Elegí la fecha del día sin operar','err');
  if(h<d) return toast('La fecha "hasta" del corte no puede ser anterior a "desde"','err');
  const des=document.querySelector(`.f-desde[data-eq="${eid}"]`).value, has=document.querySelector(`.f-hasta[data-eq="${eid}"]`).value;
  if((des&&d<des)||(has&&h>has)) return toast('El día sin operar debe caer dentro de las fechas de trabajo del equipo','err');
  (PAD_PAUSAS[eid]=PAD_PAUSAS[eid]||[]).push({desde:d,hasta:h});

function padDelPausa(eid,i){ (PAD_PAUSAS[eid]||[]).splice(i,1); const c=document.getElementById('pausas-'+eid); if(c) c.innerHTML=padPausasHTML(eid); }

// Al cambiar las fechas del PAD, sincroniza las fechas de los equipos que aún tenían el rango por defecto
let PAD_DATES={ini:'',fin:''};
function padSyncDates(){
  const ni=val('f-ini'),nf=val('f-fin');
  document.querySelectorAll('.f-desde').forEach(i=>{ if(!i.value||i.value===PAD_DATES.ini) i.value=ni; });
  document.querySelectorAll('.f-hasta').forEach(i=>{ if(!i.value||i.value===PAD_DATES.fin) i.value=nf; });
  PAD_DATES={ini:ni,fin:nf};
}

// Al cambiar pads, descartamos las fechas fijadas/movidas manualmente para que la agrupación inteligente se recalcule de cero. Devuelve true si había algo que limpiar.
function reagruparAuto(){ const n=Object.keys(DB.planificado||{}).length; DB.planificado={}; return n>0; }
// Botón manual: borra TODOS los cambios manuales (fechas fijadas/movidas) y recalcula la agrupación automática.
function reagruparManual(){
  if(isRO())return roBlock();
  const n=Object.keys(DB.planificado||{}).length;
  if(!n){ toast('No hay cambios manuales para borrar','warn'); return; }
  if(!confirm(`¿Reagrupar todo?\n\nSe borrarán tus ${n} cambio(s) manual(es) (fechas fijadas y mantenimientos movidos « / ») y todo se recalculará con la agrupación inteligente automática.\n\nDespués podés volver a mover lo que quieras.`)) return;
  DB.planificado={}; audit('Reagrupar todo (manual)',`borró ${n} planificados`); saveDB(); route(CURRENT);

}

</style></head><body><div class="doc">

${sc?'':`<div class="costos"><div class="costo tot"><div class="k">Costo total (TCO)</div><div class="v">${money(total)} ${mon}</div></div><div class="costo"><div class="k">Preventivo + adel.</div><div class="v">${money(total-cCorr)}</div></div><div class="costo"><div class="k">Correctivo</div><div class="v">${money(cCorr)}</div></div><div class="costo"><div class="k">TCO motor</div><div class="v">${tcoM!=null?money(tcoM)+'/h':'—'}</div></div><div class="costo"><div class="k">TCO bomba</div><div class="v">${tcoB!=null?money(tcoB)+'/h':'—'}</div></div></div>`}

function mantFillHoras(){ const lr=lastReading(val('f-eq')); if(lr){ document.getElementById('f-hm').value=lr.horasMotor; document.getElementById('f-hb').value=lr.horasBomba; } }
function mantTipoToggle(){
  const t=val('f-tipo'), prev=t==='preventivo', corr=t==='correctivo', insp=t==='inspeccion';
  const set=(id,show)=>{const el=document.getElementById(id); if(el) el.style.display=show?'':'none';};
  set('row-plan', prev); set('mant-productos-box', prev);
  set('row-corr', corr);                          // "¿Qué se reparó?" (texto libre) solo correctivo
  set('row-insp', insp); set('row-motivo', insp); // inspección: catálogo + motivo
  set('mant-libre-box', corr||insp);              // materiales libres para correctivo/inspección
  set('mant-insp-box', corr);                     // inspecciones realizadas dentro de un correctivo
  mantResultToggle();
  mantRefreshProductos(); mantLibreHTML(); mantCInspHTML();
}
function mantResultToggle(){ const el=document.getElementById('row-falla'); if(el){ const r=val('f-result'); el.style.display = (r==='falla'||r==='obs') ? '' : 'none'; } }
function mantCompToggle(){ const el=document.getElementById('row-comp-otro'); if(el) el.style.display = val('f-comp')==='Otro' ? '' : 'none'; }
function mantCompVal(){ let c=val('f-comp'); if(c==='Otro') c=(val('f-comp-otro')||'').trim()||'Otro'; return c; }
// Selección de materiales al ejecutar: por cada material del plan, qué pasó (usado / pendiente=parte 2 / omitido)
let MANT_PROD_INIT=null, MANT_PLAN_INIT=null, MANT_CHOSEN_INIT=null;
function mantProductosHTML(planKey, estados, chosen, adelantados){
  const bom=DB.bom.filter(b=>b.plan===planKey);
  if(!bom.length) return `<div class="muted small">Este plan no tiene materiales ni inspecciones cargados (podés cargarlos en <b>Planes y materiales</b>).</div>`;
  const selStyle='height:26px;font-size:11px;background:#0d1422;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0 6px';
  const _plan=PLAN(planKey), _fuente=_plan?_plan.fuente:'motor', _eqId=(document.getElementById('f-eq')?val('f-eq'):''), _refH=Number(val(_fuente==='bomba'?'f-hb':'f-hm'))||0, _tol=num(DB.params.toleranciaHoras);
  const estSel=(b,est,insp)=>`<select class="pest" data-bom="${b.id}" data-cant="${insp?1:b.cantidad}" data-pref="${insp?'':b.productoId}"${insp?` data-insp="1" data-inspid="${b.inspId||''}"`:''} style="width:180px;${selStyle}">
          <option value="usado" ${est==='usado'?'selected':''}>${insp?'✓ Revisado / hecho':'✓ Usado / colocado'}</option>
          <option value="adelantado" ${est==='adelantado'?'selected':''}>${insp?'↗ Ya revisado antes':'↗ Ya hecho antes (adelanto)'}</option>
          <option value="pendiente" ${est==='pendiente'?'selected':''}>⏳ Pendiente (parte 2)</option>
          <option value="omitido" ${est==='omitido'?'selected':''}>✕ No se hace (omitir)</option>
        </select>`;
  return `<div class="muted" style="font-size:10.5px;margin-bottom:8px"><b style="color:#e6b860">Pendiente</b> genera una <b>parte 2</b>. <b>Omitir</b> = no se hace. <b style="color:#5fe0a0">↗ Ya hecho antes</b> = viene de un adelanto (no se re-hace). Si hay <b>alternativas</b>, elegí cuál se usó.</div>`+
    bom.map(b=>{
      const adel=adelantados&&adelantados[b.id];
      const estGuardado = estados && (estados[b.id] || estados['P:'+b.productoId] || (b.inspId?estados['I:'+b.inspId]:undefined));
      const est=estGuardado||(adel?'adelantado':'usado');
      if(b.tipo==='inspeccion'){
        const tolIns = (!adel && !estGuardado) ? inspHechaReciente(_eqId, b.inspId, _fuente, _refH) : null;
        const estI = estGuardado || ((adel||tolIns)?'adelantado':'usado');
        const badge = adel ? `<span class="tag" style="font-size:9px;background:#13261c;color:#5fe0a0;border-color:#1c5440">↗ adelanto ${fmtDShort(adel)}</span>`
          : (tolIns?`<span class="tag" style="font-size:9px;background:#13261c;color:#5fe0a0;border-color:#1c5440" title="Ya se hizo esta inspección hace poco (±${_tol} h) — se puede saltear">↗ ya hecha ${fmtDShort(tolIns.fecha)}</span>`:'');
        return `<div class="row" style="gap:8px;align-items:center;margin:5px 0;font-size:12px;flex-wrap:wrap">
        <span style="flex:1;min-width:150px"><span class="tag" style="font-size:9px;background:#16283a;color:#6fc0ff;border-color:#254a66">🔍 inspección</span> ${esc(inspNombre(b))} ${badge}</span>
        ${estSel(b,estI,true)}</div>`;
      }
      const options=[b.productoId,...(b.alternativas||[])].map(pid=>({pid,p:prodById(pid)})).filter(x=>x.p);
      if(!options.length) return ''; const pref=options[0].p; const ch=(chosen&&(chosen[b.id]||chosen['P:'+b.productoId]))||b.productoId;
      const picker=options.length>1?`<select class="palt" data-bom="${b.id}" title="¿Cuál se usó?" style="width:150px;${selStyle}">${options.map(o=>`<option value="${o.pid}" ${o.pid===ch?'selected':''}>${esc(o.p.partNumber||o.p.refInterna)}</option>`).join('')}</select>`:'';
      return `<div class="row" style="gap:8px;align-items:center;margin:5px 0;font-size:12px;flex-wrap:wrap">
        <span style="flex:1;min-width:150px">${pref.partNumber?`<b class="mono" style="color:#d8b6ff">${esc(pref.partNumber)}</b> `:''}<span class="mono" style="color:#9fb0d8">${esc(pref.refInterna)}</span> ${esc(pref.descripcion)} <span class="muted">×${num(b.cantidad)} ${esc(pref.unidad||'')}</span>${options.length>1?` <span class="tag" style="font-size:9px;background:#241a2e;color:#caa8e0;border-color:#4a3a5f">${options.length} opciones</span>`:''}${adel?` <span class="tag" style="font-size:9px;background:#13261c;color:#5fe0a0;border-color:#1c5440">↗ adelanto ${fmtDShort(adel)}</span>`:''}</span>
        ${picker}
        ${estSel(b,est,false)}</div>`;
    }).join('');
}
function mantRefreshProductos(){
  const box=document.getElementById('mant-productos-box'), cont=document.getElementById('mant-productos'); if(!box||!cont) return;
  if(val('f-tipo')!=='preventivo'){ box.style.display='none'; return; }
  box.style.display='';
  const plan=val('f-plan');
  const same = plan===MANT_PLAN_INIT;   // prellenar solo si es el plan original (al editar)
  const est=(MANT_PROD_INIT && same)?MANT_PROD_INIT:null;
  const ch=(MANT_CHOSEN_INIT && same)?MANT_CHOSEN_INIT:null;
  MANT_PROD_INIT=null; MANT_CHOSEN_INIT=null;
  const adel=bomIdsAdelantados(val('f-eq'), plan);   // materiales ya hechos por un adelanto abierto
  cont.innerHTML=mantProductosHTML(plan, est, ch, adel);
}
// Materiales LIBRES (correctivo / inspección): selección del catálogo, sin plan/BOM
let MANT_LIBRE=[];
function mantLibreHTML(){
  const cont=document.getElementById('mant-libre'); if(!cont) return;
  if(!MANT_LIBRE.length){ cont.innerHTML='<div class="muted" style="font-size:11px">Sin materiales cargados. Agregá los que se cambiaron (opcional).</div>'; return; }
  cont.innerHTML=MANT_LIBRE.map((x,i)=>{ const p=prodById(x.productoId); if(!p) return `<div class="row" style="gap:8px;margin:4px 0;font-size:12px"><span style="flex:1" class="muted">(producto eliminado) ×${num(x.cantidad)}</span><button class="btn ghost sm" type="button" onclick="mantDelLibre(${i})">✕</button></div>`; return `<div class="row" style="gap:8px;align-items:center;margin:4px 0;font-size:12px"><span style="flex:1">${p.partNumber?`<b class="mono" style="color:#d8b6ff">${esc(p.partNumber)}</b> `:''}<span class="mono" style="color:#9fb0d8">${esc(p.refInterna)}</span> ${esc(p.descripcion)} <span class="muted">×${num(x.cantidad)} ${esc(p.unidad||'')}</span></span><button class="btn ghost sm" type="button" onclick="mantDelLibre(${i})" title="Quitar">✕</button></div>`; }).join('');
}
function mantAddLibre(){ const pid=val('f-libre-p'), c=Number(val('f-libre-c'))||1; if(!pid) return; const ex=MANT_LIBRE.find(x=>x.productoId===pid); if(ex) ex.cantidad=Number(ex.cantidad||0)+c; else MANT_LIBRE.push({productoId:pid,cantidad:c}); mantLibreHTML(); }
function mantDelLibre(i){ MANT_LIBRE.splice(i,1); mantLibreHTML(); }
// Inspecciones dentro de un CORRECTIVO (o inspección): lista de inspIds del catálogo
let MANT_INSP=[];
function mantCInspHTML(){
  const cont=document.getElementById('mant-cinsp'); if(!cont) return;
  if(!MANT_INSP.length){ cont.innerHTML='<div class="muted" style="font-size:11px">Sin inspecciones cargadas (opcional).</div>'; return; }
  cont.innerHTML=MANT_INSP.map((id,i)=>{ const it=inspById(id); return `<div class="row" style="gap:8px;align-items:center;margin:4px 0;font-size:12px"><span style="flex:1"><span class="tag" style="font-size:9px;background:#16283a;color:#6fc0ff;border-color:#254a66">🔍 inspección</span> ${esc(it?it.nombre:'(eliminada)')}</span><button class="btn ghost sm" type="button" onclick="mantDelCInsp(${i})" title="Quitar">✕</button></div>`; }).join('');
}
function mantAddCInsp(){ const id=val('f-cinsp'); if(!id) return; if(!MANT_INSP.includes(id)) MANT_INSP.push(id); mantCInspHTML(); }
function mantDelCInsp(i){ MANT_INSP.splice(i,1); mantCInspHTML(); }

  const body=`<div class="form-grid">

function informeMant(id){
  const html=informeMantHTML(id); if(!html) return toast('No se encontró el mantenimiento','err');
  const w=window.open('','_blank'); if(!w){ toast('Permití las ventanas emergentes para ver el informe','warn'); return; }
  w.document.open(); w.document.write(html); w.document.close();

/* ============================================================
   PLANES Y MATERIALES (BOM)
   Modelo normalizado: Productos (catálogo) + BOM (plan↔producto).
   Decisión técnica: gestionar POR PRODUCTO con vista POR PLAN.
   ============================================================ */
// Orden de los materiales DENTRO de cada plan (selector global arriba)
let PLAN_ITEM_SORT='ref-asc';
function planItemsView(items){
  const rf=b=>(prodById(b.productoId)?.refInterna||'').toLowerCase();
  const dd=b=>(prodById(b.productoId)?.descripcion||'').toLowerCase();
  const pn=b=>(prodById(b.productoId)?.partNumber||'').toLowerCase();
  const cmp={
    'ref-asc':(a,b)=>rf(a)<rf(b)?-1:rf(a)>rf(b)?1:0,
    'ref-desc':(a,b)=>rf(a)>rf(b)?-1:rf(a)<rf(b)?1:0,
    'desc-asc':(a,b)=>dd(a)<dd(b)?-1:dd(a)>dd(b)?1:0,
    'pn-asc':(a,b)=>pn(a)<pn(b)?-1:pn(a)>pn(b)?1:0,
    'cant-desc':(a,b)=>num(b.cantidad)-num(a.cantidad),
    'cant-asc':(a,b)=>num(a.cantidad)-num(b.cantidad),
  }[PLAN_ITEM_SORT]||((a,b)=>rf(a)<rf(b)?-1:1);
  return [...items].sort(cmp);
}
// Buscador DENTRO de cada plan: filtra en vivo las filas de esa card (sin re-render, no pierde foco)
function planCardFilter(inp){
  const q=(inp.value||'').trim().toLowerCase(); const card=inp.closest('.card'); if(!card) return;
  let shown=0, total=0;
  card.querySelectorAll('tr[data-s]').forEach(tr=>{ total++; const m=!q||tr.getAttribute('data-s').indexOf(q)>=0; tr.style.display=m?'':'none'; if(m)shown++; });
  const note=card.querySelector('.plan-nomatch'); if(note) note.style.display=(q&&shown===0)?'':'none';
}
function renderPlanes(){
  let html=`<div class="section-head"><h1>Planes y materiales</h1><div class="desc">Lista de materiales (BOM) por plan · catálogo de productos compartido</div><div class="sp"></div>
    <button class="btn ghost" onclick="reloadMateriales()">Recargar materiales de fábrica</button>
    <button class="btn ghost" onclick="prodCatalog()"> Catálogo de productos</button></div>`;
  html+=`<div class="row" style="gap:10px;margin:0 0 14px;flex-wrap:wrap;align-items:center">
    <label class="muted small" for="plan-sort">Ordenar materiales:</label>
    <select id="plan-sort" class="matsearch" onchange="PLAN_ITEM_SORT=this.value;renderPlanes()">
      <option value="ref-asc" ${PLAN_ITEM_SORT==='ref-asc'?'selected':''}>Código A - Z</option>
      <option value="ref-desc" ${PLAN_ITEM_SORT==='ref-desc'?'selected':''}>Código Z - A</option>
      <option value="desc-asc" ${PLAN_ITEM_SORT==='desc-asc'?'selected':''}>Descripción A - Z</option>
      <option value="pn-asc" ${PLAN_ITEM_SORT==='pn-asc'?'selected':''}>PN A - Z</option>
      <option value="cant-desc" ${PLAN_ITEM_SORT==='cant-desc'?'selected':''}>Cantidad mayor a menor</option>
      <option value="cant-asc" ${PLAN_ITEM_SORT==='cant-asc'?'selected':''}>Cantidad menor a mayor</option>
    </select></div>`;
  html+=`<div class="grid planes-grid">`;
  // Orden por defecto POR HORAS: primero motor/bomba por intervalo ascendente (Alfa Zero, Alfa, ...), luego calendario/pads. Estable.
  const _ordKey=p=>[(p.fuente==='motor'||p.fuente==='bomba')?0:1, Number(p.intervalo)||0];
  const _planesOrd=[...PLANES].sort((a,b)=>{ const ka=_ordKey(a), kb=_ordKey(b); return ka[0]-kb[0] || ka[1]-kb[1]; });
  _planesOrd.forEach(pl=>{
    const all=DB.bom.filter(b=>b.plan===pl.key);
    const items=all.filter(b=>b.tipo!=='inspeccion'), insps=all.filter(b=>b.tipo==='inspeccion');
    const itemsV=planItemsView(items);
    html+=`<div class="card"><h3><span class="tag">${pl.nombre}</span> ${pl.componente} <span class="sub">${num(pl.intervalo)}h · ${pl.fuente}</span><span class="tag" style="margin-left:8px;background:#0c1626;color:#7fd0ff;border-color:#1c3a54" title="Cantidad de materiales cargados en este plan">${items.length} mat.${insps.length?` · ${insps.length} insp.`:''}</span></h3>`;
    if(!items.length && !insps.length) html+=`<div class="muted small" style="margin-bottom:8px">Sin materiales ni inspecciones cargados.</div>`;
    if(items.length+insps.length>0) html+=`<input class="matsearch" style="width:100%;margin:2px 0 8px" placeholder="Buscar en este plan por código, PN o descripción..." oninput="planCardFilter(this)" autocomplete="off">`;
    if(itemsV.length){
      html+=`<table style="font-size:12px"><tbody>`;
      itemsV.forEach(b=>{ const p=prodById(b.productoId); const alts=(b.alternativas||[]).map(id=>prodById(id)).filter(Boolean);
        const s=esc(((p?.refInterna||'')+' '+(p?.partNumber||'')+' '+(p?.descripcion||'')).toLowerCase());
        html+=`<tr data-s="${s}"><td style="padding:5px 4px"><b class="mono small" style="color:#9fb0d8">${esc(p?.refInterna||'?')}</b>${p?.partNumber?` <span class="muted" style="font-size:10px">PN ${esc(p.partNumber)}</span>`:''}${b.traerHistorial?` <span class="tag" style="background:#0c1a12;color:#5fe0a0;border-color:#1c5440;font-size:9px;padding:0 5px" title="Trae su historial: el plan usa la última vez que se reemplazó este producto (aunque haya sido en otro plan) para estimar las próximas horas">historial</span>`:''}<br><span class="small">${esc(p?.descripcion||'(eliminado)')}</span>${alts.length?`<div class="muted" style="font-size:10.5px;margin-top:2px">o alternativa: ${alts.map(a=>esc(a.partNumber||a.refInterna)).join(' · ')}</div>`:''}</td><td class="right mono">${num(b.cantidad)} ${esc(p?.unidad||'')}</td><td class="right" style="white-space:nowrap"><button class="iconbtn" style="height:24px;font-size:11px" onclick="bomForm('${pl.key}','${b.id}')">Editar</button> <button class="iconbtn" style="width:24px;height:24px;font-size:11px" onclick="bomDelete('${b.id}')">×</button></td></tr>`; });
      html+=`</tbody></table>`;
    }
    if(insps.length){
      html+=`<div style="font-size:10.5px;margin:9px 0 3px;color:#6fc0ff;font-weight:600">Inspecciones / chequeos</div><table style="font-size:12px"><tbody>`;
      insps.forEach(b=>{ const d=inspDesc(b); const s=esc(((inspNombre(b)||'')+' '+(d||'')).toLowerCase()); html+=`<tr data-s="${s}"><td style="padding:5px 4px"><span class="small">${esc(inspNombre(b))}</span>${d?`<div class="muted" style="font-size:10.5px;margin-top:2px">${esc(d)}</div>`:''}</td><td class="right" style="white-space:nowrap"><button class="iconbtn" style="height:24px;font-size:11px" onclick="inspForm('${pl.key}','${b.id}')">Editar</button> <button class="iconbtn" style="width:24px;height:24px;font-size:11px" onclick="bomDelete('${b.id}')">×</button></td></tr>`; });
      html+=`</tbody></table>`;
    }
    html+=`<div class="plan-nomatch muted small" style="display:none;padding:6px 2px">Sin coincidencias en este plan.</div>`;
    html+=`<div class="row" style="gap:6px;margin-top:10px"><button class="btn ghost sm" style="flex:1" onclick="bomForm('${pl.key}')">+ Material</button><button class="btn ghost sm" style="flex:1" onclick="inspForm('${pl.key}')">+ Inspección</button></div>
      <div class="row" style="margin-top:6px"><button class="btn ghost sm" style="flex:1" onclick="bomImportForm('${pl.key}')">Importar materiales de Excel</button></div></div>`;
  });
  html+=`</div>`;
  M.innerHTML=html;
}
let BOM_ALTS=[], BOM_EDIT_PID=null;
function prodOptionsHTML(sel){ return [...DB.productos].sort((a,c)=>(a.refInterna||'')<(c.refInterna||'')?-1:1).map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.refInterna)} — ${esc(p.descripcion)}${p.partNumber?' (PN '+esc(p.partNumber)+')':''}</option>`).join(''); }
function prodLabelText(idOrP){ const p=(typeof idOrP==='string')?prodById(idOrP):idOrP; return p?((p.refInterna||'')+' — '+(p.descripcion||'')+(p.partNumber?' (PN '+p.partNumber+')':'')):''; }
function _prodMatch(q){ q=(q||'').trim().toLowerCase(); if(!q) return []; return DB.productos.filter(p=>((p.refInterna||'')+' '+(p.descripcion||'')+' '+(p.partNumber||'')).toLowerCase().includes(q)).sort((a,c)=>(a.refInterna||'')<(c.refInterna||'')?-1:1).slice(0,40); }
function _prodResHTML(list,fn){ return list.length ? list.map(p=>`<div class="prodrow" onclick="${fn}('${p.id}')"><b class="mono" style="color:#9fb0d8">${esc(p.refInterna||'?')}</b> ${esc(p.descripcion||'')}${p.partNumber?` <span class="muted">· PN ${esc(p.partNumber)}</span>`:''}</div>`).join('') : `<div class="prodrow muted">Sin resultados — creá el producto con el botón de abajo.</div>`; }
function bomProdSearch(){ const res=document.getElementById('f-prod-res'); if(!res) return; if(!val('f-prod-q').trim()){ res.hidden=true; return; } res.hidden=false; res.innerHTML=_prodResHTML(_prodMatch(val('f-prod-q')),'bomPickProd'); }
function bomPickProd(id){ const p=prodById(id); if(!p) return; document.getElementById('f-prod').value=id; const q=document.getElementById('f-prod-q'); if(q) q.value=prodLabelText(p); const res=document.getElementById('f-prod-res'); if(res) res.hidden=true; const sel=document.getElementById('f-prod-sel'); if(sel) sel.innerHTML='✓ '+esc(prodLabelText(p))+' <span class="linklike" onclick="bomEditProd(\''+id+'\')">✎ editar</span>'; }
function bomAltSearch(){ const res=document.getElementById('f-alt-res'); if(!res) return; if(!val('f-alt-q').trim()){ res.hidden=true; return; } res.hidden=false; res.innerHTML=_prodResHTML(_prodMatch(val('f-alt-q')),'bomAddAltId'); }
function bomAddAltId(id){ if(id && !BOM_ALTS.includes(id)) BOM_ALTS.push(id); renderBomAlts(); const q=document.getElementById('f-alt-q'); if(q) q.value=''; const res=document.getElementById('f-alt-res'); if(res){ res.hidden=true; res.innerHTML=''; } }
// Panel crear / editar producto SIN salir del formulario de material
function bomNewProdPanel(){ BOM_EDIT_PID=null; const box=document.getElementById('bom-newprod'); if(!box) return; document.getElementById('bom-np-title').textContent='Nuevo producto'; document.getElementById('bom-np-btn').textContent='Crear y agregar'; ['np-ref','np-desc','np-pn'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; }); box.hidden=false; const r=document.getElementById('np-ref'); if(r) r.focus(); }
function bomEditProd(id){ const p=prodById(id); if(!p) return; BOM_EDIT_PID=id; const box=document.getElementById('bom-newprod'); if(!box) return; document.getElementById('bom-np-title').textContent='Editar producto · '+(p.refInterna||''); document.getElementById('bom-np-btn').textContent='Guardar cambios'; document.getElementById('np-ref').value=p.refInterna||''; document.getElementById('np-desc').value=p.descripcion||''; document.getElementById('np-pn').value=p.partNumber||''; box.hidden=false; const d=document.getElementById('np-desc'); if(d) d.focus(); }
function bomGuardarProd(){
  const ref=val('np-ref').trim(), desc=val('np-desc').trim(), pn=val('np-pn').trim();
  if(!ref||!desc) return toast('Ref interna y descripción son obligatorias','err');
  if(BOM_EDIT_PID){   // EDITAR un producto existente (impacta en todos los planes y en la historia, porque se referencia por id)
    const p=prodById(BOM_EDIT_PID); if(p){ Object.assign(p,{refInterna:ref,descripcion:desc,partNumber:pn}); saveDB(); toast('Producto actualizado'); }
    renderBomAlts(); const fp=document.getElementById('f-prod'); if(fp && fp.value===BOM_EDIT_PID) bomPickProd(BOM_EDIT_PID); BOM_EDIT_PID=null;
  } else {            // CREAR un producto nuevo
    let p=DB.productos.find(x=>(x.refInterna&&x.refInterna.toLowerCase()===ref.toLowerCase())||(pn&&x.partNumber&&x.partNumber.toLowerCase()===pn.toLowerCase()));
    if(!p){ p={id:uid(),refInterna:ref,partNumber:pn,descripcion:desc,unidad:'Unidad'}; DB.productos.push(p); DB.stock.push({id:uid(),productoId:p.id,stockActual:0,leadTimeDias:(DB.params.leadTimeDefaultDias||120),costoUnitario:0,costoPedido:5000}); saveDB(); toast('Producto creado'); }
    else toast('Ese producto ya existía · lo uso');
    const fp=document.getElementById('f-prod');
    if(fp && !fp.value){ bomPickProd(p.id); }                                  // sin principal aún → lo pone de principal
    else if(fp && p.id!==fp.value && !BOM_ALTS.includes(p.id)){ BOM_ALTS.push(p.id); renderBomAlts(); }   // si no, como alternativa
  }
  ['np-ref','np-desc','np-pn'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  const box=document.getElementById('bom-newprod'); if(box) box.hidden=true;
}
function bomForm(planKey, bomId){ if(isRO())return roBlock();
  if(!DB.productos.length) return toast('Primero cargá productos en el catálogo','warn');
  const b = bomId ? DB.bom.find(x=>x.id===bomId) : null;
  BOM_ALTS = b ? [...(b.alternativas||[])] : [];
  const opts = prodOptionsHTML;
  const moverHTML = bomId ? `<div class="field full" style="border-top:1px solid var(--border);padding-top:10px"><label>Plan <span class="muted small">— si este producto cambió de plan, movelo acá</span></label>
      <select id="f-bplan" onchange="if(this.value!=='${planKey}')document.getElementById('f-traer').checked=true">${PLANES.map(p=>`<option value="${p.key}" ${planKey===p.key?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></div>
    <div class="field full"><label class="checkrow"><input type="checkbox" id="f-traer" ${b&&b.traerHistorial?'checked':''}> <b>Traer el historial de este producto</b> <span class="muted small">— el plan estima las próximas horas usando la última vez que se reemplazó este producto, aunque haya sido bajo otro plan</span></label></div>` : '';
  BOM_EDIT_PID=null;
  const body=`<div class="form-grid">
    <div class="field full"><label>Producto principal * <span class="muted small">(buscá por código, descripción o PN)</span></label>
      <input type="hidden" id="f-prod" value="${b?b.productoId:''}">
      <div style="position:relative"><input id="f-prod-q" placeholder="Escribí para buscar el producto…" autocomplete="off" value="${b?esc(prodLabelText(b.productoId)):''}" oninput="bomProdSearch()" onfocus="bomProdSearch()" onblur="setTimeout(()=>{const r=document.getElementById('f-prod-res');if(r)r.hidden=true},200)"><div id="f-prod-res" class="prodres" hidden></div></div>
      <div id="f-prod-sel" class="muted small" style="margin-top:4px">${b?('✓ '+esc(prodLabelText(b.productoId))+' <span class="linklike" onclick="bomEditProd(\''+b.productoId+'\')">✎ editar</span>'):''}</div></div>
    <div class="field"><label>Cantidad por intervención</label><input id="f-cant" type="number" min="0" step="1" value="${b?b.cantidad:1}"></div>

// separa una línea respetando comillas. La comilla doble SOLO es especial al inicio de un campo (regla CSV/TSV);
// una comilla suelta en el medio (ej: Junta 2") es literal y no rompe el resto de la fila.
function _impSplit(line,delim){ const out=[]; let cur='',q=false,atStart=true; for(let i=0;i<line.length;i++){ const c=line[i]; if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; } else { if(c==='"'&&atStart){ q=true; atStart=false; } else if(c===delim){ out.push(cur); cur=''; atStart=true; } else { cur+=c; atStart=false; } } } out.push(cur); return out.map(s=>s.trim()); }
function _impParseText(text){ const lines=String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim().length); if(!lines.length) return []; const d0=lines[0]; const delim=d0.includes('\t')?'\t':(d0.includes(';')?';':','); return lines.map(l=>_impSplit(l,delim)); }
function _impIsHeader(cells){ const j=(cells||[]).join(' ').toLowerCase(); return /(producto|descrip|part\s*number|\bpn\b|cantidad|c[oó]digo)/.test(j) && !/\[/.test(cells[0]||'') && !/\d{2,}/.test((cells[1]||'')); }
function _impRowToItem(cells){
  const prod=(cells[0]||'').trim(), pn=(cells[1]||'').trim(), cantRaw=(cells[2]!=null?cells[2]:'');
  let cod='', desc=prod; const mBr=prod.match(/\[([^\]]+)\]/);
  if(mBr){ cod=mBr[1].trim(); desc=prod.replace(/\[[^\]]*\]/,'').replace(/^[\s\-–—:.]+/,'').trim(); }
  else { const m=prod.match(/^(\S+)\s+(.+)$/); if(m){ cod=m[1].trim(); desc=m[2].trim(); } }
  let cant=Math.round(Number(String(cantRaw).replace(/[^\d.,-]/g,'').replace(',','.'))||0); if(!(cant>0)) cant=1;
  return {cod, desc, pn, cant};
}
function bomImportAnalizar(){
  let rows=_impParseText(val('imp-txt'));

    const enPlan=p&&DB.bom.some(b=>b.plan===IMP_PLAN&&b.productoId===p.id&&b.tipo!=='inspeccion');
    const acc=enPlan?`<span class="tag" style="font-size:9px">ya en el plan · actualiza cant.</span>`:(p?`<span class="tag" style="font-size:9px;background:#0c1a12;color:#5fe0a0;border-color:#1c5440">existente → al plan</span>`:`<span class="tag" style="font-size:9px;background:#241a2e;color:#caa8e0;border-color:#4a3a5f">nuevo</span>`);
    return `<tr><td class="mono small">${esc(it.cod||'—')}</td><td class="small">${esc(it.desc||'—')}</td><td class="mono small">${esc(it.pn||'—')}</td><td class="right mono">${num(it.cant)}</td><td>${acc}</td></tr>`;
  }).join('');
  const enPlanActual=DB.bom.filter(b=>b.plan===IMP_PLAN&&b.tipo!=='inspeccion').length;
  prev.innerHTML=`<div class="muted small" style="margin:8px 0 4px"><b>${items.length}</b> fila(s) detectada(s):</div>
    <div class="table-wrap" style="border:none;max-height:230px;overflow:auto"><table style="font-size:12px"><thead><tr><th>Código</th><th>Descripción</th><th>PN</th><th class="right">Cant.</th><th>Acción</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    <label class="checkrow" style="margin-top:10px"><input type="checkbox" id="imp-replace" checked> <b>Reemplazar los materiales actuales del plan</b> <span class="muted small">— borra los ${enPlanActual} que ya tiene y deja solo estos ${items.length} (las inspecciones no se tocan)</span></label>

function bomImportApply(){ if(isRO())return roBlock();

  const planKey=IMP_PLAN; let nuevos=0,bomAdd=0,bomUpd=0,corr=0;
  const replace=!!(document.getElementById('imp-replace')&&document.getElementById('imp-replace').checked);
  const keepIds=new Set();   // productos que quedan en el plan tras importar
  const seen=new Set();      // productos ya escritos en ESTA importación (para sumar si el producto viene repetido en el Excel)
  IMP_PARSED.forEach(it=>{
    let p=DB.productos.find(x=>(it.pn&&x.partNumber&&x.partNumber.toLowerCase()===it.pn.toLowerCase())||(it.cod&&x.refInterna&&x.refInterna.toLowerCase()===it.cod.toLowerCase()));
    if(p){ if(it.desc && it.desc!==p.descripcion){ p.descripcion=it.desc; corr++; } if(it.pn && !p.partNumber) p.partNumber=it.pn; if(it.cod && !p.refInterna) p.refInterna=it.cod; }

    keepIds.add(p.id);
    const ex=DB.bom.find(b=>b.plan===planKey&&b.productoId===p.id&&b.tipo!=='inspeccion');
    if(ex){
      if(seen.has(p.id)) ex.cantidad=(Number(ex.cantidad)||0)+it.cant;   // repetido en el Excel → sumar cantidades
      else { ex.cantidad=it.cant; bomUpd++; }                            // primera vez → reemplaza la cantidad anterior
    } else { DB.bom.push({id:uid(),plan:planKey,productoId:p.id,cantidad:it.cant,alternativas:[]}); bomAdd++; }
    seen.add(p.id);
  });
  let quitados=0;
  if(replace){   // dejar SOLO lo importado: quitar los materiales del plan que no vinieron en la lista (las inspecciones no se tocan)
    const antes=DB.bom.length;
    DB.bom=DB.bom.filter(b=>!(b.plan===planKey && b.tipo!=='inspeccion' && !keepIds.has(b.productoId)));
    quitados=antes-DB.bom.length;

  saveDB(); closeModal(); renderPlanes();
  toast(`Importados: ${bomAdd} al plan · ${bomUpd} actualizados · ${nuevos} nuevos${quitados?` · ${quitados} quitado(s)`:''}${corr?` · ${corr} descripción(es) corregida(s)`:''}`);
}

// Lector .xlsx sin librerías: descomprime el ZIP (central directory + DecompressionStream) y lee la 1ª hoja.
function _colToIdx(letters){ let n=0; for(let i=0;i<letters.length;i++) n=n*26+(letters.charCodeAt(i)-64); return n-1; }
async function _unzip(buf){
  let eo=-1; for(let i=buf.length-22;i>=0 && i>buf.length-22-65536;i--){ if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){ eo=i; break; } }
  if(eo<0) throw new Error('zip inválido');
  const dv=new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const nEnt=dv.getUint16(eo+10,true); let off=dv.getUint32(eo+16,true); const out={};
  for(let e=0;e<nEnt;e++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commLen=dv.getUint16(off+32,true), lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(buf.subarray(off+46, off+46+nameLen));
    const lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true), dataStart=lho+30+lNameLen+lExtraLen;
    const comp=buf.subarray(dataStart, dataStart+compSize);
    if(/\.xml$/i.test(name)){ out[name]= method===0 ? comp : new Uint8Array(await new Response(new Blob([comp]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
    off += 46 + nameLen + extraLen + commLen;
  }
  return out;
}
async function _impXlsx(file){
  const zip=await _unzip(new Uint8Array(await file.arrayBuffer())); const dec=new TextDecoder();
  const shared=[]; const ssName=Object.keys(zip).find(n=>/sharedStrings\.xml$/i.test(n));
  if(ssName){ const doc=new DOMParser().parseFromString(dec.decode(zip[ssName]),'application/xml'); doc.querySelectorAll('si').forEach(si=>shared.push(Array.from(si.querySelectorAll('t')).map(t=>t.textContent).join(''))); }
  const shName=Object.keys(zip).find(n=>/worksheets\/sheet1\.xml$/i.test(n))||Object.keys(zip).find(n=>/worksheets\/.*\.xml$/i.test(n)); if(!shName) throw new Error('sin hoja');
  const doc=new DOMParser().parseFromString(dec.decode(zip[shName]),'application/xml'); const rows=[];
  doc.querySelectorAll('row').forEach(r=>{ const cells=[]; r.querySelectorAll('c').forEach(c=>{ const ci=_colToIdx((c.getAttribute('r')||'').replace(/[0-9]/g,'')); const t=c.getAttribute('t'); let v=''; const isEl=c.getElementsByTagName('is')[0], vEl=c.getElementsByTagName('v')[0]; if(t==='s'&&vEl) v=shared[Number(vEl.textContent)]||''; else if(t==='inlineStr'&&isEl) v=Array.from(isEl.getElementsByTagName('t')).map(x=>x.textContent).join(''); else if(vEl) v=vEl.textContent; if(ci>=0) cells[ci]=v; else cells.push(v); }); rows.push(cells); });
  return rows;
}

/* ============================================================
   STOCK / INVENTARIO  (EOQ · ROP · Stock de seguridad)
   ============================================================ */
// Demanda anual proyectada por producto, explotando BOM de mantenimientos proyectados (próx 365 d)
function demandaAnualProductos(){
  const dem={}; const maints=allProjectedMaints().filter(m=>m.diasRestantes<=365);
  maints.forEach(m=>{ DB.bom.filter(b=>b.plan===m.plan.key && b.tipo!=='inspeccion' && b.productoId).forEach(b=>{ dem[b.productoId]=(dem[b.productoId]||0)+Number(b.cantidad); }); });
  return dem;
}
function stockAnalysis(){
  const dem=demandaAnualProductos();
  const z=DB.params.zServicio||1.65;
  return DB.stock.map(s=>{
    const p=prodById(s.productoId); if(!p) return null;
    const D=dem[s.productoId]||0;                       // demanda anual proyectada
    const dDia=D/365;
    const LT=Number(s.leadTimeDias)||DB.params.leadTimeDefaultDias;
    const demLT=dDia*LT;                                // demanda durante lead time
    const sigmaLT=Math.sqrt(LT)*dDia*0.5;              // var. estimada (50% de la media diaria)
    const SS=Math.round(z*sigmaLT);                     // stock de seguridad
    const ROP=Math.round(demLT+SS);                     // punto de pedido
    const S=Number(s.costoPedido)||5000, H=Math.max(1,(Number(s.costoUnitario)||1)*0.25); // costo mantener 25%/año
    const EOQ=D>0?Math.round(Math.sqrt(2*D*S/H)):0;     // lote óptimo
    const aPedir=Math.max(0, ROP+EOQ-(Number(s.stockActual)||0));
    const bajoROP=(Number(s.stockActual)||0)<ROP;
    return {s,p,D,LT,SS,ROP,EOQ,aPedir,bajoROP,stockActual:Number(s.stockActual)||0};
  }).filter(Boolean);
}
function coberturaStock(){
  const a=stockAnalysis().filter(x=>x.D>0);
  if(!a.length) return {pct:100,cls:'green',faltantes:0};
  const ok=a.filter(x=>!x.bajoROP).length;
  const pct=Math.round(ok/a.length*100);
  return {pct,faltantes:a.length-ok,cls:pct>=85?'green':pct>=60?'amber':'red'};
}
function renderStock(){
  const a=stockAnalysis();
  let html=`<div class="section-head"><h1>Stock / Inventario</h1><div class="desc">Cálculo automático de punto de pedido (ROP), stock de seguridad y lote óptimo (EOQ)</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('stock')">Excel</button></div>`;
  html+=`<div class="help"><span class="ic">ℹ</span><div>La <b>demanda</b> se calcula explotando la BOM de todos los mantenimientos proyectados a 12 meses. Fórmulas: <b>ROP</b> = demanda(lead time) + stock seguridad · <b>SS</b> = z·σ<sub>LT</sub> (z=${DB.params.zServicio}) · <b>EOQ</b> = √(2·D·S/H).</div></div>`;
  html+=`<div class="table-wrap"><table><thead><tr><th>Producto</th><th class="right">Stock</th><th class="right">Demanda/año</th><th class="right">Lead (d)</th><th class="right">Stock seg.</th><th class="right">ROP</th><th class="right">EOQ</th><th class="right">A fabricar</th><th>Estado</th><th></th></tr></thead><tbody>`;
  const sorted=[...a].sort((x,y)=>(y.bajoROP?1:0)-(x.bajoROP?1:0)|| y.D-x.D);
  sorted.forEach(x=>{
    html+=`<tr><td><b class="mono small" style="color:#9fb0d8">${esc(x.p.refInterna)}</b><br><span class="small">${esc(x.p.descripcion)}</span>${x.p.partNumber?`<br><span class="muted" style="font-size:10px">PN: ${esc(x.p.partNumber)}</span>`:''}</td>
      <td class="right mono">${num(x.stockActual)}</td><td class="right mono">${num(x.D)}</td><td class="right mono">${x.LT}</td>
      <td class="right mono">${num(x.SS)}</td><td class="right mono">${num(x.ROP)}</td><td class="right mono">${num(x.EOQ)}</td>
      <td class="right mono"><b ${x.aPedir>0&&x.bajoROP?'style="color:var(--amber)"':''}>${num(x.aPedir)}</b></td>
      <td><span class="pill ${x.bajoROP&&x.D>0?'rojo':(x.D>0?'verde':'gris')}">${x.D>0?(x.bajoROP?'Reponer':'OK'):'Sin demanda'}</span></td>
      <td class="actions"><button class="iconbtn" onclick="stockForm('${x.s.id}')">Editar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  // recomendaciones de fabricación
  const rep=sorted.filter(x=>x.bajoROP&&x.D>0);
  if(rep.length){
    html+=`<div class="card" style="margin-top:16px"><h3>Plan de fabricación recomendado</h3><div class="muted small" style="margin-bottom:10px">Ítems por debajo del punto de pedido — lanzar producción ahora:</div>`;
    rep.forEach(x=>{ html+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1b2336"><span><b class="mono small" style="color:#9fb0d8">${esc(x.p.refInterna)}</b> ${esc(x.p.descripcion)}${x.p.partNumber?` <span class="muted small">(PN ${esc(x.p.partNumber)})</span>`:''}</span><span><b style="color:var(--amber)">Fabricar ${num(x.aPedir)}</b> ${esc(x.p.unidad)} · lead ${x.LT}d</span></div>`; });
    html+=`</div>`;
  }
  M.innerHTML=html;
}

let calMonth=new Date(2026,5,1); calMonth.setDate(1);

  // Vencimientos de certificaciones por día (no archivadas)

// ---------- Archivos (File System Access API, reutiliza la carpeta conectada FS_DIR) ----------
function certFsListo(){ return !!FS_DIR; }
function certSanitize(s){ return String(s||'').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim(); }
function equipoQMInfo(eq){ const nom=(eq&&eq.nombre)||''; const mp=nom.match(/\((\d+)\)/); const idQM=mp?mp[1]:''; const mn=nom.match(/(\d+)/); const prome=mn?String(parseInt(mn[1],10)):''; return {idQM,prome}; }
function equipoFolderName(eq){ if(!eq) return 'Sin equipo'; const {idQM,prome}=equipoQMInfo(eq); return certSanitize(`Certificaciones QM ${idQM||'-'} (PROME ${prome||'-'})`); }
function certPdfBaseName(cert,serial){ const eq=DB.equipos.find(e=>e.id===cert.equipoId); const cat=certCat(cert.categoriaId);
  // En certificaciones por componente el SN siempre va en el nombre (aunque no se elija en el desplegable): lo toma del componente.

async function certDirEquipos(create){
  if(!FS_DIR) return null;

  try{ return await FS_DIR.getDirectoryHandle('Equipos',{create:!!create}); }catch(e){ return null; }
}
async function certDirFor(eq,cat,sub,create){
  const root=await certDirEquipos(create); if(!root) return null;
  try{
    const eqd=await root.getDirectoryHandle(equipoFolderName(eq),{create:!!create});
    const catd=await eqd.getDirectoryHandle(certSanitize(cat.nombre),{create:!!create});
    return await catd.getDirectoryHandle(sub,{create:!!create});
  }catch(e){ return null; }
}
async function certListVigente(eq,cat){ const d=await certDirFor(eq,cat,'vigente',true); if(!d) return []; const out=[]; try{ for await (const [name,h] of d.entries()){ if(h.kind==='file') out.push(name); } }catch(e){} return out; }
async function certMoveFile(fromDir,toDir,name,newName){
  let fh; try{ fh=await fromDir.getFileHandle(name); }catch(e){ return false; }
  const file=await fh.getFile();
  const dest=await toDir.getFileHandle(newName||name,{create:true});
  const w=await dest.createWritable(); await w.write(await file.arrayBuffer()); await w.close();
  if((newName||name)!==name || fromDir!==toDir){ try{ await fromDir.removeEntry(name); }catch(e){} }
  return true;
}
// Renombra dentro de 'vigente' al nombre estándar (evitando colisión)
async function certRenombrarVigente(eq,cat,oldName,newBase){
  const d=await certDirFor(eq,cat,'vigente',true); if(!d) return oldName;
  const ext=(oldName.match(/\.[a-z0-9]+$/i)||['.pdf'])[0];
  let target=newBase+ext;
  if(target===oldName) return oldName;
  // evitar pisar otro archivo existente
  const existentes=await certListVigente(eq,cat); let n=1; while(existentes.includes(target) && target!==oldName){ target=newBase+' ('+(++n)+')'+ext; }

// Mueve los PDF de una certificación de vigente → obsoleta (housekeeping al vencer/archivar)
async function certMoverAObsoleta(cert){

  const vig=await certDirFor(eq,cat,'vigente',true), obs=await certDirFor(eq,cat,'obsoleta',true); if(!vig||!obs) return 0;

// Barrido al abrir la app: certificaciones VENCIDAS con PDF aún en vigente → moverlos a obsoleta (idempotente por c.pdfMovido)

function compSinPdf(compId){ const certs=compCerts(compId,false); return certs.length>0 && !certs.some(c=>(c.pdfs||[]).length>0); }
let COMP_F={cat:'todos',equipo:'todos',estado:'todos',q:''};
let COMP_SORT={col:null,dir:'asc'};   // ordenar tabla componentes por SN / PN / equipo (A-Z / Z-A)
function compSortVal(k,col){
  if(col==='sn') return (k.sn||'').toLowerCase();
  if(col==='pn') return (k.partNumber||'').toLowerCase();
  if(col==='equipo'){ const eq=DB.equipos.find(e=>e.id===k.equipoId); return eq?(parseInt(equipoQMInfo(eq).prome,10)||9998):9999; }   // por número PROME; Sin asignar al final
  return '';
}
function compToggleSort(col){ if(COMP_SORT.col!==col) COMP_SORT={col,dir:'asc'}; else if(COMP_SORT.dir==='asc') COMP_SORT.dir='desc'; else COMP_SORT={col:null,dir:'asc'}; renderComponentes(); }
function renderComponentes(){
  const catsComp=DB.certCategorias.filter(c=>c.porComponente);
  let html=`<div class="section-head"><h1>Componentes</h1><div class="desc">Componentes certificables (SN) que rotan entre equipos · las certificaciones cuelgan de cada componente</div><div class="sp"></div>
    <button class="btn ghost rw" onclick="compPnNamesPanel()">Nombres de PN</button>
    <button class="btn ghost rw" onclick="compImportForm()">⭱ Importar componentes</button>
    <button class="btn ghost rw" onclick="compCertImportForm()">⭱ Importar certificados</button>
    <button class="btn rw" onclick="compForm()">+ Nuevo componente</button></div>`;
  if(!catsComp.length){ html+=`<div class="help"><span class="ic">ℹ</span><div>No hay categorías marcadas como <b>por componente</b>. Andá a <b>Certificaciones → Categorías</b> y marcá alguna (ej: Cañería de alta) como "Componente (SN)".</div></div>`; M.innerHTML=html; return; }
  const catOpts=`<option value="todos">Todas las categorías</option>`+catsComp.map(c=>`<option value="${c.id}" ${COMP_F.cat===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('');
  const eqOpts=`<option value="todos">Todos los equipos</option><option value="__none__" ${COMP_F.equipo==='__none__'?'selected':''}>— Sin asignar —</option>`+DB.equipos.filter(e=>e.estado!=='Baja').map(e=>`<option value="${e.id}" ${COMP_F.equipo===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('');
  const estOpts=[['todos','Todos los estados'],['vencida','Vencida'],['porvencer','Por vencer'],['vigente','Vigente'],['sincert','Sin certificado (sin datos)'],['sinpdf','Sin PDF (falta archivo)']].map(o=>`<option value="${o[0]}" ${COMP_F.estado===o[0]?'selected':''}>${o[1]}</option>`).join('');
  html+=`<div class="row" style="gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <input class="matsearch" style="flex:1;min-width:220px" placeholder="Buscar por SN, descripción, PN..." value="${esc(COMP_F.q)}" oninput="COMP_F.q=this.value;compReRender(true)" autocomplete="off">
    <select class="matsearch" onchange="COMP_F.cat=this.value;renderComponentes()">${catOpts}</select>
    <select class="matsearch" onchange="COMP_F.equipo=this.value;renderComponentes()">${eqOpts}</select>
    <select class="matsearch" onchange="COMP_F.estado=this.value;renderComponentes()">${estOpts}</select></div>`;
  // Base: filtra por categoría / equipo / búsqueda (SIN el estado) para el resumen; la tabla aplica también el estado
  const base=(DB.componentes||[]).filter(k=>{
    if(COMP_F.cat!=='todos'&&k.categoriaId!==COMP_F.cat) return false;
    if(COMP_F.equipo==='__none__'){ if((k.equipoId||'')!=='') return false; } else if(COMP_F.equipo!=='todos'&&(k.equipoId||'')!==COMP_F.equipo) return false;
    if(COMP_F.q){ const q=COMP_F.q.toLowerCase(); if(!((k.sn||'')+' '+(k.descripcion||'')+' '+(k.partNumber||'')+' '+pnNombre(k.partNumber)).toLowerCase().includes(q)) return false; }
    return true;
  });
  // Resumen (fijo, no depende del estado elegido): así, mirando vigentes/por vencer, igual ves cuántos faltan certificar
  const _cnt={vencida:0,porvencer:0,vigente:0,sincert:0}; base.forEach(k=>_cnt[compEstado(k.id).estado]++);
  const _sp=[]; const _c=CERT_EST;
  if(_cnt.vencida) _sp.push(`<span style="color:${_c.vencida.c}">${_cnt.vencida} vencido(s)</span>`);
  if(_cnt.porvencer) _sp.push(`<span style="color:${_c.porvencer.c}">${_cnt.porvencer} por vencer</span>`);
  if(_cnt.vigente) _sp.push(`<span style="color:${_c.vigente.c}">${_cnt.vigente} vigente(s)</span>`);
  if(_cnt.sincert) _sp.push(`<span class="linklike" style="color:${_c.sincert.c};font-weight:600" onclick="COMP_F.estado='sincert';renderComponentes()" title="No tienen ninguna certificación cargada (sin datos)">${_cnt.sincert} sin certificado →</span>`);
  const _sinPdf=base.filter(k=>compSinPdf(k.id)).length;
  if(_sinPdf) _sp.push(`<span class="linklike" style="color:#e6b860;font-weight:600" onclick="COMP_F.estado='sinpdf';renderComponentes()" title="Tienen certificación cargada pero falta adjuntar el PDF (certificado físico)">${_sinPdf} sin PDF →</span>`);
  html+=`<div class="muted small" style="margin:-4px 0 12px">${base.length} componente(s)${_sp.length?' · '+_sp.join(' · '):''}</div>`;
  // Aviso de faltantes según la ficha técnica (crítico): si el filtro es un equipo, el de ese equipo; si es "todos", el total
  (()=>{ if(COMP_F.equipo!=='todos'&&COMP_F.equipo!=='__none__'){ const falt=fichaFaltantes(COMP_F.equipo); if(falt.length){ html+=`<div class="card" style="margin-bottom:12px;border-color:#5a1f22;background:linear-gradient(180deg,#1f1012,var(--panel));padding:8px 12px;font-size:12px"><b style="color:#ff8a8e">Faltan piezas (según la ficha):</b> ${falt.map(f=>`${esc(f.nombre)} <b>${f.actual}/${f.esperado}</b>`).join(' · ')} <span class="linklike" onclick="route('ficha')">ver ficha</span></div>`; } }
    else { const ef=fichaEquiposConFaltantes(); if(ef.length){ html+=`<div class="card" style="margin-bottom:12px;border-color:#5a1f22;background:linear-gradient(180deg,#1f1012,var(--panel));padding:8px 12px;font-size:12px"><b style="color:#ff8a8e">${fichaFaltantesTotal()} pieza(s) faltante(s)</b> en ${ef.length} equipo(s) según la ficha. <span class="linklike" onclick="route('ficha')">ver ficha</span></div>`; } } })();
  let comps=base.filter(k=> COMP_F.estado==='todos' ? true : (COMP_F.estado==='sinpdf' ? compSinPdf(k.id) : compEstado(k.id).estado===COMP_F.estado));
  if(COMP_SORT.col){ const col=COMP_SORT.col, dir=COMP_SORT.dir==='desc'?-1:1;
    comps.sort((a,b)=>{ const va=compSortVal(a,col), vb=compSortVal(b,col); if(va<vb) return -1*dir; if(va>vb) return 1*dir; return 0; });
  } else { const key=k=>{ const v=compProxVenc(k.id); return v?parseD(v).getTime():Infinity; }; comps.sort((a,b)=>key(a)-key(b)); }
  const _arr=col=>COMP_SORT.col===col?(COMP_SORT.dir==='asc'?' ▲':' ▼'):' ↕';
  const _th=(col,label)=>`<th style="cursor:pointer;user-select:none" onclick="compToggleSort('${col}')" title="Ordenar">${label}${_arr(col)}</th>`;
  html+=`<div class="table-wrap"><table><thead><tr>${_th('sn','SN')}<th>Categoría</th><th>Nombre / descripción</th>${_th('pn','PN')}${_th('equipo','Equipo actual')}<th>Estado cert.</th><th>Próx. venc.</th><th>Cert.</th><th class="actions"></th></tr></thead><tbody>`;
  if(!comps.length) html+=`<tr><td colspan="9"><div class="empty"><span class="ic"></span>Sin componentes para el filtro.</div></td></tr>`;
  comps.forEach(k=>{
    const cat=certCat(k.categoriaId); const eq=DB.equipos.find(e=>e.id===k.equipoId); const est=compEstado(k.id); const pv=compProxVenc(k.id); const nC=compCerts(k.id,false).length;
    html+=`<tr><td style="white-space:nowrap"><b class="mono">${esc(k.sn||'(sin SN)')}</b></td><td><span class="tag">${esc(cat?cat.nombre:'?')}</span></td>
      <td class="small">${pnNombre(k.partNumber)?`<b>${esc(pnNombre(k.partNumber))}</b>${k.descripcion?`<div class="muted" style="font-size:10.5px">${esc(k.descripcion)}</div>`:''}`:esc(k.descripcion||'')}</td><td class="mono small">${esc(k.partNumber||'')}</td>
      <td>${eq?`<b>${esc(eq.nombre)}</b>`:'<span class="muted">Sin asignar</span>'}</td>
      <td>${certChip(est.estado)}${compSinPdf(k.id)?` <span class="tag" style="background:#241d0c;color:#e6b860;border-color:#5a4a1f" title="Falta adjuntar el PDF (certificado físico)">sin PDF</span>`:''}</td>
      <td class="mono">${pv?fmtD(pv):'—'}</td>
      <td class="mono">${nC}</td>
      <td class="actions">
        <button class="iconbtn rw" title="Agregar certificación a este componente" onclick="compCertForm('${k.id}')">+ Cert.</button>
        <button class="iconbtn rw" onclick="compReasignarForm('${k.id}')">Reasignar</button>
        <button class="iconbtn rw" onclick="compForm('${k.id}')">Editar</button>
        <button class="iconbtn rw" onclick="compDelete('${k.id}')">Eliminar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  html+=`<div class="muted small" style="margin-top:8px">El componente guarda su equipo actual (reasignable/desasociable). Cada certificación que le agregás tiene su propio vencimiento y PDF, y aparece en el cronograma. Ver todo en <span class="linklike" onclick="route('certificaciones')">Certificaciones</span>.</div>`;
  M.innerHTML=html;
}
function compReRender(keepFocus){ renderComponentes(); if(keepFocus){ const s=M.querySelector('.matsearch'); if(s){ s.focus(); try{ s.setSelectionRange(s.value.length,s.value.length); }catch(e){} } } }
/* ============================================================
   FICHA TÉCNICA DEL EQUIPO  — template general + override por equipo. Control de cantidad de piezas certificables.
   ============================================================ */
function fichaEqData(eqId){ DB.fichaEquipo=DB.fichaEquipo||{}; const d=DB.fichaEquipo[eqId]||(DB.fichaEquipo[eqId]={esp:{},cel:{}}); d.esp=d.esp||{}; d.cel=d.cel||{}; return d; }
function fichaEsperado(eqId,section,item){ if(section&&section.scope==='general') return Number(item.esperado)||0; const d=DB.fichaEquipo&&DB.fichaEquipo[eqId]; if(d&&d.esp&&d.esp[item.id]!=null&&d.esp[item.id]!=='') return Number(d.esp[item.id])||0; return Number(item.esperado)||0; }
function fichaCelda(eqId,section,fila,col){ const def=(fila.celdas&&fila.celdas[col.id])||''; if(col.scope==='general') return def; const d=DB.fichaEquipo&&DB.fichaEquipo[eqId]; const k=fila.id+'|'+col.id; if(d&&d.cel&&d.cel[k]!=null) return d.cel[k]; return def; }
function compCountNombre(eqId,nombre){ if(!nombre) return 0; const n=nombre.trim().toLowerCase(); return (DB.componentes||[]).filter(k=>(k.equipoId||'')===eqId && pnNombre(k.partNumber).trim().toLowerCase()===n).length; }
function fichaFaltantes(eqId){ const out=[]; (DB.fichaGeneral&&DB.fichaGeneral.secciones||[]).forEach(s=>{ if(s.tipo!=='piezas') return; (s.items||[]).forEach(it=>{ if(!it.nombre) return; const esp=fichaEsperado(eqId,s,it); if(esp<=0) return; const act=compCountNombre(eqId,it.nombre); if(act<esp) out.push({nombre:it.nombre,esperado:esp,actual:act,faltan:esp-act}); }); }); return out; }
function fichaEquiposConFaltantes(){ return (DB.equipos||[]).filter(e=>e.estado!=='Baja' && fichaFaltantes(e.id).length>0); }
function fichaFaltantesCat(eqId,catId){
  const porComp=(DB.certCategorias||[]).filter(c=>c.porComponente); const soloUna=porComp.length===1; let tot=0;
  (DB.fichaGeneral&&DB.fichaGeneral.secciones||[]).forEach(s=>{ if(s.tipo!=='piezas') return; (s.items||[]).forEach(it=>{ if(!it.nombre) return;
    const anyComp=(DB.componentes||[]).find(k=>pnNombre(k.partNumber).trim().toLowerCase()===it.nombre.trim().toLowerCase());
    const catDeTipo=anyComp?anyComp.categoriaId:(soloUna?porComp[0].id:null); if(catDeTipo!==catId) return;
    const esp=fichaEsperado(eqId,s,it), act=compCountNombre(eqId,it.nombre); if(act<esp) tot+=(esp-act);
  }); });
  return tot;
}
function fichaFaltantesTotal(){ return fichaEquiposConFaltantes().reduce((a,e)=>a+fichaFaltantes(e.id).reduce((b,f)=>b+f.faltan,0),0); }
let FICHA_EQ=null;
function fichaSetEq(id){ FICHA_EQ=id; renderFichaTecnica(); }
function fichaSetEsp(eqId,itemId,v){ if(isRO())return roBlock(); const d=fichaEqData(eqId); if(v===''||v==null) delete d.esp[itemId]; else d.esp[itemId]=Number(v)||0; saveDB(); renderFichaTecnica(); }
function fichaSetCel(eqId,filaId,colId,v){ if(isRO())return roBlock(); const d=fichaEqData(eqId); const k=filaId+'|'+colId; if(v==='') delete d.cel[k]; else d.cel[k]=v; saveDB(); }
function fichaSetEspGeneral(sid,itemId,v){ if(isRO())return roBlock(); const it=_fichaItem(sid,itemId); if(it){ it.esperado=v===''?0:Number(v)||0; saveDB(); renderFichaTecnica(); } }
function fichaSetCelGeneral(sid,filaId,colId,v){ if(isRO())return roBlock(); const s=_fichaSec(sid); const f=s&&(s.filas||[]).find(x=>x.id===filaId); if(f){ f.celdas=f.celdas||{}; if(v==='') delete f.celdas[colId]; else f.celdas[colId]=v; saveDB(); } }
const _fichaScopeBadge = s => s.scope==='general' ? '<span class="tag" style="background:#12261c;color:#5fe0a0;border-color:#1c5440" title="Un dato para toda la flota">general</span>' : '<span class="tag" style="background:#241a2e;color:#caa8e0;border-color:#4a3a5f" title="Cada equipo el suyo">por equipo</span>';
function renderFichaTecnica(){
  const eqs=(DB.equipos||[]).filter(e=>e.estado!=='Baja');
  if(!eqs.length){ M.innerHTML=`<div class="section-head"><h1>Ficha técnica</h1></div><div class="empty"><span class="ic"></span>No hay equipos.</div>`; return; }
  if(!FICHA_EQ||!eqs.some(e=>e.id===FICHA_EQ)) FICHA_EQ=eqs[0].id;
  const eq=DB.equipos.find(e=>e.id===FICHA_EQ);
  const sel=`<select class="selh" onchange="fichaSetEq(this.value)" style="min-width:210px">${eqs.map(e=>{const f=fichaFaltantes(e.id).length; return `<option value="${e.id}" ${e.id===FICHA_EQ?'selected':''}>${esc(e.nombre)}${f?' ⚠':''}</option>`;}).join('')}</select>`;
  let html=`<div class="section-head"><h1>Ficha técnica</h1><div class="desc">Datos técnicos del equipo · las secciones "general" son iguales para todos; las "por equipo" son propias</div><div class="sp"></div>${sel}
    <button class="btn ghost rw" onclick="fichaGeneralEditor()">Editar estructura / general</button></div>`;
  const falt=fichaFaltantes(eq.id);
  if(falt.length){
    html+=`<div class="card" style="margin-bottom:14px;border-color:#5a1f22;background:linear-gradient(180deg,#1f1012,var(--panel))"><h3 style="color:#ff8a8e;font-size:16px"><span style="display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--red);color:#fff;align-items:center;justify-content:center;font-weight:900">!</span> Faltan piezas dadas de alta <span class="sub">según la ficha, hay que sumar componentes</span></h3>`;
    falt.forEach(f=>{ html+=`<div class="row" style="justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--border)"><div><b>${esc(f.nombre)}</b> — esperadas <b>${f.esperado}</b> · cargadas <b style="color:#ff8a8e">${f.actual}</b> → <b style="color:#ff8a8e">faltan ${f.faltan}</b></div><button class="iconbtn rw" onclick="fichaIrAComponentes('${eq.id}','${esc(f.nombre)}')">Dar de alta</button></div>`; });
    html+=`</div>`;
  }
  (DB.fichaGeneral.secciones||[]).forEach(s=>{
    const esP=s.tipo==='piezas', gen=s.scope==='general';
    html+=`<div class="card" style="margin-bottom:14px"><h3>${esc(s.nombre)} ${esP?'<span class="tag" style="background:#0c1626;color:#6fb7ff;border-color:#1c3a54">certificable</span>':'<span class="tag">informativo</span>'} ${esP?_fichaScopeBadge(s):''}</h3>`;
    if(esP){
      html+=`<div class="table-wrap" style="border:none"><table style="font-size:12.5px"><thead><tr><th>Tipo de pieza (Nombre)</th><th class="right">Esperadas</th><th class="right">Cargadas</th><th class="right">Faltan</th></tr></thead><tbody>`;
      const items=(s.items||[]).filter(it=>it.nombre);
      if(!items.length) html+=`<tr><td colspan="4" class="muted small">Sin tipos. Agregalos en "Editar estructura".</td></tr>`;
      items.forEach(it=>{ const esp=fichaEsperado(eq.id,s,it), act=compCountNombre(eq.id,it.nombre), fal=esp-act;
        const oc=gen?`fichaSetEspGeneral('${s.id}','${it.id}',this.value)`:`fichaSetEsp('${eq.id}','${it.id}',this.value)`;
        html+=`<tr><td><b>${esc(it.nombre)}</b></td><td class="right"><input type="number" min="0" class="matsearch" style="width:66px;text-align:right" value="${esp}" onchange="${oc}" title="${gen?'Cantidad esperada para TODOS los equipos':'Cantidad esperada en este equipo'}"></td><td class="right mono">${act}</td><td class="right mono" style="color:${fal>0?'#ff8a8e':'var(--muted)'};font-weight:${fal>0?'800':'400'}">${fal>0?fal:'—'}</td></tr>`; });
      html+=`</tbody></table></div>`;
    } else {
      const cols=s.columnas||[], filas=s.filas||[];
      if(!cols.length||!filas.length) html+=`<div class="muted small">Sin columnas o filas. Definí la tabla en "Editar estructura".</div>`;
      else { html+=`<div class="table-wrap" style="border:none"><table style="font-size:12.5px"><thead><tr><th></th>${cols.map(c=>`<th>${esc(c.nombre)} ${c.scope==='general'?'<span class="tag" style="background:#12261c;color:#5fe0a0;border-color:#1c5440;font-size:9px;padding:0 4px" title="Igual para todos los equipos">gral</span>':'<span class="tag" style="background:#241a2e;color:#caa8e0;border-color:#4a3a5f;font-size:9px;padding:0 4px" title="Propio de cada equipo">×eq</span>'}</th>`).join('')}</tr></thead><tbody>`;
        filas.forEach(f=>{ html+=`<tr><td style="white-space:nowrap"><b>${esc(f.nombre||'—')}</b></td>${cols.map(c=>{ const cg=c.scope==='general'; const v=fichaCelda(eq.id,s,f,c); const oc=cg?`fichaSetCelGeneral('${s.id}','${f.id}','${c.id}',this.value)`:`fichaSetCel('${eq.id}','${f.id}','${c.id}',this.value)`; return `<td><input class="matsearch" style="width:100%;min-width:90px${cg?';background:#0e1f17;border-color:#1c5440':''}" value="${esc(v)}" onchange="${oc}" title="${cg?'General · igual para todos los equipos':'Propio de este equipo'}"></td>`; }).join('')}</tr>`; });
        html+=`</tbody></table></div>`; }
    }
    html+=`</div>`;
  });
  M.innerHTML=html;
}
function fichaIrAComponentes(eqId,nombre){ COMP_F={cat:'todos',equipo:eqId,estado:'todos',q:nombre||''}; route('componentes'); }
// ---- Editor de la estructura / general ----
function _fichaSec(id){ return (DB.fichaGeneral.secciones||[]).find(s=>s.id===id); }
function _fichaItem(sid,iid){ const s=_fichaSec(sid); return s&&(s.items||[]).find(x=>x.id===iid); }
function fichaSecNombre(id,v){ const s=_fichaSec(id); if(s){s.nombre=v; saveDB();} }
function fichaSecScope(id,v){ const s=_fichaSec(id); if(s){s.scope=v; saveDB(); fichaGeneralEditor();} }
function fichaSecDel(id){ if(!confirm('¿Eliminar la sección?'))return; DB.fichaGeneral.secciones=DB.fichaGeneral.secciones.filter(s=>s.id!==id); saveDB(); fichaGeneralEditor(); }
function fichaSecAdd(tipo){ const s={id:uid(),nombre:tipo==='piezas'?'Nueva sección certificable':'Nueva sección',tipo,scope:'equipo'}; if(tipo==='piezas') s.items=[]; else { s.columnas=[{id:uid(),nombre:'Valor',scope:'equipo'}]; s.filas=[]; } DB.fichaGeneral.secciones.push(s); saveDB(); fichaGeneralEditor(); }
function fichaItemAdd(sid){ const s=_fichaSec(sid); if(!s)return; s.items=s.items||[]; s.items.push({id:uid(),nombre:'',esperado:1}); saveDB(); fichaGeneralEditor(); }
function fichaItemDel(sid,iid){ const s=_fichaSec(sid); if(!s)return; s.items=(s.items||[]).filter(x=>x.id!==iid); saveDB(); fichaGeneralEditor(); }
function fichaItemPiezaNombre(sid,iid,v){ const it=_fichaItem(sid,iid); if(it){it.nombre=v.trim(); saveDB();} }
function fichaItemPiezaEsp(sid,iid,v){ const it=_fichaItem(sid,iid); if(it){it.esperado=v===''?0:Number(v)||0; saveDB();} }
function fichaColAdd(sid){ const s=_fichaSec(sid); if(!s)return; s.columnas=s.columnas||[]; s.columnas.push({id:uid(),nombre:'Columna',scope:'equipo'}); saveDB(); fichaGeneralEditor(); }
function fichaColScope(sid,cid,v){ const s=_fichaSec(sid); const c=s&&(s.columnas||[]).find(x=>x.id===cid); if(c){c.scope=v; saveDB(); fichaGeneralEditor();} }
function fichaColDel(sid,cid){ const s=_fichaSec(sid); if(!s)return; s.columnas=(s.columnas||[]).filter(c=>c.id!==cid); (s.filas||[]).forEach(f=>{ if(f.celdas) delete f.celdas[cid]; }); saveDB(); fichaGeneralEditor(); }
function fichaColNombre(sid,cid,v){ const s=_fichaSec(sid); const c=s&&(s.columnas||[]).find(x=>x.id===cid); if(c){c.nombre=v; saveDB();} }
function fichaFilaAdd(sid){ const s=_fichaSec(sid); if(!s)return; s.filas=s.filas||[]; s.filas.push({id:uid(),nombre:'',celdas:{}}); saveDB(); fichaGeneralEditor(); }
function fichaFilaDel(sid,fid){ const s=_fichaSec(sid); if(!s)return; s.filas=(s.filas||[]).filter(f=>f.id!==fid); saveDB(); fichaGeneralEditor(); }

// Aplica el cambio de equipo a un componente: sincroniza sus certificaciones y mueve los PDF (sin render/toast, para reusar en import)
async function compAplicarEquipo(k,newEqId){
  newEqId=newEqId||''; k.equipoId=newEqId;
  const certs=compCerts(k.id,false);
  for(const ct of certs){ const oldE=ct.equipoId||''; ct.equipoId=newEqId;
    if(certFsListo() && (ct.pdfs||[]).length && oldE!==newEqId){ const cat=certCat(ct.categoriaId); const sub=ct.archivada?'obsoleta':'vigente';
      const fromDir=await certDirFor(DB.equipos.find(e=>e.id===oldE)||null,cat,sub,true), toDir=await certDirFor(DB.equipos.find(e=>e.id===newEqId)||null,cat,sub,true);
      if(fromDir&&toDir){ for(const p of ct.pdfs){ const nuevo=certPdfBaseNameFor(ct,newEqId,p.serial); const ext=(p.name.match(/\.[a-z0-9]+$/i)||['.pdf'])[0]; const ok=await certMoveFile(fromDir,toDir,p.name,nuevo+ext); if(ok) p.name=nuevo+ext; } }
    }
  }
}
async function compReasignar(id,newEqId){
  const k=compById(id); if(!k) return; newEqId=newEqId||'';
  await compAplicarEquipo(k,newEqId);
  saveDB(); if(CURRENT==='componentes') renderComponentes(); else renderCertificaciones(); toast(newEqId?('Reasignado a '+eqName(newEqId)):'Desasociado del equipo');
}
// Resuelve el texto de equipo del Excel ("Prometheus 3", "Prome 3", "3"…) a un equipo por su número PROME. '' = Sin asignar, null = no encontrado.
function compResolveEquipo(txt){
  const s=(txt||'').trim(); if(!s) return {id:'',label:'Sin asignar',found:true};
  // Solo interpreto el número como PROME si el texto dice "prome…" o es un número puro (evita falsos positivos tipo "Zeus 9")
  if(/prome/i.test(s) || /^\d+$/.test(s.replace(/\s/g,''))){ const m=s.match(/(\d+)/); if(m){ const n=String(parseInt(m[1],10)); const eq=DB.equipos.find(e=>equipoQMInfo(e).prome===n); if(eq) return {id:eq.id,label:eq.nombre,found:true}; } }
  const low=s.toLowerCase(); const eq2=DB.equipos.find(e=>(e.nombre||'').toLowerCase()===low || (e.codigo||'').toLowerCase()===low);
  if(eq2) return {id:eq2.id,label:eq2.nombre,found:true};
  return {id:null,label:s+' (no encontrado)',found:false};
}
