function tipoTagHTML(tipo){
  if(tipo==='correctivo') return `<span class="tag" style="background:#3a2118;color:#ff9a6b;border-color:#5a3320">Correctivo</span>`;
  if(tipo==='inspeccion') return `<span class="tag" style="background:#16283a;color:#6fc0ff;border-color:#254a66">Inspección</span>`;
  if(tipo==='adelanto') return `<span class="tag" style="background:#0c1a12;color:#5fe0a0;border-color:#1c5440">↗ Adelanto</span>`;
  return `<span class="tag" style="background:#13261c;color:#5fe0a0;border-color:#1c5440">Preventivo</span>`;
}
// Lista unificada de intervenciones de un equipo, ordenada (más nueva primero)
function historiaEventos(eqId){
  const ev=[];
  DB.mantenimientos.filter(m=>m.equipoId===eqId&&m.fecha).forEach(m=>ev.push({kind:'mant',fecha:m.fecha,m}));
  (DB.adelantos||[]).filter(a=>a.equipoId===eqId&&a.fecha).forEach(a=>ev.push({kind:'adelanto',fecha:a.fecha,a}));
  (DB.pendientes||[]).filter(p=>p.equipoId===eqId&&p.estado==='hecho').forEach(p=>ev.push({kind:'parte2',fecha:p.fechaHecho||p.fecha||p.fechaOrigen,p}));
  ev.sort((x,y)=> x.fecha<y.fecha?1:(x.fecha>y.fecha?-1:0));
  return ev;
}
function historiaMatList(prods){
  const estGl={usado:'✓',adelantado:'↗',pendiente:'⏳',omitido:'✕'};
  return (prods||[]).map(x=>{ const g=x.libre?'':(estGl[x.estado]?estGl[x.estado]+' ':''); const p=prodById(x.productoId); if(!p) return (x.tipo==='inspeccion'||x.inspId||x.titulo)?`${g}🔍 ${esc(inspNombre(x))}`:''; return `${g}${esc(p.partNumber||p.refInterna)}${Number(x.cantidad)>1?' ×'+num(x.cantidad):''}`; }).filter(Boolean);
}

/* ============================================================
   PLANES Y MATERIALES (BOM)
   Modelo normalizado: Productos (catálogo) + BOM (plan↔producto).
   Decisión técnica: gestionar POR PRODUCTO con vista POR PLAN.
   ============================================================ */
function renderPlanes(){
  let html=`<div class="section-head"><h1>Planes y materiales</h1><div class="desc">Lista de materiales (BOM) por plan · catálogo de productos compartido</div><div class="sp"></div>
    <button class="btn ghost" onclick="reloadMateriales()">Recargar materiales de fábrica</button>

let BOM_ALTS=[];

  const body=`<div class="form-grid">

    <div class="field full"><label>Alternativas <span class="muted small">(se puede usar cualquiera de estas en lugar del principal; al ejecutar el plan elegís cuál)</span></label>
      <div id="bom-alts" style="margin-bottom:6px"></div>

  openModal(bomId?`Editar material · ${PLAN(planKey).nombre}`:`Agregar material · ${PLAN(planKey).nombre}`,body,()=>{
    const pid=val('f-prod'); const cant=Number(val('f-cant'))||1; const alts=BOM_ALTS.filter(a=>a!==pid);
    if(bomId){ Object.assign(b,{productoId:pid,cantidad:cant,alternativas:alts}); audit('Editar material del plan',PLAN(planKey).nombre); }
    else{ DB.bom.push({id:uid(),plan:planKey,productoId:pid,cantidad:cant,alternativas:alts}); audit('Agregar material al plan',PLAN(planKey).nombre); }

function renderBomAlts(){ const c=document.getElementById('bom-alts'); if(!c)return; c.innerHTML = BOM_ALTS.length ? BOM_ALTS.map((id,i)=>{ const p=prodById(id); return `<span class="tag" style="margin:2px 4px 2px 0;display:inline-block">${esc(p?(p.partNumber||p.refInterna):'?')} <span class="linklike" style="color:#e08a8a;font-weight:800" onclick="bomDelAlt(${i})">×</span></span>`; }).join('') : '<span class="muted small">Sin alternativas.</span>'; }
function bomAddAlt(){ const id=val('f-alt'); if(!id)return; if(!BOM_ALTS.includes(id)) BOM_ALTS.push(id); renderBomAlts(); }
function bomDelAlt(i){ BOM_ALTS.splice(i,1); renderBomAlts(); }
function bomDelete(id){ if(isRO())return roBlock(); DB.bom=DB.bom.filter(b=>b.id!==id); saveDB(); renderPlanes(); }

// Reemplaza SOLO el catálogo de materiales (productos+BOM+stock) por el de fábrica actualizado, conservando el resto de los datos
function reloadMateriales(){
  if(!confirm('¿Reemplazar el catálogo de materiales (productos, BOM y stock) por el de fábrica con las referencias internas corregidas?\n\nSe CONSERVAN equipos, lecturas, pads, mantenimientos y órdenes. Los valores de stock cargados a mano se intentan conservar por código.'))return;
  // preservar valores de stock por referencia interna o part number
  const prev={};
  DB.stock.forEach(s=>{ const p=DB.productos.find(x=>x.id===s.productoId); if(!p)return; const v={stockActual:s.stockActual,leadTimeDias:s.leadTimeDias,costoUnitario:s.costoUnitario,costoPedido:s.costoPedido}; if(p.refInterna)prev[p.refInterna]=v; if(p.partNumber)prev[p.partNumber]=v; });
  const fresh=seed();
  DB.productos=fresh.productos; DB.bom=fresh.bom;
  DB.stock=fresh.stock.map(s=>{ const p=fresh.productos.find(x=>x.id===s.productoId); const pv=p&&(prev[p.refInterna]||prev[p.partNumber]); return pv?{...s,...pv}:s; });
  audit('Recargar materiales','catálogo de fábrica (referencias B.xx)'); saveDB(); renderPlanes(); toast('Materiales actualizados a las referencias de fábrica');
}

function renderOrdenes(){
  const g=leadStatsGlobal();
  let html=`<div class="section-head"><h1>Órdenes de producción</h1><div class="desc">Lanzamiento, compromiso y recepción · plazos recalculados con historial real</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('ordenes')">Excel</button>
    <button class="btn" onclick="ordForm()">+ Nueva orden</button></div>`;
  html+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px">
    <div class="kpi"><div class="accent"></div><div class="lbl">Lead time promedio</div><div class="val mono">${g.avg}<small> d</small></div><div class="sub">${g.n} órdenes recibidas</div></div>
    <div class="kpi"><div class="accent"></div><div class="lbl">Variabilidad (σ)</div><div class="val mono">±${g.std}<small> d</small></div><div class="sub">desvío estándar</div></div>
    <div class="kpi ${g.cumpl>=85?'green':g.cumpl>=60?'amber':'red'}"><div class="accent"></div><div class="lbl">Cumplimiento</div><div class="val mono">${g.cumpl??'—'}<small>%</small></div><div class="sub">entregas en fecha</div></div>
    <div class="kpi amber"><div class="accent"></div><div class="lbl">Anticipación recomendada</div><div class="val mono">${Math.round(g.avg+(DB.params.zServicio||1.65)*g.std)}<small> d</small></div><div class="sub">lead + colchón ${(DB.params.zServicio)}σ</div></div></div>`;

  // recomendaciones de lanzamiento por mantenimiento proyectado
  html+=`<div class="card" style="margin-bottom:16px"><h3>Recomendaciones de lanzamiento <span class="sub">para mantenimientos proyectados</span></h3>
    <div class="table-wrap" style="border:none"><table><thead><tr><th>Equipo</th><th>Plan</th><th class="right">A las (h)</th><th>Mantenimiento</th><th>Lead recomendado</th><th>Lanzar antes de</th><th>Acción</th></tr></thead><tbody>`;
  const recs=allProjectedMaints().filter(m=>m.diasRestantes<=540).slice(0,20);
  if(!recs.length) html+=`<tr><td colspan="7" class="muted">Sin mantenimientos próximos.</td></tr>`;
  recs.forEach(m=>{
    const rl=recommendedLead(m.plan.key);
    const lanzar=toISO(addDays(parseD(m.date),-rl.dias));
    const urgente=daysBetween(todayISO(),lanzar)<=0;
    html+=`<tr><td><b>${esc(m.equipo.nombre)}</b></td><td><span class="tag">${m.plan.nombre}</span></td><td class="right mono">${num(m.horas)}</td><td class="mono">${m.vencido?'<span style="color:var(--red)">vencido</span>':fmtDShort(m.date)}</td>
      <td class="mono">${rl.dias} d ${rl.stats.n?'':'<span class="muted">(def.)</span>'}</td>
      <td class="mono" ${urgente?'style="color:var(--red);font-weight:700"':''}>${fmtDShort(lanzar)} ${urgente?'':''}</td>
      <td><button class="btn sm ghost" onclick="ordForm(null,'${m.plan.key}','${lanzar}','${m.equipo.id}',${m.horas})">Crear orden</button></td></tr>`;
  });
  html+=`</tbody></table></div></div>`;

  html+=`<div class="table-wrap"><table><thead><tr><th>Lanzamiento</th><th>Plan / objetivo</th><th class="right">Cant.</th><th>Comprometida</th><th>Recepción</th><th class="right">Lead real</th><th>Estado</th><th></th></tr></thead><tbody>`;
  const os=[...DB.ordenes].sort((a,b)=>a.fechaLanzamiento<b.fechaLanzamiento?1:-1);
  if(!os.length) html+=`<tr><td colspan="8"><div class="empty"><span class="ic"></span>Sin órdenes.</div></td></tr>`;
  os.forEach(o=>{
    const recibida=!!o.fechaRecepcion;
    const lead=recibida?daysBetween(o.fechaLanzamiento,o.fechaRecepcion):null;
    const enFecha=recibida&&o.fechaComprometida?daysBetween(o.fechaComprometida,o.fechaRecepcion)<=0:null;
    const st=recibida?(enFecha?'verde':'rojo'):'amarillo';
    const objetivo=`<span class="tag">${PLAN(o.plan)?.nombre||o.plan}</span>${o.horas?` <span class="mono small" style="color:#9fb0d8">@ ${num(o.horas)}h</span>`:''}${o.equipoId?`<br><span class="muted small">${esc(eqName(o.equipoId))}</span>`:''}`;
    html+=`<tr><td class="mono">${fmtD(o.fechaLanzamiento)}</td><td>${objetivo}</td><td class="right mono">${o.cantidad}</td>
      <td class="mono">${fmtD(o.fechaComprometida)}</td><td class="mono">${o.fechaRecepcion?fmtD(o.fechaRecepcion):'—'}</td><td class="right mono">${lead!=null?lead+' d':'—'}</td>
      <td><span class="pill ${st}">${recibida?(enFecha?'En fecha':'Con atraso'):'En curso'}</span></td>
      <td class="actions"><button class="iconbtn" onclick="ordForm('${o.id}')">Editar</button><button class="iconbtn" onclick="ordDelete('${o.id}')">Eliminar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  M.innerHTML=html;
}
function ordForm(id,planKey,lanzar,equipoId,horas){

  const body=`<div class="form-grid">
    <div class="field full"><label>Plan *</label><select id="f-plan">${PLANES.map(p=>`<option value="${p.key}" ${o.plan===p.key?'selected':''}>${planLabel(p)}</option>`).join('')}</select></div>

/* ============================================================
   STOCK / INVENTARIO  (EOQ · ROP · Stock de seguridad)
   ============================================================ */
// Demanda anual proyectada por producto, explotando BOM de mantenimientos proyectados (próx 365 d)
function demandaAnualProductos(){
  const dem={}; const maints=allProjectedMaints().filter(m=>m.diasRestantes<=365);
  maints.forEach(m=>{ DB.bom.filter(b=>b.plan===m.plan.key && b.tipo!=='inspeccion' && b.productoId).forEach(b=>{ dem[b.productoId]=(dem[b.productoId]||0)+Number(b.cantidad); }); });
  return dem;
}
function stockAnalysis(){
  const dem=demandaAnualProductos();
  const z=DB.params.zServicio||1.65;
  return DB.stock.map(s=>{
    const p=prodById(s.productoId); if(!p) return null;
    const D=dem[s.productoId]||0;                       // demanda anual proyectada
    const dDia=D/365;
    const LT=Number(s.leadTimeDias)||DB.params.leadTimeDefaultDias;
    const demLT=dDia*LT;                                // demanda durante lead time
    const sigmaLT=Math.sqrt(LT)*dDia*0.5;              // var. estimada (50% de la media diaria)
    const SS=Math.round(z*sigmaLT);                     // stock de seguridad
    const ROP=Math.round(demLT+SS);                     // punto de pedido
    const S=Number(s.costoPedido)||5000, H=Math.max(1,(Number(s.costoUnitario)||1)*0.25); // costo mantener 25%/año
    const EOQ=D>0?Math.round(Math.sqrt(2*D*S/H)):0;     // lote óptimo
    const aPedir=Math.max(0, ROP+EOQ-(Number(s.stockActual)||0));
    const bajoROP=(Number(s.stockActual)||0)<ROP;
    return {s,p,D,LT,SS,ROP,EOQ,aPedir,bajoROP,stockActual:Number(s.stockActual)||0};
  }).filter(Boolean);
}
function coberturaStock(){
  const a=stockAnalysis().filter(x=>x.D>0);
  if(!a.length) return {pct:100,cls:'green',faltantes:0};
  const ok=a.filter(x=>!x.bajoROP).length;
  const pct=Math.round(ok/a.length*100);
  return {pct,faltantes:a.length-ok,cls:pct>=85?'green':pct>=60?'amber':'red'};
}
function renderStock(){
  const a=stockAnalysis();
  let html=`<div class="section-head"><h1>Stock / Inventario</h1><div class="desc">Cálculo automático de punto de pedido (ROP), stock de seguridad y lote óptimo (EOQ)</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('stock')">Excel</button></div>`;
  html+=`<div class="help"><span class="ic">ℹ</span><div>La <b>demanda</b> se calcula explotando la BOM de todos los mantenimientos proyectados a 12 meses. Fórmulas: <b>ROP</b> = demanda(lead time) + stock seguridad · <b>SS</b> = z·σ<sub>LT</sub> (z=${DB.params.zServicio}) · <b>EOQ</b> = √(2·D·S/H).</div></div>`;
  html+=`<div class="table-wrap"><table><thead><tr><th>Producto</th><th class="right">Stock</th><th class="right">Demanda/año</th><th class="right">Lead (d)</th><th class="right">Stock seg.</th><th class="right">ROP</th><th class="right">EOQ</th><th class="right">A fabricar</th><th>Estado</th><th></th></tr></thead><tbody>`;
  const sorted=[...a].sort((x,y)=>(y.bajoROP?1:0)-(x.bajoROP?1:0)|| y.D-x.D);
  sorted.forEach(x=>{
    html+=`<tr><td><b class="mono small" style="color:#9fb0d8">${esc(x.p.refInterna)}</b><br><span class="small">${esc(x.p.descripcion)}</span>${x.p.partNumber?`<br><span class="muted" style="font-size:10px">PN: ${esc(x.p.partNumber)}</span>`:''}</td>
      <td class="right mono">${num(x.stockActual)}</td><td class="right mono">${num(x.D)}</td><td class="right mono">${x.LT}</td>
      <td class="right mono">${num(x.SS)}</td><td class="right mono">${num(x.ROP)}</td><td class="right mono">${num(x.EOQ)}</td>
      <td class="right mono"><b ${x.aPedir>0&&x.bajoROP?'style="color:var(--amber)"':''}>${num(x.aPedir)}</b></td>
      <td><span class="pill ${x.bajoROP&&x.D>0?'rojo':(x.D>0?'verde':'gris')}">${x.D>0?(x.bajoROP?'Reponer':'OK'):'Sin demanda'}</span></td>
      <td class="actions"><button class="iconbtn" onclick="stockForm('${x.s.id}')">Editar</button></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  // recomendaciones de fabricación
  const rep=sorted.filter(x=>x.bajoROP&&x.D>0);
  if(rep.length){
    html+=`<div class="card" style="margin-top:16px"><h3>Plan de fabricación recomendado</h3><div class="muted small" style="margin-bottom:10px">Ítems por debajo del punto de pedido — lanzar producción ahora:</div>`;
    rep.forEach(x=>{ html+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1b2336"><span><b class="mono small" style="color:#9fb0d8">${esc(x.p.refInterna)}</b> ${esc(x.p.descripcion)}${x.p.partNumber?` <span class="muted small">(PN ${esc(x.p.partNumber)})</span>`:''}</span><span><b style="color:var(--amber)">Fabricar ${num(x.aPedir)}</b> ${esc(x.p.unidad)} · lead ${x.LT}d</span></div>`; });
    html+=`</div>`;
  }
  M.innerHTML=html;
}

// ---- Recomendación en formato CORTO + badge de situación (reusado por Gantt y Agrupación) ----
function recCorto(m){
  const r=m.rec; if(!r) return '';
  const pad=r.pad?r.pad:'el pad';
  switch(r.tipo){
    case 'ya':      return 'Hacer lo antes posible';
    case 'postpad': return 'Esperar y hacer al terminar '+pad;
    case 'prepad':  return 'Adelantar a la parada previa a '+pad;
    case 'manual':  return 'Fecha fijada por vos';
    case 'lejano':  return 'Cargá más pads para precisar la fecha';
    default:        return '';
  }
}
function sitBadge(m){   // {t,cls} — el estado en una palabra/chip
  const tipo=m.rec&&m.rec.tipo;
  const exc = m.excedente>0 ? ' ~'+num(m.excedente)+'h' : '';        // horas que se pasará del ciclo AL EJECUTARSE (también si ya está vencido o si vos moviste la fecha)
  if(tipo==='ya') return {t:'hacer ya'+exc, cls:'rojo'};             // vencido y el equipo está parado
  if(m.vencido) return {t:'vencido'+exc, cls:'rojo'};                // vencido; si además se hará N h pasado, lo muestra
  if(m.excedente>0) return {t:'se hará vencido ~'+num(m.excedente)+'h', cls:'rojo'};
  if(m.beyond && !m.accionable) return {t:'sin fecha', cls:'neutral'};
  if(tipo==='manual') return {t:'fijado', cls:'azul'};
  if(tipo==='prepad') return {t:'a tiempo', cls:'verde'};
  if(tipo==='postpad') return {t:'al fin del pad', cls:'amarillo'};
  return {t:estadoLabel(m.estado), cls:m.estado};
}
// Celda de acción visual (agrupación): fecha + situación + motivo corto + link fijar
function accionCell(m){
  const f=m.accionFecha||(m.rec&&m.rec.fecha);
  const when=f?`<span class="when">${fmtDShort(f)}</span>`:'';
  const sb=sitBadge(m);
  const sit=`<span class="sit ${sb.cls}"${m.excedente>0?` title="Al ejecutarse estará ~${num(m.excedente)}h pasado el objetivo (${num(m.horas)}h) · ciclo de ${num(m.plan.intervalo)}h"`:''}>${sb.t}</span>`;
  const motivo=recCorto(m);
  const fijar=`<span class="linklike rw" style="font-size:11px" onclick="planificarMant('${m.equipo.id}','${m.plan.key}',${m.horas})">${m.manual?'cambiar fecha':'fijar fecha'}</span>`;
  return `<div class="acc"><div class="acc-line">${when}${sit}</div>${motivo?`<div class="acc-motivo">${esc(motivo)}</div>`:''}${fijar}</div>`;
}
// ---- Tooltip flotante del Gantt (tarjeta limpia, no la línea apretada) ----
let GTIPS={};
function gttShow(ev,id){ const t=document.getElementById('gtt'); if(!t)return; t.innerHTML=GTIPS[id]||''; t.style.display='block'; gttMove(ev); }
function gttMove(ev){ const t=document.getElementById('gtt'); if(!t||t.style.display!=='block')return;
  const r=t.getBoundingClientRect(); let x=ev.clientX+16, y=ev.clientY+16;
  if(x+r.width>window.innerWidth-10) x=ev.clientX-r.width-16;

// Letra griega de cada plan (para el Gantt). Alfa Zero = α con un 0; el resto, su letra.
const GRIEGAS={ALFA_ZERO:'α',ALFA:'α',BETA:'β',GAMMA:'γ',DELTA:'δ',EPSILON:'ε',ZETA:'ζ',ETA:'η',THETA:'θ',IOTA:'ι',KAPPA:'κ'};
function glifoPlan(key){ return key==='ALFA_ZERO' ? 'α<span class="g0">0</span>' : (GRIEGAS[key] || (PLAN(key)?.nombre||'?').trim().charAt(0).toUpperCase() || '?'); }
// Componente + fuente de horas, sin repetir: "Motor" (no "Motor Mot."), pero "Transmisión Mot." / "Power End Bba." sí (el nombre no dice la fuente)
function compFuente(plan){
  const c=(plan.componente||'').trim().toLowerCase();
  const same=(plan.fuente==='motor'&&c==='motor')||(plan.fuente==='bomba'&&c==='bomba');
  return (plan.componente||'') + (same?'':(plan.fuente==='motor'?' Mot.':' Bba.'));
}
// Tramos de operación de un equipo según sus PADS reales (fechas completas, no recortado a la lectura) — para dibujar las barras del Gantt
function padRunsEquipo(eqId){
  let ivs=[];
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId && a.desde && a.hasta) ivs.push({d:a.desde,h:a.hasta,nombre:p.nombre,emp:p.empresaServicio||'',pausas:a.pausas||[]}); }));
  ivs.sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.end),1))){ if(o.h>last.end)last.end=o.h; last.nombres.add(o.nombre); if(!last.emp)last.emp=o.emp; last.pausas.push(...(o.pausas||[])); } else merged.push({start:o.d,end:o.h,nombres:new Set([o.nombre]),emp:o.emp,pausas:[...(o.pausas||[])]}); });

function renderPlanificacion(){

  const hoyISO=todayISO();

  const enFoco = a => (GANTT.equipo==='todos'||a.equipoId===GANTT.equipo);
  // El timeline abarca PASADO + FUTURO. Inicio = pad más antiguo de los equipos mostrados (tope 365 d atrás), mínimo 14 d atrás.
  let startISO=toISO(addDays(parseD(hoyISO),-14));
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(enFoco(a) && a.desde<startISO) startISO=a.desde; }));
  DB.mantenimientos.forEach(m=>{ if((GANTT.equipo==='todos'||m.equipoId===GANTT.equipo) && m.fecha && m.fecha<startISO) startISO=m.fecha; });   // incluir mantenimientos ya hechos (pasados)
  const cap=toISO(addDays(parseD(hoyISO),-365)); if(startISO<cap) startISO=cap;

  let endISO=toISO(addDays(parseD(hoyISO),30));

  const dx = iso => (parseD(iso)-start)/86400000*px;               // posición horizontal de una fecha

    <div class="field" style="margin:0;min-width:150px"><label>Equipo</label><select onchange="GANTT.equipo=this.value;renderPlanificacion()">
      <option value="todos">Todos</option>${DB.equipos.map(e=>`<option value="${e.id}" ${GANTT.equipo===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;min-width:140px"><label>Zoom</label><select onchange="GANTT.px=Number(this.value);renderPlanificacion()">

    <button class="btn ghost sm" onclick="renderPlanificacion()">Actualizar</button>

/* ============================================================
   AGRUPACIÓN INTELIGENTE
   ============================================================ */
// ---- Ventanas SIN operación (huecos entre pads) de un equipo, desde hoy hasta el horizonte ----
function idleWindows(eqId){
  const today=todayISO();
  const horizonEnd=toISO(addDays(parseD(today),DB.params.horizonteDias||1095));
  // intervalos operativos (asignaciones) recortados a [hoy, horizonte], ordenados
  let ops=asignacionesForEquipo(eqId).map(a=>({desde:a.desde,hasta:a.hasta}))
    .filter(o=>o.hasta>=today)
    .map(o=>({desde:o.desde<today?today:o.desde,hasta:o.hasta>horizonEnd?horizonEnd:o.hasta}))
    .sort((a,b)=>a.desde<b.desde?-1:1);
  // fusionar solapados/contiguos
  const merged=[];
  ops.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.desde<=toISO(addDays(parseD(last.hasta),1))){ if(o.hasta>last.hasta) last.hasta=o.hasta; } else merged.push({...o}); });
  if(!merged.length) return [{desde:today,hasta:horizonEnd,abierta:true}];   // sin pads → todo libre
  // huecos entre operaciones
  const gaps=[]; let cursor=today;
  merged.forEach(o=>{ if(o.desde>cursor){ gaps.push({desde:cursor,hasta:toISO(addDays(parseD(o.desde),-1))}); } if(o.hasta>=cursor) cursor=toISO(addDays(parseD(o.hasta),1)); });
  if(cursor<horizonEnd) gaps.push({desde:cursor,hasta:horizonEnd,abierta:true});  // cola libre tras el último pad
  return gaps.filter(g=>g.hasta>=g.desde);
}
// Ventana libre recomendada para ejecutar un mantenimiento cuya fecha proyectada es D
function recommendWindow(eqId,D){
  const gaps=idleWindows(eqId); if(!gaps.length) return null;
  let g=gaps.find(g=> D>=g.desde && D<=g.hasta);                 // ¿el mant cae dentro de una ventana libre?
  if(g) return {win:g,rel:'durante',dist:0};
  let best=null,bestDist=Infinity,rel='';
  gaps.forEach(g=>{
    if(g.hasta<D){ const d=daysBetween(g.hasta,D); if(d<bestDist){bestDist=d;best=g;rel='antes';} }      // hueco previo → preventivo
    else if(g.desde>D){ const d=daysBetween(D,g.desde); if(d<bestDist){bestDist=d;best=g;rel='despues';} } // hueco posterior → leve excedente
  });
  return best?{win:best,rel,dist:bestDist}:null;
}
function computeGroups(){
  const win=DB.params.ventanaAgrupacionDias||10;
  const maints=allProjectedMaints();
  // agrupar por componente (mismo recurso/cuadrilla) en ventana temporal
  const byComp={};
  maints.forEach(m=>{ (byComp[m.plan.componente]=byComp[m.plan.componente]||[]).push(m); });
  const groups=[];
  Object.entries(byComp).forEach(([comp,arr])=>{
    arr.sort((a,b)=>a.date<b.date?-1:1);
    let i=0;
    while(i<arr.length){
      const cluster=[arr[i]]; let j=i+1;
      while(j<arr.length && daysBetween(arr[i].date,arr[j].date)<=win){ cluster.push(arr[j]); j++; }
      if(cluster.length>=2){
        groups.push({componente:comp,items:cluster,from:cluster[0].date,to:cluster[cluster.length-1].date,
          evitadas:cluster.length-1});
      }
      i=j>i+1?j:i+1;
    }
  });
  return groups.sort((a,b)=>b.evitadas-a.evitadas);
}
// Tramos contiguos de operación (runs) a partir del timeline
function operatingRuns(tl){
  const runs=[]; let cur=null;
  tl.days.forEach(d=>{ if(d.pad){ if(!cur) cur={start:d.date,end:d.date,pad:d.pad}; else cur.end=d.date; } else if(cur){ runs.push(cur); cur=null; } });
  if(cur) runs.push(cur);
  return runs;
}
// Horas acumuladas de una fuente a una fecha dada
function cumAt(tl,iso,fuente){
  const key=fuente==='motor'?'cumMotor':'cumBomba';
  let last=tl.days[0][key];
  for(const d of tl.days){ if(d.date>iso) break; last=d[key]; }
  return last;
}
// Fecha de ACCIÓN recomendada (distinta del cruce). Usa TOLERANCIA: el primer pad en cuyo final
// el equipo queda a <= tolerancia del umbral (lo cruce o no) es donde hay que actuar.
function ventanaTxt(desde,hasta){
  if(desde&&hasta) return desde===hasta?`el ${fmtDM(desde)}`:`entre ${fmtDM(desde)} y ${fmtDM(hasta)}`;
  if(desde) return `desde el ${fmtDM(desde)}`;
  return '';
}
function planRecomendacion(tl,m){
  const hoy=todayISO();
  const runs=operatingRuns(tl);
  if(!runs.length) return m.vencido?{tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible'}:{tipo:'futuro',fecha:null,cls:'neutral',txt:'Sin pads cargados para este equipo'};
  const asap0=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };
  if(m.vencido){
    // si el equipo está operando hoy, no se puede frenar: se hace al terminar el pad en curso (se agrupa con los demás)
    const rHoy=runs.find(r=> hoy>=r.start && hoy<=r.end);
    if(rHoy){
      const nx=runs[runs.indexOf(rHoy)+1];
      const w={desde:toISO(addDays(parseD(rHoy.end),1)), hasta: nx?toISO(addDays(parseD(nx.start),-1)):null};
      const f=asap0(w);
      return {tipo:'postpad',...w,fecha:f,pad:rHoy.pad,cls:'rojo',txt:`Vencido · hacer al terminar ${rHoy.pad} (~${fmtDM(f)})`};
    }
    return {tipo:'ya',fecha:hoy,desde:hoy,hasta:hoy,cls:'rojo',txt:'Vencido · hacer lo antes posible (equipo parado)'};
  }
  const nd=m.horas, fuente=m.plan.fuente;
  // PAD donde REALMENTE se cruza el umbral (no donde está "cerca"): primer run cuyo fin alcanza nd
  let idx=-1;
  for(let k=0;k<runs.length;k++){ if(cumAt(tl,runs[k].end,fuente) >= nd){ idx=k; break; } }
  if(idx<0){                                                                 // ningún pad cargado llega a cruzarlo
    const last=runs[runs.length-1], lleg=cumAt(tl,last.end,fuente), faltan=Math.round(nd-lleg);
    return {tipo:'lejano',fecha:null,cls:'neutral',faltan,txt:`Con los pads cargados llega a ${num(lleg)}h (faltan ~${num(faltan)}h al ${fmtDM(last.end)}). Cargá el próximo pad para precisar.`};
  }
  const R=runs[idx], prev=runs[idx-1], next=runs[idx+1];
  const ongoing=R.start<=hoy;
  const gapBefore={desde: prev?toISO(addDays(parseD(prev.end),1)):hoy, hasta: toISO(addDays(parseD(R.start),-1))};
  const gapAfter ={desde: toISO(addDays(parseD(R.end),1)), hasta: next?toISO(addDays(parseD(next.start),-1)):null};
  const asap=g=>{ let f=toISO(addDays(parseD(g.desde),1)); if(f<hoy)f=hoy; if(g.hasta&&f>g.hasta)f=g.hasta; return f; };  // lo antes posible = 2 días tras el pad previo
  if(ongoing){   // cruza operando dentro del pad en curso → no se puede frenar, se hace al terminarlo
    const w=gapAfter; return {tipo:'postpad',...w,fecha:asap(w),pad:R.pad,cls:'rojo',txt:`Cruza operando en ${R.pad} (en curso) · hacer al terminar (~${fmtDM(asap(w))})`};
  }
  // cruza en un pad FUTURO. No se puede frenar a mitad de pad, así que hay DOS paradas posibles:
  //   prepad  = parada ANTES del pad  → se haría ADELANTADO (se desperdicia vida útil)
  //   postpad = parada DESPUÉS del pad → se haría VENCIDO (operó de más dentro del pad)
  // Solo conviene ADELANTAR si el adelanto entra en la TOLERANCIA (Parámetros, def. 150h). Si falta más que
  // eso (típico de un mantenimiento RECIÉN hecho, o un primer service todavía lejano), NO se adelanta: como el
  // pad no se puede frenar, se ESPERA a que se venza y se hace al terminar el pad — nunca rehacerlo prematuro.
  const tol=Number(DB.params.toleranciaHoras)||0;
  const hBefore=cumAt(tl,asap(gapBefore),fuente);
  const hAfter =cumAt(tl,R.end,fuente);
  const adelanto=Math.round(nd-hBefore), atraso=Math.round(hAfter-nd);
  if(adelanto<=tol){
    const w=gapBefore;
    return {tipo:'prepad',...w,fecha:asap(w),pad:R.pad,cls:'amarillo',txt:`Cruza en ${R.pad} · adelantar a la parada previa (~${fmtDM(asap(w))}, ~${num(adelanto)}h antes)`};
  }
  const w=gapAfter;
  return {tipo:'postpad',...w,fecha:asap(w),pad:R.pad,cls:'rojo',txt:`Faltan ~${num(adelanto)}h (más que la tolerancia) · esperar y hacer al terminar ${R.pad} (~${fmtDM(asap(w))}, se vence ~${num(atraso)}h)`};
}
// Ventanas SIN operación (entre pads) a nivel flota — TODAS, aunque estén vacías
function fleetGaps(){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=DB.pads.map(p=>({d:p.fechaInicio,h:p.fechaFin})).filter(x=>x.d&&x.h&&x.h>=hoy).sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});  // hueco antes del 1er pad
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,14);
}
// ¿El equipo está OPERANDO (dentro de un pad propio) esa fecha?
function equipoOperando(eqId,iso){
  return DB.pads.some(p=>(p.asignaciones||[]).some(a=>a.equipoId===eqId && a.desde && a.hasta && iso>=a.desde && iso<=a.hasta));
}
// ¿El equipo está EN LOCACIÓN pero en PAUSA (sin operar) esa fecha? (dentro de un pad, día marcado sin operar)
function equipoEnPausa(eqId,iso){
  return DB.pads.some(p=>(p.asignaciones||[]).some(a=>a.equipoId===eqId && a.desde && a.hasta && iso>=a.desde && iso<=a.hasta && enPausa(a.pausas,iso)));
}
// Ventanas en las que ESTE equipo NO opera (paradas propias) = complemento de sus pads. Puede haber paradas
// para un equipo mientras otros operan. Son las únicas ventanas válidas para mover/fijar su mantenimiento.
function equipoGaps(eqId){
  const hoy=todayISO();
  const horizon=toISO(addDays(parseD(hoy),DB.params.horizonteDias||1095));
  let ivs=[];
  DB.pads.forEach(p=>(p.asignaciones||[]).forEach(a=>{ if(a.equipoId===eqId && a.desde && a.hasta && a.hasta>=hoy) ivs.push({d:a.desde,h:a.hasta}); }));
  ivs.sort((a,b)=>a.d<b.d?-1:1);
  const merged=[];
  ivs.forEach(o=>{ const last=merged[merged.length-1]; if(last && o.d<=toISO(addDays(parseD(last.h),1))){ if(o.h>last.h) last.h=o.h; } else merged.push({...o}); });
  const gaps=[];
  if(!merged.length){ gaps.push({desde:hoy,hasta:horizon,abierta:true}); return gaps; }
  if(merged[0].d>hoy) gaps.push({desde:hoy,hasta:toISO(addDays(parseD(merged[0].d),-1)),abierta:false});
  for(let i=0;i<merged.length;i++){
    const gd=toISO(addDays(parseD(merged[i].h),1));
    const gh=merged[i+1]?toISO(addDays(parseD(merged[i+1].d),-1)):horizon;
    if(gh>=gd) gaps.push({desde:gd,hasta:gh,abierta:!merged[i+1]});
  }
  return gaps.filter(g=>g.hasta>=hoy).slice(0,30);
}
// "Lo antes posible" dentro de una ventana = 2 días después de que arranca (o desde hoy)
function asapEnVentana(g){ let f=toISO(addDays(parseD(g.desde),1)); if(f<todayISO())f=todayISO(); if(g.hasta&&f>g.hasta)f=g.hasta; return f; }
// Paradas para MOSTRAR = ventanas de flota (todas, incl. vacías) + ventanas individuales donde caiga un mant. (equipo libre mientras otros operan)
function computeParadas(){
  const items=planEvents().filter(e=>e.accionFecha && (VERPROY||!e.proyeccion)).concat(pendientesItems());
  const wins=fleetGaps().map(g=>({desde:g.desde,hasta:g.hasta,abierta:g.abierta,individual:false,items:[]}));
  items.forEach(it=>{
    let w=wins.find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta && !g.individual);
    if(!w){   // cae fuera de las ventanas de flota → ventana individual del equipo (libre mientras otros operan)
      const eg=equipoGaps(it.equipo.id).find(g=> it.accionFecha>=g.desde && it.accionFecha<=g.hasta);
      const desde=eg?eg.desde:it.accionFecha, hasta=eg?eg.hasta:it.accionFecha, ab=eg?eg.abierta:false;
      w=wins.find(g=>g.individual && g.desde===desde && g.hasta===hasta);
      if(!w){ w={desde,hasta,abierta:ab,individual:true,items:[]}; wins.push(w); }
    }
    w.items.push(it);
  });
  wins.sort((a,b)=> a.desde<b.desde?-1:(a.desde>b.desde?1:0));
  return wins;
}
// Mover un mantenimiento a la parada PROPIA del equipo anterior (-1) o siguiente (+1). Salta solo las ventanas
// donde el equipo opera (no son válidas), así no hay que pasar por ellas.
function moverParada(eqId,planKey,horas,dir){ if(isRO())return roBlock();
  const wins=equipoGaps(eqId);
  if(!wins.length){ toast('Este equipo no tiene paradas (cargá pads).','warn'); return; }
  const item=planEvents().find(e=>e.equipo.id===eqId&&e.plan.key===planKey&&e.horas===horas);
  const cur=item&&item.accionFecha;
  let gi=wins.findIndex(g=> cur&&cur>=g.desde&&cur<=g.hasta);
  if(gi<0){ // la fecha actual no cae en una parada propia (p.ej. está operando): arranco del borde según la dirección
    if(cur){ gi = dir>0 ? wins.reduce((acc,g,i)=> g.desde<=cur?i:acc, -1) : wins.findIndex(g=>g.desde>=cur); if(dir<0&&gi<0) gi=wins.length; }
    else gi = dir>0?-1:wins.length;
  }
  const t=wins[gi+dir];
  if(!t){ toast('No hay parada '+(dir<0?'anterior':'siguiente')+' para este equipo','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
// Saltar directo a una parada concreta del equipo (por índice de equipoGaps) — permite saltar varias ventanas de una
function moverParadaA(eqId,planKey,horas,idx){ if(isRO())return roBlock();
  const wins=equipoGaps(eqId); const t=wins[idx];
  if(!t){ toast('Parada no válida','warn'); return; }
  fijarEnVentana(eqId,planKey,horas,t);
}
function fijarEnVentana(eqId,planKey,horas,g){
  const f=asapEnVentana(g);
  DB.planificado[planKeyOf(eqId,planKey,horas)]=f;
  audit('Mover a parada',`${eqName(eqId)} ${PLAN(planKey)?.nombre} → ${f}`);
  saveDB(); route(CURRENT);
}
// Selector "Mover a…": lista las paradas PROPIAS del equipo (donde NO opera) para saltar directo a cualquiera
function selectorMover(m){
  const wins=equipoGaps(m.equipo.id);
  const cur=m.accionFecha;
  const opts=wins.map((g,i)=>{ const sel=cur&&cur>=g.desde&&cur<=g.hasta?'selected':''; const lbl=`${fmtDShort(g.desde)} ${g.abierta?'→ adelante':'→ '+fmtDShort(g.hasta)}`; return `<option value="${i}" ${sel}>${lbl}</option>`; }).join('');
  return `<select class="mini-select" title="Saltar a otra parada del equipo (solo donde está parado)" onchange="moverParadaA('${m.equipo.id}','${m.plan.key}',${m.horas},Number(this.value))"><option value="" disabled ${cur?'':'selected'}>Mover a…</option>${opts}</select>`;
}
function renderAgrupacion(){
  const gaps=computeParadas();
  const sched=gaps.flatMap(g=>g.items).filter(x=>!x.proyeccion && !x.esParte2);
  const proyN=gaps.flatMap(g=>g.items).filter(x=>x.proyeccion).length;
  const vencidos=planEvents().filter(e=>e.vencido&&!e.proyeccion).slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
  const conjuntas=gaps.filter(g=>new Set(g.items.filter(x=>!x.esParte2).map(x=>x.equipo.id)).size>=2).length;

/* ============================================================
   COSTOS y TCO por equipo
   ============================================================ */
function costosPorEquipo(){
  return DB.equipos.filter(e=>e.estado!=='Baja').map(e=>{
    const ms=DB.mantenimientos.filter(m=>m.equipoId===e.id);
    const prev=ms.filter(m=>m.tipo!=='correctivo'), corr=ms.filter(m=>m.tipo==='correctivo');  // inspección cuenta como preventivo
    const ade=(DB.adelantos||[]).filter(a=>a.equipoId===e.id && a.estado!=='cancelado');          // adelantos cuentan como preventivo
    const p2h=(DB.pendientes||[]).filter(p=>p.equipoId===e.id && p.estado==='hecho');             // partes 2 completadas cuentan como preventivo
    const cAde=ade.reduce((s,a)=>s+(Number(a.costo)||0),0)+p2h.reduce((s,p)=>s+(Number(p.costo)||0),0);
    const cPrev=prev.reduce((s,m)=>s+(Number(m.costo)||0),0)+cAde, cCorr=corr.reduce((s,m)=>s+(Number(m.costo)||0),0);
    const lr=lastReading(e.id); const hM=lr?Number(lr.horasMotor)||0:0, hB=lr?Number(lr.horasBomba)||0:0;
    const total=cPrev+cCorr;
    return {equipo:e,total,cPrev,cCorr,cAde,nPrev:prev.length,nCorr:corr.length,nAde:ade.length,hM,hB,
      tcoM: hM>0?total/hM:null, tcoB: hB>0?total/hB:null};
  });
}
// Aclara (p>0) u oscurece (p<0) un color hex — para los gradientes de relieve
function shade(hex,p){
  hex=(''+hex).replace('#',''); if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  const f=x=>Math.max(0,Math.min(255,Math.round(p>0?x+(255-x)*p:x*(1+p))));
  return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
// Costo estándar (planificado) de un plan preventivo — lo define el usuario
function costoDePlan(key){ return Number((DB.params.costoPlan||{})[key])||0; }
// Costo PLANIFICADO estimado por equipo (suma del costo estándar de cada mantenimiento que viene, dentro de N meses)
function costoPlanificado(meses){
  meses=meses||12;
  const hoy=todayISO(), hasta=toISO(addDays(parseD(hoy),meses*31));
  const porEquipo={}, porPlan={}, porMes={}, porEquipoPlan={}, porMesEquipo={}; let total=0, n=0;
  planEvents().forEach(e=>{
    if(e.beyond) return; const f=e.accionFecha||e.date; if(!f||f<hoy||f>hasta) return;
    const c=costoDePlan(e.plan.key); if(!c) return;
    const eq=e.equipo.id, pk=e.plan.key, mes=f.slice(0,7);
    (porEquipo[eq]=porEquipo[eq]||{c:0,n:0}); porEquipo[eq].c+=c; porEquipo[eq].n++;
    (porPlan[pk]=porPlan[pk]||{c:0,n:0}); porPlan[pk].c+=c; porPlan[pk].n++;
    (porEquipoPlan[eq]=porEquipoPlan[eq]||{}); porEquipoPlan[eq][pk]=(porEquipoPlan[eq][pk]||0)+c;
    (porMesEquipo[mes]=porMesEquipo[mes]||{}); porMesEquipo[mes][eq]=(porMesEquipo[mes][eq]||0)+c;
    porMes[mes]=(porMes[mes]||0)+c;
    total+=c; n++;
  });
  return {porEquipo,porPlan,porMes,porEquipoPlan,porMesEquipo,total,n};
}
// Costo YA REALIZADO desglosado por plan (preventivos por su plan; correctivos/inspecciones agrupados aparte; adelantos → su plan, como preventivo)
function costosRealizadosPorPlan(){
  const porPlan={}; let total=0;
  const add=(k,c)=>{ (porPlan[k]=porPlan[k]||{c:0,n:0}); porPlan[k].c+=c; porPlan[k].n++; total+=c; };
  DB.mantenimientos.forEach(m=>{ const c=Number(m.costo)||0; if(!c) return;
    add(m.tipo==='correctivo'?'CORRECTIVO':(m.tipo==='inspeccion'?'INSPECCION':m.plan), c); });
  (DB.adelantos||[]).forEach(a=>{ if(a.estado==='cancelado') return; const c=Number(a.costo)||0; if(!c) return; add(a.planKey, c); });
  return {porPlan,total};
}

// Gráfico de dona (torta) en SVG con relieve: gradiente por porción, sombra y pista de fondo
function donutSVG(segs,opts){
  opts=opts||{}; const size=opts.size||190, sw=opts.stroke||28, r=(size-sw)/2-3, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const list=segs.filter(s=>s.value>0); const total=list.reduce((s,x)=>s+x.value,0)||1;
  const gap=list.length>1?Math.min(C*0.014,6):0;   // espacio fino entre porciones
  const u='d'+Math.random().toString(36).slice(2,7);
  let defs=`<filter id="${u}s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/></filter>`;
  list.forEach((s,i)=>{ defs+=`<linearGradient id="${u}g${i}" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="${shade(s.color,0.34)}"/><stop offset="1" stop-color="${shade(s.color,-0.16)}"/></linearGradient>`; });
  let off=0, arcs='';
  list.forEach((s,i)=>{ const len=s.value/total*C, draw=Math.max(0.6,len-gap);
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#${u}g${i})" stroke-width="${sw}" stroke-dasharray="${draw.toFixed(2)} ${(C-draw).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.label)}: ${money(s.value)} (${Math.round(s.value/total*100)}%)</title></circle>`;
    off+=len; });
  const track=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0b1120" stroke-width="${sw}"/><circle cx="${cx}" cy="${cy}" r="${r-sw/2}" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none"><defs>${defs}</defs>${track}<g filter="url(#${u}s)">${arcs}</g>`
    +`<text x="${cx}" y="${cy-1}" text-anchor="middle" fill="var(--text)" font-size="18" font-weight="800">${esc(opts.centerTop||'')}</text>`
    +`<text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--muted)" font-size="10.5">${esc(opts.centerSub||'')}</text></svg>`;
}

  let html=`<div class="section-head"><h1>Costos</h1><div class="desc">Costo de mantenimientos y TCO (costo por hora) por equipo · moneda ${esc(mon)}</div><div class="sp"></div>
    <button class="btn ghost" onclick="exportCSV('costos')">Excel</button><button class="btn ghost" onclick="window.print()">PDF</button></div>`;
  html+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px">
    <div class="kpi"><div class="accent"></div><div class="lbl">Costo total flota</div><div class="val mono" style="font-size:22px">${money(totalFlota)}</div></div>
    <div class="kpi red"><div class="accent"></div><div class="lbl">Costo correctivos</div><div class="val mono" style="font-size:22px">${money(totalCorr)}</div><div class="sub">${totalFlota?Math.round(totalCorr/totalFlota*100):0}% del total · ${nCorr} eventos</div></div>
    <div class="kpi green"><div class="accent"></div><div class="lbl">Costo preventivos</div><div class="val mono" style="font-size:22px">${money(totalFlota-totalCorr)}</div></div>
    <div class="kpi"><div class="accent"></div><div class="lbl">Mant. con costo</div><div class="val mono">${nCosto}</div><div class="sub">de ${DB.mantenimientos.length} registrados</div></div></div>`;
  // ===== Costo PLANIFICADO (estimado) — panel detallado: se ARMA acá y se inserta ABAJO =====
  const pl=costoPlanificado(12);
  const cpv=DB.params.costoPlan||{}; const cpDef=Object.values(cpv).some(v=>Number(v)>0);
  let planifHTML=`<div class="card" style="margin-top:16px;border-color:#2b3566"><h3 style="color:#aeb6ff">Costo planificado (estimado) <span class="sub" style="color:var(--muted)">próximos 12 meses · con los costos estándar</span></h3>`;
  if(!cpDef){ planifHTML+=`<div class="muted small">Definí los <b>costos estándar por plan</b> (abajo) para ver el planificado desglosado por mes, plan y equipo.</div></div>`; }
  else if(!pl.total){ planifHTML+=`<div class="muted small">No hay mantenimientos con costo estándar en los próximos 12 meses.</div></div>`; }
  else {
    planifHTML+=`<div class="row" style="gap:30px;margin:4px 0 18px;flex-wrap:wrap">
      <div><span class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.6px">Total flota · 12 meses</span><div class="mono" style="font-size:26px;font-weight:800;color:#8b94ff">${money(pl.total)}</div></div>
      <div><span class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.6px">Intervenciones</span><div class="mono" style="font-size:26px;font-weight:800">${pl.n}</div></div>
      <div><span class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.6px">Promedio / mes</span><div class="mono" style="font-size:26px;font-weight:800">${money(Math.round(pl.total/12))}</div></div></div>`;
    const mn=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    let cur=new Date(); cur=new Date(cur.getFullYear(),cur.getMonth(),1); const meses12=[];
    for(let i=0;i<12;i++){ meses12.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')); cur.setMonth(cur.getMonth()+1); }
    const maxMes=Math.max(1,...meses12.map(k=>pl.porMes[k]||0));
    // color por equipo (estable, mayor gasto primero) — reusado en el gasto mensual apilado y su leyenda
    const eqList=Object.keys(pl.porEquipo).sort((a,b)=>pl.porEquipo[b].c-pl.porEquipo[a].c);
    const eqColor=id=>COSTCOL[Math.max(0,eqList.indexOf(id))%COSTCOL.length];
    const eqNm=id=>(DB.equipos.find(e=>e.id===id)||{}).nombre||id;
    planifHTML+=`<div style="font-weight:600;font-size:13px;margin-bottom:10px">Gasto por mes <span class="muted" style="font-weight:400;font-size:11px">· apilado por equipo</span></div><div style="display:flex;align-items:flex-end;gap:7px;height:158px">`;
    meses12.forEach(k=>{ const v=pl.porMes[k]||0, h=v/maxMes*120, [y,m]=k.split('-'), me=pl.porMesEquipo[k]||{};
      const stack=eqList.filter(id=>me[id]).map(id=>`<div title="${esc(eqNm(id))} · ${mn[+m-1]} ${y}: ${money(me[id])}" style="height:${v?me[id]/v*100:0}%;background:${eqColor(id)}"></div>`).join('');
      planifHTML+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%"><span class="mono" style="font-size:9px;color:#aeb6ff;white-space:nowrap">${v?num(v):''}</span><div title="${mn[+m-1]} ${y}: ${money(v)}" style="width:100%;max-width:34px;display:flex;flex-direction:column-reverse;height:${Math.max(2,h)}px;border-radius:5px 5px 0 0;overflow:hidden;background:#0b1120">${stack}</div><span class="muted" style="font-size:9.5px;text-align:center;line-height:1.1">${mn[+m-1]}<br>'${y.slice(2)}</span></div>`; });
    planifHTML+=`</div>`;
    planifHTML+=`<div class="row" style="gap:12px;margin-top:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)">${eqList.map(id=>`<span class="row" style="gap:6px;align-items:center"><span style="width:11px;height:11px;border-radius:3px;background:${eqColor(id)}"></span>${esc(eqNm(id))}</span>`).join('')}</div>`;
    // Por equipo, DESGLOSADO POR PLAN (barras apiladas; cada segmento = un plan, color consistente)
    const eqArr=Object.entries(pl.porEquipo).map(([id,o])=>({id,nombre:(DB.equipos.find(e=>e.id===id)||{}).nombre||id,c:o.c,n:o.n})).sort((a,b)=>b.c-a.c);
    const maxEq=Math.max(1,...eqArr.map(e=>e.c));
    const planesPresentes=PLANES.filter(p=>Object.values(pl.porEquipoPlan).some(m=>m[p.key]));
    planifHTML+=`<div style="font-weight:600;font-size:13px;margin:20px 0 10px">Por equipo, desglosado por plan</div><div style="display:flex;flex-direction:column;gap:11px">`;
    eqArr.forEach(e=>{
      const segs=Object.entries(pl.porEquipoPlan[e.id]||{}).map(([k,c])=>({k,c})).sort((a,b)=>PLANES.findIndex(p=>p.key===a.k)-PLANES.findIndex(p=>p.key===b.k));
      const bar=segs.map(s=>`<div class="cbar-fill" title="${esc(PLAN(s.k)?.nombre||s.k)}: ${money(s.c)}" style="width:${e.c?s.c/maxEq*100:0}%;background:${planColor(s.k)}"></div>`).join('');
      planifHTML+=`<div style="display:grid;grid-template-columns:130px 1fr 130px;align-items:center;gap:10px"><span style="font-weight:600;font-size:13px">${esc(e.nombre)}</span><div class="cbar-track" style="height:22px;display:flex">${bar}</div><span class="mono" style="font-size:12.5px;text-align:right">${money(e.c)} <span class="muted">·${e.n}</span></span></div>`;
    });
    planifHTML+=`</div>`;
    planifHTML+=`<div class="row" style="gap:12px;margin-top:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)">${planesPresentes.map(p=>`<span class="row" style="gap:6px;align-items:center"><span style="width:11px;height:11px;border-radius:3px;background:${planColor(p.key)}"></span>${esc(p.nombre)}</span>`).join('')}</div></div>`;
  }
  // Editor de costos estándar por plan (solo admin: oculto en la vista de usuario web). Entrada en USD con separador de miles.
  const editorHTML=`<div class="card rw" style="margin-top:16px;border-color:#2a3550"><h3>Costos estándar por plan (preventivo) <span class="sub">en ${esc(mon)} · se usan para estimar lo planificado</span></h3>
    <div class="muted small" style="margin-bottom:12px">Definí cuánto cuesta cada mantenimiento preventivo (en <b>${esc(mon)}</b>). Estos valores alimentan el <b>costo planificado</b>. Al ejecutarlo, el costo real (que cargás en Mantenimientos) puede variar — estos quedan como referencia para la planificación.</div>
    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(185px,1fr))">${PLANES.map(p=>`<div class="field"><label>${esc(p.nombre)} <span class="muted" style="font-size:10px">· ${p.componente}</span></label><div style="display:flex;align-items:center;gap:6px;background:#0d1422;border:1px solid var(--border);border-radius:7px;padding:0 10px"><span class="muted" style="font-size:11px;font-weight:700">${esc(mon)}</span><input class="cstd" data-k="${p.key}" type="text" inputmode="numeric" oninput="this.value=fmtMilesInput(this.value)" value="${cpv[p.key]?Number(cpv[p.key]).toLocaleString('es-AR'):''}" placeholder="0" style="border:none;background:none;padding:9px 0;flex:1;text-align:right"></div></div>`).join('')}</div>
    <div style="margin-top:12px"><button class="btn" onclick="saveCostosPlan()">Guardar costos estándar</button></div></div>`;
  if(!totalFlota){
    html+=`<div class="help"><span class="ic">ℹ</span><div>Todavía no hay costos REALES cargados. En <b>Mantenimientos realizados</b> completá el campo <b>Costo</b> al registrar (o cargá <b>correctivos</b>). Igual podés definir los costos estándar abajo para ver el costo planificado.</div></div>`;
    html+=planifHTML+editorHTML; M.innerHTML=html; return;
  }
  // ===== Tortas (costo YA REALIZADO): Prev/Corr · por equipo · por plan =====
  const segPC=[{label:'Preventivo',value:totalFlota-totalCorr,color:'#1FB87A'},{label:'Correctivo',value:totalCorr,color:'#E8743C'}];
  const segEq=data.map((d,i)=>({label:d.equipo.nombre,value:d.total,color:COSTCOL[i%COSTCOL.length]}));
  // por plan (lo ya realizado): SOLO preventivos por su plan (el correctivo ya está en la torta Prev/Corr)
  const realPlan=costosRealizadosPorPlan();
  const segPlan=PLANES.filter(p=>realPlan.porPlan[p.key]).map(p=>({label:p.nombre,value:realPlan.porPlan[p.key].c,color:planColor(p.key)}));
  const totalPlanPrev=segPlan.reduce((s,x)=>s+x.value,0);
  html+=`<div class="row" style="align-items:stretch;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div class="card" style="flex:1;min-width:280px"><h3>Preventivo vs Correctivo <span class="sub">realizado</span></h3>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px">${donutSVG(segPC,{size:168,centerTop:num(totalFlota),centerSub:'total '+mon})}${donutLegend(segPC,totalFlota)}</div></div>
    <div class="card" style="flex:1;min-width:280px"><h3>Costo por equipo <span class="sub">realizado</span></h3>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px">${donutSVG(segEq,{size:168,centerTop:String(data.length),centerSub:'equipos'})}${donutLegend(segEq,totalFlota)}</div></div>
    <div class="card" style="flex:1;min-width:280px"><h3>Costo por plan <span class="sub">solo preventivo</span></h3>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px">${donutSVG(segPlan,{size:168,centerTop:String(segPlan.length),centerSub:'planes'})}${donutLegend(segPlan,totalPlanPrev)}</div></div></div>`;
  // ===== Costo total por equipo (barras apiladas preventivo + correctivo) =====
  const maxTotal=Math.max(1,...data.map(d=>d.total));
  html+=`<div class="card" style="margin-bottom:16px"><h3>Costo total por equipo <span class="sub">preventivo + correctivo</span></h3><div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">`;
  data.forEach(d=>{
    const wp=d.total?d.cPrev/maxTotal*100:0, wc=d.total?d.cCorr/maxTotal*100:0;
    const pPrev=d.total?Math.round(d.cPrev/d.total*100):0, pCorr=d.total?100-pPrev:0;
    const lbl=(w,pct)=> w>9?`<span style="color:#08110b;font-size:10.5px;font-weight:800;line-height:24px;padding-left:7px">${pct}%</span>`:'';
    html+=`<div style="display:grid;grid-template-columns:130px 1fr 120px;align-items:center;gap:10px">
      <span style="font-weight:600;font-size:13px">${esc(d.equipo.nombre)}</span>
      <div class="cbar-track" style="height:24px;display:flex">
        <div class="cbar-fill" title="Preventivo ${money(d.cPrev)} (${pPrev}%)" style="width:${wp}%;background:linear-gradient(180deg,#34c98e,#178a5e);overflow:hidden;white-space:nowrap">${lbl(wp,pPrev)}</div>
        <div class="cbar-fill" title="Correctivo ${money(d.cCorr)} (${pCorr}%)" style="width:${wc}%;background:linear-gradient(180deg,#f0954a,#c9591f);overflow:hidden;white-space:nowrap">${lbl(wc,pCorr)}</div>
      </div>
      <span style="text-align:right;line-height:1.3"><span class="mono" style="font-size:12.5px">${money(d.total)}</span><br><span style="font-size:10.5px"><b style="color:#34c98e">${pPrev}%</b> prev · <b style="color:#f0954a">${pCorr}%</b> corr</span></span></div>`;
  });
  html+=`</div><div class="row" style="gap:16px;margin-top:12px;font-size:12px"><span class="row" style="gap:6px"><span class="leg-sw" style="background:#2bbd86"></span>Preventivo</span><span class="row" style="gap:6px"><span class="leg-sw" style="background:#ef8a3d"></span>Correctivo</span></div></div>`;
  // ===== TCO: costo por hora (motor y bomba) por equipo =====
  const tcoData=data.filter(d=>d.tcoM!=null||d.tcoB!=null);
  const maxM=Math.max(0.0001,...tcoData.map(d=>d.tcoM||0)), maxB=Math.max(0.0001,...tcoData.map(d=>d.tcoB||0));
  const tcoCol=(arr,key,max,grad,sub)=>{
    let h=`<div class="card" style="flex:1;min-width:300px"><h3>TCO ${sub}</h3><div class="muted small" style="margin:-4px 0 12px">Costo total ÷ horas de ${sub} acumuladas</div><div style="display:flex;flex-direction:column;gap:12px">`;
    arr.forEach(d=>{ const v=d[key]; const w=v!=null?Math.max(2,v/max*100):0;
      h+=`<div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="font-weight:600">${esc(d.equipo.nombre)}</span><span class="mono" style="color:#ffd27f">${v!=null?money(v)+'/h':'<span style=\"color:var(--muted)\">sin horas</span>'}</span></div>
        <div class="cbar-track" style="height:18px"><div class="cbar-fill" style="width:${w}%;background:${grad}"></div></div></div>`;
    });
    return h+`</div></div>`;
  };
  html+=`<div class="row" style="align-items:flex-start;gap:16px">`;
  html+=tcoCol(tcoData,'tcoM',maxM,'linear-gradient(180deg,#5a66ff,#2a35c0)','motor');
  html+=tcoCol(tcoData,'tcoB',maxB,'linear-gradient(180deg,#3fd0e8,#147f99)','bombeo');
  html+=`</div>`;
  html+=planifHTML+editorHTML;
  M.innerHTML=html;
}

      </div>${WEB_LITE?'':'<div class="muted small">z=1.65 → 95% · z=2.33 → 99%</div>'}</div>
    <div class="card" style="flex:1;min-width:300px"><h3>Credenciales de acceso</h3>
      <div class="form-grid">
        <div class="field"><label>Usuario</label><input id="p-user" value="${esc(p.user)}"></div>
        <div class="field"><label>Contraseña</label><input id="p-pass" value="${esc(p.pass)}"></div>
      </div></div></div>`;
  html+=`<div style="margin-top:18px"><button class="btn" onclick="saveParams()"> Guardar parámetros</button></div>`;
  // ---- Exportar / Sincronizar próximos mantenimientos a SharePoint (vía Power Automate) ----
  html+=`<div class="card" style="margin-top:18px"><h3>Exportar / Sincronizar a SharePoint <span class="sub">próximos mantenimientos siempre actualizados</span></h3>
    <div class="muted small" style="margin-bottom:12px">La app manda la lista completa de próximos mantenimientos (fecha, equipo, tipo, horas teóricas, se hará a, estado) a SharePoint <b>cada vez que hacés un cambio</b>, usando un <b>flujo de Power Automate</b>. Se configura una sola vez (instrucciones abajo) y pegás acá la URL. Mientras tanto, el botón <b>Descargar Excel</b> siempre funciona.</div>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="field"><label>URL del flujo de Power Automate (webhook HTTP)</label><input id="p-syncurl" value="${esc(p.syncURL||'')}" placeholder="https://prod-xx.logic.azure.com/workflows/..."></div>
      <label class="row" style="gap:8px;font-size:13px;cursor:pointer;margin:2px 0"><input type="checkbox" id="p-syncauto" ${p.syncAuto?'checked':''}> Sincronizar automáticamente en cada cambio</label>
      <div class="field"><label>Moneda (para costos)</label><input id="p-moneda" value="${esc(p.moneda||'USD')}" style="max-width:130px"></div></div>
    <div style="margin-top:8px"><button class="btn" onclick="saveSync()">Guardar</button> <button class="btn ghost" onclick="syncAhora(false)">Sincronizar ahora</button> <button class="btn ghost" onclick="exportTodo()">Descargar Excel</button>
      <span id="sync-estado" class="muted small" style="margin-left:10px">${p.syncUltima?'Última sincronización: '+fmtDHora(p.syncUltima):'Sin sincronizar aún'}</span></div>
    <details style="margin-top:12px"><summary style="cursor:pointer;color:var(--primary-glow);font-size:13px;font-weight:600">Cómo configurar el flujo de Power Automate (una sola vez)</summary>
      <ol class="muted small" style="margin:8px 0 0 18px;line-height:1.8">
        <li>Entrá a <b>make.powerautomate.com</b> → <b>Crear</b> → <b>Flujo de nube instantáneo</b>.</li>
        <li>Elegí el disparador <b>"Cuando se recibe una solicitud HTTP"</b>. Guardá: se genera una <b>URL POST</b>.</li>
        <li>Agregá la acción <b>SharePoint → "Crear archivo"</b> (con sobrescritura): Sitio = tu SharePoint, Carpeta = donde quieras, Nombre de archivo = <code>proximos_mantenimientos.csv</code>, Contenido = el <b>Cuerpo</b> (Body) del disparador.</li>
        <li>Guardá, copiá la URL HTTP y pegala arriba. Tildá "Sincronizar automáticamente" → cada cambio actualiza ese CSV en SharePoint.</li>
      </ol></div></div>`;
  // ---- Vista de la versión WEB: qué ve el modo USUARIO (lo elige el admin) ----
  const uv=(p.userRoutes)||WEB_ROUTES;
  const rlabel=id=>(ROUTES.find(r=>r.id===id)||{}).t||id;
  html+=`<div class="card" style="margin-top:18px"><h3>Versión web — Vista del modo USUARIO <span class="sub">qué módulos ven tus jefes</span></h3>
    <div class="muted small" style="margin-bottom:12px">Tildá los módulos que querés que vea el <b>modo usuario</b> en la web. Vos (Administrador) siempre ves todo. Se aplica al publicar el sitio (botón <b>Administrador</b> en la web para entrar como admin).</div>
    <div class="help" style="margin:0 0 12px"><span class="ic">ℹ</span><div>La web abre por defecto como <b>Usuario Vista</b> (mismas pestañas, pero <b>sin ninguna información de costos</b> — para mostrarle al cliente). Arriba a la derecha, el botón <b>"Usuario"</b> pasa a la vista con costos (para los jefes) y <b>"Usuario Vista"</b> vuelve a la de sin costos. El link con <code>?user</code> abre directo con costos y <code>?admin</code> pide la contraseña de administrador.</div></div>
    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${WEB_ROUTES.map(id=>`<label class="row" style="gap:8px;font-size:13px;cursor:pointer;margin:0"><input type="checkbox" class="uv-chk" value="${id}" ${uv.includes(id)?'checked':''}> ${esc(rlabel(id))}</label>`).join('')}</div>
    <div class="form-grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><div class="field" style="margin:0"><label>Contraseña del modo administrador (web)</label><input id="p-adminpass" value="${esc(p.adminWebPass||'admin')}"></div></div>

// Guarda las periodicidades. Lo YA EJECUTADO no se toca: el próximo ciclo sale de "último mantenimiento + nueva periodicidad"
// (nextDueHours: exec+I). Las fechas fijadas a mano se reinician porque su clave incluye las horas del ciclo, que cambian.
function savePeriodicidades(){
  if(isRO())return roBlock();
  const nuevos={}; let cambios=[];
  for(const inp of document.querySelectorAll('.pint')){
    const k=inp.dataset.k, v=Math.round(Number(inp.value));
    if(!(v>0)) return toast(`${PLAN(k)?.nombre||k}: la periodicidad tiene que ser un número mayor a 0`,'err');
    nuevos[k]=v;
    const antes=PLAN(k)?.intervalo;
    if(antes!==v) cambios.push(`${PLAN(k)?.nombre||k}: ${num(antes)}h → ${num(v)}h`);
  }
  if(!cambios.length) return toast('No cambiaste ninguna periodicidad');
  const nFijadas=Object.keys(DB.planificado||{}).length;
  if(!confirm(`Vas a cambiar:\n\n${cambios.join('\n')}\n\nLo ya ejecutado NO se modifica; el próximo ciclo de cada equipo se recalcula desde su último mantenimiento.${nFijadas?`\n\nSe van a reiniciar ${nFijadas} fecha(s) fijada(s) a mano.`:''}\n\n¿Confirmás?`)) return;
  DB.planes.forEach(p=>{ if(nuevos[p.key]>0){ p.intervalo=nuevos[p.key]; DB.params.intervalos[p.key]=nuevos[p.key]; } });
  aplicarPlanes(); reagruparAuto();      // las fechas manuales apuntan a ciclos que ya no existen → se reinician
  audit('Cambiar periodicidad',cambios.join(' · '));
  saveDB(); renderParametros(); refreshBadges();
  toast('Periodicidades guardadas · proyecciones recalculadas');
}

    <div class="field" id="pf-dep-row"><label>Depende de <span class="muted small">(arranca después de otro plan)</span></label><select id="pf-dep"><option value="">— ninguno —</option>${otros.map(x=>`<option value="${x.key}" ${p&&p.dependeDe===x.key?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>
    <div class="field full" id="pf-off-row"><label class="checkrow"><input type="checkbox" id="pf-off" ${p&&p.offset?'checked':''}> <b>Offset</b>: la 1ª vez arranca en (intervalo del que depende + el propio) — ej. Alfa arranca a las 1.000h (500 de Alfa Zero + 500)</label></div>
    <div class="field full"><label>Descripción del plan <span class="muted small">(qué incluye / alcance — aparece en la historia clínica)</span></label><textarea id="pf-desc" placeholder="Ej: Cambio de filtros y control de niveles del motor...">${esc(p?p.descripcion||'':'')}</textarea></div>
    </div>`;
  openModal(key?`Editar plan · ${esc(p.nombre)}`:'Nuevo plan de mantenimiento',body,()=>{
    const nom=val('pf-nom').trim(); if(!nom) return toast('El nombre es obligatorio','err');
    const intv=Math.round(Number(val('pf-int'))); if(!(intv>0)) return toast('Las horas tienen que ser un número mayor a 0','err');
    const tipo=val('pf-tipo');
    const o={nombre:nom, componente:val('pf-comp').trim()||'Motor', fuente:val('pf-fte'), intervalo:intv, tipo, descripcion:val('pf-desc').trim(),
      offset: tipo!=='unica' && document.getElementById('pf-off').checked, dependeDe: tipo!=='unica' ? (val('pf-dep')||undefined) : undefined};
    if(key){ const pp=PLAN(key); Object.assign(pp,o); if(!o.dependeDe) delete pp.dependeDe; if(!o.offset) delete pp.offset; if(!o.descripcion) delete pp.descripcion; audit('Editar plan',nom); }
    else{ o.key='PLAN_'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(); if(!o.dependeDe)delete o.dependeDe; if(!o.offset)delete o.offset; DB.planes.push(o); DB.params.intervalos[o.key]=intv; audit('Agregar plan',nom); }
    aplicarPlanes(); reagruparAuto(); saveDB(); closeModal(); renderParametros(); refreshBadges(); toast(key?'Plan actualizado · proyecciones recalculadas':'Plan agregado · proyecciones recalculadas');
  });

function planDelete(key){ if(isRO())return roBlock(); const p=PLAN(key); if(!p)return;

/* ---------- PUBLICAR LA DEMO WEB (desde el botón, sin terminal) ----------
   Arma el index.html del sitio (mismo resultado que build-web.js, pero en el navegador) a partir de
   PRISTINE_HTML + los datos ACTUALES, y lo sube al repo de GitHub Pages con la API de GitHub. */
function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str); let bin=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(bin);
}
function buildLiteHTML(){
  const clean=JSON.parse(JSON.stringify(DB));
  clean.audit=[];                                            // no exponer el log interno
  if(clean.params){ clean.params.user='demo'; clean.params.pass='demo';
    delete clean.params.ghToken; delete clean.params.ghOwner; delete clean.params.ghRepo; }  // NUNCA publicar el token
  const ver=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  const json=JSON.stringify(clean).replace(/<\//g,'<\\/');
  const inject=`<script>window.QM_FORCE_LITE=true;window.QM_LITE_SEED=${json};window.QM_LITE_SEED_VER=${JSON.stringify(ver)};<\/script>`;
  let html=PRISTINE_HTML;
  html=html.replace(/<body[^>]*>/i, m=> m+'\n'+inject);                          // el seed debe correr ANTES del script principal
  html=html.replace('</head>', '<meta name="robots" content="noindex,nofollow">\n</head>');
  return {html, ver};
}
async function publicarWeb(){
  if(isRO()) return roBlock();
  if(WEB_LITE){ toast('Publicá desde la app LOCAL (no desde la web).','err'); return; }
  // guardar config tomada de los inputs (si está la pantalla abierta)
  const tok=(val('p-ghtoken')||DB.params.ghToken||'').trim();
  const owner=(val('p-ghowner')||DB.params.ghOwner||'EliasSuarez16').trim();
  const repo=(val('p-ghrepo')||DB.params.ghRepo||'qm-planificador-demo').trim();
  DB.params.ghToken=tok; DB.params.ghOwner=owner; DB.params.ghRepo=repo; saveDB();
  if(!tok){ toast('Pegá tu token de GitHub abajo y guardá antes de publicar.','err'); return; }
  const {html,ver}=buildLiteHTML();
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
  const headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const btn=document.getElementById('btn-publicar'); if(btn){ btn.disabled=true; btn.textContent='Publicando…'; }
  toast('Publicando demo web…');
  try{
    let sha;
    const g=await fetch(api,{headers});                       // sha actual (necesario para sobrescribir)
    if(g.ok){ sha=(await g.json()).sha; }
    else if(g.status===401){ throw new Error('token inválido o sin permiso (401)'); }
    else if(g.status!==404){ throw new Error('no se pudo leer el repo ('+g.status+')'); }
    const body={message:'Actualizar demo '+ver, content:utf8ToBase64(html)}; if(sha) body.sha=sha;
    const p=await fetch(api,{method:'PUT',headers,body:JSON.stringify(body)});
    if(!p.ok){ const t=await p.text(); throw new Error('GitHub '+p.status+' · '+t.slice(0,140)); }
    audit('Publicar web', `${owner}/${repo} v${ver}`); saveDB();
    toast('✓ Publicado. La web se actualiza en ~1 minuto: '+`https://${owner}.github.io/${repo}/`);
  }catch(e){
    toast('No se pudo publicar online ('+e.message+'). Descargo el index.html como respaldo.','err');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='index.html'; a.click();
  }finally{ if(btn){ btn.disabled=false; btn.textContent='Publicar demo web ahora'; } }
}

  if(what==='stock'){ const a=stockAnalysis(); dl('stock.csv',[['Referencia interna','Descripcion','Part Number','Stock','Demanda/año','LeadTime','StockSeg','ROP','EOQ','AFabricar'],...a.map(x=>[x.p.refInterna,x.p.descripcion,x.p.partNumber||'',x.stockActual,x.D,x.LT,x.SS,x.ROP,x.EOQ,x.aPedir])]); }
  if(what==='costos'){ dl('costos.csv',[['Equipo','Costo total','Preventivo','Correctivo','N preventivos','N correctivos','H.Motor','H.Bomba','TCO motor /h','TCO bomba /h'],...costosPorEquipo().map(d=>[d.equipo.nombre,d.total,d.cPrev,d.cCorr,d.nPrev,d.nCorr,d.hM,d.hB,d.tcoM!=null?d.tcoM.toFixed(2):'',d.tcoB!=null?d.tcoB.toFixed(2):''])]); }

const _stripGl=s=>String(s||'').replace(/^[✓↗⏳✕🔍]+\s?/,'').replace(/[✓↗⏳✕🔍]/g,'');
function exportSheets(ids){
  const sub='Exportado el '+fmtD(todayISO());
  const out=[]; const add=(id,name,cols,rows,title)=>out.push({id,name,cols,rows,sub,title:title||name});
  if(ids.includes('equipos')) add('equipos','Equipos',['Equipo','Código','Estado','Horas motor','Horas bomba','Última lectura','Observaciones'],
    DB.equipos.map(e=>{const lr=lastReading(e.id);return [e.nombre,e.codigo||'',e.estado||'',lr?num(lr.horasMotor):'',lr?num(lr.horasBomba):'',lr?fmtD(lr.fecha):'',e.obs||''];}),'Equipos');
  if(ids.includes('proximos')) add('proximos','Próximos mant.',['Fecha','Equipo','Código','Plan','Componente','Fuente','Horas objetivo','Se hará a (h)','Estado'],
    planEvents().map(e=>[e.accionFecha||e.date||'sin fecha',e.equipo.nombre,e.equipo.codigo||'',e.plan.nombre,e.plan.componente,e.plan.fuente==='motor'?'Motor':'Bomba',e.horas!=null?num(e.horas):'',e.horasReal!=null?num(e.horasReal):'',estadoLabel(e.estado)]),'Próximos mantenimientos');
  if(ids.includes('mantenimientos')) add('mantenimientos','Mantenimientos',['Fecha','Equipo','Tipo','Plan / Detalle','Resultado','Horas motor','Horas bomba','Responsable','Observaciones'],
    [...DB.mantenimientos].sort((a,b)=>a.fecha<b.fecha?1:-1).map(m=>{const tl=m.tipo==='correctivo'?'Correctivo':(m.tipo==='inspeccion'?'Inspección':'Preventivo'); const det=m.tipo==='preventivo'?(PLAN(m.plan)?.nombre||m.plan):(m.descripcion||''); return [fmtD(m.fecha),eqName(m.equipoId),tl,det,RESULT_LBL[m.resultado]||'',num(m.horasMotor),num(m.horasBomba),m.responsable||'',m.obs||''];}),'Mantenimientos realizados');
  if(ids.includes('historia')) DB.equipos.forEach(e=>{
    const rows=historiaEventos(e.id).map(x=>{
      if(x.kind==='adelanto'){const a=x.a;return [fmtD(a.fecha),'Adelanto',(PLAN(a.planKey)?.nombre||a.planKey),PLAN(a.planKey)?.descripcion||'','',a.horasMotor?num(a.horasMotor):'','','',historiaMatList(a.productos).map(_stripGl).join(', '),a.motivo||'',a.obs||'',''];}
      if(x.kind==='parte2'){const p=x.p;return [fmtD(p.fechaHecho||p.fecha),'Parte 2',(PLAN(p.planKey)?.nombre||p.planKey),PLAN(p.planKey)?.descripcion||'',RESULT_LBL[p.resultado]||'','','',p.responsable||'',historiaMatList(p.productos).map(_stripGl).join(', '),'',p.obs||'',''];}
      const m=x.m, libre=m.tipo==='correctivo'||m.tipo==='inspeccion'; const tl=m.tipo==='correctivo'?'Correctivo':(m.tipo==='inspeccion'?'Inspección':'Preventivo');
      const det=(m.tipo==='preventivo'?(PLAN(m.plan)?.nombre||m.plan):(m.descripcion||''))+(libre&&m.componente?' · '+m.componente:'');
      const desc=m.tipo==='preventivo'?(PLAN(m.plan)?.descripcion||''):(m.tipo==='inspeccion'?inspDesc({inspId:m.inspId}):'');
      return [fmtD(m.fecha),tl,det,desc,RESULT_LBL[m.resultado]||'',num(m.horasMotor),num(m.horasBomba),m.responsable||'',historiaMatList(m.productos).map(_stripGl).join(', '),m.motivo||'',m.obs||'',(m.resultado==='falla'||m.resultado==='obs')?((m.acciones||'')+(m.fechaRehacer?' (rehacer '+fmtDShort(m.fechaRehacer)+')':'')):''];
    });
    add('hist_'+e.id, e.nombre, ['Fecha','Tipo','Detalle','Descripción','Resultado','H. motor','H. bomba','Responsable','Materiales / inspección','Motivo','Observaciones','Acciones'], rows, 'Historia clínica · '+e.nombre);
  });
  if(ids.includes('planes')) add('planes','Planes',['Plan','Componente','Cada (h)','Fuente','Descripción','Materiales','Inspecciones'],
    PLANES.map(pl=>{const mats=DB.bom.filter(b=>b.plan===pl.key&&b.tipo!=='inspeccion').map(b=>{const p=prodById(b.productoId);return p?(p.partNumber||p.refInterna)+' ×'+num(b.cantidad):'';}).filter(Boolean).join(', '); const insps=DB.bom.filter(b=>b.plan===pl.key&&b.tipo==='inspeccion').map(b=>inspNombre(b)).join(', '); return [pl.nombre,pl.componente,num(pl.intervalo),pl.fuente==='motor'?'Motor':'Bomba',pl.descripcion||'',mats,insps];}),'Planes de mantenimiento');
  if(ids.includes('inspecciones')) add('inspecciones','Inspecciones',['Inspección','Descripción','En planes'],
    (DB.inspecciones||[]).map(i=>[i.nombre,i.descripcion||'',DB.bom.filter(b=>b.tipo==='inspeccion'&&b.inspId===i.id).map(b=>PLAN(b.plan)?.nombre||b.plan).join(', ')]),'Catálogo de inspecciones');
  if(ids.includes('lecturas')) add('lecturas','Horas',['Fecha','Equipo','Horas motor','Horas bomba','Observaciones'],
    [...DB.lecturas].sort((a,b)=>a.fecha<b.fecha?1:-1).map(l=>[fmtD(l.fecha),eqName(l.equipoId),num(l.horasMotor),num(l.horasBomba),l.obs||'']),'Horas / lecturas');
  if(ids.includes('pads')) add('pads','Pads',['Pad','Operadora','Empresa','Inicio','Fin','Equipo','Desde','Hasta'],
    DB.pads.flatMap(p=>(p.asignaciones||[]).length?p.asignaciones.map(a=>[p.nombre,p.operadora||'',p.empresaServicio||'',fmtD(p.fechaInicio),fmtD(p.fechaFin),eqName(a.equipoId),a.desde?fmtD(a.desde):'',a.hasta?fmtD(a.hasta):'']):[[p.nombre,p.operadora||'',p.empresaServicio||'',fmtD(p.fechaInicio),fmtD(p.fechaFin),'—','','']]),'Pads / operación');
  return out;
}
function exportCliente(fmt){
  if(isRO())return roBlock();
  const ids=[...document.querySelectorAll('.exp-chk:checked')].map(c=>c.value);
  if(!ids.length) return toast('Elegí al menos una pestaña para exportar','err');

const _xmlEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
// Colores por valor para las columnas Tipo y Resultado del export cliente (mismos tonos que el informe)
const _EXP_TIPO={'Preventivo':['#e3f5ea','#1a7f4b'],'Inspección':['#e6f2fb','#1a6ea8'],'Correctivo':['#fdeee6','#c0562a'],'Adelanto':['#e3f5ea','#1a7f4b'],'Parte 2':['#fff5db','#8a6d10']};
const _EXP_RES={'OK':['#e3f5ea','#1a7f4b'],'Con observaciones':['#fff5db','#8a6d10'],'Crítico':['#fdeee6','#c0562a']};
const _expColor=(col,val)=>{ const v=String(val==null?'':val).trim(); if(col==='Tipo') return _EXP_TIPO[v]||null; if(col==='Resultado') return _EXP_RES[v]||null; return null; };
const _xlColorId={'#e3f5ea':'cg','#e6f2fb':'cb','#fdeee6':'co','#fff5db':'cm'};
function _wsName(s,used){ let n=String(s||'Hoja').replace(/[\[\]\:\*\?\/\\]/g,' ').slice(0,28).trim()||'Hoja'; let b=n,i=2; while(used[n.toLowerCase()]){ n=(b.slice(0,25)+' '+i).trim(); i++; } used[n.toLowerCase()]=1; return n; }
function exportExcelXML(sheets){
  const used={};

    <Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF" ss:Size="10"/><Interior ss:Color="#2A35C0" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style>
    <Style ss:ID="c"><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#E5E9F0"/></Borders></Style>
    <Style ss:ID="a"><Interior ss:Color="#F1F3FF" ss:Pattern="Solid"/><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#E5E9F0"/></Borders></Style>
    <Style ss:ID="cg"><Font ss:Bold="1" ss:Color="#1A7F4B" ss:Size="10"/><Interior ss:Color="#E3F5EA" ss:Pattern="Solid"/><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#E5E9F0"/></Borders></Style>
    <Style ss:ID="cb"><Font ss:Bold="1" ss:Color="#1A6EA8" ss:Size="10"/><Interior ss:Color="#E6F2FB" ss:Pattern="Solid"/><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#E5E9F0"/></Borders></Style>
    <Style ss:ID="co"><Font ss:Bold="1" ss:Color="#C0562A" ss:Size="10"/><Interior ss:Color="#FDEEE6" ss:Pattern="Solid"/><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#E5E9F0"/></Borders></Style>
    <Style ss:ID="cm"><Font ss:Bold="1" ss:Color="#8A6D10" ss:Size="10"/><Interior ss:Color="#FFF5DB" ss:Pattern="Solid"/><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#E5E9F0"/></Borders></Style>
  </Styles>`;
  const wss=sheets.map(sh=>{
    const nc=Math.max(1,sh.cols.length);
    const cols=sh.cols.map(()=>`<Column ss:Width="135"/>`).join('');
    const titleRow=`<Row ss:Height="22"><Cell ss:StyleID="t" ss:MergeAcross="${nc-1}"><Data ss:Type="String">${_xmlEsc(sh.title||sh.name)}</Data></Cell></Row>`;
    const subRow=`<Row><Cell ss:StyleID="s" ss:MergeAcross="${nc-1}"><Data ss:Type="String">${_xmlEsc(sh.sub||'')}</Data></Cell></Row>`;
    const hdr=`<Row>${sh.cols.map(c=>`<Cell ss:StyleID="h"><Data ss:Type="String">${_xmlEsc(c)}</Data></Cell>`).join('')}</Row>`;
    const rows=sh.rows.length?sh.rows.map((r,i)=>`<Row>${r.map((v,ci)=>{ const cp=_expColor(sh.cols[ci],v); const sid=cp?_xlColorId[cp[0]]:(i%2?'a':'c'); return `<Cell ss:StyleID="${sid}"><Data ss:Type="String">${_xmlEsc(v)}</Data></Cell>`; }).join('')}</Row>`).join(''):`<Row><Cell ss:StyleID="c"><Data ss:Type="String">Sin datos</Data></Cell></Row>`;
    return `<Worksheet ss:Name="${_xmlEsc(_wsName(sh.name,used))}"><Table>${cols}${titleRow}${subRow}<Row></Row>${hdr}${rows}</Table></Worksheet>`;
  }).join('');
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">${styles}${wss}</Workbook>`;
  const blob=new Blob(['﻿'+xml],{type:'application/vnd.ms-excel;charset=UTF-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='QM_reporte_'+todayISO()+'.xls'; a.click();
  toast('Excel exportado · '+sheets.length+' hoja(s)');
